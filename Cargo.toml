[workspace]
resolver = "3"
members = [
    "crates/chelis-unord",
    "crates/chelis-vocab",
    "crates/chelis-pipeline-core",
    "crates/chelis-deep",
    "crates/chelis-pred",
    "crates/chelis-types",
    "crates/chelis-effects",
    "crates/chelis-ir",
]

[workspace.package]
edition = "2024"
version = "0.18.10"
license = "MIT"
repository = "https://github.com/Chelis-Lang/chelis"

[workspace.lints.rust]
# Keep the core's feature/configuration space explicit.
unexpected_cfgs = "deny"

[workspace.dependencies]
chelis-unord = { path = "crates/chelis-unord" }
chelis-vocab = { path = "crates/chelis-vocab" }
chelis-deep = { path = "crates/chelis-deep" }
chelis-pred = { path = "crates/chelis-pred" }
chelis-pipeline-core = { path = "crates/chelis-pipeline-core" }
chelis-types = { path = "crates/chelis-types" }
chelis-effects = { path = "crates/chelis-effects" }
chelis-ir = { path = "crates/chelis-ir" }

thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive", "rc"] }
half = { version = "2", features = ["serde"] }
stacker = "0.1"

# Library identities hash canonical accepted source during ordinary core use.
[profile.dev.package.sha2]
opt-level = 3
