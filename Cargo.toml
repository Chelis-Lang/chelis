[workspace]
resolver = "3"
members = [
    "crates/chelis-deep",
    "crates/chelis-surf",
    "crates/chelis-types",
    "crates/chelis-ir",
    "crates/chelis-backend-c",
    "crates/chelis-backend-hip",
    "crates/chelis-cli",
    "crates/chelis-e2e",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/jeffreyksmithjr/chelis"

[workspace.dependencies]
chelis-deep = { path = "crates/chelis-deep" }
chelis-surf = { path = "crates/chelis-surf" }
chelis-types = { path = "crates/chelis-types" }
chelis-ir = { path = "crates/chelis-ir" }
chelis-backend-c = { path = "crates/chelis-backend-c" }
chelis-backend-hip = { path = "crates/chelis-backend-hip" }

thiserror = "2"
miette = { version = "7", features = ["fancy"] }
