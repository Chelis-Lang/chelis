[workspace]
resolver = "3"
members = [
    "crates/chelis-vocab",
    "crates/chelis-prove",
    "crates/chelis-runtime",
    "crates/chelis-compiler-api",
    "crates/chelis-version",
    "crates/chelis-python",
    "crates/chelis-shell",
    "crates/chelis-std-bundle",
    "crates/chelis-conformance",
    "crates/chelis-reef",
    "crates/chelis-deep",
    "crates/chelis-pred",
    "crates/chelis-macros",
    "crates/chelis-surf",
    "crates/chelis-types",
    "crates/chelis-effects",
    "crates/chelis-ir",
    "crates/chelis-backend-c",
    "crates/chelis-backend-hip",
    "crates/chelis-backend-metal",
    "crates/chelis-validate",
    "crates/chelis-lint",
    "crates/chelis-tide",
    "crates/chelis-lsp",
    "crates/chelis-cove",
    "crates/chelis-cli",
    "crates/chelis-e2e",
    "crates/chelisup",
    "tree-sitter-chelis",
]

[workspace.package]
edition = "2024"
version = "0.18.1"
license = "MIT"
repository = "https://github.com/Chelis-Lang/chelis"

[workspace.dependencies]
chelis-vocab = { path = "crates/chelis-vocab" }
chelis-deep = { path = "crates/chelis-deep" }
chelis-pred = { path = "crates/chelis-pred" }
chelis-runtime = { path = "crates/chelis-runtime" }
chelis-compiler-api = { path = "crates/chelis-compiler-api" }
chelis-shell = { path = "crates/chelis-shell" }
chelis-std-bundle = { path = "crates/chelis-std-bundle" }
chelis-conformance = { path = "crates/chelis-conformance" }
chelis-reef = { path = "crates/chelis-reef" }
chelis-macros = { path = "crates/chelis-macros" }
chelis-surf = { path = "crates/chelis-surf" }
chelis-types = { path = "crates/chelis-types" }
chelis-effects = { path = "crates/chelis-effects" }
chelis-ir = { path = "crates/chelis-ir" }
chelis-backend-c = { path = "crates/chelis-backend-c" }
chelis-backend-hip = { path = "crates/chelis-backend-hip" }
chelis-backend-metal = { path = "crates/chelis-backend-metal" }
chelis-validate = { path = "crates/chelis-validate" }
chelis-lint = { path = "crates/chelis-lint" }
chelis-tide = { path = "crates/chelis-tide" }
chelis-lsp = { path = "crates/chelis-lsp" }
chelis-cove = { path = "crates/chelis-cove" }

thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive", "rc"] }
libc = "0.2"
half = { version = "2", features = ["serde"] }
stacker = "0.1"
# Source-scanning invariant tests parse Rust with syn (e.g. the
# stack_guard! walker-coverage test in chelis-types). Dev-only.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
ryu = "1"
