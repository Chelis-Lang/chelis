schema: spec-driven

context: |
  Chelis is a Rust implementation of a functional programming language for AI research.
  Follow AGENTS.md and the existing specification hierarchy; do not let OpenSpec duplicate
  or override normative language in spec/**. The Phase 0 adoption authority is
  spec/design/spec_provenance.md: OpenSpec is planning and review evidence, not runtime,
  atom-lifecycle, freshness, coverage, canonical graph, or implementation-correctness authority.
  Python 3.11+ is required for automation, scripts are stdlib-first and tested, shell scripts
  are forbidden outside the published bootstrap exception, and every phase names one
  authoritative acceptance oracle plus positive and negative evidence.

rules:
  proposal:
    - Identify affected normative specifications and distinguish product behavior from contributor-process changes.
    - State explicit non-goals and whether compiler, runtime, CLI, backend, package, or generated-code behavior changes.
  design:
    - Preserve the authority boundary among OpenSpec planning, repository specifications, provider review state, executable tests, and future Buoy provenance.
    - Record fail-closed behavior, negative fixtures, migration or activation ordering, rollback, and hosted-versus-local evidence limits.
  specs:
    - Use SHALL requirements with positive and negative WHEN/THEN scenarios.
    - Treat every spec/** edit as normative; it cannot use a documentation-only bypass.
    - Link existing owning spec sections instead of copying or weakening their contracts.
  tasks:
    - Order work as tests or fixtures, implementation, documentation or review routing, strict validation, adversarial validation, and hosted acceptance.
    - Name the authoritative completion oracle and keep policy inactive until that oracle is green.
