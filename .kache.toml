[cache]
ignore_env = true
cache_executables = true
heartbeat_secs = 30

# Compiler/linker provider policy can change outputs without changing rustc argv.
key_env_vars = [
  "NIX_CC_USE_RESPONSE_FILE",
  "NIX_SET_BUILD_ID*",
  "NIX_BUILD_ID_STYLE",
]

# Keep local_store and runtime_dir machine-local; CI supplies job-owned paths
# and its own remote store. This file configures no remote cache.
remote_readonly = false
s3_concurrency = 4
