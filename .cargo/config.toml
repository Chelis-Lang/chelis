# Point pyo3-build-config at the uv-managed Python 3.11 in `.venv/`
# instead of letting it auto-detect a system Python. On macOS, Apple's
# bundled Python 3.9 reports a `sysconfig.LIBDIR` of
# `/Applications/Xcode.app/.../Python3.framework/.../lib` (baked at
# framework build time), which doesn't exist on workstations with
# only the Command Line Tools installed; pyo3 emits that stale path
# as `-L` to the linker and `chelis-python` fails with
# `library 'python3.9' not found`. The same uv-managed Python is the
# project policy on every platform (see AGENTS.md "Scripting Language
# Policy") so behavior is consistent across dev and CI.
#
# REQUIRES: a `.venv/` at the repo root. Create it once with:
#     uv venv --python 3.11
# (see README.md "Prerequisites"). On a fresh clone without `.venv/`,
# `cargo build` for any crate that transitively pulls pyo3 (today
# only `chelis-python`) will fail with
# `failed to run the Python interpreter at .venv/bin/python: No such
# file or directory`. This is the project policy, not a bug: run
# `uv venv --python 3.11` first.
#
# The `relative = true` flag resolves `.venv/bin/python` against the
# directory containing this config.toml, so the setting works from
# any subdir and on any developer's machine.
#
# Override: env vars take precedence over `[env]` in cargo config
# (cargo `[env]` defaults to `force = false`). Export
# `PYO3_PYTHON=/path/to/python` in your shell to use a different
# interpreter.
[env]
PYO3_PYTHON = { value = ".venv/bin/python", relative = true }
# Required for cvc5-sys bindgen on Fedora where the ROCm clang doesn't
# include standard system headers in its search path.
BINDGEN_EXTRA_CLANG_ARGS = "-I/usr/include"
# Two C/C++ build flags share CXXFLAGS below; both are required and combined.
#
# (a) cvc5-sys (smt feature) builds cvc5 from source, which #includes the
# auto-downloaded GMP C++ header `gmpxx.h`. That header declares
# user-defined-literal operators with a space before the suffix
# (`operator"" _mpz`), which Apple clang flags under
# `-Wdeprecated-literal-operator`; cvc5 compiles its own sources with
# that warning promoted to an error, so the cvc5 build aborts on
# Apple-Silicon CI runners (`SMT Feature Build (darwin-arm64)`, red
# since the job was added). cmake seeds `CMAKE_CXX_FLAGS` from this env
# `CXXFLAGS`, so the flag reaches every cvc5 compile command.
# Use the plain `-Wno-` (fully disable), NOT `-Wno-error=` (downgrade to
# warning): the `SMT Feature Build (Linux, glibc 2.31)` lane runs an OLD
# gcc that predates this warning. gcc is lenient about disabling an
# unknown warning (`-Wno-<unknown>` is silently accepted), but
# `-Wno-error=<unknown>` is a HARD ERROR there
# (`cc1plus: error: '-Wno-error=deprecated-literal-operator': no option
# '-Wdeprecated-literal-operator'`). The plain form works on all three
# SMT lanes: Apple clang disables the warning so the build's `-Werror`
# has nothing to promote; new gcc applies the suppression; old gcc
# (glibc231) silently accepts the unknown `-Wno-`.
#
# (b) WI-14 Arb/FLINT oracle (`chelis-prove` `arb` feature). `arb-sys` /
# `flint-sys` / `gmp-mpfr-sys` compile their vendored C from source. Two
# build hazards on a Fedora-style PIE-default toolchain, both fixed durably
# here so a clean `--features arb` build Just Works without a per-developer
# step:
#  1. POSITION-INDEPENDENT CODE. The default toolchain links executables as
#     PIE, but the vendored C objects are not position-independent unless told,
#     so the link fails with `relocation R_X86_64_32 cannot be used ...
#     recompile with -fPIC`. `CFLAGS`/`CXXFLAGS = -fPIC` makes every C object
#     position-independent. (`-fPIC` is benign for the workspace's other C
#     builds — cvc5-sys etc. — on a PIE-default target, so setting it globally
#     is safe.)
#  2. ISOLATED BUILD CACHES. `gmp-mpfr-sys` / `flint-sys` / `arb-sys` each cache
#     their compiled archive in a per-user dir (`~/.cache/<crate>`) keyed by
#     version + compiler but NOT by CFLAGS. A non-`-fPIC` archive built earlier
#     (e.g. by a sibling probe) would be silently reused and re-trigger hazard
#     1. Pointing the three `*_CACHE` vars at a workspace-local dir
#     (`target/arb-cache`, resolved relative to this config) keeps this
#     checkout's archives PIC and isolated from any shared per-user cache.
#
# CXXFLAGS carries BOTH (a) and (b): the cvc5 (smt) and the arb lanes are
# distinct features that never link in the same build, and each flag is a
# harmless no-op for the other lane. CFLAGS carries only (b) (cvc5 has no C, only
# C++). `[env]` defaults to `force = false`, so a developer's own CFLAGS/CXXFLAGS
# still takes precedence (append these flags if you set your own for the `arb`
# build).
CFLAGS = "-fPIC"
CXXFLAGS = "-fPIC -Wno-deprecated-literal-operator"
GMP_MPFR_SYS_CACHE = { value = "target/arb-cache/gmp-mpfr-sys", relative = true }
FLINT_SYS_CACHE = { value = "target/arb-cache/flint-sys", relative = true }
ARB_SYS_CACHE = { value = "target/arb-cache/arb-sys", relative = true }
