# Point pyo3-build-config at the uv-managed Python 3.11 in `.venv/`
# instead of letting it auto-detect Apple's bundled Python 3.9, whose
# `sysconfig.LIBDIR` references a non-existent
# `/Applications/Xcode.app/.../Python3.framework/.../lib` path on
# workstations with only the Command Line Tools installed. That stale
# LIBDIR ends up as `-L` to the linker and `chelis-python` fails with
# `library 'python3.9' not found`.
#
# The uv venv is the project-local Python; reef.toml-style developer
# setup creates it via `uv venv --python 3.11` (see AGENTS.md). The
# `relative = true` flag resolves `.venv/bin/python` against the
# directory containing this config.toml, so the setting works from
# any subdir and on any developer's machine.
#
# CI builds chelis-python on Linux runners where the system Python's
# LIBDIR is correct; PYO3_PYTHON here is a no-op there because
# pyo3-build-config will still find a working Python. Override with
# `PYO3_PYTHON=...` in the environment if you need a different
# interpreter (a different Python version, a system-wide install,
# etc.) — env vars take precedence over `[env]` in cargo config.
[env]
PYO3_PYTHON = { value = ".venv/bin/python", relative = true }
