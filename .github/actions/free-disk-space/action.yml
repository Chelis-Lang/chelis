name: Free disk space (Ubuntu)
description: >-
  Reclaim ~25-30 GB on GitHub-hosted Ubuntu runners before the Rust build by
  removing large unused pre-installed SDK toolchains and pruning cached Docker
  images. Delegates to scripts/ci_free_disk.py, which is best-effort,
  non-fatal, and a no-op off Linux. Requires the repo to be checked out first.
runs:
  using: composite
  steps:
    - run: python3 scripts/ci_free_disk.py
      shell: bash
