# The save half of the shared cvc5 closure cache. Run it immediately
# after the step that materializes the closure, so a later build or test
# failure does not lose a ~30m cold cvc5 build. A no-op when the paired
# restore hit. Saving is best-effort by design: a failed cache save must
# never fail the build.
name: Save cvc5 closure cache
description: >-
  Export the built cvc5 closure into the shared archive and save it
  under the restore step's key. Skipped entirely on a cache hit.
inputs:
  system:
    description: Nix system whose cvc5-dir closure is cached (for example x86_64-linux)
    required: true
  cache-hit:
    description: The cache-hit output of the paired cvc5-cache-restore step
    required: true
  key:
    description: The key output of the paired cvc5-cache-restore step
    required: true
runs:
  using: composite
  steps:
    - name: Export the cvc5 toolchain closure
      if: inputs.cache-hit != 'true'
      shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
      env:
        CVC5_SYSTEM: ${{ inputs.system }}
      run: python3 -c 'import os, subprocess; system = os.environ["CVC5_SYSTEM"]; out = subprocess.check_output(["nix", "eval", "--raw", f".#legacyPackages.{system}.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--to", "file:///tmp/chelis-cvc5-cache", out], check=True)'

    - name: Save the cvc5 toolchain closure
      if: inputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: /tmp/chelis-cvc5-cache
        key: nix-cvc5-${{ inputs.key }}
