name: Set up project CI
description: Restore signed Nix inputs before realizing the project, then attach its compiler cache.
inputs:
  profile:
    description: Project profile (ci or ci-smt). GitHub-hosted runners realize its public-cache twin.
    required: false
    default: ci
outputs:
  state-path:
    description: Job-owned cache state; always finalize nonempty state with publish-build-cache.
    value: ${{ steps.build-cache.outputs.state-path }}
runs:
  using: composite
  steps:
    - name: Set up portable Devenv
      uses: Chelis-Lang/ci/actions/setup-devenv@6afc09f65c178211a9d1bea994a4b39b62d23024

    - name: Restore signed Nix inputs
      id: build-cache
      if: runner.environment == 'self-hosted'
      uses: Chelis-Lang/ci/actions/restore-build-cache@6afc09f65c178211a9d1bea994a4b39b62d23024
      with:
        # Every admitted Tunnet member may read and write, including reviewed drafts.
        mode: read-write

    - name: Activate project CI environment
      shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
      env:
        PROJECT_CI_PROFILE: ${{ inputs.profile }}
      # GitHub-hosted runners cannot reach the private cache, so they realize
      # the twin profile that public binary caches serve instead of building
      # the native libraries from source.
      run: |
        activation=(--profile "$PROJECT_CI_PROFILE")
        if [ "${RUNNER_ENVIRONMENT:-github-hosted}" != self-hosted ]; then
          activation+=(--hosted)
        fi
        python scripts/ci_devenv.py "${activation[@]}"

    - name: Attach the realized compiler cache
      if: runner.environment == 'self-hosted'
      uses: Chelis-Lang/ci/actions/restore-build-cache@6afc09f65c178211a9d1bea994a4b39b62d23024
      with:
        state-path: ${{ steps.build-cache.outputs.state-path }}
        kache-binary: ${{ env.RUSTC_WRAPPER }}

    - name: Declare the realized environment cache root
      if: runner.environment == 'self-hosted'
      shell: chelis-ci-shell run {0}
      run: python scripts/ci_nix_cache_roots.py
