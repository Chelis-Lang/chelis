name: DAG exact-source acceptance
on:
  push:
    branches: [verify/dag-core-acceptance-20261023]
permissions:
  contents: read
jobs:
  oracle:
    name: DAG oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      UV_MANAGED_PYTHON: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 91678fe73d0750f6f914344f1dfa3c740409a18c
          fetch-depth: 0
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: python3 scripts/ci_apt_get.py gcc g++ clang llvm cmake m4 libclang-dev libopenblas-dev libgmp-dev libmpfr-dev libasan8 libubsan1
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "AR=$(brew --prefix llvm)/bin/llvm-ar" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: thumbv7em-none-eabi
          components: clippy, rustc-dev, rustfmt
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Create uv-managed Python
        run: python3 scripts/ci_setup_uv_python.py
      - name: Install Python binding dependencies
        run: uv pip install --python .venv/bin/python -r bindings/python/pyproject.toml
      - name: Install shared-skill validator dependency
        run: uv pip install --python .venv/bin/python PyYAML==6.0.3
      - uses: taiki-e/install-action@nextest
      - name: Record exact identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dag-evidence"
          test "$(git rev-parse HEAD)" = 91678fe73d0750f6f914344f1dfa3c740409a18c
          .venv/bin/python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          value = {'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'workflow_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'platform': platform.platform(), 'machine': platform.machine()}
          value['script_sha256'] = {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in ['scripts/dag_core_oracle.py', 'scripts/dtype_builtin_atom_closure_oracle.py', 'scripts/gate.py']}
          value['initial_source_status'] = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          commands = {'rustc': ['rustc', '-vV'], 'cargo': ['cargo', '-V'], 'clippy': ['cargo', 'clippy', '--version'], 'rustfmt': ['rustfmt', '--version'], 'components': ['rustup', 'component', 'list', '--installed'], 'targets': ['rustup', 'target', 'list', '--installed'], 'cc': [os.environ.get('CC', 'cc'), '--version'], 'clang': ['clang', '--version'], 'llvm_ar': [os.environ.get('AR', 'llvm-ar'), '--version'], 'nextest': ['cargo', 'nextest', '--version'], 'uv': ['uv', '--version']}
          value['compiler_identities'] = {}
          for name, command in commands.items():
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, check=False)
              value['compiler_identities'][name] = {'command': command, 'exit_code': result.returncode, 'stdout': result.stdout}
          value['python'] = {'executable': sys.executable, 'version': sys.version}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'dag-evidence', 'identity.json').write_text(json.dumps(value, indent=2))
          print(json.dumps(value))
          PY
      - name: Execute complete DAG oracle
        shell: bash
        run: |
          set +e
          set -o pipefail
          .venv/bin/python scripts/dag_core_oracle.py 2>&1 | tee "$RUNNER_TEMP/dag-evidence/oracle.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/dag-evidence/exit-code.txt"
          exit "$code"
      - name: Execute builtin closure oracle
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          .venv/bin/python scripts/dtype_builtin_atom_closure_oracle.py 2>&1 | tee "$RUNNER_TEMP/dag-evidence/closure.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/dag-evidence/closure-exit-code.txt"
          exit "$code"
      - name: Execute complete fast gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          .venv/bin/python scripts/gate.py --fast 2>&1 | tee "$RUNNER_TEMP/dag-evidence/gate.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/dag-evidence/gate-exit-code.txt"
          exit "$code"
      - name: Retain complete evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dag-evidence"
          git status --porcelain=v1 > "$RUNNER_TEMP/dag-evidence/final-source-status.txt"
          git diff --binary > "$RUNNER_TEMP/dag-evidence/final-source.diff"
          .venv/bin/python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'], 'dag-evidence')
          for name in ['gate-failures', 'gate-reports', 'builtin-atom-closure']:
              source = pathlib.Path('target', name)
              if source.exists():
                  shutil.copytree(source, evidence / name, dirs_exist_ok=True)
          target = pathlib.Path('target')
          for pattern in ['**/junit.xml', '**/fold-final-stored-bits.jsonl']:
              for source in target.glob(pattern):
                  destination = evidence / 'receipts' / source.relative_to(target)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
          results = {}
          for name, filename in [('oracle', 'exit-code.txt'), ('closure', 'closure-exit-code.txt'), ('fast_gate', 'gate-exit-code.txt')]:
              path = evidence / filename
              results[name] = {'exit_code': int(path.read_text()) if path.exists() else None, 'executed': path.exists()}
          (evidence / 'command-results.json').write_text(json.dumps(results, indent=2))
          manifest = [{'path': str(path.relative_to(evidence)), 'size_bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(evidence.rglob('*')) if path.is_file()]
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(results))
          PY
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dag-hosted-${{ matrix.os }}
          path: ${{ runner.temp }}/dag-evidence
          if-no-files-found: error
          retention-days: 30
