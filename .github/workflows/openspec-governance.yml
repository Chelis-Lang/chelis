name: OpenSpec governance

on:
  pull_request:
    branches: [main]
    # Re-run on body edits: the citation control reads the pull-request
    # body from the frozen event payload, so a green run must not survive a
    # later edit that removes the OpenSpec-Change citation.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-governance-${{ github.ref }}
  # Cancel superseded pull-request runs, but never cancel a push-lane run:
  # each mainline commit is the post-merge audit of a distinct squashed diff
  # and a later push must not cancel the audit of the one before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openspec-governance:
    name: openspec-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenSpec governance
        uses: Chelis-Lang/ci/actions/openspec-governance@2906e03880a2ea7d553b0959c246991b1b058990 # accepted 2026-07-24, run 30116322777
