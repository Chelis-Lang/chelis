name: LOC Report

# Weekly LOC report refresh. Previously this ran as a job in ci.yml on every
# push to main and committed a github-actions[bot] "Update LOC report" commit
# per merge — pure bookkeeping churn on the per-merge path. Moved to a weekly
# schedule (+ manual dispatch) in #413 so main no longer gets a bot commit on
# every merge; this file (the new workflow) was dropped during the 0.8.0
# release work while #413's ci.yml job-removal + test_gate.py changes landed,
# so it is restored here. Out of the gate.py developer-quartet scope by design
# (already in scripts/test_gate.py NON_GATE_WORKFLOWS).
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loc-report:
    name: LOC Report
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@128d3acc50bb04bf75a6bb4cf34ec7f50dc388b9 # ci#50 shared composition

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@128d3acc50bb04bf75a6bb4cf34ec7f50dc388b9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      # The Devenv shell supplies uv and the managed Python; the report
      # anchors its output to the repo root, so the cwd stays here.
      - name: Generate LOC report
        run: devenv --profile ci shell --no-tui -- uv run --project py loc-report

      - name: Commit LOC report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/loc_report.md
          if git diff --cached --quiet; then
            echo "LOC report unchanged"
            exit 0
          fi
          git commit -m "Update LOC report"
          git push || echo "LOC report push skipped: token lacks write access"
