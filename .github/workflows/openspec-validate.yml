name: OpenSpec validation

# This advisory workflow validates the openspec/ planning tree.
# It does not enforce lifecycle, citation, or ordering rules.
# The central action supplies the locked OpenSpec CLI and Node runtime.
# Validation findings produce warnings. Operational failures stay nonzero.
# The Phase 0 regime in spec/design/spec_provenance.md stays inactive.

on:
  pull_request:
    paths:
      - "openspec/**"
      - ".github/workflows/openspec-validate.yml"
      - "scripts/check_openspec.py"
  push:
    branches: [main]
    paths:
      - "openspec/**"
      - ".github/workflows/openspec-validate.yml"
      - "scripts/check_openspec.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openspec-validate:
    name: openspec-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      - name: Validate OpenSpec tree
        uses: Chelis-Lang/ci/actions/openspec-governance@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          mode: advisory
