name: Secret scan

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Set up Python
        run: uv venv --python 3.11
      - name: Install checksum-verified Gitleaks
        run: .venv/bin/python .github/scripts/secret_scan.py --install '${{ runner.temp }}/secret-scan'
      - name: Test scan contracts
        env:
          SECRET_SCAN_TEST_BINARY: ${{ runner.temp }}/secret-scan/gitleaks
        run: .venv/bin/python -m unittest discover -s .github/scripts -p 'test_secret_scan*.py'
      - name: Scan candidate history
        run: .venv/bin/python .github/scripts/secret_scan.py --gitleaks '${{ runner.temp }}/secret-scan/gitleaks' --config .github/security/gitleaks.toml
