name: SMT Full Prove

# Full solver/proof corpus for Chelis prove. The required
# `SMT Feature Build (Linux)` job in ci.yml is the fast cvc5 smoke that
# preserves branch protection. This workflow carries the expensive proof
# lanes: Carcara, Z3, cross-engine agreement, Clarabel, Gappa proof
# re-validation, and Arb cross-checks.
#
# It runs NIGHTLY and by manual dispatch only -- NOT on PRs. The full corpus is
# ~46 min (Clarabel SoS ~25m + the from-source Arb/FLINT cross-check ~12m), far
# too heavy for the per-PR path, and `SMT Full Prove (Linux)` is NOT a required
# status check, so dropping the PR trigger cannot deadlock branch protection.
# Prove-stack regressions are caught by the nightly run (which opens/closes a
# tracking issue below) and can be checked on demand via workflow_dispatch; the
# required per-PR cvc5 signal is the fast `SMT Feature Build (Linux)` smoke in
# ci.yml. See docs/smt_build_setup.md.

on:
  schedule:
    # 09:00 UTC daily, staggered after the existing Hull and Heavy E2E
    # nightlies so the shared runner pool is not hit all at once.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: smt-full-prove-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-smt-prove:
    name: SMT Full Prove (Linux)
    runs-on: ubuntu-latest
    # The fast required SMT smoke stays in ci.yml. This nightly/dispatch-only
    # lane intentionally carries the full solver + Arb/Gappa corpus (~46m on a
    # warm cache), too heavy for the per-PR path; 75m leaves headroom over the
    # observed wall time while it makes forward progress.
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a6408b57c8019cb34b48cbfb735383db1d138a4f # ci#46 devenv-native primitives

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@73f017c4d3179dc313844e9d5f08d17a7879c824 # ci#37 prerequisite

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Mint a scoped token for the private ci input
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          repositories: ci

      - name: Authenticate Nix to the private ci devenv input
        shell: bash
        env:
          CI_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: printf 'NIX_CONFIG<<EOF\n%s\naccess-tokens = github.com=%s\nEOF\n' "$NIX_CONFIG" "$CI_TOKEN" >> "$GITHUB_ENV"

      # cvc5 closure cache: the same key derivation and import/export pattern
      # as nix-packages.yml and the smoke lanes, so all four jobs share one
      # cached closure. The lane builds with the Devenv toolchain and the
      # flake's pinned cvc5 (openspec converge-full-prove-on-devenv); the
      # solver stack (z3, gappa, gmp, m4, make) comes from the Devenv shell.
      - name: Compute the cvc5 toolchain cache key
        id: cvc5-key
        run: python3 -c 'import os, pathlib, subprocess; drv = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.x86_64-linux.cvc5-dir.drvPath"], text=True).strip(); pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("key=" + pathlib.Path(drv).name + "\n")'

      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chelis-cvc5-cache
          key: nix-cvc5-${{ steps.cvc5-key.outputs.key }}

      - name: Import the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit == 'true'
        run: python3 -c 'import subprocess; out = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.x86_64-linux.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--from", "file:///tmp/chelis-cvc5-cache", "--no-check-sigs", out], check=True)'

      - name: Build the pinned cvc5 tree and export CVC5_DIR
        run: |
          set -euo pipefail
          nix build .#legacyPackages.x86_64-linux.cvc5-dir --out-link .cvc5-dir
          printf 'CVC5_DIR=%s\n' "$(readlink -f .cvc5-dir)" >> "$GITHUB_ENV"

      # Export and save immediately after the closure exists, so a later
      # prove failure does not lose the ~30m cold cvc5 build.
      - name: Export the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit != 'true'
        run: python3 -c 'import subprocess; out = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.x86_64-linux.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--to", "file:///tmp/chelis-cvc5-cache", out], check=True)'

      - name: Save the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the closure cache must never fail the build.
        continue-on-error: true
        with:
          path: /tmp/chelis-cvc5-cache
          key: nix-cvc5-${{ steps.cvc5-key.outputs.key }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore the same cvc5 target cache as the required smt smoke
          # lane. The full corpus is intentionally slower, but it should
          # spend time proving, not cold-building again before the
          # first prove step.
          shared-key: smt-smt-build
          # Match the smt-build smoke lane so the shared cache inputs stay
          # identical (asserted by scripts/test_gate.py) and a slow run
          # still warms the cache (chelis#583).
          cache-on-failure: true

      - name: Build smt feature
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- cargo build -p chelis-cli --features smt

      - name: Run smt-gated chelis-prove tests
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- cargo test -p chelis-prove --features smt

      - name: Run carcara-gated chelis-prove tests
        # The nightly parallel process exited with SIGSEGV after tests; the
        # same complete suite passed serially. Retain the full corpus while
        # containing that nondeterministic failure in this optional lane.
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- cargo test -p chelis-prove --features carcara -- --test-threads=1

      # The Nix libz3.so needs the loader path at runtime; the Devenv shell
      # exports Z3_LIBRARY_PATH_OVERRIDE for z3-sys's link step.
      - name: Run z3-gated chelis-prove tests
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- bash -euo pipefail -c 'export LD_LIBRARY_PATH="$Z3_LIBRARY_PATH_OVERRIDE"; cargo test -p chelis-prove --features z3'

      - name: Run cross-engine oracle (cvc5 + Z3 agreement)
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- bash -euo pipefail -c 'export LD_LIBRARY_PATH="$Z3_LIBRARY_PATH_OVERRIDE"; cargo test -p chelis-prove --features "smt z3" --test cross_engine_oracle'

      - name: Run clarabel-gated chelis-prove tests
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- cargo test -p chelis-prove --features clarabel

      - name: Run the production solver config (cvc5 + Clarabel, both live)
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- cargo test -p chelis-prove --features "smt clarabel"

      - name: Re-validate committed Gappa proofs (--check-only)
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- python scripts/generate_erf_proof.py --check-only

      - name: Arb cross-check (certify_erf_envelope validate)
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: |
          devenv shell --no-tui -- cargo run -p chelis-prove --features arb --bin certify_erf_envelope \
            -- validate crates/chelis-prove/data/erf_envelope.json

      - name: Arb cross-check exp/log/sqrt (certify_special_fn_envelope validate)
        # chelis#434: the rigorous tamper gate for the exp/log/sqrt envelopes.
        # Re-certifies each committed eps at its recorded subdivision count and
        # fails if any committed eps is below the fresh Arb bound (a shrunk /
        # tampered eps would forge a green). Mirrors the erf step above.
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: |
          devenv shell --no-tui -- bash -euo pipefail -c '
            for fn in exp log sqrt; do
              cargo run -p chelis-prove --features arb --bin certify_special_fn_envelope \
                -- validate "crates/chelis-prove/data/special_fn_envelopes/${fn}_envelope.json"
            done
          '

      - name: Run arb-gated chelis-prove tests
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: devenv shell --no-tui -- cargo test -p chelis-prove --features arb

  report:
    name: Surface SMT full-prove status
    needs: full-smt-prove
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close SMT full-prove tracking issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.full-smt-prove.result }}
        with:
          script: |
            const title = 'Nightly failing: SMT Full Prove';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (process.env.RESULT === 'failure') {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **SMT Full Prove** workflow failed.\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the workflow next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (process.env.RESULT === 'success' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `SMT Full Prove green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
