name: SMT Full Prove

# Full solver/proof corpus for Chelis prove. The required
# `SMT Feature Build (Linux)` job in ci.yml is the fast cvc5 smoke that
# preserves branch protection. This workflow carries the expensive proof
# lanes: Carcara, Z3, cross-engine agreement, Clarabel, Gappa proof
# re-validation, and Arb cross-checks.
#
# It runs NIGHTLY and by manual dispatch only -- NOT on PRs. The full corpus is
# ~46 min (Clarabel SoS ~25m + the from-source Arb/FLINT cross-check ~12m), far
# too heavy for the per-PR path, and `SMT Full Prove (Linux)` is NOT a required
# status check, so dropping the PR trigger cannot deadlock branch protection.
# Prove-stack regressions are caught by the nightly run (which opens/closes a
# tracking issue below) and can be checked on demand via workflow_dispatch; the
# required per-PR cvc5 signal is the fast `SMT Feature Build (Linux)` smoke in
# ci.yml. See docs/smt_build_setup.md.

on:
  schedule:
    # 09:00 UTC daily, staggered after the existing Hull and Heavy E2E
    # nightlies so the shared runner pool is not hit all at once.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: smt-full-prove-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-smt-prove:
    name: SMT Full Prove (Linux)
    runs-on: ubuntu-latest
    # The fast required SMT smoke stays in ci.yml. This path-gated/nightly lane
    # intentionally carries the full solver + Arb/Gappa corpus, which exceeded
    # 45 minutes on a warm-cache PR run while still making forward progress.
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        # libz3-dev provides the unversioned libz3 on default linker and
        # loader paths. libopenblas-dev backs the Clarabel SDP backend.
        run: python3 scripts/ci_apt_get.py gcc g++ cmake libclang-dev libopenblas-dev libgmp-dev libmpfr-dev libz3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      # chelis#583: dedicated stable-key cvc5 cache, shared with the required
      # smt-build smoke lane (same `linux-x86_64` namespace + key). cvc5
      # builds from source (~30m cold) and the Swatinem cache below keys on
      # Cargo.lock, so an unrelated dependency bump would otherwise re-pay
      # the full build before the first prove step. On a warm hit, `activate`
      # exports CVC5_DIR and cvc5-sys LINKS the prebuilt libcvc5.a. See the
      # smt-build job in ci.yml and docs/smt_build_setup.md.
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-x86_64

      - name: Restore prebuilt cvc5
        id: cvc5restore
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # Restore the same cvc5 target cache as the required smt smoke
          # lane. The full corpus is intentionally slower, but it should
          # spend time proving, not cold-building cvc5 again before the
          # first prove step.
          shared-key: smt-smt-build
          # Match the smt-build smoke lane so the shared cache inputs stay
          # identical (asserted by scripts/test_gate.py) and a slow run
          # still warms the cache (chelis#583).
          cache-on-failure: true

      - name: Build smt feature
        run: cargo build -p chelis-cli --features smt

      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Run smt-gated chelis-prove tests
        run: cargo test -p chelis-prove --features smt

      - name: Run carcara-gated chelis-prove tests
        run: cargo test -p chelis-prove --features carcara

      - name: Run z3-gated chelis-prove tests
        run: cargo test -p chelis-prove --features z3

      - name: Run cross-engine oracle (cvc5 + Z3 agreement)
        run: cargo test -p chelis-prove --features "smt z3" --test cross_engine_oracle

      - name: Run clarabel-gated chelis-prove tests
        run: cargo test -p chelis-prove --features clarabel

      - name: Run the production solver config (cvc5 + Clarabel, both live)
        run: cargo test -p chelis-prove --features "smt clarabel"

      - name: Install arb lane prerequisites (m4, make, gappa)
        run: python3 scripts/ci_apt_get.py m4 make gappa

      - name: Re-validate committed Gappa proofs (--check-only)
        run: .venv/bin/python scripts/generate_erf_proof.py --check-only

      - name: Arb cross-check (certify_erf_envelope validate)
        run: |
          cargo run -p chelis-prove --features arb --bin certify_erf_envelope \
            -- validate crates/chelis-prove/data/erf_envelope.json

      - name: Run arb-gated chelis-prove tests
        run: cargo test -p chelis-prove --features arb

  report:
    name: Surface SMT full-prove status
    needs: full-smt-prove
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close SMT full-prove tracking issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.full-smt-prove.result }}
        with:
          script: |
            const title = 'Nightly failing: SMT Full Prove';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (process.env.RESULT === 'failure') {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **SMT Full Prove** workflow failed.\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the workflow next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (process.env.RESULT === 'success' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `SMT Full Prove green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
