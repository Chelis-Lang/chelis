name: SMT Full Prove

# Full solver/proof corpus for Chelis prove. The required
# `SMT Feature Build (Linux)` job in ci.yml is the fast cvc5 smoke that
# preserves branch protection. This workflow carries the expensive proof
# lanes: Carcara, Z3, cross-engine agreement, Clarabel, Gappa proof
# re-validation, and Arb cross-checks.
#
# It runs NIGHTLY and by manual dispatch only -- NOT on PRs. The full corpus is
# ~46 min (Clarabel SoS ~25m + the from-source Arb/FLINT cross-check ~12m), far
# too heavy for the per-PR path, and `SMT Full Prove (Linux)` is NOT a required
# status check, so dropping the PR trigger cannot deadlock branch protection.
# Prove-stack regressions are caught by the nightly run (which opens/closes a
# tracking issue below) and can be checked on demand via workflow_dispatch; the
# required per-PR cvc5 signal is the fast `SMT Feature Build (Linux)` smoke in
# ci.yml. See docs/smt_build_setup.md.

on:
  schedule:
    # 09:00 UTC daily, staggered after the existing Hull and Heavy E2E
    # nightlies so the shared runner pool is not hit all at once.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: smt-full-prove-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-smt-prove:
    name: SMT Full Prove (Linux)
    runs-on: ubuntu-latest
    # The fast required SMT smoke stays in ci.yml. This nightly/dispatch-only
    # lane intentionally carries the full solver + Arb/Gappa corpus (~46m on a
    # warm cache), too heavy for the per-PR path; 75m leaves headroom over the
    # observed wall time while it makes forward progress.
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        # libz3-dev provides the unversioned libz3 on default linker and
        # loader paths. gmp-mpfr-sys and openblas-src build their locked
        # sources; distribution versions can be older than the Rust bindings
        # accept. m4 and make support those source builds.
        run: python3 scripts/ci_apt_get.py gcc g++ cmake libclang-dev m4 make libz3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      # Same layered prebuilt-cvc5 link as the required smt-build smoke lane
      # (shared `linux-x86_64` namespace + key): durable Release asset first
      # (build-cvc5.yml, rustc-independent, no TTL/LRU/branch-scope), Actions
      # cache fallback second. Keeps the ~22m from-source cvc5 build off this
      # lane so it spends time proving, not rebuilding cvc5. On a warm store
      # `activate` exports CVC5_DIR and cvc5-sys LINKS the prebuilt libcvc5.a.
      # See the smt-build job in ci.yml and docs/smt_build_setup.md.
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-x86_64

      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-x86_64 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          # Restore the cvc5 target cache that ci-cache-warm.yml writes for
          # the required smt smoke lane, so the full corpus spends its time
          # proving rather than cold-building cvc5 before the first step.
          shared-key: smt-smt-build
          save-if: false

      - name: Build smt feature
        run: cargo build -p chelis-cli --features smt

      # This runner is the only one that provisions every solver toolchain, so
      # it is the only place `--all-features` can compile. It closes Clippy's
      # `disallowed_types` coverage over the `z3`, `carcara`, and `arb`
      # features, whose per-pull-request cost this repository has declined.
      # Registered in scripts/check_configuration_closure.py CLIPPY_MATRIX.
      - name: Clippy over every declared feature
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # With every feature compiled, the nightly-only allowance is dropped: the
      # reconciliation must account for every repository source from dep-info
      # alone. This is what keeps NIGHTLY_ONLY_SOURCES from becoming a place to
      # park an uncovered file.
      - name: Reconcile every source against dep-info
        run: python3 scripts/check_configuration_closure.py --require-complete

      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      # Every integration entry installs its shared libtest worker before
      # solving; keep default parallelism to exercise process containment.
      - name: Run smt-gated chelis-prove unit and integration tests
        run: cargo test -p chelis-prove --features smt

      - name: Run carcara-gated chelis-prove tests
        # The nightly parallel process exited with SIGSEGV after tests; the
        # same complete suite passed serially. Retain the full corpus while
        # containing that nondeterministic failure in this optional lane.
        run: cargo test -p chelis-prove --features carcara -- --test-threads=1

      - name: Run z3-gated chelis-prove tests
        run: cargo test -p chelis-prove --features z3

      - name: Run cross-engine oracle (cvc5 + Z3 agreement)
        run: cargo test -p chelis-prove --features "smt z3" --test cross_engine_oracle

      - name: Run clarabel-gated chelis-prove tests
        run: cargo test -p chelis-prove --features clarabel

      - name: Run the production solver config (cvc5 + Clarabel, both live)
        run: cargo test -p chelis-prove --features "smt clarabel"

      - name: Install Gappa proof checker
        run: python3 scripts/ci_apt_get.py gappa

      - name: Re-validate committed Gappa proofs (--check-only)
        run: .venv/bin/python scripts/generate_erf_proof.py --check-only

      - name: Arb cross-check (certify_erf_envelope validate)
        run: |
          cargo run -p chelis-prove --features arb --bin certify_erf_envelope \
            -- validate crates/chelis-prove/data/erf_envelope.json

      - name: Arb cross-check exp/log/sqrt (certify_special_fn_envelope validate)
        # chelis#434: the rigorous tamper gate for the exp/log/sqrt envelopes.
        # Re-certifies each committed eps at its recorded subdivision count and
        # fails if any committed eps is below the fresh Arb bound (a shrunk /
        # tampered eps would forge a green). Mirrors the erf step above.
        run: |
          for fn in exp log sqrt; do
            cargo run -p chelis-prove --features arb --bin certify_special_fn_envelope \
              -- validate "crates/chelis-prove/data/special_fn_envelopes/${fn}_envelope.json"
          done

      - name: Run arb-gated chelis-prove tests
        run: cargo test -p chelis-prove --features arb

  report:
    name: Surface SMT full-prove status
    needs: full-smt-prove
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close SMT full-prove tracking issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.full-smt-prove.result }}
        with:
          script: |
            const title = 'Nightly failing: SMT Full Prove';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (process.env.RESULT === 'failure') {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **SMT Full Prove** workflow failed.\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the workflow next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (process.env.RESULT === 'success' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `SMT Full Prove green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
