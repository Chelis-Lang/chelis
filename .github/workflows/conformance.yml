name: Hull Conformance

run-name: ${{ inputs.retarget_token != '' && format('Retarget Hull {0}', inputs.retarget_token) || github.workflow }}

# The Hull Phase 5b conformance gate: runs the frozen, version-stamped Hull
# conformance corpus (tests/conformance/hull/) against the just-built chelis
# binary and FAILS on any CompilerUnsound, unexplained Disagree, or EvalDisagree.
# The only semantic content -- what type a program has, accept vs reject, the
# reference scalar -- is FROZEN in the corpus as canonical strings Hull itself
# emitted; this job does only a mechanical re-render + the differential_check
# decision table, so it cannot silently re-decide semantics.
#
# This is a CI job like backend-sanitizers, NOT part of the per-PR developer
# `gate.py` quartet (scripts/test_gate.py knows conformance.yml is out of scope
# by design -- see the CONFORMANCE_YML reference there). It runs per-PR and on
# push-to-main; the FULL >=10k fresh campaign runs nightly in
# conformance-nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose synthetic merge must be tested
        required: true
        type: number
      expected_head_sha:
        description: Exact open pull-request head
        required: true
        type: string
      expected_base_sha:
        description: Exact retargeted base commit
        required: true
        type: string
      retarget_token:
        description: Unique coordinator token
        required: true
        type: string

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same docs-only detector as ci.yml's `changes` job (chelis#419). The
  # conformance gate lives in its own workflow file, so `needs:` cannot
  # reach ci.yml's changes job; this replicates it here so the required
  # `Hull Conformance Gate (Linux)` context skips on a docs-only PR
  # (skipped required job reports success) while running on every code PR
  # and push. Kept as a separate file (no required-context move) to avoid
  # the branch-protection deadlock footgun in chelis#420; the build-once /
  # shared-artifact fold is escalated separately.
  changes:
    name: Detect docs-only changes (conformance)
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      ci_contract_changed: ${{ steps.detect.outputs.ci_contract_changed }}
      candidate_preflight: ${{ steps.candidate-preflight.outputs.candidate_preflight }}
    steps:
      - name: Checkout trusted retarget validator
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_base_sha }}
          path: trusted
          fetch-depth: 1

      # Shallow checkout (depth 1); deepen in bash since GitHub Actions
      # expressions have no arithmetic. See ci.yml's changes job.
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          path: candidate
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}

      - name: Validate exact retarget candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: candidate
        run: >-
          python3 ../trusted/scripts/ci_validate_pr_candidate.py
          --repository "${{ github.repository }}"
          --pr-number "${{ inputs.pr_number }}"
          --expected-head-sha "${{ inputs.expected_head_sha }}"
          --expected-base-sha "${{ inputs.expected_base_sha }}"
          --validate-checkout

      - name: Record exact candidate
        id: candidate
        working-directory: candidate
        run: |
          candidate="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Compute docs_only
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        working-directory: candidate
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] &&
             [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "rejection_authority_changed=false" >> "$GITHUB_OUTPUT"
            echo "diagnostic_kind_changed=false" >> "$GITHUB_OUTPUT"
            echo "ci_contract_changed=false" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME): docs_only=false (full suite)"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
          else
            git fetch origin "$HEAD" "$BASE" 2>/dev/null || true
          fi
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          git diff --name-only "$BASE..$HEAD" \
            | python3 scripts/ci_detect_docs_only.py

      - name: Validate candidate lifecycle
        id: candidate-lifecycle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: candidate
        run: |
          args=(--event "$GITHUB_EVENT_PATH")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            current_pr="$RUNNER_TEMP/current-pr.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$current_pr"
            args+=(--current-pr "$current_pr")
          fi
          if [ "$EVENT_NAME" = "pull_request" ] &&
             [ "$ACTION" = "synchronize" ]; then
            git fetch origin "$BEFORE" "$HEAD" "$BASE" 2>/dev/null || true
          fi
          python3 scripts/ci_candidate_lifecycle.py "${args[@]}"

      - name: Install uv for CI contract preflight
        if: steps.detect.outputs.ci_contract_changed == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Validate changed CI contracts before Hull build
        id: ci-contract
        if: steps.detect.outputs.ci_contract_changed == 'true'
        continue-on-error: true
        working-directory: candidate
        run: >-
          uv run --managed-python --python 3.11 --no-project
          --with PyYAML==6.0.3 python -m unittest
          scripts.test_ci_candidate_lifecycle
          scripts.test_ci_detect_docs_only
          scripts.test_pr_workflow_routing
          scripts.test_change_owned_workflow
          scripts.test_hosted_validation
          scripts.test_gate.DocsOnlySkipTests
          scripts.test_gate.CiParityTests

      - name: Record candidate preflight verdict
        id: candidate-preflight
        if: always()
        run: |
          lifecycle="${{ steps.candidate-lifecycle.outcome }}"
          contract="${{ steps.ci-contract.outcome }}"
          verdict=success
          if [ "$lifecycle" = "failure" ] || [ "$contract" = "failure" ]; then
            verdict=failure
          fi
          echo "candidate_preflight=$verdict" >> "$GITHUB_OUTPUT"
          echo "candidate lifecycle=$lifecycle, CI contract=$contract, verdict=$verdict"

  conformance:
    name: Hull Conformance Gate (Linux)
    runs-on: ubuntu-latest
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success, and the `if` fails safe (runs when the changes job did not
    # succeed) so a broken detector never skips the gate on a code PR.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight != 'failure' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # ~1,500 subprocess calls at ~50-80 ms/call under contention across 2-4
    # cores is ~30-45 s of subprocess wall; the binary build dominates. Allow
    # generous head room for a cold cargo cache.
    timeout-minutes: 20
    # Strip debuginfo on the build; debuginfo is the dominant target/
    # disk consumer and the conformance binary needs no symbols
    # (chelis#392). Release defaults to debug=false, but set it explicitly
    # so a future profile tweak cannot silently reintroduce the bloat.
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py). This
      # release-build job was missing the reclaim every ci.yml build job
      # already runs (chelis#392).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      # apt-get under retry (scripts/ci_apt_get.py): a transient apt mirror
      # reset would otherwise flake this required gate with no code change.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `.cargo/config.toml` sets `PYO3_PYTHON=.venv/bin/python`; CI runners
      # need a matching uv-managed venv before any cargo run (pyo3-build-config
      # is a transitive build-dep that runs before main compilation). See
      # ci.yml lint-and-unit for the same pattern and the v8.1.0 pin rationale.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # The conformance runner needs the chelis binary by ABSOLUTE path (never a
      # bare PATH name). A release build matches the Hull campaign profile (a
      # debug build's check pass is multi-minute per program).
      - name: Build chelis (release)
        run: cargo build --release -p chelis-cli --bin chelis

      # The pure runner core (wire_to_canonical, derive_compiler_outcome,
      # classify_program, assert_acceptance_oracle), the wire-normalizer golden
      # tests, the corpus-integrity invariants, and the injected-unsound
      # self-test (the teeth). Binary-free; runs fast.
      - name: Conformance unit tests (pure core + teeth)
        run: |
          .venv/bin/python -m unittest \
            tests.conformance.hull.test_run_conformance \
            tests.conformance.hull.test_wire_canonical \
            tests.conformance.hull.test_corpus_integrity

      # THE GATE. Run the frozen ~1,500-program slice against the just-built
      # binary. Fails on any CompilerUnsound / unexplained Disagree / EvalDisagree.
      - name: Conformance gate (frozen corpus vs live compiler)
        run: |
          .venv/bin/python tests/conformance/hull/run_conformance.py \
            --chelis-bin "$GITHUB_WORKSPACE/target/release/chelis"

      # E2E TEETH PROOF: an injected compiler-accepts-a-reject-sentinel
      # divergence MUST make the runner exit nonzero. This step EXPECTS failure;
      # if the runner exits 0, the gate has no teeth and this step fails.
      - name: Conformance teeth (injected-unsound must fail the gate)
        run: |
          if .venv/bin/python tests/conformance/hull/run_conformance.py \
            --chelis-bin "$GITHUB_WORKSPACE/target/release/chelis" \
            --simulate-unsound reject_0000; then
            echo "TEETH BROKEN: --simulate-unsound exited 0; the gate did not catch the injected CompilerUnsound" >&2
            exit 1
          else
            echo "teeth verified: injected CompilerUnsound made the runner exit nonzero"
          fi
