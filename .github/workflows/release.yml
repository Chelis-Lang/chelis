name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Both toolchain tarballs come from the pinned, sandboxed Devenv release
  # output (nix/release-chelis.nix): the committed Cargo.nix graph, the
  # pinned cvc5 1.3.1 tree, a statically linked libzstd (plus libstdc++ on
  # Linux), and a portability rewrite off the Nix store (patchelf on Linux,
  # install_name_tool on Darwin). The derivation verifies behavior (version,
  # help, the release fixture, the chelis#422 cvc5 discharge) and enforces
  # the platform portability postconditions; Linux additionally enforces the
  # recorded glibc floor from nix/contracts.nix.
  build-chelis-release:
    name: Build portable chelis toolchain (${{ matrix.slug }})
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
            system: x86_64-linux
          - os: macos-latest
            slug: darwin-arm64
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      # cvc5 closure cache: the shared composite pair derives one key
      # from the cvc5-dir drvPath (the devenv-side cvc5 derivation is
      # byte-identical to the flake's), so a release dispatch reuses the
      # shared closure instead of paying the ~30m cvc5 build.
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: ${{ matrix.system }}

      # verify_release_chelis.py checks the exact output inventory, the
      # checksum, the exact tarball tree, and -- at a v* tag -- that the tag
      # equals v<workspace-version> before anything can publish.
      - name: Build and verify the portable chelis toolchain output
        id: build
        run: |
          devenv-retry build --no-tui --quiet outputs.release-chelis > release-chelis-build.json
          devenv-retry --profile ci shell --no-tui -- python scripts/verify_release_chelis.py \
            --build-json release-chelis-build.json \
            --stage-root release-chelis \
            --platform ${{ matrix.slug }}

      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: ${{ matrix.system }}
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

      - name: Stage chelisup bootstrap script
        if: matrix.slug == 'linux-x86_64'
        run: |
          # Publishing the bootstrap script as an asset gives the one-liner
          # a canonical URL: <repo>/releases/latest/download/chelisup.sh
          cp crates/chelisup/bootstrap/chelisup.sh chelisup.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-${{ matrix.slug }}
          path: |
            ${{ steps.build.outputs.path }}/chelis-v*-${{ matrix.slug }}.tar.gz
            ${{ steps.build.outputs.path }}/chelis-v*-${{ matrix.slug }}.tar.gz.sha256
            chelisup.sh
          if-no-files-found: error

  consume-chelis-release:
    name: Consume chelis release off Nix (linux-x86_64)
    needs: [build-chelis-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    defaults:
      run:
        shell: bash
    steps:
      # The pinned image is minimal: bootstrap python3 and the C toolchain
      # with raw apt-get (scripts/ci_apt_get.py itself needs python3, so the
      # helper cannot bootstrap its own interpreter).
      - name: Bootstrap consumption prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates gcc libc6-dev libopenblas-dev python3 tar gzip

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the staged release artifact
        uses: actions/download-artifact@v7
        with:
          name: chelis-linux-x86_64
          path: release-download

      - name: Assert the consumption environment glibc matches the contract
        run: |
          set -euo pipefail
          ldd --version | awk 'NR==1'
          python3 .github/scripts/verify_consumption_glibc.py

      - name: Unpack and run the shipped compiler
        run: |
          set -euo pipefail
          tarball="$(find release-download -name 'chelis-v*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$tarball"
          mkdir -p consume
          tar -xzf "$tarball" -C consume
          unpacked="$(find consume -mindepth 1 -maxdepth 1 -type d -print -quit)"
          echo "unpacked=$unpacked" >> "$GITHUB_ENV"
          "$unpacked/bin/chelis" --version
          "$unpacked/bin/chelis" --help >/dev/null

      - name: Verify the shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          tarball="$(find release-download -name 'chelis-v*-linux-x86_64.tar.gz' -print -quit)"
          python3 .github/scripts/verify_release_smt.py --tarball "$tarball"

      - name: Compile and run emitted C against the shipped runtime
        run: python3 .github/scripts/smoke_linux_openblas.py "$unpacked/bin/chelis"

  # Off-Nix consumption proof for Darwin: macos-latest runners carry no
  # Nix, so the stock runner is the clean consumption environment. It runs
  # the exact staged tarball, proves the cvc5 discharge on the shipped
  # binary, and compiles emitted C against the shipped runtime archive with
  # the system clang and Accelerate (.github/scripts/smoke_macos_accelerate.py).
  consume-chelis-release-darwin:
    name: Consume chelis release off Nix (darwin-arm64)
    needs: [build-chelis-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Download the staged release artifact
        uses: actions/download-artifact@v7
        with:
          name: chelis-darwin-arm64
          path: release-download

      - name: Unpack and run the shipped compiler
        run: |
          set -euo pipefail
          tarball="$(find release-download -name 'chelis-v*-darwin-arm64.tar.gz' -print -quit)"
          test -n "$tarball"
          mkdir -p consume
          tar -xzf "$tarball" -C consume
          unpacked="$(find consume -mindepth 1 -maxdepth 1 -type d -print -quit)"
          echo "unpacked=$unpacked" >> "$GITHUB_ENV"
          "$unpacked/bin/chelis" --version
          "$unpacked/bin/chelis" --help >/dev/null

      - name: Verify the shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          tarball="$(find release-download -name 'chelis-v*-darwin-arm64.tar.gz' -print -quit)"
          python3 .github/scripts/verify_release_smt.py --tarball "$tarball"

      - name: Compile and run emitted C against the shipped runtime
        run: python3 .github/scripts/smoke_macos_accelerate.py "$unpacked/bin/chelis"

  build-chelisup-release:
    name: Build portable chelisup (${{ matrix.slug }})
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
          - os: macos-latest
            slug: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Build and verify portable chelisup output
        id: build
        run: |
          devenv-retry build --no-tui --quiet outputs.release-chelisup > release-chelisup-build.json
          devenv-retry --profile ci shell --no-tui -- python scripts/verify_release_chelisup.py \
            --build-json release-chelisup-build.json \
            --stage-root release-chelisup \
            --platform ${{ matrix.slug }}

      - name: Upload portable chelisup artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelisup-${{ matrix.slug }}
          path: |
            ${{ steps.build.outputs.path }}/chelisup-${{ matrix.slug }}
            ${{ steps.build.outputs.path }}/chelisup-${{ matrix.slug }}.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    # Dispatch the workflow at a v* tag to publish its staged artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-chelis-release, consume-chelis-release, consume-chelis-release-darwin, build-chelisup-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # `chelisup-*` covers the bare executables and their .sha256
          # sidecars; `chelisup.sh` is the bootstrap script itself, giving
          # the one-liner a canonical latest-release URL.
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256
            release-assets/**/chelisup-*
            release-assets/**/chelisup.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
