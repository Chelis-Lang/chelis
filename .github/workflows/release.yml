name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the release tarball but do not publish a GitHub Release'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build chelis (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chelis-cli (release)
        run: cargo build --release -p chelis-cli

      - name: Build chelis-runtime staticlib (release)
        run: cargo build --release -p chelis-runtime

      - name: Strip binary
        run: strip target/release/chelis

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          cp target/release/libchelis_runtime.a "$staging/lib/"
          cp crates/chelis-runtime/include/chelis_runtime.h "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      - name: Upload build artifact (dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chelis-linux-x86_64
          path: |
            chelis-*-linux-x86_64.tar.gz
            chelis-*-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chelis-*-linux-x86_64.tar.gz
            chelis-*-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
