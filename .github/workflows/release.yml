name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Linux toolchain tarball comes from the pinned, sandboxed Devenv
  # release output (nix/release-chelis.nix): the committed Cargo.nix graph,
  # the pinned cvc5 1.3.1 tree, a statically linked libstdc++/libzstd, and a
  # patchelf interpreter rewrite off the Nix store. The derivation verifies
  # behavior (version/help, the release fixture, the chelis#422 cvc5
  # discharge) before the rewrite, then enforces the ELF portability
  # postconditions and the recorded glibc floor from nix/contracts.nix.
  build-chelis-release:
    name: Build portable chelis toolchain (linux-x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@73f017c4d3179dc313844e9d5f08d17a7879c824 # ci#37 prerequisite

      - name: Mint a scoped token for the private ci input
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          repositories: ci

      - name: Authenticate Nix to the private ci devenv input
        shell: bash
        env:
          CI_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          {
            echo "NIX_CONFIG<<EOF"
            printf '%s\n' "$NIX_CONFIG"
            echo "access-tokens = github.com=$CI_TOKEN"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # verify_release_chelis.py checks the exact output inventory, the
      # checksum, the exact tarball tree, and -- at a v* tag -- that the tag
      # equals v<workspace-version> before anything can publish.
      - name: Build and verify the portable chelis toolchain output
        id: build
        run: |
          devenv build --no-tui --quiet outputs.release-chelis > release-chelis-build.json
          python scripts/verify_release_chelis.py \
            --build-json release-chelis-build.json \
            --stage-root release-chelis

      - name: Stage chelisup bootstrap script
        run: |
          # Publishing the bootstrap script as an asset gives the one-liner
          # a canonical URL: <repo>/releases/latest/download/chelisup.sh
          cp crates/chelisup/bootstrap/chelisup.sh chelisup.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-linux-x86_64
          path: |
            ${{ steps.build.outputs.path }}/chelis-v*-linux-x86_64.tar.gz
            ${{ steps.build.outputs.path }}/chelis-v*-linux-x86_64.tar.gz.sha256
            chelisup.sh
          if-no-files-found: error

  # Off-Nix consumption proof: a clean, digest-pinned Ubuntu 24.04
  # container (glibc 2.39 -- must equal linuxReleaseConsumptionGlibc in
  # nix/contracts.nix, which must stay at or above the recorded binary
  # floor). The container has no Nix; it runs the exact staged tarball,
  # proves the cvc5 discharge on the shipped binary, and compiles emitted C
  # against the shipped runtime archive with the system gcc and OpenBLAS.
  consume-chelis-release:
    name: Consume chelis release off Nix (linux-x86_64)
    needs: [build-chelis-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    defaults:
      run:
        shell: bash
    steps:
      # The pinned image is minimal: bootstrap python3 and the C toolchain
      # with raw apt-get (scripts/ci_apt_get.py itself needs python3, so the
      # helper cannot bootstrap its own interpreter).
      - name: Bootstrap consumption prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates gcc libc6-dev libopenblas-dev python3 tar gzip

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the staged release artifact
        uses: actions/download-artifact@v7
        with:
          name: chelis-linux-x86_64
          path: release-download

      - name: Assert the consumption environment glibc matches the contract
        run: |
          set -euo pipefail
          ldd --version | awk 'NR==1'
          python3 .github/scripts/verify_consumption_glibc.py

      - name: Unpack and run the shipped compiler
        run: |
          set -euo pipefail
          tarball="$(find release-download -name 'chelis-v*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$tarball"
          mkdir -p consume
          tar -xzf "$tarball" -C consume
          unpacked="$(find consume -mindepth 1 -maxdepth 1 -type d -print -quit)"
          echo "unpacked=$unpacked" >> "$GITHUB_ENV"
          "$unpacked/bin/chelis" --version
          "$unpacked/bin/chelis" --help >/dev/null

      - name: Verify the shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          tarball="$(find release-download -name 'chelis-v*-linux-x86_64.tar.gz' -print -quit)"
          python3 .github/scripts/verify_release_smt.py --tarball "$tarball"

      - name: Compile and run emitted C against the shipped runtime
        run: python3 .github/scripts/smoke_linux_openblas.py "$unpacked/bin/chelis"

  build-darwin-arm64:
    name: Build chelis (darwin-arm64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # cvc5 builds from source under `--features smt` (chelis#422); the
    # 10-minute cap from the no-feature build is too tight for the cold
    # cvc5 compile on a cache miss. Raised from 30 for chelis#1004: a
    # measured cold build is ~14m here, and a fetch failure aborts in ~3m,
    # so three attempts fit in ~21m -- but 30 left no margin for a slow
    # runner on top of that.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # cvc5 builds from source for `--features smt`. CMake, Python
      # (3.11+, so cvc5's TOML codegen uses stdlib tomllib), and
      # libclang ship in the macos-latest image and Xcode CLT; cvc5
      # auto-downloads and builds its own static GMP. cmake is installed
      # defensively in case a future image drops it from PATH.
      - name: Install SMT build dependencies (cvc5)
        run: |
          set -euo pipefail
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # See the linux-x86_64 job for the WI-11 GMP-not-CLN rationale and the
      # chelis#1004 fetch-retry rationale.
      - name: Build chelis-cli (release, smt)
        run: python3 scripts/ci_cvc5_build.py -- cargo build --release -p chelis-cli --features smt

      - name: Build chelis-runtime staticlib (release)
        run: cargo build --release -p chelis-runtime

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

      - name: Release binary test fixture
        run: |
          set -euo pipefail
          (cd crates/chelis-cli/tests/fixtures/release_pipe_stage && ../../../../../target/release/chelis test tests)

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Strip binary
        run: strip -x target/release/chelis || true

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/release/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test generated C with Accelerate
        run: python3 .github/scripts/smoke_macos_accelerate.py ./target/release/chelis

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-darwin-arm64"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          cp target/release/libchelis_runtime.a "$staging/lib/"
          cp crates/chelis-runtime/include/chelis_runtime.h "$staging/include/"
          cp crates/chelis-runtime/include/chelis_runtime_dtype.h "$staging/include/"
          cp crates/chelis-runtime/include/chelis_blas.h "$staging/include/"
          cp crates/chelis-runtime/include/chelis_simd.h "$staging/include/"
          cp crates/chelis-runtime/include/chelis_math.h "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      # Verify the SHIPPED artifact (the binary inside the tarball)
      # discharges via cvc5 -- see the linux-x86_64 job.
      - name: Verify shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_release_smt.py \
            --tarball "chelis-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-darwin-arm64
          path: |
            chelis-*-darwin-arm64.tar.gz
            chelis-*-darwin-arm64.tar.gz.sha256

  build-chelisup-release:
    name: Build portable chelisup (${{ matrix.slug }})
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
          - os: macos-latest
            slug: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@73f017c4d3179dc313844e9d5f08d17a7879c824 # ci#37 prerequisite

      - name: Mint a scoped token for the private ci input
        id: ci-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          repositories: ci

      - name: Authenticate Nix to the private ci devenv input
        shell: bash
        env:
          CI_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          {
            echo "NIX_CONFIG<<EOF"
            printf '%s\n' "$NIX_CONFIG"
            echo "access-tokens = github.com=$CI_TOKEN"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and verify portable chelisup output
        id: build
        run: |
          devenv build --no-tui --quiet outputs.release-chelisup > release-chelisup-build.json
          python scripts/verify_release_chelisup.py \
            --build-json release-chelisup-build.json \
            --stage-root release-chelisup \
            --platform ${{ matrix.slug }}

      - name: Upload portable chelisup artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelisup-${{ matrix.slug }}
          path: |
            ${{ steps.build.outputs.path }}/chelisup-${{ matrix.slug }}
            ${{ steps.build.outputs.path }}/chelisup-${{ matrix.slug }}.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    # Dispatch the workflow at a v* tag to publish its staged artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-chelis-release, consume-chelis-release, build-darwin-arm64, build-chelisup-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # `chelisup-*` covers the bare executables and their .sha256
          # sidecars; `chelisup.sh` is the bootstrap script itself, giving
          # the one-liner a canonical latest-release URL.
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256
            release-assets/**/chelisup-*
            release-assets/**/chelisup.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
