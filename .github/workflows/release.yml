name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build chelis (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chelis-cli (release)
        run: cargo build --release -p chelis-cli

      - name: Build chelis-runtime staticlib (release)
        run: cargo build --release -p chelis-runtime

      - name: Test workspace
        run: cargo test --workspace

      - name: Strip binary
        run: strip target/release/chelis

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          cp target/release/libchelis_runtime.a "$staging/lib/"
          cp crates/chelis-runtime/include/chelis_runtime.h "$staging/include/"
          cp crates/chelis-runtime/include/chelis_blas.h "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chelis-linux-x86_64
          path: |
            chelis-*-linux-x86_64.tar.gz
            chelis-*-linux-x86_64.tar.gz.sha256

  build-darwin-arm64:
    name: Build chelis (darwin-arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chelis-cli (release)
        run: cargo build --release -p chelis-cli

      - name: Build chelis-runtime staticlib (release)
        run: cargo build --release -p chelis-runtime

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Test workspace
        run: CARGO_INCREMENTAL=0 cargo test --workspace

      - name: Strip binary
        run: strip -x target/release/chelis || true

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/release/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test generated C with Accelerate
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/matmul.ch" <<'EOF'
          a = (a : tensor[2, 3, f32])
          b = (b : tensor[3, 4, f32])
          out = (matmul(a, b) : tensor[2, 4, f32])
          EOF
          ./target/release/chelis build "$tmpdir/matmul.ch" --output "$tmpdir/out"
          grep -q 'cblas_sgemm' "$tmpdir/out/matmul.c"
          grep -q 'chelis_blas.h' "$tmpdir/out/matmul.c"
          cat > "$tmpdir/out/driver.c" <<'EOF'
          #include "chelis_runtime.h"
          void matmul(chelis_tensor **inputs, int n_in, chelis_tensor **outputs, int n_out);
          int main(void) {
              chelis_tensor *outputs[1] = {0};
              matmul(NULL, 0, outputs, 1);
              chelis_free(outputs[0]);
              return 0;
          }
          EOF
          clang -O2 -I "$tmpdir/out" -c "$tmpdir/out/matmul.c" -o "$tmpdir/out/matmul.o"
          clang -O2 -I "$tmpdir/out" -c "$tmpdir/out/driver.c" -o "$tmpdir/out/driver.o"
          clang "$tmpdir/out/matmul.o" "$tmpdir/out/driver.o" \
            "$tmpdir/out/libchelis_runtime.a" -framework Accelerate -lpthread -ldl \
            -o "$tmpdir/out/matmul_bin"
          "$tmpdir/out/matmul_bin"

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-darwin-arm64"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          cp target/release/libchelis_runtime.a "$staging/lib/"
          cp crates/chelis-runtime/include/chelis_runtime.h "$staging/include/"
          cp crates/chelis-runtime/include/chelis_blas.h "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chelis-darwin-arm64
          path: |
            chelis-*-darwin-arm64.tar.gz
            chelis-*-darwin-arm64.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
