name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Run the release-notes extraction BEFORE any platform build starts.
  # publish-release runs the same `changelog.py extract` on the tagged
  # commit, but only after the three builds and the canary (~35m). The
  # v0.18.8 tag (run 34782623299) reached that step with two fragments
  # that had merged to main between the release-branch cut and the
  # release squash merge, so extract refused, nothing was published, and
  # the builds had been wasted. Failing the same check here bounds a bad
  # tag to about a minute. On workflow_dispatch there is no tag to
  # extract, so the job runs the read-only `changelog.py check` instead:
  # the job must still succeed on dispatch because every build job
  # `needs` it, and a skipped job would skip its dependents too.
  preflight:
    name: Release notes preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout tagged release notes
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Extract committed release notes (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: .venv/bin/python scripts/changelog.py extract --version "$RELEASE_VERSION" --output /tmp/release-notes.md

      - name: Validate pending fragments (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/changelog.py check

  build-linux-x86_64:
    name: Build chelis (linux-x86_64)
    needs: [preflight]
    runs-on: ubuntu-latest
    # chelis#1004: a cold cvc5 build measures ~30m here, and the retry
    # wrapper can add a couple of fast-failing fetch attempts on top. This
    # job had no ceiling at all, so a stalled fetch would have run toward
    # the 6-hour runner cap; 75m bounds it while leaving real headroom.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # cvc5 builds from source for `--features smt` (chelis#422):
      # cmake/g++/libclang plus git (cvc5-sys clones the cvc5 source at
      # build time). cvc5 auto-downloads and builds its own static GMP,
      # so libgmp-dev is not strictly required, but it mirrors the
      # ci.yml smt-build recipe (docs/smt_build_setup.md). apt-get under
      # retry (scripts/ci_apt_get.py) so a transient mirror reset does not
      # flake a release build.
      - name: Install SMT build dependencies (cvc5)
        run: python3 scripts/ci_apt_get.py g++ cmake libclang-dev git libgmp-dev libmpfr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # `--features smt` links cvc5 so the shipped `chelis prove` uses
      # the SMT solver instead of degrading to the solver-free fuzz path
      # (chelis#422). WI-11: the cvc5-sys build forces GMP and disables
      # the GPL CLN path (ENABLE_GPL=OFF, USE_CLN=OFF), so the artifact
      # is distributable. The verify step below proves the feature is
      # live in the shipped binary.
      #
      # Wrapped in scripts/ci_cvc5_build.py (chelis#1004): the cold build
      # starts by fetching cvc5 and its deps over the network, and a
      # transient GitHub refusal there fails this job and skips the publish.
      # The wrapper retries ONLY a fetch-signature failure; a real build
      # failure still fails on the first attempt, so this job remains the
      # cold-build proof docs/smt_build_setup.md says it is.
      - name: Build chelis-cli (release, smt)
        run: python3 scripts/ci_cvc5_build.py -- cargo build --release -p chelis-cli --features smt,sealed-runtime

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

      - name: Release binary test fixture
        run: |
          set -euo pipefail
          (cd crates/chelis-cli/tests/fixtures/release_pipe_stage && ../../../../../target/release/chelis test tests)

      - name: Strip binary
        run: strip target/release/chelis

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          # Ship the runtime the released chelis carries (spec/08-backends.md §2.1).
          runtime_export="$(mktemp -d)"
          ./target/release/chelis runtime export "$runtime_export"
          cp "$runtime_export/libchelis_runtime.a" "$staging/lib/"
          # The shipped archive is the sealed export's, byte for byte.
          python3 -c 'import hashlib, json, sys; receipt = json.load(open(sys.argv[1])); digest = hashlib.sha256(open(sys.argv[2], "rb").read()).hexdigest(); sys.exit(0 if (receipt["mode"], receipt["archive_sha256"]) == ("sealed", digest) else f"shipped runtime {digest} is not the sealed export {receipt}")' "$runtime_export/chelis_runtime.receipt.json" "$staging/lib/libchelis_runtime.a"
          cp "$runtime_export/chelis_runtime.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_views.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_dtype.h" "$staging/include/"
          cp "$runtime_export/chelis_blas.h" "$staging/include/"
          cp "$runtime_export/chelis_simd.h" "$staging/include/"
          cp "$runtime_export/chelis_math.h" "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      # Verify the SHIPPED artifact: unpack the staged tarball and run
      # the cvc5-discharge check on the extracted (stripped) bin/chelis.
      # The earlier verify step runs on target/release/chelis before
      # staging; this one proves the exact binary inside the .tar.gz
      # users download still discharges via cvc5 (chelis#422), and would
      # also catch a staging step that copied the wrong binary.
      - name: Verify shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_release_smt.py \
            --tarball "chelis-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-linux-x86_64
          path: |
            chelis-*-linux-x86_64.tar.gz
            chelis-*-linux-x86_64.tar.gz.sha256
          retention-days: 7

  build-linux-x86_64-glibc231:
    name: Build chelis (linux-x86_64, glibc 2.31)
    needs: [preflight]
    runs-on: ubuntu-latest
    # Debian 11 ships glibc 2.31. Building inside it caps the binary's glibc
    # verneed records at 2.31, so the tarball loads on Debian 11/12 and
    # Ubuntu 20.04+. The default ubuntu-latest build records a hard
    # GLIBC_2.39 requirement (Rust std's weak pidfd refs) and refuses to
    # load on anything older (#330).
    # Pin both the Bullseye/Python base and, after checkout, its apt snapshot.
    # This retains glibc 2.31 without relying on a moving Debian mirror during
    # a release build.
    container: python:3.11.13-bullseye@sha256:df0bd610af061603b29d63eb82027b64d5a3f15506e39270422b10b2a55079fc
    # chelis#1004: see the linux-x86_64 job. Same measured ~30m cold build,
    # same previously-unbounded wall clock.
    timeout-minutes: 75
    # Container jobs default `run:` steps to `sh`, which rejects
    # `set -o pipefail` and `${VAR::8}`; the Bullseye image ships bash.
    defaults:
      run:
        shell: bash
    steps:
      # `--features smt` (chelis#422) builds cvc5 from source: cmake,
      # g++ (via build-essential), libclang for bindgen, and git for the
      # cvc5-sys clone. m4 is required by GMP's configure: cvc5
      # builds its own static GMP from source under --auto-download, and
      # GMP's ./configure aborts with "No usable m4 in $PATH" without it
      # (the base omits m4). libgmp/libmpfr-dev and libopenblas-dev mirror the
      # ci.yml smt-build-glibc231 lane so the prove-in-CI lane builds with the
      # same system libs this job ships. Python 3.11 includes pip and venv;
      # cvc5 uses stdlib tomllib without a separate PyPI dependency.

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build prerequisites
        run: python3 scripts/ci_apt_get.py --debian-bullseye-snapshot --no-sudo --no-install-recommends build-essential m4 cmake libclang-dev libopenblas-dev libgmp-dev libmpfr-dev

      # `head -1` would SIGPIPE ldd under pipefail (racy exit 141);
      # awk consumes its whole input.
      - name: Assert glibc 2.31 build environment
        run: |
          set -euo pipefail
          ldd --version | awk 'NR==1'
          ldd --version | awk 'NR==1' | grep -F '2.31'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # See the linux-x86_64 job for the WI-11 GMP-not-CLN rationale and the
      # chelis#1004 fetch-retry rationale.
      - name: Build chelis-cli (release, smt)
        run: python3 scripts/ci_cvc5_build.py -- cargo build --release -p chelis-cli --features smt,sealed-runtime

      # WS-B (chelis#164): the bootstrap installer
      # (crates/chelisup/bootstrap/chelisup.sh) downloads a BARE executable
      # asset `chelisup-<slug>` (no version in the name, no tarball) from
      # the latest release. The linux chelisup ships from THIS glibc-2.31
      # job, not the ubuntu-latest one: chelisup is the first binary a bare
      # machine runs, so it must load on the oldest supported glibc (#330).
      # (The bootstrap also knows a darwin-x86_64 slug; no release job
      # builds it, matching the toolchain tarballs.)
      - name: Build chelisup (release)
        run: cargo build --release -p chelisup

      # Run before strip so the prove path exercises a functional
      # binary; the strip below only removes symbols.
      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

      # Runs the built binary inside the glibc-2.31 container, proving the
      # shipped artifact actually loads and works on the oldest supported
      # glibc — the exact failure mode of #330.
      - name: Release binary test fixture
        run: |
          set -euo pipefail
          (cd crates/chelis-cli/tests/fixtures/release_pipe_stage && ../../../../../target/release/chelis test tests)

      - name: Strip binary
        run: strip target/release/chelis

      - name: Assert no glibc requirement above 2.31
        run: |
          set -euo pipefail
          max_req="$(objdump -T target/release/chelis | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "max glibc requirement: ${max_req}"
          test "$(printf 'GLIBC_2.31\n%s\n' "${max_req}" | sort -V | tail -1)" = "GLIBC_2.31"

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-linux-x86_64-glibc2.31"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          # Ship the runtime the released chelis carries (spec/08-backends.md §2.1).
          runtime_export="$(mktemp -d)"
          ./target/release/chelis runtime export "$runtime_export"
          cp "$runtime_export/libchelis_runtime.a" "$staging/lib/"
          # The shipped archive is the sealed export's, byte for byte.
          python3 -c 'import hashlib, json, sys; receipt = json.load(open(sys.argv[1])); digest = hashlib.sha256(open(sys.argv[2], "rb").read()).hexdigest(); sys.exit(0 if (receipt["mode"], receipt["archive_sha256"]) == ("sealed", digest) else f"shipped runtime {digest} is not the sealed export {receipt}")' "$runtime_export/chelis_runtime.receipt.json" "$staging/lib/libchelis_runtime.a"
          cp "$runtime_export/chelis_runtime.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_views.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_dtype.h" "$staging/include/"
          cp "$runtime_export/chelis_blas.h" "$staging/include/"
          cp "$runtime_export/chelis_simd.h" "$staging/include/"
          cp "$runtime_export/chelis_math.h" "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      # Verify the SHIPPED artifact (the stripped binary inside the
      # tarball) discharges via cvc5 -- see the linux-x86_64 job. Here the
      # staged binary is already stripped (strip runs above), so this
      # proves the stripped, packaged cvc5 build still works.
      - name: Verify shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_release_smt.py \
            --tarball "chelis-${{ steps.version.outputs.version }}-linux-x86_64-glibc2.31.tar.gz"

      - name: Stage chelisup asset (bare executable + sha256 + bootstrap script)
        run: |
          set -euo pipefail
          strip target/release/chelisup
          max_req="$(objdump -T target/release/chelisup | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "chelisup max glibc requirement: ${max_req}"
          test "$(printf 'GLIBC_2.31\n%s\n' "${max_req}" | sort -V | tail -1)" = "GLIBC_2.31"
          ./target/release/chelisup --help >/dev/null
          cp target/release/chelisup chelisup-linux-x86_64
          sha256sum chelisup-linux-x86_64 > chelisup-linux-x86_64.sha256
          # Publishing the bootstrap script as an asset gives the one-liner
          # a canonical URL: <repo>/releases/latest/download/chelisup.sh
          cp crates/chelisup/bootstrap/chelisup.sh chelisup.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-linux-x86_64-glibc2.31
          path: |
            chelis-*-linux-x86_64-glibc2.31.tar.gz
            chelis-*-linux-x86_64-glibc2.31.tar.gz.sha256
            chelisup-linux-x86_64
            chelisup-linux-x86_64.sha256
            chelisup.sh
          retention-days: 7

  build-darwin-arm64:
    name: Build chelis (darwin-arm64)
    needs: [preflight]
    runs-on: macos-latest
    # cvc5 builds from source under `--features smt` (chelis#422); the
    # 10-minute cap from the no-feature build is too tight for the cold
    # cvc5 compile on a cache miss. Raised from 30 for chelis#1004: a
    # measured cold build is ~14m here, and a fetch failure aborts in ~3m,
    # so three attempts fit in ~21m -- but 30 left no margin for a slow
    # runner on top of that.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # cvc5 builds from source for `--features smt`. CMake, Python
      # (3.11+, so cvc5's TOML codegen uses stdlib tomllib), and
      # libclang ship in the macos-latest image and Xcode CLT; cvc5
      # auto-downloads and builds its own static GMP. cmake is installed
      # defensively in case a future image drops it from PATH.
      - name: Install SMT build dependencies (cvc5)
        run: |
          set -euo pipefail
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # See the linux-x86_64 job for the WI-11 GMP-not-CLN rationale and the
      # chelis#1004 fetch-retry rationale.
      - name: Build chelis-cli (release, smt)
        run: python3 scripts/ci_cvc5_build.py -- cargo build --release -p chelis-cli --features smt,sealed-runtime

      # WS-B (chelis#164): darwin half of the bare `chelisup-<slug>`
      # bootstrap asset — see the glibc-2.31 job for the convention.
      - name: Build chelisup (release)
        run: cargo build --release -p chelisup

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

      - name: Release binary test fixture
        run: |
          set -euo pipefail
          (cd crates/chelis-cli/tests/fixtures/release_pipe_stage && ../../../../../target/release/chelis test tests)

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Strip binary
        run: strip -x target/release/chelis || true

      - name: Verify binary runs
        run: ./target/release/chelis --help || ./target/release/chelis help || true

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/release/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test manifested C callable ABI
        run: python3 .github/scripts/smoke_macos_manifested_callable.py ./target/release/chelis

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage tarball contents
        run: |
          set -euo pipefail
          staging="chelis-${{ steps.version.outputs.version }}-darwin-arm64"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include"
          cp target/release/chelis "$staging/bin/"
          # Ship the runtime the released chelis carries (spec/08-backends.md §2.1).
          runtime_export="$(mktemp -d)"
          ./target/release/chelis runtime export "$runtime_export"
          cp "$runtime_export/libchelis_runtime.a" "$staging/lib/"
          # The shipped archive is the sealed export's, byte for byte.
          python3 -c 'import hashlib, json, sys; receipt = json.load(open(sys.argv[1])); digest = hashlib.sha256(open(sys.argv[2], "rb").read()).hexdigest(); sys.exit(0 if (receipt["mode"], receipt["archive_sha256"]) == ("sealed", digest) else f"shipped runtime {digest} is not the sealed export {receipt}")' "$runtime_export/chelis_runtime.receipt.json" "$staging/lib/libchelis_runtime.a"
          cp "$runtime_export/chelis_runtime.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_views.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_dtype.h" "$staging/include/"
          cp "$runtime_export/chelis_blas.h" "$staging/include/"
          cp "$runtime_export/chelis_simd.h" "$staging/include/"
          cp "$runtime_export/chelis_math.h" "$staging/include/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          ls -la "${staging}.tar.gz"*

      # Verify the SHIPPED artifact (the binary inside the tarball)
      # discharges via cvc5 -- see the linux-x86_64 job.
      - name: Verify shipped tarball discharges via cvc5
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_release_smt.py \
            --tarball "chelis-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz"

      - name: Stage chelisup asset (bare executable + sha256)
        run: |
          set -euo pipefail
          strip -x target/release/chelisup || true
          file target/release/chelisup | grep -E 'arm64|aarch64'
          ./target/release/chelisup --help >/dev/null
          cp target/release/chelisup chelisup-darwin-arm64
          shasum -a 256 chelisup-darwin-arm64 > chelisup-darwin-arm64.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-darwin-arm64
          path: |
            chelis-*-darwin-arm64.tar.gz
            chelis-*-darwin-arm64.tar.gz.sha256
            chelisup-darwin-arm64
            chelisup-darwin-arm64.sha256
          retention-days: 7

  installed-artifact-canary:
    name: Installed C callable (${{ matrix.slug }})
    needs: [preflight, build-linux-x86_64, build-linux-x86_64-glibc231, build-darwin-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            slug: linux-x86_64
            installer_artifact: chelis-linux-x86_64-glibc2.31
          - runner: macos-latest
            slug: darwin-arm64
            installer_artifact: chelis-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source and canary
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Create uv-managed venv
        run: uv venv --python 3.11
      - name: Download staged toolchain
        uses: actions/download-artifact@v7
        with:
          name: chelis-${{ matrix.slug }}
          path: installed-canary-assets/toolchain
      - name: Download staged installer
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.installer_artifact }}
          path: installed-canary-assets/installer
      - name: Install verified archive and run shipped callable
        run: .venv/bin/python scripts/installed_artifact_canary.py --artifacts installed-canary-assets/toolchain --installer-assets installed-canary-assets/installer --source-sha "${{ github.sha }}" --evidence installed-canary-evidence
      - name: Retain installed-artifact evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-callable-${{ matrix.slug }}
          path: installed-canary-evidence
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-linux-x86_64-glibc231, build-darwin-arm64, installed-artifact-canary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged release notes
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Extract committed release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: .venv/bin/python scripts/changelog.py extract --version "$RELEASE_VERSION" --output release-notes.md

      - name: Download staged artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: chelis-*
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # `chelisup-*` covers the bare executables and their .sha256
          # sidecars; `chelisup.sh` is the bootstrap script itself, giving
          # the one-liner a canonical latest-release URL.
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256
            release-assets/**/chelisup-*
            release-assets/**/chelisup.sh
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
