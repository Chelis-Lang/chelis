name: Hull Conformance Nightly

# A LIGHTENED WEEKLY fresh Hull conformance campaign. The PRIMARY regression
# guard is the per-PR gate (conformance.yml): it replays the frozen, fixed
# ~1,500-program slice against every PR and is cheap. This workflow is a
# SUPPLEMENT that draws NEW programs the frozen slice never sees and compares
# them against the LIVE Hull reference, catching a regression only a new program
# would expose; it also re-validates the freeze. The fresh campaign is no longer
# a heavyweight daily >=10k sweep (the per-PR frozen gate already proves
# soundness on every change) -- it runs weekly at a reduced program count.
#
# Unlike the per-PR gate (no Hull process, frozen-Hull-verdict comparison), this
# workflow is the ONE place a Hull process runs: it checks out Hull at its pinned
# commit, builds the live chelis binary, runs Hull's OWN authoritative live
# `differential_check` campaign (scripts/run_differential_suite.py) against the
# fresh binary with a FRESH date-derived seed, AND re-validates the frozen
# per-PR corpus so an unexpected drift on an unchanged compiler surfaces as a
# failing gate while a deliberate compiler semantics change is a reviewable
# corpus refresh.
#
# Modeled on heavy-e2e.yml: scheduled cron + manual dispatch ONLY, never per-PR,
# never on push.

on:
  schedule:
    # 07:00 UTC every Sunday. Weekly, off-peak; the per-PR frozen gate is the
    # daily/per-change guard, so this fresh-program supplement runs weekly.
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Hull commit the frozen corpus was produced from. Bump this in lockstep
  # with a corpus refresh so the nightly fresh campaign uses the same Hull
  # reference logic the frozen corpus was pinned against.
  HULL_REPO: Chelis-Lang/hull

jobs:
  conformance-nightly:
    name: Hull Conformance Nightly (Linux)
    runs-on: ubuntu-latest
    # The lightened sharded campaign wall (~3-5 min at check-n 2000) plus build
    # + checkout head room; the release build dominates. 30 min stays generous.
    timeout-minutes: 30
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      # Mint a short-lived token scoped to the private `hull` repo so the
      # cross-repo Hull checkout can read it. The default GITHUB_TOKEN only
      # grants access to this repo, which is why the Hull checkout previously
      # failed with git exit 128. Auto-revoked at job end.
      - name: Mint cross-repo token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          repositories: hull
          permission-contents: read

      - name: Checkout chelis
        uses: actions/checkout@v6
        with:
          path: chelis

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      # Hull at the commit the frozen corpus was pinned against (manifest
      # hull_commit). The nightly reads that field and checks Hull out at it so
      # the fresh campaign and the frozen corpus share one Hull reference.
      - name: Read pinned Hull commit
        id: hull
        run: |
          commit=$(python3 -c 'import json;print(json.load(open("chelis/tests/conformance/hull/manifest.json"))["hull_commit"])')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout Hull at pinned commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HULL_REPO }}
          ref: ${{ steps.hull.outputs.commit }}
          path: hull
          token: ${{ steps.app-token.outputs.token }}

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chelis

      - name: Build chelis (release)
        working-directory: chelis
        run: devenv-retry --profile ci shell --no-tui -- cargo build --release -p chelis-cli --bin chelis

      # FAIL FAST on a cross-repo cascade lag (chelis#341/#335). The fresh
      # campaign runs Hull's `chelis reef build`, which rejects any manifest
      # whose `compiler = "=X.Y.Z"` pin is not byte-equal to the live binary.
      # When chelis is released ahead of a Hull cascade (e.g. live 0.10.0 vs a
      # pinned Hull whose deps pin =0.8.0) EVERY shard dies with an opaque
      # `missing report (rc=2)` / `package.compiler must be =X.Y.Z`. This step
      # diagnoses that up front with a single actionable line. It still exits
      # nonzero on a skew -- the nightly stays red until Hull is cascaded and
      # `hull_commit` in tests/conformance/hull/manifest.json is bumped in
      # lockstep -- it just replaces four cryptic shard crashes with the cause.
      - name: Check Hull pin vs live chelis version (cascade-skew guard)
        working-directory: chelis
        run: |
          devenv-retry --profile ci shell --no-tui -- python scripts/ci_check_hull_pin_skew.py \
            --chelis-bin "$GITHUB_WORKSPACE/chelis/target/release/chelis" \
            --hull-reef-toml "$GITHUB_WORKSPACE/hull/reef.toml"

      # FRESH (LIGHTENED) CAMPAIGN. Run Hull's OWN authoritative live differential
      # campaign against the freshly-built binary with a FRESH date-derived seed,
      # exercising NEW programs the frozen slice never sees. This is the live
      # Hull `differential_check`, not the frozen strings. The per-PR frozen
      # ~1,500-program gate (conformance.yml) is the PRIMARY cheap regression
      # guard on every PR; this weekly run is a LIGHTENED fresh-program supplement
      # against the live Hull reference, not a heavyweight daily >=10k sweep. The
      # program count is reduced to --check-n 2000 / --eval-n 200 (--shards 4
      # proportional); the seed is the run date so each week draws a distinct
      # sequence.
      - name: Fresh campaign (live Hull reference)
        working-directory: chelis
        # The pinned Hull driver spawns `chelis` by name. Run from the Hull
        # checkout, and prepend the release directory inside the Devenv shell.
        run: |
          export SEED="$(date -u +%Y%m%d)"
          # shellcheck disable=SC2016
          devenv-retry --profile ci shell --no-tui -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE/hull"
            mkdir -p corpus/scratch
            export PATH="$GITHUB_WORKSPACE/chelis/target/release:$PATH"
            exec python scripts/run_differential_suite.py \
              --check-n 2000 --eval-n 200 --shards 4 \
              --seed "$SEED" \
              --chelis-bin "$GITHUB_WORKSPACE/chelis/target/release/chelis"
          '

      # RE-VALIDATE THE FREEZE: run the frozen per-PR corpus against the same
      # fresh binary (the full slice, no caps). An unexpected drift on an
      # unchanged compiler surfaces here as a failing gate; a deliberate
      # semantics change must refresh the corpus (a reviewable diff).
      - name: Re-validate the frozen corpus
        working-directory: chelis
        run: |
          devenv-retry --profile ci shell --no-tui -- python tests/conformance/hull/run_conformance.py \
            --chelis-bin "$GITHUB_WORKSPACE/chelis/target/release/chelis"

      - name: Conformance teeth (injected-unsound must fail the gate)
        working-directory: chelis
        run: |
          if devenv-retry --profile ci shell --no-tui -- python tests/conformance/hull/run_conformance.py \
            --chelis-bin "$GITHUB_WORKSPACE/chelis/target/release/chelis" \
            --simulate-unsound reject_0000; then
            echo "TEETH BROKEN: --simulate-unsound exited 0" >&2
            exit 1
          fi

  # Surface a nightly failure as a tracking issue (opens on failure, closes on
  # green). Scheduled-run failures show no red status on main, which is how
  # this nightly stayed red for days unnoticed (e.g. the cross-repo Hull
  # checkout failing with git exit 128).
  report:
    name: Surface nightly status
    needs: conformance-nightly
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      - name: Open or close the nightly tracking issue
        uses: Chelis-Lang/ci/actions/nightly-status@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          github-token: ${{ github.token }}
          result: ${{ needs.conformance-nightly.result }}
          issue-title: "Nightly failing: Hull Conformance"
          issue-body: |
            The **Hull Conformance** nightly failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: `${{ github.sha }}`

            Auto-opened on failure; auto-closes when the nightly next passes.
          issue-label: nightly-failure
          recovery-comment: >-
            Nightly green again — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Closing.
