name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# Keyed by head SHA, and never cancelling. This check reports per head, so a
# run for an older head cannot answer for a newer one and there is nothing to
# gain by killing it; keying by pull request instead made every push cancel the
# previous head's run. Within one head the extra events are metadata -- a body
# or title edit, a label change -- and cancelling the in-flight verdict for
# those leaves a `cancelled` check run that reads as a failure on an otherwise
# green pull request. The agent contract requires recording review evidence in
# the body before merging, so that collision is routine rather than rare. The
# job is roughly 30 seconds, so letting both finish is cheaper than the
# confusion.
concurrency:
  group: >-
    changelog-${{ github.event.pull_request.number }}-${{
    github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head and history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Test changelog contract
        run: .venv/bin/python -m unittest scripts.test_changelog

      - name: Check PR changelog policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .venv/bin/python scripts/changelog.py check-pr --base "$BASE_SHA" --head "$HEAD_SHA"
