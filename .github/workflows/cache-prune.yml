name: Prune CI caches

# Deletes provably-dead Actions caches (closed-PR generations + stale duplicate
# main generations) so the pool stays well under GitHub's 10GB per-repo LRU
# budget and useful caches are never the eviction victim. Durable cvc5 fallback
# caches (`cvc5-prebuilt-*`) are protected. Policy + tests:
# scripts/ci_cache_prune.py / scripts/test_ci_cache_prune.py.

on:
  schedule:
    # Weekly Monday morning; the scheduled run APPLIES deletions.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete (unchecked = dry-run print only)"
        type: boolean
        default: false

permissions:
  actions: write        # delete caches
  contents: read        # checkout
  pull-requests: read   # open-PR set for closed-PR pruning

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale Actions caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Scheduled runs apply; manual dispatch is dry-run unless `apply` is set,
      # so a human can inspect the plan first.
      - name: Prune caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_cache_prune.py
          ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && '--apply' || '' }}
