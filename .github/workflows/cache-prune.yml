name: Prune CI caches

# Deletes provably-dead Actions caches so the pool stays under GitHub's
# repository limit. The shared action owns the cache mechanics. This workflow
# owns the schedule, apply policy, retention count, and protected prefixes.

on:
  schedule:
    # Weekly Monday morning; the scheduled run APPLIES deletions.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete (unchecked = dry-run print only)"
        type: boolean
        default: false

permissions:
  actions: write        # delete caches
  contents: read        # checkout
  pull-requests: read   # open-PR set for closed-PR pruning

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale Actions caches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@128d3acc50bb04bf75a6bb4cf34ec7f50dc388b9 # ci#50 shared composition

      # Scheduled runs apply. Manual dispatch is a dry run unless `apply` is set.
      - name: Prune caches
        uses: Chelis-Lang/ci/actions/prune-actions-cache@128d3acc50bb04bf75a6bb4cf34ec7f50dc388b9 # ci#50 shared composition
        with:
          github-token: ${{ github.token }}
          primary-ref: refs/heads/main
          apply: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
          keep-per-prefix: '1'
          protected-prefixes: cvc5-prebuilt-
