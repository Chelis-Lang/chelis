name: Release E2E

# Installs a release the way users get it and runs it on the hosts the install
# guide names: macOS 14, 15 and 26, Ubuntu 22.04 and 24.04, pinned
# distribution images from glibc 2.31 to current and musl Alpine, and NixOS
# with and without nix-ld. scripts/release_e2e.py owns the steps and the
# report; this workflow provides the hosts and builds nothing.
#
# It runs after each tag's release.yml run succeeds, which is the run that
# publishes the release, and by hand for a published tag or for the
# unpublished artifacts of a release.yml run. It reports problems; it does not
# gate publishing. release.yml publishes with GITHUB_TOKEN, and GitHub starts
# no workflow for events that token creates, so `release: published` would
# never fire here.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to check (vX.Y.Z)
        required: false
      candidate_run:
        description: Or the id of a release.yml run whose unpublished artifacts to check
        required: false

permissions:
  contents: read
  actions: read

jobs:
  inputs:
    name: Release assets and gates
    # A release.yml run published a release when a tag push started it and it
    # succeeded. Its dispatch runs publish nothing.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.identity.outputs.source-sha }}
      tag: ${{ steps.identity.outputs.tag }}
      archive-label: ${{ steps.identity.outputs.archive-label }}
    steps:
      - name: Resolve the release under test
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE_RUN" ]; then
            if [ -n "$TAG" ]; then
              echo "::error::give a tag or a candidate run, not both"
              exit 1
            fi
            workflow="$(gh run view "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)"
            if [ "$workflow" != release ]; then
              echo "::error::run $CANDIDATE_RUN is a $workflow run, not a release.yml run"
              exit 1
            fi
            sha="$(gh run view "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag must be vX.Y.Z, got '$TAG'"
            exit 1
          fi
      - name: Checkout the gates of that source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: tagged
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            scripts/installed_artifact_canary.py
            scripts/verify_runtime_package.py
            .github/scripts/smoke_macos_manifested_callable.py
            .github/scripts/verify_release_smt.py
            docs/book/src/first-program.md
          sparse-checkout-cone-mode: false
      - name: Download the published assets
        if: inputs.candidate_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.ref }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir e2e/assets
      - name: Download the candidate run's artifacts
        if: inputs.candidate_run != ''
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: chelis-*
          merge-multiple: true
          path: e2e/assets
      - name: Verify sidecars and stage the gates
        run: |
          set -euo pipefail
          (cd e2e/assets && sha256sum -c ./*.sha256)
          mkdir -p e2e/gates/scripts e2e/gates/.github/scripts e2e/gates/docs/book/src
          cp tagged/scripts/installed_artifact_canary.py e2e/gates/scripts/
          if [ -f tagged/scripts/verify_runtime_package.py ]; then
            cp tagged/scripts/verify_runtime_package.py e2e/gates/scripts/
          fi
          cp tagged/.github/scripts/smoke_macos_manifested_callable.py \
            tagged/.github/scripts/verify_release_smt.py e2e/gates/.github/scripts/
          cp tagged/docs/book/src/first-program.md e2e/gates/docs/book/src/
      - name: Record the identity under test
        id: identity
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          TAG: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git -C tagged rev-parse HEAD)"
          echo "source-sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$CANDIDATE_RUN" ]; then
            version="$(awk '/^\[workspace.package\]/{p=1} p&&/^version/{gsub(/"/,"",$3); print $3; exit}' tagged/Cargo.toml)"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "archive-label=dev-${sha::8}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "archive-label=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-e2e-inputs
          path: e2e
          if-no-files-found: error
          retention-days: 7

  hosts:
    name: ${{ matrix.runner }}
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-e2e-inputs
          path: e2e
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Check the release on this host
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.inputs.outputs.source-sha }}
          TAG: ${{ needs.inputs.outputs.tag }}
          ARCHIVE_LABEL: ${{ needs.inputs.outputs.archive-label }}
          LABEL: ${{ matrix.runner }}
        run: |
          uv run --python 3.11 --no-project python scripts/release_e2e.py run --online \
            --label "$LABEL" --tag "$TAG" --archive-label "$ARCHIVE_LABEL" \
            --source-sha "$SOURCE_SHA" --assets e2e/assets --gates e2e/gates \
            --evidence "$RUNNER_TEMP/evidence"
      # Reports and logs only: work/ holds the installed toolchains.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-evidence-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/work/**
          if-no-files-found: warn
          retention-days: 14

  distros:
    name: ${{ matrix.id }}
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.31, the floor of the dynamic Linux builds. Bullseye's LTS
          # has ended and its moving mirror 404s, so apt reads the immutable
          # snapshot of BULLSEYE_SNAPSHOT_TIMESTAMP in scripts/ci_apt_get.py.
          # Plain http: the image has no CA bundle, and apt verifies the
          # signed indices.
          - image: debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
            id: debian-11
            prepare: >-
              rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources &&
              printf 'deb [check-valid-until=no] http://snapshot.debian.org/archive/%s/20260901T000000Z/ %s main\n'
              debian bullseye debian bullseye-updates debian-security bullseye-security > /etc/apt/sources.list &&
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ca-certificates
          - image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
            id: ubuntu-20.04
            prepare: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ca-certificates
          - image: debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26
            id: debian-12
            prepare: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ca-certificates
          - image: debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
            id: debian-13
            prepare: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ca-certificates
          - image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            id: fedora-44
            prepare: dnf -y -q install gcc gcc-c++ tar gzip
          - image: almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16
            id: almalinux-9
            prepare: dnf -y -q install gcc gcc-c++ tar gzip
          - image: amazonlinux:2023@sha256:5b29412077a463b4a3a8fbc99a8cdf4b929f38a3ecc8dac10328d8f36b0099b8
            id: amazonlinux-2023
            prepare: dnf -y -q install gcc gcc-c++ tar gzip
          - image: opensuse/leap:15.6@sha256:79be7751205ea84559990fb76b1bec71e38d6fad41c70a4f6c921b803b58f421
            id: opensuse-leap-15.6
            prepare: zypper -n -q install gcc gcc-c++ tar gzip
          - image: archlinux:base-20260927.0.600689@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
            id: archlinux
            prepare: pacman -Syu --noconfirm --needed --quiet gcc tar gzip
          # musl, no glibc: Alpine's own Python runs the harness, because the
          # runner's uv is a glibc build.
          - image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            id: alpine-3.24
            prepare: apk add --no-cache --quiet python3 gcc musl-dev tar gzip
            python: python3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-e2e-inputs
          path: e2e
      - uses: astral-sh/setup-uv@v8.1.0
      # Each image gets the documented native prerequisites and nothing else.
      # gh is absent, so the run covers the GitHub API install but not the gh
      # bootstrap.
      - name: Check the release inside ${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.inputs.outputs.source-sha }}
          TAG: ${{ needs.inputs.outputs.tag }}
          ARCHIVE_LABEL: ${{ needs.inputs.outputs.archive-label }}
          IMAGE: ${{ matrix.image }}
          LABEL: ${{ matrix.id }}
          PREPARE: ${{ matrix.prepare }}
          PYTHON: ${{ matrix.python || '/work/.uv/uv run --python 3.11 --no-project python' }}
        run: |
          set -euo pipefail
          mkdir -p .uv && cp "$(command -v uv)" .uv/uv
          docker run --rm -e GITHUB_TOKEN -e SOURCE_SHA -e TAG -e ARCHIVE_LABEL -e LABEL \
            -e PREPARE -e PYTHON -v "$PWD:/work" -w /work "$IMAGE" sh -c '
              set -e
              sh -c "$PREPARE" >/dev/null
              $PYTHON scripts/release_e2e.py run --online --label "$LABEL" \
                --tag "$TAG" --archive-label "$ARCHIVE_LABEL" --source-sha "$SOURCE_SHA" \
                --assets e2e/assets --gates e2e/gates --evidence /work/evidence'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-evidence-${{ matrix.id }}
          path: |
            evidence
            !evidence/work/**
          if-no-files-found: warn
          retention-days: 14

  nixos:
    name: NixOS 26.05 VMs (stock, nix-ld)
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-e2e-inputs
          path: e2e
      - name: Give the build users KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::no /dev/kvm; the NixOS VMs run under emulation"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.4/install
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Check the release inside both VMs
        env:
          SOURCE_SHA: ${{ needs.inputs.outputs.source-sha }}
          TAG: ${{ needs.inputs.outputs.tag }}
          ARCHIVE_LABEL: ${{ needs.inputs.outputs.archive-label }}
        run: |
          set -euo pipefail
          nix build --print-build-logs --out-link nixos-result \
            --file nix/tests/release-e2e-nixos.nix \
            --arg assets "$PWD/e2e/assets" --arg gates "$PWD/e2e/gates" \
            --arg scripts "$PWD/scripts" \
            --argstr tag "$TAG" --argstr archiveLabel "$ARCHIVE_LABEL" \
            --argstr sourceSha "$SOURCE_SHA"
          failed=0
          for node in stock nixld; do
            mkdir -p "nixos-evidence/$node"
            tar -C "nixos-evidence/$node" -xzf "nixos-result/$node/evidence.tar.gz"
            status="$(cat "nixos-evidence/$node/evidence/exit-status")"
            if [ "$status" != 0 ]; then
              echo "::error::the harness exited $status in the $node VM"
              failed=1
            fi
          done
          python3 scripts/release_e2e.py summarize nixos-evidence
          exit "$failed"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-evidence-nixos
          path: nixos-evidence
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Summary
    needs: [inputs, hosts, distros, nixos]
    if: always() && needs.inputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: release-e2e-evidence-*
          path: evidence
      - name: Render every host's report
        run: python3 scripts/release_e2e.py summarize evidence | tee -a "$GITHUB_STEP_SUMMARY"
