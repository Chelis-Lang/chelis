name: Shared runner canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-runner-canary
  cancel-in-progress: false

jobs:
  cache-canary:
    if: github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on:
      group: chelis-ci-trusted
      labels: chelis-ci-warm-x64
    timeout-minutes: 20
    steps:
      - name: Check out the admitted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the isolated Python environment
        run: /run/current-system/sw/bin/uv venv --python /run/current-system/sw/bin/python3 .venv
      - name: Check the canary contracts
        run: .venv/bin/python -m unittest scripts.test_shared_runner_canary
      - name: Check member cache writes and readback
        env:
          SHARED_CACHE_NIX_URL: ${{ vars.SHARED_CACHE_NIX_URL }}
          SHARED_CACHE_KACHE_URL: ${{ vars.SHARED_CACHE_KACHE_URL }}
          SHARED_CACHE_KACHE_BUCKET: ${{ vars.SHARED_CACHE_KACHE_BUCKET }}
          SHARED_CACHE_KACHE_REGION: ${{ vars.SHARED_CACHE_KACHE_REGION }}
          SHARED_CACHE_SIGNING_KEY_NAME: ${{ vars.SHARED_CACHE_SIGNING_KEY_NAME }}
          SHARED_CACHE_PUBLIC_KEY: ${{ vars.SHARED_CACHE_PUBLIC_KEY }}
          SHARED_RUNNER_INSTANCE_ID: ${{ vars.SHARED_RUNNER_INSTANCE_ID }}
        run: .venv/bin/python scripts/shared_runner_canary.py
