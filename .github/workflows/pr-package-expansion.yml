name: PR Package Expansion

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number
      expected_head_sha:
        description: Exact reviewed pull request head SHA
        required: true
        type: string

concurrency:
  group: pr-package-expansion-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  integration-plan:
    name: Plan Manual Package Expansion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.pr-identity.outputs.base_ref }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - name: Checkout trusted candidate validator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: trusted

      - name: Validate the requested pull request head
        id: pr-identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          python3 trusted/scripts/ci_validate_pr_candidate.py \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout the requested pull request merge candidate
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          path: candidate
          fetch-depth: 0

      - name: Record the exact package-expansion candidate
        id: candidate
        working-directory: candidate
        run: |
          candidate_sha=$(git rev-parse HEAD)
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        working-directory: candidate
        run: uv venv --python 3.11

      - name: Derive the exact package-expansion plan
        working-directory: candidate
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: >-
          .venv/bin/python scripts/ci_change_owned.py plan
          --event-name pull_request
          --pr-head "$EXPECTED_HEAD_SHA"
          --output target/integration-change/plan.json

      - name: Upload integration change plan
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-plan
          path: candidate/target/integration-change/plan.json
          if-no-files-found: error
          retention-days: 14

  package-expansion-shard:
    name: Manual Package Expansion (bucket ${{ matrix.shard }})
    # This is the limit that binds. `EXPANSION_EXECUTION_SECONDS` in
    # scripts/ci_change_owned.py sits ten minutes under it so a shard that
    # reaches its deadline still writes and uploads a partial receipt; raising
    # only the script constant would replace a partial report with no report.
    # Most of that gap is job setup, which runs before the executor's clock
    # starts: a measured median of 118s and maximum of 211s across the last 30
    # dispatches. The two move together, independently of the required
    # change-owned lane's job budget in ci.yml.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [integration-plan]
    if: ${{ !cancelled() && needs.integration-plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CC: clang
      CXX: clang++
      CHELIS_TEST_CC: clang
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integration-plan.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Download integration change plan for shard selection
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: ${{ runner.temp }}/integration-change

      - name: Preserve empty-shard evidence or request execution
        id: shard-selection
        run: >-
          python3 scripts/ci_change_owned.py prepare-shard
          --plan "${{ runner.temp }}/integration-change/plan.json"
          --lane package-expansion
          --shard ${{ matrix.shard }}
          --output target/integration-change/package-expansion-${{ matrix.shard }}
          --github-output "$GITHUB_OUTPUT"

      - name: Free disk space (Ubuntu)
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: python3 scripts/ci_apt_get.py gcc clang libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: python3 scripts/ci_setup_uv_python.py

      - name: Observe native Cargo producers
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: uv run --managed-python --python 3.11 --no-project python scripts/ci_runtime_identity.py --provenance source-worktree

      - name: Restore cargo registry and build cache
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: runtime-identity-v1
          shared-key: linux-workspace
          save-if: false

      - name: Install Python binding dependencies
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: uv pip install --python .venv/bin/python -r bindings/python/pyproject.toml

      - name: Install cargo-nextest
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: taiki-e/install-action@nextest

      - name: Download integration change plan
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change

      - name: Execute the informational package-expansion shard
        if: steps.shard-selection.outputs.has_targets == 'true'
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: >-
          .venv/bin/python scripts/ci_change_owned.py run-shard
          --plan target/integration-change/plan.json
          --lane package-expansion
          --shard ${{ matrix.shard }}
          --output target/integration-change/package-expansion-${{ matrix.shard }}

      - name: Upload package-expansion shard receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-package-expansion-${{ matrix.shard }}
          path: target/integration-change/package-expansion-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  package-expansion-summary:
    name: Manual Package Expansion Summary
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    needs: [integration-plan, package-expansion-shard]
    if: ${{ always() }}
    steps:
      - name: Checkout trusted candidate validator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: trusted

      - name: Checkout the requested pull request merge candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.integration-plan.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11
        working-directory: candidate

      - name: Download integration change plan
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: candidate/target/integration-change

      - name: Download available package-expansion receipts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: integration-package-expansion-*
          path: candidate/target/integration-change/receipts/package-expansion

      - name: Record the default-branch failure baseline
        id: failure-baseline
        continue-on-error: true
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 ../trusted/scripts/ci_failure_baseline.py
          --plan target/integration-change/plan.json
          --repo-path .
          --output target/integration-change/failure-baseline

      - name: Summarize the informational package expansion
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PLANNER_RESULT: ${{ needs.integration-plan.result }}
          EXPANSION_RESULT: ${{ needs.package-expansion-shard.result }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_REF: ${{ needs.integration-plan.outputs.base_ref }}
        run: |
          mkdir -p target/integration-change/package-expansion-summary
          if [ -f target/integration-change/plan.json ]; then
            candidate_status=0
            expected_base_sha=$(
              jq -r '.base_sha // empty' target/integration-change/plan.json
            )
            candidate_output=$(
              python3 ../trusted/scripts/ci_validate_pr_candidate.py \
                --repository "$REPOSITORY" \
                --pr-number "$PR_NUMBER" \
                --expected-head-sha "$EXPECTED_HEAD_SHA" \
                --expected-base-ref "$EXPECTED_BASE_REF" \
                --checkout-base-sha "$expected_base_sha" \
                --plan target/integration-change/plan.json \
                --validate-checkout 2>&1
            ) || candidate_status=$?
            report_status=0
            .venv/bin/python scripts/ci_change_owned.py report \
              --plan target/integration-change/plan.json \
              --lane package-expansion \
              --receipts-root target/integration-change/receipts/package-expansion \
              --output target/integration-change/package-expansion-summary ||
              report_status=$?
            {
              echo
              echo "## Final candidate validation"
              echo
              if [ "$candidate_status" -ne 0 ]; then
                echo "FAIL: ${candidate_output}"
              else
                echo "PASS: ${candidate_output}"
              fi
            } >> target/integration-change/package-expansion-summary/summary.md
            if [ "$report_status" -ne 0 ] || [ "$candidate_status" -ne 0 ]; then
              exit 1
            fi
          else
            {
              echo "# Manual package expansion"
              echo
              echo "Expected PR head: \`${EXPECTED_HEAD_SHA}\`"
              echo "Planner: ${PLANNER_RESULT}"
              echo "Expansion workers: ${EXPANSION_RESULT}"
              echo
              echo "No validated plan artifact was available."
            } > target/integration-change/package-expansion-summary/summary.md
            exit 1
          fi

      - name: Publish informational package-expansion summary
        if: always()
        working-directory: candidate
        run: |
          if [ -f target/integration-change/package-expansion-summary/summary.md ]; then
            cat target/integration-change/package-expansion-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload informational package-expansion summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-package-expansion-summary
          path: candidate/target/integration-change/package-expansion-summary
          if-no-files-found: error
          retention-days: 14
