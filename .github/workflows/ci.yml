name: CI

run-name: ${{ inputs.retarget_token != '' && format('Retarget CI {0}', inputs.retarget_token) || github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose synthetic merge must be tested
        required: true
        type: number
      expected_head_sha:
        description: Exact open pull-request head
        required: true
        type: string
      expected_base_sha:
        description: Exact retargeted base commit
        required: true
        type: string
      retarget_token:
        description: Unique coordinator token
        required: true
        type: string

concurrency:
  # Generic PR edits never enter this workflow. Exact-base retarget dispatches
  # and normal PR updates share the implementation group for the same PR.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}-implementation
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect docs-only pull requests so the heavy jobs (Integration, macOS
  # Smoke, SMT Feature Build, Backend Sanitizers, Hull Conformance Gate)
  # can skip them via a job-level `if` (chelis#419). This MUST be a job
  # output consumed by each heavy job's `if`, never a workflow-level
  # `paths-ignore`: a required check filtered out by `paths-ignore` never
  # reports its status context, so branch protection waits on it forever
  # and the PR can never merge; a required check whose JOB is skipped by
  # an `if` reports its context as success, satisfying branch protection.
  #
  # This job itself is intentionally NOT a required status check, is
  # cheap (no toolchain, no build), and runs on every event. On push (no
  # pull_request context) it emits docs_only=false so push-to-main always
  # runs the full suite, per the WS-7 spend-trim scope.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      diagnostic_kind_changed: ${{ steps.detect.outputs.diagnostic_kind_changed }}
      ci_contract_changed: ${{ steps.candidate-preflight.outputs.ci_contract_changed }}
      candidate_preflight: ${{ steps.candidate-preflight.outputs.candidate_preflight }}
      rebase_lane: ${{ steps.rebase-reuse.outputs.rebase_lane }}
      rebase_before: ${{ steps.rebase-reuse.outputs.rebase_before }}
      rebase_contract_changed: ${{ steps.rebase-reuse.outputs.rebase_contract_changed }}
    steps:
      - name: Checkout trusted retarget validator
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_base_sha }}
          path: trusted
          fetch-depth: 1

      # Shallow checkout (depth 1); the detect step deepens to the PR
      # commit range. A retarget dispatch fetches the exact synthetic merge
      # with full parents so the trusted validator can bind both sides.
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          path: candidate
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}

      - name: Checkout trusted rebase reuse verifier
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-rebase
          fetch-depth: 1

      - name: Validate exact retarget candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: candidate
        run: >-
          python3 ../trusted/scripts/ci_validate_pr_candidate.py
          --repository "${{ github.repository }}"
          --pr-number "${{ inputs.pr_number }}"
          --expected-head-sha "${{ inputs.expected_head_sha }}"
          --expected-base-sha "${{ inputs.expected_base_sha }}"
          --validate-checkout

      - name: Record exact candidate
        id: candidate
        working-directory: candidate
        run: |
          candidate="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Bootstrap CI contract preflight selection
        id: ci-contract-bootstrap
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] &&
             [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ci_contract_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            classifier="trusted/scripts/ci_contract_paths.py"
          else
            classifier="$RUNNER_TEMP/ci-contract-paths.py"
            if ! /usr/bin/git -C candidate show \
              "$BASE_SHA:scripts/ci_contract_paths.py" > "$classifier"; then
              echo "ci_contract_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          set -o pipefail
          if ! GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git -C candidate \
            -c core.quotePath=true diff --name-only --no-renames \
            --no-ext-diff --no-textconv "$BASE_SHA" "$HEAD_SHA" \
            | /usr/bin/python3 "$classifier"; then
            echo "ci_contract_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute docs_only
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        working-directory: candidate
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] &&
             [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # push-to-main (or any non-PR event) always runs the full
            # suite; do not skip heavy jobs off a PR diff.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "diagnostic_kind_changed=false" >> "$GITHUB_OUTPUT"
            echo "ci_contract_changed=false" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME): docs_only=false (full suite)"
            exit 0
          fi
          # Deepen head to the PR commit count + 1 (the +1 reaches the
          # base tip's parent so base..head resolves), then backstop-fetch
          # the base commit so it is present as an object even on a stale
          # count (force-push between the event and the run).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
          else
            git fetch origin "$HEAD" "$BASE" 2>/dev/null || true
          fi
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          git diff --name-only "$BASE..$HEAD" \
            | python3 scripts/ci_detect_docs_only.py

      - name: Validate candidate lifecycle
        id: candidate-lifecycle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: candidate
        run: |
          args=(--event "$GITHUB_EVENT_PATH")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            current_pr="$RUNNER_TEMP/current-pr.json"
            timeline="$RUNNER_TEMP/pr-timeline.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$current_pr"
            base_ref=$(jq -er '.base.ref | select(length > 0)' "$current_pr")
            git fetch --no-tags origin "refs/heads/$base_ref"
            target_tip=$(git rev-parse FETCH_HEAD)
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" > "$timeline"
            args+=(
              --current-pr "$current_pr"
              --target-tip "$target_tip"
              --timeline "$timeline"
            )
          fi
          if [ "$EVENT_NAME" = "pull_request" ] &&
             [ "$ACTION" = "synchronize" ]; then
            git fetch origin "$BEFORE" "$HEAD" "$target_tip" 2>/dev/null || true
          fi
          python3 scripts/ci_candidate_lifecycle.py "${args[@]}"

      - name: Select targeted rebase lane
        id: rebase-reuse
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LIFECYCLE: ${{ steps.candidate-lifecycle.outcome }}
          BEFORE: ${{ github.event.before }}
        working-directory: candidate
        run: |
          record_full() {
            echo "rebase_lane=full" >> "$GITHUB_OUTPUT"
            echo "rebase_before=${BEFORE:-}" >> "$GITHUB_OUTPUT"
            echo "rebase_reason=$1" >> "$GITHUB_OUTPUT"
            echo "rebase_contract_changed=false" >> "$GITHUB_OUTPUT"
          }
          record_ordinary() {
            echo "rebase_lane=ordinary" >> "$GITHUB_OUTPUT"
            echo "rebase_before=${BEFORE:-}" >> "$GITHUB_OUTPUT"
            echo "rebase_reason=$1" >> "$GITHUB_OUTPUT"
            echo "rebase_contract_changed=false" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            record_full "trusted exact-candidate dispatch"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ] ||
             [ "$ACTION" != "synchronize" ] ||
             [ "$LIFECYCLE" != "success" ]; then
            record_ordinary "not an eligible synchronize event"
            exit 0
          fi
          verifier="../trusted-rebase/scripts/ci_rebase_reuse.py"
          if [ ! -f "$verifier" ]; then
            record_full "trusted rebase verifier is not available on the base"
            exit 0
          fi
          if ! python3 "$verifier" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-path . \
            --event "$GITHUB_EVENT_PATH" \
            --current-pr "$RUNNER_TEMP/current-pr.json" \
            --timeline "$RUNNER_TEMP/pr-timeline.json" \
            --candidate-sha "${{ steps.candidate.outputs.candidate_sha }}" \
            --output "$RUNNER_TEMP/rebase-reuse/decision.json" \
            --github-output "$GITHUB_OUTPUT"; then
            record_full "trusted rebase verifier failed closed"
          fi

      - name: Publish targeted rebase decision for review
        if: always()
        run: |
          decision="$RUNNER_TEMP/rebase-reuse/decision.json"
          if [ -f "$decision" ]; then
            {
              echo "### Targeted rebase decision"
              echo
              echo '```json'
              cat "$decision"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install uv for CI contract preflight
        if: ${{ always() && (steps.detect.outputs.ci_contract_changed == 'true' || steps.ci-contract-bootstrap.outputs.ci_contract_changed == 'true' || steps.rebase-reuse.outputs.rebase_contract_changed == 'true') }}
        uses: astral-sh/setup-uv@v8.1.0

      - name: Validate changed CI contracts before build fan-out
        id: ci-contract
        if: ${{ always() && (steps.detect.outputs.ci_contract_changed == 'true' || steps.ci-contract-bootstrap.outputs.ci_contract_changed == 'true' || steps.rebase-reuse.outputs.rebase_contract_changed == 'true') }}
        continue-on-error: true
        working-directory: candidate
        run: >-
          uv run --managed-python --python 3.11 --no-project
          --with PyYAML==6.0.3 python -m unittest
          scripts.test_check_agent_skills
          scripts.test_ci_candidate_lifecycle
          scripts.test_ci_candidate_identity
          scripts.test_ci_candidate_receipt
          scripts.test_ci_rebase_reuse
          scripts.test_ci_change_owned
          scripts.test_ci_contract_paths
          scripts.test_ci_detect_docs_only
          scripts.test_ci_validate_pr_candidate
          scripts.test_pr_workflow_routing
          scripts.test_change_owned_workflow
          scripts.test_hosted_validation
          scripts.test_regenerate_conformance_assets
          scripts.test_gate.DocsOnlySkipTests
          scripts.test_gate.CiParityTests
          scripts.test_gate.RejectionAuthorityPrBoundaryTests

      - name: Record candidate preflight verdict
        id: candidate-preflight
        if: always()
        run: |
          lifecycle="${{ steps.candidate-lifecycle.outcome }}"
          contract="${{ steps.ci-contract.outcome }}"
          detected_contract="${{ steps.detect.outputs.ci_contract_changed }}"
          bootstrap_contract="${{ steps.ci-contract-bootstrap.outputs.ci_contract_changed }}"
          rebase_contract="${{ steps.rebase-reuse.outputs.rebase_contract_changed }}"
          contract_changed=unknown
          if [ "$detected_contract" = "true" ] ||
             [ "$bootstrap_contract" = "true" ] ||
             [ "$rebase_contract" = "true" ]; then
            contract_changed=true
          elif [ "$detected_contract" = "false" ] &&
               [ "$bootstrap_contract" = "false" ] &&
               { [ "$rebase_contract" = "false" ] || [ -z "$rebase_contract" ]; }; then
            contract_changed=false
          fi
          verdict=success
          if [ "$lifecycle" != "success" ]; then
            verdict=failure
          elif [ "$contract_changed" = "true" ]; then
            if [ "$contract" != "success" ]; then
              verdict=failure
            fi
          elif [ "$contract_changed" != "false" ]; then
            verdict=failure
          fi
          echo "ci_contract_changed=$contract_changed" >> "$GITHUB_OUTPUT"
          echo "candidate_preflight=$verdict" >> "$GITHUB_OUTPUT"
          echo "candidate lifecycle=$lifecycle, detected CI contract=$detected_contract, bootstrap CI contract=$bootstrap_contract, rebase CI contract=$rebase_contract, combined=$contract_changed, CI contract=$contract, verdict=$verdict"

      - name: Record immutable candidate identity
        if: github.event_name == 'pull_request' && steps.candidate-preflight.outputs.candidate_preflight == 'success'
        working-directory: candidate
        run: >-
          python3 scripts/ci_candidate_identity.py
          --repository "${{ github.repository }}"
          --workflow-file ci.yml
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --base-ref "${{ github.event.pull_request.base.ref }}"
          --candidate-sha "${{ steps.candidate.outputs.candidate_sha }}"
          --output "$RUNNER_TEMP/candidate-identity/candidate-identity.json"

      - name: Upload immutable candidate identity
        if: github.event_name == 'pull_request' && steps.candidate-preflight.outputs.candidate_preflight == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-identity-ci
          path: ${{ runner.temp }}/candidate-identity/candidate-identity.json
          if-no-files-found: error
          retention-days: 30

  # C2.2's producer seal depends on same-crate privacy, which an external
  # compile-fail doctest cannot distinguish from pub(crate). Run the actual
  # controlled mutations whenever any owner/oracle/control input changes.
  diagnostic-kind-oracle:
    name: Diagnostic Kind Mutation Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && needs.changes.outputs.rebase_lane != 'docs' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.diagnostic_kind_changed != 'false') }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: target/diagnostic-kind-oracle
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and mutation-oracle build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/diagnostic-kind-oracle

      - name: Run C2.2 controlled mutations
        run: .venv/bin/python scripts/diagnostic_kind_oracle.py

  lint-rust:
    name: Rust Policy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    # Strip debuginfo from the dev/test build. Debuginfo is the dominant
    # disk consumer in target/; dropping it (alongside the free-disk step
    # below) is what keeps the Linux workspace build off "No space left on
    # device" / the mid-link ld bus-error (signal 7) — chelis#392. Symbols
    # only affect backtraces, never what is tested. Set per-job (not
    # workflow-wide) so unrelated jobs and release profiles keep their own
    # settings. The macOS workspace workers make the same test-only tradeoff
    # explicitly below.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      # apt-get under retry (scripts/ci_apt_get.py): the hosted runner's apt
      # mirror intermittently resets the connection mid-download, flaking the
      # job with no code change. The helper retries the update+install pair on
      # a transient failure; a genuine packaging error still fails after the
      # attempts are exhausted.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest for targeted Rust units
        if: needs.changes.outputs.rebase_lane == 'targeted'
        uses: taiki-e/install-action@nextest

      # `.cargo/config.toml` sets `PYO3_PYTHON=.venv/bin/python` so the
      # `chelis-python` link step finds the project-pinned interpreter
      # on every developer's machine. CI runners don't ship a `.venv/`
      # by default, so `scripts/ci_setup_uv_python.py` creates one with
      # the same uv-managed Python the project policy requires, then
      # appends the interpreter's `sysconfig.LIBDIR` to `$GITHUB_ENV` as
      # `LD_LIBRARY_PATH` (Linux) or `DYLD_LIBRARY_PATH` (macOS) so the
      # `chelis-python` test binaries can dlopen `libpython3.X.so` at
      # runtime. pyo3-build-config is a transitive build-dep of pyo3
      # and runs even when only its dependents are compiled, so this
      # step must precede every cargo invocation — including the
      # cache restore below, which is future-proofed against a
      # Swatinem version that might invoke `cargo` directly.
      - name: Install uv
        # Pinned to v8.1.0 (specific patch) rather than @v8 because
        # astral-sh/setup-uv does not yet publish a rolling `v8` major
        # tag — only the explicit v8.0.0 and v8.1.0 patch tags exist.
        # Using `@v8` resolves to "unable to find version `v8`" on the
        # runner. Bump this pin when astral-sh publishes either a `v8`
        # rolling tag or a newer patch.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # The Rust-policy gate subset (clippy, fmt, chelis lint --check,
      # doctests, and compile guards) is defined once in scripts/gate.py.
      # Clippy already compiles every workspace target, so a preceding
      # standalone `cargo build --workspace --all-targets` is redundant.
      # `gate.py lint-and-unit`. Do not hand-inline cargo/chelis
      # commands into this job: scripts/test_gate.py greps this file
      # and fails if any gate step is not produced by gate.py. See
      # docs/investigations/test_toolchain_guards_design.md.
      - name: Gate (lint-and-unit subset)
        run: python3 scripts/gate.py lint-and-unit

      - name: Run Rust units for targeted rebase
        if: needs.changes.outputs.rebase_lane == 'targeted'
        run: python3 scripts/gate.py targeted-units

  script-unit:
    name: Script and Python Unit Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Small compiler fixtures remain here; full C6 execution is nightly-owned.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      # Python execution ownership is explicit, independent of installed tools.
      - name: Install shared-skill validator dependency
        run: uv pip install --python .venv/bin/python PyYAML==6.0.3

      - name: Install Python binding dependencies
        run: uv pip install --python .venv/bin/python -r bindings/python/pyproject.toml

      - name: Script unit tests (scripts/test_*.py)
        run: .venv/bin/python scripts/ci_script_tests.py pr

      # Keep the privacy and source-usage construction boundary in script-unit
      # without querying mutable GitHub issue state. The always-running Docs
      # Phase 4B oracle owns fresh compiler closure and generated agreement;
      # the standing nightly owns exists/kind/open liveness.
      - name: Validate rejection authority construction boundary
        run: .venv/bin/python scripts/check_rejection_authority_boundary.py

      - name: Python binding ingress unit tests
        run: .venv/bin/python -m unittest discover -s bindings/python/tests -p 'test_*.py'

      - name: Upload script selection and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: script-tests-pr
          path: target/ci-script-tests/pr
          if-no-files-found: error
          retention-days: 14

  # Preserve the required branch-protection context while the independent
  # Rust and Python policy workers execute in parallel.
  lint-and-unit:
    name: Lint and Unit Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, lint-rust, script-unit]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Require every lint and unit worker
        run: python3 scripts/ci_require_success.py lint-rust=${{ needs.lint-rust.result }} script-unit=${{ needs.script-unit.result }}

  # Non-gate job (see NON_GATE_JOBS in scripts/test_gate.py, rule-id
  # GATE-SCOPE-SMT): the required fast SMT smoke. It builds the
  # cvc5-backed `smt` feature and proves the binary can discharge a real
  # obligation through cvc5, but leaves the full solver/proof corpus to
  # smt-full-prove.yml (nightly + manual dispatch only, not on PRs). Keep the job
  # display name stable: branch protection requires this exact context.
  # Runbook: docs/smt_build_setup.md.
  smt-build:
    name: SMT Feature Build (Linux)
    runs-on: ubuntu-latest
    # In steady state this job LINKS a durable prebuilt cvc5 (a GitHub Release
    # asset published by build-cvc5.yml, rustc-independent, no cache TTL/LRU),
    # so it runs ~3m warm. The from-source cvc5 compile (~22m) is off the
    # per-PR path: it only recurs on a cvc5-sys version bump before
    # build-cvc5.yml republishes the asset (see docs/smt_build_setup.md for the
    # bump runbook). 25m covers a warm link plus a fully cold Rust workspace
    # recompile (e.g. after a stable-toolchain bump) with margin, and fails
    # fast instead of silently absorbing a stray from-source cvc5 build.
    timeout-minutes: 25
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    # cvc5 builds from source into target/ on top of the workspace build —
    # the heaviest disk consumer of any Linux job — so it gets both the
    # free-disk reclaim and the debuginfo strip (chelis#392). It was the
    # only Linux build job missing the free-disk step.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo + cvc5 build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        # apt-get under retry (scripts/ci_apt_get.py) so a transient
        # mirror reset does not flake the cvc5 smoke job. This fast lane
        # does not install Z3, Gappa, or Arb-only tools; those live in
        # the non-required full prove workflow.
        run: python3 scripts/ci_apt_get.py gcc g++ cmake libclang-dev libgmp-dev libmpfr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      # cvc5 (cvc5-sys) builds from source via CMake+make (~22m cold). To keep
      # that off the per-PR path we LINK a prebuilt cvc5, tried in two layers
      # (see docs/smt_build_setup.md and scripts/ci_cvc5_cache.py):
      #   1. DURABLE (primary): a GitHub Release asset published by
      #      build-cvc5.yml, keyed on the cvc5-sys version + namespace (NOT
      #      Cargo.lock, NOT rustc). A Release asset has no 10GB LRU budget, no
      #      7-day TTL, and no branch scope, so a stable-toolchain bump or a
      #      quiet stretch no longer forces a cold rebuild. `fetch`
      #      sha256-verifies and extracts it; on ANY miss it exits 0 with
      #      warm=false.
      #   2. FALLBACK (secondary): the stable-key Actions cache, restored only
      #      when the durable fetch missed (the cvc5-sys-bump window before
      #      build-cvc5.yml republishes). Best-effort; a hiccup degrades to
      #      from-source, never fails the job.
      # `activate` exports CVC5_DIR only when the store is complete (verified by
      # ci_cvc5_cache.py's sentinel); otherwise the normal from-source path
      # runs. (A PR branch DOES inherit main's caches/assets; only a PR's own
      # cache SAVE is branch-scoped.)
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-x86_64

      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-x86_64 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # cvc5 builds from source into target/; share the former
          # smt-build cache namespace with the optional full-prove lane
          # while keeping the gate jobs lean.
          shared-key: smt-smt-build
          # Persist a warm workspace cache even if a later step fails, so a
          # slow cold run is not re-paid on the next attempt (chelis#583).
          cache-on-failure: true

      - name: Build smt feature
        run: cargo build -p chelis-cli --features smt

      # Cold runs only (no CVC5_DIR active): copy the freshly built cvc5
      # artifacts into the stable-key cache dir so the next Cargo.lock churn
      # links them instead of rebuilding. `complete=true` is emitted only
      # after a fully-verified harvest; the save step below is gated on it,
      # so a partial/failed build never poisons the stable-key cache.
      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/debug/chelis

      - name: Run cvc5 engine smoke tests
        run: cargo test -p chelis-prove --features smt --lib cvc5_engine_

      # Integration binaries link chelis-prove without cfg(test). Exercise
      # their explicit libtest worker route as well as the unit-test route.
      - name: Run SMT integration containment controls
        run: cargo test -p chelis-prove --features smt --test integration_solver_isolation

      # chelis#1125 PP7: `crates/chelis-cli/tests/prove_deep_obligations.rs` is
      # `#![cfg(feature = "smt")]` and had NO invocation anywhere. The gate
      # never passes `--features smt`, this job tested only `chelis-prove`, and
      # smt-full-prove.yml never names `chelis-cli`, so a merged test asserting
      # the correct proof tier for the `.dp` surface could not fail and the
      # regression it was written to catch landed green. This is the smallest
      # step that runs it, in the job that already provisions cvc5. Pinned by
      # scripts/test_gate.py's SmtCiSplitTests so it cannot silently disappear
      # again.
      - name: Run the Deep-surface obligation tier tests
        run: cargo test -p chelis-cli --features smt --test prove_deep_obligations

      # Clippy's `disallowed_types` ban on raw hash collections
      # (spec/design/hash_order_determinism.md C2.3) only sees the
      # configuration it compiles. This job already provisions cvc5, so it is
      # the cheapest place to lint the `smt` feature's code. Registered in
      # scripts/check_configuration_closure.py CLIPPY_MATRIX, which fails if
      # this command drifts from it.
      - name: Clippy over the cvc5 feature configuration
        run: cargo clippy --workspace --all-targets --features chelis-cli/smt,chelis-prove/smt,chelis-tide/smt -- -D warnings

  # chelis#422 (WS-4) PROVE-IN-CI lanes. release.yml ships
  # `chelis-cli --features smt` on three targets; cvc5 builds from
  # source (cmake/g++/libgmp) and is only PROVEN on ubuntu-latest by the
  # smt-build job above. These two lanes prove cvc5 also builds on the
  # other two release targets BEFORE release.yml relies on the feature
  # there: the glibc-2.31 Bullseye compat toolchain and macOS-arm64.
  # Each mirrors its release.yml job's build command exactly
  # (`cargo build --release -p chelis-cli --features smt`) and runs the
  # post-build verifier (.github/scripts/verify_release_smt.py) to
  # confirm the binary actually discharges through cvc5, not the
  # solver-free fuzz fallback. No uv setup: `cargo build -p chelis-cli`
  # is pyo3-free on both the default and smt feature graphs (asserted by
  # scripts/test_release_workflow_pyo3_isolation.py), unlike the
  # `cargo test -p chelis-prove` step in the Linux smt-build job.
  smt-build-glibc231:
    name: SMT Feature Build (Linux, glibc 2.31)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    # The immutable digest supplies Python, git, curl, and CA certificates
    # before checkout while retaining Debian 11's glibc 2.31. After checkout,
    # ci_apt_get replaces its moving mirrors with the repository-pinned
    # snapshot before installing anything.
    container: python:3.11.13-bullseye@sha256:df0bd610af061603b29d63eb82027b64d5a3f15506e39270422b10b2a55079fc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # m4 is required by GMP's configure; cmake/g++/libclang support the cvc5
      # source build. The pinned snapshot makes package indices and payloads
      # one immutable generation, while the retry loop still handles network
      # resets and stalls. The Python 3.11 base already supplies git, pip, and
      # venv, and cvc5 uses stdlib tomllib rather than a PyPI tomli bootstrap.
      - name: Install build prerequisites
        run: python3 scripts/ci_apt_get.py --debian-bullseye-snapshot --no-sudo --no-install-recommends build-essential m4 cmake libclang-dev libopenblas-dev libgmp-dev libmpfr-dev

      - name: Assert glibc 2.31 build environment
        run: |
          set -euo pipefail
          ldd --version | awk 'NR==1'
          ldd --version | awk 'NR==1' | grep -F '2.31'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # chelis#583: dedicated stable-key cvc5 cache, in its OWN
      # `linux-glibc231` namespace so the Bullseye (glibc 2.31) toolchain's
      # libcvc5.a is never crossed with the ubuntu-latest one. On a warm hit
      # cvc5-sys links the prebuilt lib (built in this same container, so the
      # glibc-2.31 assertion below stays valid) instead of rebuilding from
      # source after an unrelated Cargo.lock bump. See the smt-build job.
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-glibc231

      # Durable Release asset first, Actions cache fallback second; see the
      # smt-build job for the full rationale. The asset is built in this same
      # Bullseye (glibc 2.31) container by build-cvc5.yml, so the glibc-2.31
      # assertion below stays valid on the linked artifact.
      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-glibc231 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: smt-glibc231
          cache-on-failure: true

      - name: Build chelis-cli (release, smt)
        run: cargo build --release -p chelis-cli --features smt

      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Assert no glibc requirement above 2.31
        run: |
          set -euo pipefail
          max_req="$(objdump -T target/release/chelis | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "max glibc requirement: ${max_req}"
          test "$(printf 'GLIBC_2.31\n%s\n' "${max_req}" | sort -V | tail -1)" = "GLIBC_2.31"

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

  ci-fast:
    name: Fast Tests (Linux)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc clang libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Python binding dependencies
        run: uv pip install --python .venv/bin/python -r bindings/python/pyproject.toml

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Gate (units and reviewed integrations)
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: python3 scripts/gate.py ci-fast

      - name: Upload fast JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-fast
          path: target/nextest/ci-fast/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload selection and build timing receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-fast-receipts
          path: |
            target/ci-fast
            target/gate-reports
          if-no-files-found: error
          retention-days: 14

  integration-plan:
    name: Plan Changed Integration Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable


      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Derive the change-owned and package-expansion plan
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          PR_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ needs.changes.outputs.candidate_sha }}
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
          REBASE_BEFORE: ${{ needs.changes.outputs.rebase_before }}
        run: |
          event_name="$EVENT_NAME"
          before="$BEFORE"
          if [ "$REBASE_LANE" = "targeted" ]; then
            event_name=targeted_rebase
            before="$REBASE_BEFORE"
          fi
          .venv/bin/python scripts/ci_change_owned.py plan \
            --event-name "$event_name" \
            --pr-head "$PR_HEAD" \
            --before "$before" \
            --after "$AFTER" \
            --output target/integration-change/plan.json

      - name: Upload integration change plan
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change/plan.json
          if-no-files-found: error
          retention-days: 14

  change-owned-shard:
    name: Change-Owned Integration Tests (bucket ${{ matrix.shard }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, integration-plan]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.integration-plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Download integration change plan for shard selection
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: ${{ runner.temp }}/integration-change

      - name: Preserve empty-shard evidence or request execution
        id: shard-selection
        run: >-
          python3 scripts/ci_change_owned.py prepare-shard
          --plan "${{ runner.temp }}/integration-change/plan.json"
          --lane change-owned
          --shard ${{ matrix.shard }}
          --output target/integration-change/change-owned-${{ matrix.shard }}
          --github-output "$GITHUB_OUTPUT"

      - name: Free disk space (Ubuntu)
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: python3 scripts/ci_apt_get.py gcc clang libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: python3 scripts/ci_setup_uv_python.py

      - name: Restore cargo registry and build cache
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          save-if: false

      - name: Install Python binding dependencies
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: uv pip install --python .venv/bin/python -r bindings/python/pyproject.toml

      - name: Install cargo-nextest
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: taiki-e/install-action@nextest

      # Cache restoration can replace target/; install the current plan last.
      - name: Download integration change plan
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change

      - name: Execute the exact change-owned shard
        if: steps.shard-selection.outputs.has_targets == 'true'
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: >-
          .venv/bin/python scripts/ci_change_owned.py run-shard
          --plan target/integration-change/plan.json
          --lane change-owned
          --shard ${{ matrix.shard }}
          --output target/integration-change/change-owned-${{ matrix.shard }}

      - name: Upload change-owned shard receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-owned-${{ matrix.shard }}
          path: target/integration-change/change-owned-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

  change-owned-report:
    name: Change-Owned Integration Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, ci-fast, integration-plan, change-owned-shard]
    if: ${{ always() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Require the planner and every change-owned shard
        env:
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
        run: |
          args=(
            "integration-plan=${{ needs.integration-plan.result }}"
            "change-owned-shard=${{ needs.change-owned-shard.result }}"
          )
          if [ "$REBASE_LANE" != "targeted" ]; then
            args+=("ci-fast=${{ needs.ci-fast.result }}")
          fi
          python3 scripts/ci_require_success.py "${args[@]}"

      - name: Download integration change plan
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change

      - name: Download change-owned shard receipts
        uses: actions/download-artifact@v7
        with:
          pattern: integration-change-owned-*
          path: target/integration-change/receipts/change-owned

      - name: Download standing coverage receipt
        if: needs.changes.outputs.rebase_lane != 'targeted'
        uses: actions/download-artifact@v7
        with:
          name: ci-fast-receipts
          path: target/integration-change/standing

      - name: Validate required change-owned execution
        env:
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
        run: |
          standing=()
          if [ "$REBASE_LANE" != "targeted" ]; then
            standing+=(
              --standing-coverage
              target/integration-change/standing/ci-fast/coverage.json
            )
          fi
          .venv/bin/python scripts/ci_change_owned.py report \
            --plan target/integration-change/plan.json \
            --lane change-owned \
            --receipts-root target/integration-change/receipts/change-owned \
            --output target/integration-change/change-owned-report \
            --required \
            "${standing[@]}"

      - name: Publish required change-owned summary
        if: always()
        run: |
          if [ -f target/integration-change/change-owned-report/summary.md ]; then
            cat target/integration-change/change-owned-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload required change-owned report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-owned-report
          path: target/integration-change/change-owned-report
          if-no-files-found: warn
          retention-days: 14


  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, ci-fast, change-owned-report]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Require the fixed main integration suite
        if: github.event_name == 'push'
        run: >-
          python3 scripts/ci_require_success.py
          ci-fast=${{ needs.ci-fast.result }}

      - name: Require all ordinary pull-request integration legs
        if: github.event_name != 'push' && needs.changes.outputs.rebase_lane != 'targeted'
        run: >-
          python3 scripts/ci_require_success.py
          ci-fast=${{ needs.ci-fast.result }}
          change-owned-report=${{ needs.change-owned-report.result }}

      - name: Require targeted rebase integration
        if: needs.changes.outputs.rebase_lane == 'targeted'
        run: >-
          python3 scripts/ci_require_success.py
          change-owned-report=${{ needs.change-owned-report.result }}

  # NOTE: the LOC report moved to its own weekly workflow
  # (.github/workflows/loc-report.yml) so it no longer commits a bot
  # commit to main on every merge. See WS-7 / spend-trim.

  test-telemetry:
    name: CI Test Telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, ci-fast]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) && needs.ci-fast.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download fast Linux JUnit
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-fast
          path: target/test-telemetry/input/linux-fast

      - name: Build cross-lane timing report
        run: >-
          uv run --managed-python --python 3.11 --no-project python
          scripts/ci_test_telemetry.py
          --shard linux-fast=target/test-telemetry/input/linux-fast/junit.xml
          --json target/test-telemetry/full/report.json
          --summary target/test-telemetry/full/summary.md
          --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload cross-lane timing report
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-all-lanes
          path: target/test-telemetry/full
          if-no-files-found: error
          retention-days: 14

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    env:
      CHELIS_C_TEST_EXTRA_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Strip debuginfo; see lint-rust for the chelis#392 rationale.
      # ASan/UBSan still report file:line from the C side; the Rust
      # debuginfo dropped here does not affect the sanitizer findings.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      # apt-get under retry (scripts/ci_apt_get.py); see the lint-rust
      # job for the transient-mirror-reset rationale.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # No uv setup here — `cargo test -p chelis-backend-c` does not
      # transitively pull pyo3 (verified by `cargo tree -p chelis-backend-c`),
      # so pyo3-build-config never runs in this job.
      - name: Backend tests under ASan/UBSan
        run: cargo test -p chelis-backend-c --lib

      - name: Backend doctests
        run: cargo test -p chelis-backend-c --doc

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() }}
    steps:
      # Shallow the clone to the PR's commit range instead of the whole
      # repo history (chelis#421). GitHub Actions expressions have no
      # arithmetic, so the depth-1 checkout is deepened to the PR commit
      # count + 1 in bash below (the `+1` reaches the base tip's parent so
      # `base..head` resolves). A backstop fetch guarantees `base.sha` is
      # present even if the count is stale (a force-push between the event
      # and the run). On push, depth 2 covers `HEAD~1..HEAD`.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}
          fetch-depth: 1

      - name: Check commits for AI authorship markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] ||
             [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Deepen head to the PR commit range, then backstop-fetch the
            # base commit so `base..head` resolves at the shallow boundary
            # (both no-ops if already present).
            if [ "$EVENT_NAME" = "pull_request" ]; then
              git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
            else
              git fetch origin "$HEAD" "$BASE" 2>/dev/null || true
            fi
            git fetch --depth=1 origin "$BASE" 2>/dev/null || true
            RANGE="$BASE..$HEAD"
          else
            git fetch --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
            RANGE="HEAD~1..HEAD"
          fi
          FOUND=0
          # Patterns covering Claude, Kiro, OpenAI, Codex, ChatGPT, Copilot, generic AI
          AI_MSG_PATTERNS=(
            '(Co-)?Authored-By:.*(claude|anthropic|kiro|openai|codex|chatgpt|copilot)'
            'Generated (with|by).*(claude|kiro|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)'
          )
          AI_IDENTITY_PATTERNS=(
            '(claude|anthropic|kiro|openai|codex|chatgpt|copilot)'
          )
          for SHA in $(git rev-list "$RANGE"); do
            MSG="$(git log -1 --format="%B" "$SHA")"
            AUTHOR="$(git log -1 --format="%an <%ae>" "$SHA")"
            COMMITTER="$(git log -1 --format="%cn <%ce>" "$SHA")"
            for pat in "${AI_MSG_PATTERNS[@]}"; do
              if printf '%s\n' "$MSG" | grep -qiE "$pat"; then
                echo "FAIL: $SHA commit message matches: $pat"
                FOUND=1
              fi
            done
            for pat in "${AI_IDENTITY_PATTERNS[@]}"; do
              if printf '%s\n' "$AUTHOR" | grep -qiE "$pat"; then
                echo "FAIL: $SHA author matches: $AUTHOR"
                FOUND=1
              fi
              if printf '%s\n' "$COMMITTER" | grep -qiE "$pat"; then
                echo "FAIL: $SHA committer matches: $COMMITTER"
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Remove AI authorship markers from the flagged commits."
            exit 1
          fi
          echo "All commits clean."

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() }}
    # Strip debuginfo; see lint-rust for the chelis#392 rationale.
    # This job compiles the chelis-e2e skill-suite test binary.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      # Full history: the Phase 4B acknowledgement gate diffs every frozen
      # contract file against `git merge-base origin/main HEAD`. The default
      # shallow checkout gives neither a usable `origin/main` nor enough
      # history behind it, and what it does give varies with the clone shape:
      # measured, `--depth 1 --no-single-branch` makes `git merge-base` exit 1
      # with no output, and `--depth 1 --branch <topic>` leaves `origin/main`
      # absent entirely. The gate fails loudly on both, so a shallow checkout
      # turns this job red rather than quiet, but the depth is what makes it
      # green for the right reason.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Require candidate lifecycle and CI contract preflight
        env:
          CANDIDATE_PREFLIGHT: ${{ needs.changes.outputs.candidate_preflight }}
        run: |
          if [ "$CANDIDATE_PREFLIGHT" != "success" ]; then
            echo "candidate preflight failed; expensive CI was suppressed" >&2
            exit 1
          fi

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install uv for focused documentation contracts
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv for contract reports
        run: uv venv --python 3.11

      - name: Report Phase 3 required-test changes
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: .venv/bin/python scripts/phase3_test_change_report.py --base "$BASE_REF" --pr-head "$PR_HEAD" --output target/phase3-test-changes.json

      - name: Publish Phase 3 required-test changes
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase3-test-changes
          path: target/phase3-test-changes.json
          if-no-files-found: error

      - name: Report Phase 4B contract changes
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: .venv/bin/python scripts/phase4b_change_report.py --base "$BASE_REF" --pr-head "$PR_HEAD" --output target/phase4b-contract-changes.json

      - name: Publish Phase 4B contract changes
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase4b-contract-changes
          path: target/phase4b-contract-changes.json
          if-no-files-found: error

      - name: Validate CI topology documentation
        run: uv run --managed-python --python 3.11 --no-project python -m unittest scripts.test_gate.CiParityTests.test_topology_docs_name_current_shard_owners

      # Agent instructions are Markdown, so their owning checks must also
      # run when docs-only routing skips the workspace and script jobs.
      - name: Validate shared agent skills
        run: uv run --managed-python --python 3.11 --no-project --with PyYAML==6.0.3 python scripts/check_agent_skills.py

      - name: Test hosted validation coverage
        run: uv run --managed-python --python 3.11 --no-project --with PyYAML==6.0.3 python -m unittest scripts.test_check_agent_skills scripts.test_hosted_validation

      - name: Verify shared skill distribution
        run: cargo test -p chelis-conformance --test asset_drift_tripwire --test skill_set_uniformity

      # chelis#729 Phase 4B froze the numeric atoms and the capability schema
      # behind atom and region digests over spec/ and spec/design/, plus a
      # per-file acknowledgement gate over every frozen contract file. The
      # oracle validates documents and regenerated rejection membership, including
      # its fresh source/compiler closure. A docs-only pull request skips the
      # other heavy jobs, so this always-run job is the
      # placement that actually defends the freeze against the edits most
      # likely to break it. This step is unconditional: on a push or a
      # workflow_dispatch it runs the atom and region digests and reports the
      # contract diff without requiring a pull request body.
      - name: Validate the chelis#729 Phase 4B freeze
        run: uv run --managed-python --python 3.11 --no-project python scripts/dtype_phase4b_oracle.py

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      # This example suite does not transitively pull pyo3. The contract reports
      # above use the checkout venv; the freeze oracle uses managed uv directly.
      - name: Validate package SKILL and mdBook examples
        run: cargo test -p chelis-e2e --test skill_suite

      - name: Build mdBook
        run: mdbook build docs/book
