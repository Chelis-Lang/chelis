name: CI

run-name: ${{ inputs.retarget_token != '' && format('Retarget CI {0}', inputs.retarget_token) || github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose synthetic merge must be tested
        required: true
        type: number
      expected_head_sha:
        description: Exact open pull-request head
        required: true
        type: string
      expected_base_sha:
        description: Exact retargeted base commit
        required: true
        type: string
      retarget_token:
        description: Unique coordinator token
        required: true
        type: string
      execution_target:
        description: Protected self-hosted execution requires separate exact-candidate admission
        required: false
        default: github-hosted
        type: choice
        options: [github-hosted, self-hosted]
      expected_candidate_sha:
        description: Exact synthetic merge SHA required for protected self-hosted execution
        required: false
        type: string

concurrency:
  # Generic PR edits never enter this workflow. Exact-base retarget dispatches
  # and normal PR updates share the implementation group for the same PR.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}-implementation
  cancel-in-progress: true

# Candidate code also runs on workflow_dispatch in the base branch context.
# Limit the cache capability independently of GITHUB_TOKEN permissions.
# Every job here therefore restores main's Rust build caches and saves none;
# ci-cache-warm.yml writes each cache family from main's own code, under the
# key these jobs compute. Self-hosted runners keep their Kache compiler cache
# and skip the GitHub caches.
cache-mode: read

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect docs-only pull requests so the heavy jobs (Integration, macOS
  # Smoke, SMT Feature Build, Backend Sanitizers, Hull Conformance Gate)
  # can skip them via a job-level `if` (chelis#419). This MUST be a job
  # output consumed by each heavy job's `if`, never a workflow-level
  # `paths-ignore`: a required check filtered out by `paths-ignore` never
  # reports its status context, so branch protection waits on it forever
  # and the PR can never merge; a required check whose JOB is skipped by
  # an `if` reports its context as success, satisfying branch protection.
  #
  # This job itself is intentionally NOT a required status check, is
  # cheap (no toolchain, no build), and runs on every event. On push (no
  # pull_request context) it emits docs_only=false so push-to-main always
  # runs the full suite, per the WS-7 spend-trim scope.
  changes:
    name: Detect docs-only changes
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      diagnostic_kind_changed: ${{ steps.detect.outputs.diagnostic_kind_changed }}
      clarabel_changed: ${{ steps.detect.outputs.clarabel_changed }}
      ci_contract_changed: ${{ steps.candidate-preflight.outputs.ci_contract_changed }}
      candidate_preflight: ${{ steps.candidate-preflight.outputs.candidate_preflight }}
      preflight_reason: ${{ steps.candidate-preflight.outputs.preflight_reason }}
      rebase_lane: ${{ steps.rebase-reuse.outputs.rebase_lane }}
      rebase_before: ${{ steps.rebase-reuse.outputs.rebase_before }}
      rebase_contract_changed: ${{ steps.rebase-reuse.outputs.rebase_contract_changed }}
      rebase_run_rust: ${{ steps.rebase-reuse.outputs.rebase_run_rust }}
      rebase_run_script_unit: ${{ steps.rebase-reuse.outputs.rebase_run_script_unit }}
      rebase_run_integration: ${{ steps.rebase-reuse.outputs.rebase_run_integration }}
      rebase_run_smt: ${{ steps.rebase-reuse.outputs.rebase_run_smt }}
      rebase_run_backend: ${{ steps.rebase-reuse.outputs.rebase_run_backend }}
      rebase_run_diagnostic: ${{ steps.rebase-reuse.outputs.rebase_run_diagnostic }}
      rebase_run_hull: ${{ steps.rebase-reuse.outputs.rebase_run_hull }}
      rebase_packages: ${{ steps.rebase-reuse.outputs.rebase_packages }}
    steps:
      - name: Checkout trusted retarget validator
        id: checkout-trusted-retarget
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_base_sha }}
          path: trusted
          fetch-depth: 1

      # Shallow checkout (depth 1); the detect step deepens to the PR
      # commit range. A retarget dispatch with a pinned candidate checks out
      # that exact merge commit by SHA (it stays reachable through the
      # reviewer's refs/ci-candidates/<token> pin) and both parents so the
      # trusted validator can bind them. Depth 2, not 0: expressions treat 0
      # as false, so `&& 0 || 1` is 1.
      - name: Checkout exact candidate
        id: checkout-candidate
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_candidate_sha != '' && inputs.expected_candidate_sha || (github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha) }}
          path: candidate
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 2 || 1 }}

      - name: Checkout trusted rebase reuse verifier
        id: checkout-trusted-rebase
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-rebase
          fetch-depth: 1

      - name: Validate exact retarget candidate
        id: validate-retarget
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        working-directory: candidate
        run: |
          # A pinned candidate is a fixed merge of the reviewed base and the
          # head. Bind its parents, not the live pull-request base: GitHub
          # recomputes that base on every main push, and whether main moved
          # is decided at merge time, not by rerunning this review.
          if [ -n "$EXPECTED_CANDIDATE_SHA" ]; then
            base_args=(--checkout-base-sha "$EXPECTED_BASE_SHA" --expected-base-ref main)
          else
            base_args=(--expected-base-sha "$EXPECTED_BASE_SHA")
          fi
          python3 ../trusted/scripts/ci_validate_pr_candidate.py \
            --repository "${{ github.repository }}" \
            --pr-number "${{ inputs.pr_number }}" \
            --expected-head-sha "${{ inputs.expected_head_sha }}" \
            "${base_args[@]}" \
            --validate-checkout

      - name: Record exact candidate
        id: candidate
        continue-on-error: true
        env:
          EXECUTION_TARGET: ${{ inputs.execution_target }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        working-directory: candidate
        run: |
          candidate="$(git rev-parse HEAD)"
          if [ "$EXECUTION_TARGET" = self-hosted ] || [ -n "$EXPECTED_CANDIDATE_SHA" ]; then
            if [[ ! "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
               [ "$candidate" != "$EXPECTED_CANDIDATE_SHA" ]; then
              echo "::error::The server-controlled candidate differs from the reviewed synthetic merge."
              exit 1
            fi
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Bootstrap CI contract preflight selection
        id: ci-contract-bootstrap
        continue-on-error: true
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: |
          # Bootstrap before project activation without consulting a checkout-controlled PATH.
          trusted_git=/usr/bin/git
          trusted_python=/usr/bin/python3
          if [ "${RUNNER_ENVIRONMENT:-github-hosted}" = "self-hosted" ]; then
            trusted_git=/run/current-system/sw/bin/git
            trusted_python=/run/current-system/sw/bin/python3
          fi
          if [ "$EVENT_NAME" != "pull_request" ] &&
             [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ci_contract_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            classifier="trusted/scripts/ci_contract_paths.py"
          else
            classifier="$RUNNER_TEMP/ci-contract-paths.py"
            if ! "$trusted_git" -C candidate show \
              "$BASE_SHA:scripts/ci_contract_paths.py" > "$classifier"; then
              echo "ci_contract_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          set -o pipefail
          if ! GIT_NO_REPLACE_OBJECTS=1 "$trusted_git" -C candidate \
            -c core.quotePath=true diff --name-only --no-renames \
            --no-ext-diff --no-textconv "$BASE_SHA" "$HEAD_SHA" \
            | "$trusted_python" "$classifier"; then
            echo "ci_contract_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One step owns this clone's shape, and every verifier after it reads
      # a stated property rather than whatever the previous step's fetches
      # happened to leave behind. Two defects came from the latter:
      # chelis#2228, where the base backstop's `--depth=1` grafted the
      # target snapshot out of the identity step's reach, and chelis#2234,
      # where the head deepen's own boundary grafted the target tip out of
      # the classifier's. Both were a verifier depending on execution order.
      #
      # An invariant that a later fetch can violate is worse than none,
      # because it reads as a guarantee. A fetch can only add history, with
      # one exception: a depth-limited fetch adds a graft. So this step owns
      # every depth-limited fetch in the job, and
      # scripts/test_ci_establish_candidate_clone.py fails if another step
      # acquires one.
      - name: Establish the candidate clone
        id: clone
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          COMMITS: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: candidate
        run: |
          # Every command in this preamble is guarded. Under errexit an
          # unguarded one exits the step, and this step's outcome now gates
          # the candidate preflight, so a transient `gh` blip would close
          # required contexts with nothing said about the candidate. Worse,
          # `Compute docs_only` reads the clone this step establishes and
          # cannot tolerate a failure of its own, so dying here would fail
          # the whole job and leave required contexts with no check run at
          # all, which is chelis#2228's unmergeable shape. The module below
          # already fails closed *with information*; this preamble has to
          # do the same rather than fail closed with none.
          current_pr="$RUNNER_TEMP/current-pr.json"
          target_tip=""
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$current_pr"; then
            # A bare assignment is not a guard. `// ""` defaults a null
            # field; it does not survive a malformed document, and jq exits
            # 5 on an array or on non-JSON written under a zero exit code,
            # and 127 when it is absent. The same applies to the rev-parse
            # below, which is reachable after a successful fetch.
            if ! base_ref=$(jq -r '.base.ref // ""' "$current_pr"); then
              base_ref=""
            fi
            # Pre-existing and unguarded until now: a base branch renamed
            # upstream leaves `refs/heads/$base_ref` gone (chelis#2240).
            if [ -n "$base_ref" ] &&
               git fetch --no-tags origin "refs/heads/$base_ref" &&
               target_tip=$(git rev-parse FETCH_HEAD); then
              :
            else
              target_tip=""
              echo "could not resolve the target tip for base ref" \
                "'${base_ref:-<unreadable>}'; the clone is established" \
                "without it and the classifier will fail safe" >&2
            fi
          else
            echo "could not read the live pull request; the target tip is" \
              "unresolved and the clone is established without it" >&2
          fi
          echo "target_tip=$target_tip" >> "$GITHUB_OUTPUT"
          args=(--base "$BASE" --head "$HEAD" --commits "$COMMITS"
                --github-output "$GITHUB_OUTPUT")
          # Named explicitly, and not redundantly: `--unshallow`
          # un-truncates what the refspec reaches rather than discovering
          # commits, so a pre-push head unreachable from any live ref after
          # a force-push stays absent unless it is asked for by name.
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ]; then
            args+=(--before "$BEFORE")
          fi
          if [ -n "$target_tip" ]; then
            args+=(--target-tip "$target_tip")
          fi
          python3 ../candidate/scripts/ci_establish_candidate_clone.py "${args[@]}"

      - name: Compute docs_only
        id: detect
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        working-directory: candidate
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] &&
             [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # push-to-main (or any non-PR event) always runs the full
            # suite; do not skip heavy jobs off a PR diff.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "diagnostic_kind_changed=false" >> "$GITHUB_OUTPUT"
            echo "clarabel_changed=false" >> "$GITHUB_OUTPUT"
            echo "ci_contract_changed=false" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME): docs_only=false (full suite)"
            exit 0
          fi
          # No fetching here. `Establish the candidate clone` owns the
          # shape of this clone and has already asserted that base and head
          # are present and comparable, so this step reads a stated
          # property instead of inheriting whatever ran before it
          # (chelis#2228, chelis#2234).
          git diff --name-only "$BASE..$HEAD" \
            | python3 scripts/ci_detect_docs_only.py

      - name: Validate candidate lifecycle
        id: candidate-lifecycle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: candidate
        run: |
          args=(--event "$GITHUB_EVENT_PATH")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # No fetching here either. `Establish the candidate clone`
            # wrote current-pr.json, resolved the target tip and asserted
            # that this classifier's commits are walkable; this step
            # consumes that rather than re-deriving it (chelis#2234).
            current_pr="$RUNNER_TEMP/current-pr.json"
            timeline="$RUNNER_TEMP/pr-timeline.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" > "$timeline"
            args+=(
              --current-pr "$current_pr"
              --target-tip "${{ steps.clone.outputs.target_tip }}"
              --timeline "$timeline"
            )
          fi
          python3 scripts/ci_candidate_lifecycle.py "${args[@]}"

      - name: Select targeted rebase lane
        id: rebase-reuse
        continue-on-error: true
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LIFECYCLE: ${{ steps.candidate-lifecycle.outcome }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        working-directory: candidate
        run: |
          record_frontier_defaults() {
            echo "rebase_packages=" >> "$GITHUB_OUTPUT"
            echo "rebase_run_rust=false" >> "$GITHUB_OUTPUT"
            echo "rebase_run_script_unit=false" >> "$GITHUB_OUTPUT"
            echo "rebase_run_integration=false" >> "$GITHUB_OUTPUT"
            echo "rebase_run_smt=false" >> "$GITHUB_OUTPUT"
            echo "rebase_run_backend=false" >> "$GITHUB_OUTPUT"
            echo "rebase_run_diagnostic=false" >> "$GITHUB_OUTPUT"
            echo "rebase_run_hull=false" >> "$GITHUB_OUTPUT"
          }
          record_full() {
            echo "rebase_lane=full" >> "$GITHUB_OUTPUT"
            echo "rebase_before=${BEFORE:-}" >> "$GITHUB_OUTPUT"
            echo "rebase_reason=$1" >> "$GITHUB_OUTPUT"
            echo "rebase_contract_changed=false" >> "$GITHUB_OUTPUT"
            record_frontier_defaults
          }
          record_ordinary() {
            echo "rebase_lane=ordinary" >> "$GITHUB_OUTPUT"
            echo "rebase_before=${BEFORE:-}" >> "$GITHUB_OUTPUT"
            echo "rebase_reason=$1" >> "$GITHUB_OUTPUT"
            echo "rebase_contract_changed=false" >> "$GITHUB_OUTPUT"
            record_frontier_defaults
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            record_full "trusted exact-candidate dispatch"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ] ||
             [ "$ACTION" != "synchronize" ] ||
             [ "$LIFECYCLE" != "success" ]; then
            record_ordinary "not an eligible synchronize event"
            exit 0
          fi
          verifier="../trusted-rebase/scripts/ci_rebase_reuse.py"
          if [ ! -f "$verifier" ]; then
            record_full "trusted rebase verifier is not available on the base"
            exit 0
          fi
          if ! python3 "$verifier" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-path . \
            --event "$GITHUB_EVENT_PATH" \
            --current-pr "$RUNNER_TEMP/current-pr.json" \
            --timeline "$RUNNER_TEMP/pr-timeline.json" \
            --candidate-sha "${{ steps.candidate.outputs.candidate_sha }}" \
            --output "$RUNNER_TEMP/rebase-reuse/decision.json" \
            --github-output "$GITHUB_OUTPUT"; then
            record_full "trusted rebase verifier failed closed"
          fi

      - name: Publish targeted rebase decision for review
        id: publish-rebase-decision
        continue-on-error: true
        if: always()
        run: |
          decision="$RUNNER_TEMP/rebase-reuse/decision.json"
          if [ -f "$decision" ]; then
            {
              echo "### Targeted rebase decision"
              echo
              echo '```json'
              cat "$decision"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install uv for CI contract preflight
        id: install-uv
        continue-on-error: true
        if: ${{ always() && (steps.detect.outputs.ci_contract_changed == 'true' || steps.ci-contract-bootstrap.outputs.ci_contract_changed == 'true' || steps.rebase-reuse.outputs.rebase_contract_changed == 'true') }}
        uses: astral-sh/setup-uv@v8.1.0

      - name: Validate changed CI contracts before build fan-out
        id: ci-contract
        if: ${{ always() && (steps.detect.outputs.ci_contract_changed == 'true' || steps.ci-contract-bootstrap.outputs.ci_contract_changed == 'true' || steps.rebase-reuse.outputs.rebase_contract_changed == 'true') }}
        continue-on-error: true
        working-directory: candidate
        run: >-
          uv run --managed-python --python 3.11 --no-project
          --with PyYAML==6.0.3 python -m unittest
          scripts.test_check_agent_skills
          scripts.test_ci_candidate_lifecycle
          scripts.test_ci_establish_candidate_clone
          scripts.test_ci_preflight_carrier
          scripts.test_ci_candidate_identity
          scripts.test_ci_candidate_receipt
          scripts.test_ci_rebase_reuse
          scripts.test_ci_change_owned
          scripts.test_ci_contract_paths
          scripts.test_ci_detect_docs_only
          scripts.test_ci_validate_pr_candidate
          scripts.test_pr_workflow_routing
          scripts.test_change_owned_workflow
          scripts.test_hosted_validation
          scripts.test_regenerate_conformance_assets
          scripts.test_gate.DocsOnlySkipTests
          scripts.test_gate.CiParityTests
          scripts.test_gate_local.LocalCommandListTests
          scripts.test_gate.RejectionAuthorityPrBoundaryTests

      # Split from the verdict so the identity step can sit between them:
      # it needs a gate to run behind, and the verdict needs its outcome.
      # This half covers everything that establishes and classifies the
      # candidate; the verdict below adds what this gate then permitted.
      #
      # Every step in this job is `continue-on-error`, so the job always
      # completes and always emits its outputs. Job setup is the exception
      # that no step condition reaches: an unresolvable `uses:` or a lost
      # runner still fails the job, and the required Docs context reports
      # that case.
      #
      # The reason names the first failure in THIS list's order, which is
      # not step order. With two steps failing it names whichever this
      # checks first, which is deliberate: one stated cause beats a
      # concatenation, and the job log has the rest. That is the point: a hard
      # failure here used to leave required contexts with no check run at
      # all, which cannot be waited out, re-run into existence or
      # overridden (chelis#2228). Tolerating a step must not make its
      # failure ignorable, so every one of them is read below, and
      # scripts/test_ci_preflight_carrier.py fails if a tolerated step is
      # missing from this list.
      - name: Compute the candidate preflight gate
        id: preflight-gate
        if: always()
        continue-on-error: true
        run: |
          checkout="${{ steps.checkout-candidate.outcome }}"
          candidate="${{ steps.candidate.outcome }}"
          candidate_sha="${{ steps.candidate.outputs.candidate_sha }}"
          clone="${{ steps.clone.outcome }}"
          clone_invariant="${{ steps.clone.outputs.clone_invariant }}"
          bootstrap="${{ steps.ci-contract-bootstrap.outcome }}"
          detect_outcome="${{ steps.detect.outcome }}"
          lifecycle="${{ steps.candidate-lifecycle.outcome }}"
          rebase="${{ steps.rebase-reuse.outcome }}"
          publish="${{ steps.publish-rebase-decision.outcome }}"
          install_uv="${{ steps.install-uv.outcome }}"
          contract="${{ steps.ci-contract.outcome }}"
          retarget_checkout="${{ steps.checkout-trusted-retarget.outcome }}"
          retarget_validate="${{ steps.validate-retarget.outcome }}"
          rebase_checkout="${{ steps.checkout-trusted-rebase.outcome }}"
          detected_contract="${{ steps.detect.outputs.ci_contract_changed }}"
          bootstrap_contract="${{ steps.ci-contract-bootstrap.outputs.ci_contract_changed }}"
          rebase_contract="${{ steps.rebase-reuse.outputs.rebase_contract_changed }}"
          contract_changed=unknown
          if [ "$detected_contract" = "true" ] ||
             [ "$bootstrap_contract" = "true" ] ||
             [ "$rebase_contract" = "true" ]; then
            contract_changed=true
          elif [ "$detected_contract" = "false" ] &&
               [ "$bootstrap_contract" = "false" ] &&
               { [ "$rebase_contract" = "false" ] || [ -z "$rebase_contract" ]; }; then
            contract_changed=false
          fi
          gate=success
          reason=""
          fail() {
            gate=failure
            if [ -z "$reason" ]; then
              reason="$1"
            fi
          }
          if [ "$checkout" = "failure" ]; then
            fail "the candidate could not be checked out"
          fi
          if [ "$candidate" = "failure" ] || [ -z "$candidate_sha" ]; then
            fail "the exact candidate commit could not be recorded"
          fi
          if [ "$retarget_checkout" = "failure" ]; then
            fail "the trusted retarget validator could not be checked out"
          fi
          if [ "$retarget_validate" = "failure" ]; then
            fail "the retargeted candidate did not validate"
          fi
          if [ "$rebase_checkout" = "failure" ]; then
            fail "the trusted rebase verifier could not be checked out"
          fi
          if [ "$clone" = "failure" ] || [ "$clone_invariant" = "failed" ]; then
            fail "the candidate clone could not be established"
          fi
          if [ "$bootstrap" = "failure" ]; then
            fail "the CI contract bootstrap selection failed"
          fi
          if [ "$detect_outcome" = "failure" ]; then
            fail "the docs-only detector failed"
          fi
          if [ "$lifecycle" != "success" ]; then
            fail "the candidate update could not be classified"
          fi
          if [ "$rebase" = "failure" ]; then
            fail "the targeted rebase lane could not be selected"
          fi
          if [ "$publish" = "failure" ]; then
            fail "the targeted rebase decision could not be published"
          fi
          if [ "$install_uv" = "failure" ]; then
            fail "uv could not be installed for the CI contract suite"
          fi
          if [ "$contract_changed" = "true" ]; then
            if [ "$contract" != "success" ]; then
              fail "the changed CI contracts did not validate"
            fi
          elif [ "$contract_changed" != "false" ]; then
            fail "whether the CI contracts changed could not be determined"
          fi
          echo "ci_contract_changed=$contract_changed" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "gate_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "preflight gate=$gate${reason:+ ($reason)}; combined CI contract=$contract_changed"

      # Ahead of the verdict, so its outcome can reach it. Its gate is the
      # same condition it had when it sat after the verdict -- an
      # established clone, a classified lifecycle and a satisfied CI
      # contract -- computed from the step outcomes rather than from the
      # verdict it now precedes. Moving it must not make it run on a
      # candidate the verdict would have stopped.
      - name: Record immutable candidate identity
        id: identity
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && steps.preflight-gate.outputs.gate == 'success' }}
        working-directory: candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >-
          python3 scripts/ci_candidate_identity.py
          --repository "${{ github.repository }}"
          --workflow-file ci.yml
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --base-ref "$BASE_REF"
          --candidate-sha "${{ steps.candidate.outputs.candidate_sha }}"
          --output "$RUNNER_TEMP/candidate-identity/candidate-identity.json"

      - name: Upload immutable candidate identity
        continue-on-error: true
        id: upload-identity
        if: ${{ github.event_name == 'pull_request' && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-identity-ci
          path: ${{ runner.temp }}/candidate-identity/candidate-identity.json
          if-no-files-found: error
          retention-days: 30

      # The stated reason, which the required Docs context prints. An unevaluable
      # candidate produces a red check saying what could not be evaluated,
      # instead of a job that never reported at all, which is the shape
      # that made a pull request unmergeable rather than merely red.
      - name: Record candidate preflight verdict
        id: candidate-preflight
        if: always()
        continue-on-error: true
        run: |
          gate="${{ steps.preflight-gate.outputs.gate }}"
          reason="${{ steps.preflight-gate.outputs.gate_reason }}"
          identity="${{ steps.identity.outcome }}"
          upload="${{ steps.upload-identity.outcome }}"
          verdict="$gate"
          if [ "$verdict" = "success" ] && [ "$identity" = "failure" ]; then
            verdict=failure
            reason="the candidate identity could not be recorded"
          fi
          if [ "$verdict" = "success" ] && [ "$upload" = "failure" ]; then
            verdict=failure
            reason="the candidate identity could not be uploaded"
          fi
          if [ -z "$verdict" ]; then
            verdict=failure
            reason="the candidate preflight gate did not report"
          fi
          echo "ci_contract_changed=${{ steps.preflight-gate.outputs.ci_contract_changed }}" >> "$GITHUB_OUTPUT"
          echo "candidate_preflight=$verdict" >> "$GITHUB_OUTPUT"
          echo "preflight_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "candidate preflight=$verdict${reason:+: $reason}"

  # C2.2's producer seal depends on same-crate privacy, which an external
  # compile-fail doctest cannot distinguish from pub(crate). Run the actual
  # controlled mutations whenever any owner/oracle/control input changes.
  diagnostic-kind-oracle:
    name: Diagnostic Kind Mutation Oracle
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    # Reserve 25 minutes for cold hosted Devenv realization.
    timeout-minutes: 55
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && needs.changes.outputs.rebase_lane != 'docs' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_diagnostic == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.diagnostic_kind_changed != 'false')) }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: target/diagnostic-kind-oracle
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      - name: Cache cargo registry and mutation-oracle build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: diagnostic-kind-oracle
          workspaces: . -> target/diagnostic-kind-oracle
          save-if: false

      - name: Run C2.2 controlled mutations
        run: python scripts/diagnostic_kind_oracle.py

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  lint-rust:
    name: Rust Policy (Linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    # Reserve headroom for cold Devenv and optional native dependencies.
    timeout-minutes: 75
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_rust == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    # Strip debuginfo from the dev/test build. Debuginfo is the dominant
    # disk consumer in target/; dropping it (alongside the free-disk step
    # below) is what keeps the Linux workspace build off "No space left on
    # device" / the mid-link ld bus-error (signal 7) — chelis#392. Symbols
    # only affect backtraces, never what is tested. Set per-job (not
    # workflow-wide) so unrelated jobs and release profiles keep their own
    # settings. The macOS workspace workers make the same test-only tradeoff
    # explicitly below.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      - name: Cache cargo registry and build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: lint-rust
          save-if: false

      # The Rust-policy gate subset (clippy, fmt, chelis lint --check,
      # doctests, and compile guards) is defined once in scripts/gate.py.
      # Clippy already compiles every workspace target, so a preceding
      # standalone `cargo build --workspace --all-targets` is redundant.
      # Keep the complete Rust-policy selection in gate.py rather than
      # hand-inlining a second list in this workflow.
      # The static LP64 OpenBLAS provider is part of the self-hosted profile
      # only; hosted runners lint with the bundled provider, as main does.
      - name: Gate (lint-and-unit subset)
        if: needs.changes.outputs.rebase_lane != 'targeted' || needs.changes.outputs.rebase_packages == ''
        run: |
          if [ "${RUNNER_ENVIRONMENT:-github-hosted}" = self-hosted ]; then
            chelis-gate lint-and-unit-nix
          else
            chelis-gate lint-and-unit
          fi

      - name: Run affected Rust policy and units for targeted rebase
        if: needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_packages != ''
        env:
          CHELIS_TARGETED_PACKAGES: ${{ needs.changes.outputs.rebase_packages }}
        run: chelis-gate targeted-units

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  script-unit:
    name: Script and Python Unit Tests (Linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    # The hosted wheel consumer intentionally runs for docs-only changes too:
    # distribution behavior needs an executable receipt on every pull request.
    timeout-minutes: 90
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_script_unit == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true') || needs.changes.outputs.docs_only == 'true') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      # Python execution ownership is explicit, independent of installed tools.
      - name: Install shared-skill validator dependency
        run: uv pip install --python "$PYO3_PYTHON" PyYAML==6.0.3

      - name: Install Python binding dependencies
        run: uv pip install --python "$PYO3_PYTHON" -r bindings/python/pyproject.toml

      - name: Script unit tests (scripts/test_*.py)
        run: python scripts/ci_script_tests.py pr

      - name: Install local tooling test dependencies
        run: uv pip install --python "$PYO3_PYTHON" -e 'py[test]'

      - name: Local LOC report tests
        run: python -m pytest py/tests/test_loc_report.py -q

      # Keep the privacy and source-usage construction boundary in script-unit
      # without querying mutable GitHub issue state. The always-running Docs
      # Phase 4B oracle owns fresh compiler closure and generated agreement;
      # the standing nightly owns exists/kind/open liveness.
      - name: Validate rejection authority construction boundary
        run: python scripts/check_rejection_authority_boundary.py

      - name: Python binding ingress unit tests
        run: python -m unittest discover -s bindings/python/tests -p 'test_*.py'

      - name: Cache the Python distribution build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: python-wheel-smoke
          workspaces: . -> target/python-wheel-smoke/cargo
          save-if: false

      - name: Build and exercise Python distributions
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/python-wheel-smoke/cargo
          CARGO_INCREMENTAL: 0
        if: ${{ !cancelled() }}
        run: >-
          python bindings/python/tests/python_wheel_smoke.py
          --crossed-bundle
          --receipt "$CARGO_TARGET_DIR/wheel-smoke.json"

      - name: Upload Python distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-smoke
          path: |
            target/python-wheel-smoke/cargo/wheel-smoke.json
            target/python-wheel-smoke/cargo/wheel-smoke-failures/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload script selection and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: script-tests-pr
          path: target/ci-script-tests/pr
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  # Preserve the required branch-protection context while the independent
  # Rust and Python policy workers execute in parallel.
  lint-and-unit:
    name: Lint and Unit Tests (Linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: [changes, lint-rust, script-unit]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true')) || needs.changes.outputs.docs_only == 'true') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Require the selected lint and unit frontier
        env:
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
          RUN_RUST: ${{ needs.changes.outputs.rebase_run_rust }}
          RUN_SCRIPT_UNIT: ${{ needs.changes.outputs.rebase_run_script_unit }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          args=()
          if [ "$DOCS_ONLY" != "true" ] &&
             { [ "$REBASE_LANE" != "targeted" ] || [ "$RUN_RUST" = "true" ]; }; then
            args+=("lint-rust=${{ needs.lint-rust.result }}")
          fi
          if [ "$REBASE_LANE" != "targeted" ] ||
             [ "$RUN_SCRIPT_UNIT" = "true" ] ||
             [ "$DOCS_ONLY" = "true" ]; then
            args+=("script-unit=${{ needs.script-unit.result }}")
          fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "trusted rebase selected no lint or unit owner"
          else
            python3 scripts/ci_require_success.py "${args[@]}"
          fi

  # Non-gate job (see NON_GATE_JOBS in scripts/test_gate.py, rule-id
  # GATE-SCOPE-SMT): the required fast SMT smoke. It builds the
  # cvc5-backed `smt` feature and proves the binary can discharge a real
  # obligation through cvc5, but leaves the full solver/proof corpus to
  # smt-full-prove.yml (nightly + manual dispatch only, not on PRs). Keep the job
  # display name stable: branch protection requires this exact context.
  # Runbook: docs/smt_build_setup.md.
  smt-build:
    name: SMT Feature Build (Linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    # The self-hosted profile realizes its own cvc5 closure from the private
    # cache; the hosted lane links the prebuilt release asset below. Budget
    # for a cold Devenv and a cold from-source cvc5 build.
    timeout-minutes: 90
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_smt == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    # cvc5 builds from source into target/ on top of the workspace build —
    # the heaviest disk consumer of any Linux job — so it gets both the
    # free-disk reclaim and the debuginfo strip (chelis#392). It was the
    # only Linux build job missing the free-disk step.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo + cvc5 build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci
        with:
          profile: ci-smt

      # Hosted runners cannot reach the private Nix cache, so they take main's
      # prebuilt path: a durable Release asset, then the Actions cache, then a
      # from-source build that the harvest below saves for the next run.
      # `activate` exports CVC5_DIR only when the store is complete (verified
      # by ci_cvc5_cache.py's sentinel); otherwise the normal from-source path
      # runs. (A PR branch DOES inherit main's caches/assets; only a PR's own
      # cache SAVE is branch-scoped.)
      - name: Compute cvc5 cache key
        id: cvc5key
        if: runner.environment == 'github-hosted'
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-x86_64

      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        if: runner.environment == 'github-hosted'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-x86_64 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: runner.environment == 'github-hosted' && steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        if: runner.environment == 'github-hosted'
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          # smt-full-prove.yml restores the same family.
          shared-key: smt-smt-build
          save-if: false

      - name: Build smt feature
        run: cargo build -p chelis-cli --features smt

      # Cold hosted runs only (no CVC5_DIR active): copy the freshly built
      # cvc5 artifacts into the stable-key cache dir so the next Cargo.lock
      # churn links them instead of rebuilding. `complete=true` is emitted
      # only after a fully-verified harvest; the save step below is gated on
      # it, so a partial/failed build never poisons the stable-key cache.
      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        if: runner.environment == 'github-hosted'
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}


      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/debug/chelis

      - name: Run cvc5 engine smoke tests
        run: cargo test -p chelis-prove --features smt --lib cvc5_engine_

      # Integration binaries link chelis-prove without cfg(test). Exercise
      # their explicit libtest worker route as well as the unit-test route.
      - name: Run SMT integration containment controls
        run: cargo test -p chelis-prove --features smt --test integration_solver_isolation

      # chelis#1125 PP7: `crates/chelis-cli/tests/prove_deep_obligations.rs` is
      # `#![cfg(feature = "smt")]` and had NO invocation anywhere. The gate
      # never passes `--features smt`, this job tested only `chelis-prove`, and
      # smt-full-prove.yml never names `chelis-cli`, so a merged test asserting
      # the correct proof tier for the `.dp` surface could not fail and the
      # regression it was written to catch landed green. This is the smallest
      # step that runs it, in the job that already provisions cvc5. Pinned by
      # scripts/test_gate.py's SmtCiSplitTests so it cannot silently disappear
      # again.
      - name: Run the Deep-surface obligation tier tests
        run: cargo test -p chelis-cli --features smt --test prove_deep_obligations

      # chelis#3236: this CLI acceptance target is `#![cfg(feature = "smt")]`,
      # so the change-owned lane lists no tests in it. Its owner row in
      # .config/ci-test-targets.toml names this job, which provisions cvc5.
      - name: Run the prover solver-symbol collision acceptance tests
        run: cargo test -p chelis-cli --features smt --test issue_3236_prover_name_collision

      # Clippy's `disallowed_types` ban on raw hash collections
      # (spec/design/hash_order_determinism.md C2.3) only sees the
      # configuration it compiles. This job already provisions cvc5, so it is
      # an independent check of the `smt` feature's code. The Rust-policy
      # gate runs a separate provider-plus-SMT row before its local dep-info
      # closure guard; see scripts/check_configuration_closure.py.
      - name: Clippy over the cvc5 feature configuration
        run: cargo clippy --workspace --all-targets --features chelis-cli/smt,chelis-prove/smt,chelis-tide/smt -- -D warnings

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  # chelis#422 (WS-4) PROVE-IN-CI lanes. release.yml ships
  # `chelis-cli --features smt` on three targets; cvc5 builds from
  # source (cmake/g++/libgmp) and is only PROVEN on ubuntu-latest by the
  # smt-build job above. These two lanes prove cvc5 also builds on the
  # other two release targets BEFORE release.yml relies on the feature
  # there: the glibc-2.31 Bullseye compat toolchain and macOS-arm64.
  # Each mirrors its release.yml job's build command exactly
  # (`cargo build --release -p chelis-cli --features smt`) and runs the
  # post-build verifier (.github/scripts/verify_release_smt.py) to
  # confirm the binary actually discharges through cvc5, not the
  # solver-free fuzz fallback. No uv setup: `cargo build -p chelis-cli`
  # is pyo3-free on both the default and smt feature graphs (asserted by
  # scripts/test_release_workflow_pyo3_isolation.py), unlike the
  # `cargo test -p chelis-prove` step in the Linux smt-build job.
  smt-build-glibc231:
    name: SMT Feature Build (Linux, glibc 2.31)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_smt == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    # The immutable digest supplies Python, git, curl, and CA certificates
    # before checkout while retaining Debian 11's glibc 2.31. After checkout,
    # ci_apt_get replaces its moving mirrors with the repository-pinned
    # snapshot before installing anything.
    container: python:3.11.13-bullseye@sha256:df0bd610af061603b29d63eb82027b64d5a3f15506e39270422b10b2a55079fc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # m4 is required by GMP's configure; cmake/g++/libclang support the cvc5
      # source build. The pinned snapshot makes package indices and payloads
      # one immutable generation, while the retry loop still handles network
      # resets and stalls. The Python 3.11 base already supplies git, pip, and
      # venv, and cvc5 uses stdlib tomllib rather than a PyPI tomli bootstrap.
      - name: Install build prerequisites
        run: python3 scripts/ci_apt_get.py --debian-bullseye-snapshot --no-sudo --no-install-recommends build-essential m4 cmake libclang-dev libopenblas-dev libgmp-dev libmpfr-dev

      - name: Assert glibc 2.31 build environment
        run: |
          set -euo pipefail
          ldd --version | awk 'NR==1'
          ldd --version | awk 'NR==1' | grep -F '2.31'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # chelis#583: dedicated stable-key cvc5 cache, in its OWN
      # `linux-glibc231` namespace so the Bullseye (glibc 2.31) toolchain's
      # libcvc5.a is never crossed with the ubuntu-latest one. On a warm hit
      # cvc5-sys links the prebuilt lib (built in this same container, so the
      # glibc-2.31 assertion below stays valid) instead of rebuilding from
      # source after an unrelated Cargo.lock bump. See the smt-build job.
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-glibc231

      # Durable Release asset first, Actions cache fallback second; see the
      # smt-build job for the full rationale. The asset is built in this same
      # Bullseye (glibc 2.31) container by build-cvc5.yml, so the glibc-2.31
      # assertion below stays valid on the linked artifact.
      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-glibc231 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: smt-glibc231
          save-if: false

      - name: Build chelis-cli (release, smt)
        run: cargo build --release -p chelis-cli --features smt

      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Assert no glibc requirement above 2.31
        run: |
          set -euo pipefail
          max_req="$(objdump -T target/release/chelis | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "max glibc requirement: ${max_req}"
          test "$(printf 'GLIBC_2.31\n%s\n' "${max_req}" | sort -V | tail -1)" = "GLIBC_2.31"

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

  ci-fast:
    name: Fast Tests (Linux)
    # Reserve 25 minutes for cold hosted Devenv realization.
    timeout-minutes: 55
    # Hosted for ordinary events, like every other job here (chelis#2543). On
    # the two-runner warm pool this pull-request critical path queued behind
    # the nightly, and the pool admits pull requests only against main.
    # Explicit dispatches keep their existing target selection.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      - name: Cache cargo registry and build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: linux-workspace
          save-if: false

      - name: Install Python binding dependencies
        run: uv pip install --python "$PYO3_PYTHON" -r bindings/python/pyproject.toml

      - name: Gate (units and reviewed integrations)
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: chelis-gate ci-fast

      - name: Upload fast JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-fast
          path: target/nextest/ci-fast/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload selection and build timing receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-fast-receipts
          path: |
            target/ci-fast
            target/gate-reports
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  integration-plan:
    name: Plan Changed Integration Tests
    timeout-minutes: 10
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_integration == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable


      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Derive the change-owned and package-expansion plan
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          PR_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ needs.changes.outputs.candidate_sha }}
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
          REBASE_BEFORE: ${{ needs.changes.outputs.rebase_before }}
          REBASE_PACKAGES: ${{ needs.changes.outputs.rebase_packages }}
        run: |
          event_name="$EVENT_NAME"
          before="$BEFORE"
          if [ "$REBASE_LANE" = "targeted" ]; then
            event_name=targeted_rebase
            before="$REBASE_BEFORE"
          fi
          .venv/bin/python scripts/ci_change_owned.py plan \
            --event-name "$event_name" \
            --pr-head "$PR_HEAD" \
            --before "$before" \
            --after "$AFTER" \
            --targeted-packages "$REBASE_PACKAGES" \
            --output target/integration-change/plan.json

      - name: Upload integration change plan
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change/plan.json
          if-no-files-found: error
          retention-days: 14

  change-owned-shard:
    name: Change-Owned Integration Tests (bucket ${{ matrix.shard }})
    # Reserve 25 minutes for cold hosted Devenv realization.
    timeout-minutes: 85
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    permissions:
      contents: read
    needs: [changes, integration-plan]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.integration-plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Download integration change plan for shard selection
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: ${{ runner.temp }}/integration-change

      - name: Preserve empty-shard evidence or request execution
        shell: bash
        id: shard-selection
        run: >-
          python3 scripts/ci_change_owned.py prepare-shard
          --plan "${{ runner.temp }}/integration-change/plan.json"
          --lane change-owned
          --shard ${{ matrix.shard }}
          --output target/integration-change/change-owned-${{ matrix.shard }}
          --github-output "$GITHUB_OUTPUT"

      - name: Free disk space (Ubuntu)
        if: steps.shard-selection.outputs.has_targets == 'true' && runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: ./.github/actions/setup-project-ci

      - name: Restore cargo registry and build cache
        if: runner.environment == 'github-hosted' && steps.shard-selection.outputs.has_targets == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: linux-workspace
          save-if: false

      - name: Install Python binding dependencies
        if: steps.shard-selection.outputs.has_targets == 'true'
        run: uv pip install --python "$PYO3_PYTHON" -r bindings/python/pyproject.toml

      # Cache restoration can replace target/; install the current plan last.
      - name: Download integration change plan
        if: steps.shard-selection.outputs.has_targets == 'true'
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change

      - name: Execute the exact change-owned shard
        if: steps.shard-selection.outputs.has_targets == 'true'
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
          CHELIS_CI_TIMING_DIR: ${{ github.workspace }}/target/integration-change/change-owned-${{ matrix.shard }}/census-timings
        run: >-
          python scripts/ci_change_owned.py run-shard
          --plan target/integration-change/plan.json
          --lane change-owned
          --shard ${{ matrix.shard }}
          --output target/integration-change/change-owned-${{ matrix.shard }}

      - name: Upload change-owned shard receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-owned-${{ matrix.shard }}
          path: target/integration-change/change-owned-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  change-owned-report:
    name: Change-Owned Integration Report
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: [changes, ci-fast, integration-plan, change-owned-shard]
    if: ${{ always() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_integration == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Require the planner and every change-owned shard
        env:
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
        run: |
          args=(
            "integration-plan=${{ needs.integration-plan.result }}"
            "change-owned-shard=${{ needs.change-owned-shard.result }}"
          )
          if [ "$REBASE_LANE" != "targeted" ]; then
            args+=("ci-fast=${{ needs.ci-fast.result }}")
          fi
          python3 scripts/ci_require_success.py "${args[@]}"

      - name: Download integration change plan
        uses: actions/download-artifact@v7
        with:
          name: integration-change-plan
          path: target/integration-change

      - name: Download change-owned shard receipts
        uses: actions/download-artifact@v7
        with:
          pattern: integration-change-owned-*
          path: target/integration-change/receipts/change-owned

      - name: Download standing coverage receipt
        if: needs.changes.outputs.rebase_lane != 'targeted'
        uses: actions/download-artifact@v7
        with:
          name: ci-fast-receipts
          path: target/integration-change/standing

      - name: Validate required change-owned execution
        env:
          REBASE_LANE: ${{ needs.changes.outputs.rebase_lane }}
        run: |
          standing=()
          if [ "$REBASE_LANE" != "targeted" ]; then
            standing+=(
              --standing-coverage
              target/integration-change/standing/ci-fast/coverage.json
            )
          fi
          .venv/bin/python scripts/ci_change_owned.py report \
            --plan target/integration-change/plan.json \
            --lane change-owned \
            --receipts-root target/integration-change/receipts/change-owned \
            --output target/integration-change/change-owned-report \
            --required \
            "${standing[@]}"

      - name: Publish required change-owned summary
        if: always()
        run: |
          if [ -f target/integration-change/change-owned-report/summary.md ]; then
            cat target/integration-change/change-owned-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload required change-owned report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-change-owned-report
          path: target/integration-change/change-owned-report
          if-no-files-found: warn
          retention-days: 14


  # The provider's two feature builds are selected by their source owners,
  # including the shared native-call bridge. They run beside ci-fast so an
  # unrelated PR never compiles the optional solver or waits for these tests.
  clarabel-provider:
    name: Clarabel Feature Checks (Linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    timeout-minutes: 55
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && needs.changes.outputs.rebase_lane != 'docs' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.clarabel_changed == 'true' }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      - name: Cache cargo registry and build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: linux-workspace
          save-if: false

      - name: Lint native Clarabel provider
        run: cargo clippy --workspace --all-targets --features chelis-cli/clarabel-provider -- -D warnings

      - name: Lint native Clarabel ideal proofs
        run: cargo clippy --workspace --all-targets --features chelis-cli/clarabel-provider,chelis-cli/smt,chelis-prove/smt,chelis-tide/smt -- -D warnings

      - name: Check native Clarabel package calls
        run: cargo nextest run -p chelis-cli --features clarabel-provider --test clarabel_native_eval

      - name: Check Clarabel adapter cases
        run: cargo nextest run -p chelis-clarabel-provider --features solver --test solver

      - name: Check native Clarabel ideal QP proofs
        run: cargo nextest run -p chelis-cli --features clarabel-provider,smt --test clarabel_native_eval

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  integration:
    name: Integration Tests (Linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: [changes, ci-fast, change-owned-report, clarabel-provider]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane != 'docs' && (needs.changes.outputs.rebase_lane == 'targeted' || needs.changes.outputs.docs_only != 'true'))) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Require the fixed main integration suite
        if: github.event_name == 'push'
        run: >-
          python3 scripts/ci_require_success.py
          ci-fast=${{ needs.ci-fast.result }}

      - name: Require all ordinary pull-request integration legs
        if: github.event_name != 'push' && needs.changes.outputs.rebase_lane != 'targeted'
        run: >-
          python3 scripts/ci_require_success.py
          ci-fast=${{ needs.ci-fast.result }}
          change-owned-report=${{ needs.change-owned-report.result }}

      - name: Require targeted rebase integration
        if: needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_integration == 'true'
        run: >-
          python3 scripts/ci_require_success.py
          change-owned-report=${{ needs.change-owned-report.result }}

      - name: Require selected Clarabel feature checks
        if: needs.changes.outputs.clarabel_changed == 'true'
        run: >-
          python3 scripts/ci_require_success.py
          clarabel-provider=${{ needs.clarabel-provider.result }}

      - name: Preserve integration context for an owner-only rebase
        if: needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_integration != 'true'
        run: echo "trusted rebase selected no package integration frontier"

  test-telemetry:
    name: CI Test Telemetry
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs: [changes, ci-fast]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) && needs.ci-fast.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download fast Linux JUnit
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-fast
          path: target/test-telemetry/input/linux-fast

      - name: Build cross-lane timing report
        run: >-
          uv run --managed-python --python 3.11 --no-project python
          scripts/ci_test_telemetry.py
          --shard linux-fast=target/test-telemetry/input/linux-fast/junit.xml
          --json target/test-telemetry/full/report.json
          --summary target/test-telemetry/full/summary.md
          --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload cross-lane timing report
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-all-lanes
          path: target/test-telemetry/full
          if-no-files-found: error
          retention-days: 14

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    # Reserve 25 minutes for cold hosted Devenv realization.
    timeout-minutes: 55
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.candidate_preflight == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.rebase_lane == 'full' || (needs.changes.outputs.rebase_lane == 'targeted' && needs.changes.outputs.rebase_run_backend == 'true') || (needs.changes.outputs.rebase_lane == 'ordinary' && needs.changes.outputs.docs_only != 'true')) }}
    env:
      CHELIS_C_TEST_EXTRA_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Strip debuginfo; see lint-rust for the chelis#392 rationale.
      # ASan/UBSan still report file:line from the C side; the Rust
      # debuginfo dropped here does not affect the sanitizer findings.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      - name: Cache cargo registry and build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: backend-sanitizers
          save-if: false

      - name: Backend tests under ASan/UBSan
        run: cargo test -p chelis-backend-c --lib

      - name: Backend doctests
        run: cargo test -p chelis-backend-c --doc

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    needs: [changes]
    if: ${{ !cancelled() }}
    steps:
      # Shallow the clone to the PR's commit range instead of the whole
      # repo history (chelis#421). GitHub Actions expressions have no
      # arithmetic, so the depth-1 checkout is deepened to the PR commit
      # count + 1 in bash below (the `+1` reaches the base tip's parent so
      # `base..head` resolves). A backstop fetch guarantees `base.sha` is
      # present even if the count is stale (a force-push between the event
      # and the run). On push, depth 2 covers `HEAD~1..HEAD`.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}
          fetch-depth: 1

      - name: Check commits for AI authorship markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ inputs.expected_base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] ||
             [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Deepen head to the PR commit range, then backstop-fetch the
            # base commit so `base..head` resolves at the shallow boundary
            # (both no-ops if already present). The backstop is depth-less
            # for the reason given in the `changes` job: `--depth=1` grafts
            # the base in .git/shallow, and `$BASE..$HEAD` then stops
            # excluding the base's ancestors, so this scan reads commits
            # that merged into the target long before the pull request
            # existed (chelis#2228).
            if [ "$EVENT_NAME" = "pull_request" ]; then
              git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
            else
              git fetch origin "$HEAD" "$BASE" 2>/dev/null || true
            fi
            git fetch --no-tags origin "$BASE" 2>/dev/null || true
            RANGE="$BASE..$HEAD"
          else
            git fetch --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
            RANGE="HEAD~1..HEAD"
          fi
          FOUND=0
          # Patterns covering Claude, Kiro, OpenAI, Codex, ChatGPT, Copilot, generic AI
          AI_MSG_PATTERNS=(
            '(Co-)?Authored-By:.*(claude|anthropic|kiro|openai|codex|chatgpt|copilot)'
            'Generated (with|by).*(claude|kiro|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)'
          )
          AI_IDENTITY_PATTERNS=(
            '(claude|anthropic|kiro|openai|codex|chatgpt|copilot)'
          )
          for SHA in $(git rev-list "$RANGE"); do
            MSG="$(git log -1 --format="%B" "$SHA")"
            AUTHOR="$(git log -1 --format="%an <%ae>" "$SHA")"
            COMMITTER="$(git log -1 --format="%cn <%ce>" "$SHA")"
            for pat in "${AI_MSG_PATTERNS[@]}"; do
              if printf '%s\n' "$MSG" | grep -qiE "$pat"; then
                echo "FAIL: $SHA commit message matches: $pat"
                FOUND=1
              fi
            done
            for pat in "${AI_IDENTITY_PATTERNS[@]}"; do
              if printf '%s\n' "$AUTHOR" | grep -qiE "$pat"; then
                echo "FAIL: $SHA author matches: $AUTHOR"
                FOUND=1
              fi
              if printf '%s\n' "$COMMITTER" | grep -qiE "$pat"; then
                echo "FAIL: $SHA committer matches: $COMMITTER"
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Remove AI authorship markers from the flagged commits."
            exit 1
          fi
          echo "All commits clean."

  docs:
    name: Docs
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'self-hosted' && fromJSON(format('["chelis-ci-warm-x64","chelis-ci-reviewed-{0}"]', inputs.retarget_token)) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    needs: [changes]
    if: ${{ !cancelled() }}
    # Strip debuginfo; see lint-rust for the chelis#392 rationale.
    # This job compiles the chelis-e2e skill-suite test binary.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      # Full history: the Phase 4B acknowledgement gate diffs every frozen
      # contract file against `git merge-base origin/main HEAD`. The default
      # shallow checkout gives neither a usable `origin/main` nor enough
      # history behind it, and what it does give varies with the clone shape:
      # measured, `--depth 1 --no-single-branch` makes `git merge-base` exit 1
      # with no output, and `--depth 1 --branch <topic>` leaves `origin/main`
      # absent entirely. The gate fails loudly on both, so a shallow checkout
      # turns this job red rather than quiet, but the depth is what makes it
      # green for the right reason.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.candidate_sha }}
          fetch-depth: 0

      # Where the reason is stated. Not the only red context on a code
      # pull request: the two required aggregators go red too, reporting a
      # skipped worker rather than the cause. This step states the cause
      # and says nothing about what happened to other jobs, deliberately.
      # That consequence list is what went stale twice, and a check whose
      # message describes jobs it cannot see has to be kept in sync with
      # them forever; the job log already shows what ran.
      - name: Require candidate lifecycle and CI contract preflight
        shell: bash
        env:
          CANDIDATE_PREFLIGHT: ${{ needs.changes.outputs.candidate_preflight }}
          PREFLIGHT_REASON: ${{ needs.changes.outputs.preflight_reason }}
        run: |
          if [ "$CANDIDATE_PREFLIGHT" != "success" ]; then
            echo "this candidate could not be evaluated, which is why this" \
              "check is red." >&2
            echo "reason: ${PREFLIGHT_REASON:-the candidate preflight did not report}" >&2
            echo "See the Detect docs-only changes job for the step that" \
              "reported it." >&2
            exit 1
          fi

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/free-disk-space

      - name: Set up project CI
        id: build-cache
        uses: ./.github/actions/setup-project-ci

      - name: Cache cargo registry and build
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-v1-${{ runner.environment }}
          shared-key: docs
          save-if: false

      - name: Install shared-skill validator dependency
        run: uv pip install --python "$PYO3_PYTHON" PyYAML==6.0.3

      - name: Report Phase 3 required-test changes
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: python scripts/phase3_test_change_report.py --base "$BASE_REF" --pr-head "$PR_HEAD" --output target/phase3-test-changes.json

      - name: Publish Phase 3 required-test changes
        if: ${{ always() && hashFiles('target/phase3-test-changes.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase3-test-changes
          path: target/phase3-test-changes.json
          if-no-files-found: error

      - name: Report Phase 4B contract changes
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_HEAD: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: python scripts/phase4b_change_report.py --base "$BASE_REF" --pr-head "$PR_HEAD" --output target/phase4b-contract-changes.json

      - name: Publish Phase 4B contract changes
        if: ${{ always() && hashFiles('target/phase4b-contract-changes.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase4b-contract-changes
          path: target/phase4b-contract-changes.json
          if-no-files-found: error

      - name: Validate CI topology documentation
        run: python -m unittest scripts.test_gate.CiParityTests.test_topology_docs_name_current_shard_owners

      # Agent instructions are Markdown, so their owning checks must also
      # run when docs-only routing skips the workspace and script jobs.
      - name: Validate shared agent skills
        run: python scripts/check_agent_skills.py

      - name: Test hosted validation coverage
        run: python -m unittest scripts.test_check_agent_skills scripts.test_hosted_validation

      - name: Verify shared skill distribution
        run: cargo test -p chelis-conformance --test asset_drift_tripwire --test skill_set_uniformity

      # chelis#729 Phase 4B froze the numeric atoms and the capability schema
      # behind atom and region digests over spec/ and spec/design/, plus a
      # per-file acknowledgement gate over every frozen contract file. The
      # oracle validates documents and regenerated rejection membership, including
      # its fresh source/compiler closure. A docs-only pull request skips the
      # other heavy jobs, so this always-run job is the
      # placement that actually defends the freeze against the edits most
      # likely to break it. This step is unconditional: on a push or a
      # workflow_dispatch it runs the atom and region digests and reports the
      # contract diff without requiring a pull request body.
      - name: Validate the chelis#729 Phase 4B freeze
        run: python scripts/dtype_phase4b_oracle.py

      - name: Validate package SKILL and mdBook examples
        run: cargo test -p chelis-e2e --test skill_suite

      - name: Install mdBook
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: Build mdBook
        run: mdbook build docs/book

      # The book mirrors the chelis.ch docs; the lint keeps contributor
      # material (issue numbers, internal paths, status words) out of it.
      - name: Lint the user book and README
        run: python scripts/check_book.py docs/book/src README.md

      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outputs.state-path != ''
        uses: ./.github/actions/vendor/ci/actions/publish-build-cache
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}
