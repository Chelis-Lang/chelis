name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect docs-only pull requests so the heavy jobs (Integration,
  # SMT Feature Build, Backend Sanitizers, Hull Conformance Gate)
  # can skip them via a job-level `if` (chelis#419). This MUST be a job
  # output consumed by each heavy job's `if`, never a workflow-level
  # `paths-ignore`: a required check filtered out by `paths-ignore` never
  # reports its status context, so branch protection waits on it forever
  # and the PR can never merge; a required check whose JOB is skipped by
  # an `if` reports its context as success, satisfying branch protection.
  #
  # This job itself is intentionally NOT a required status check, is
  # cheap (no toolchain, no build), and runs on every event. On push (no
  # pull_request context) it emits docs_only=false so push-to-main always
  # runs the full suite, per the WS-7 spend-trim scope.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      rejection_authority_changed: ${{ steps.detect.outputs.rejection_authority_changed }}
      diagnostic_kind_changed: ${{ steps.detect.outputs.diagnostic_kind_changed }}
    steps:
      # Shallow checkout (depth 1) on every event: the local
      # detect-docs-only action needs the repo on disk. The action
      # deepens to the PR commit range itself; on push it
      # short-circuits to docs_only=false without touching history.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Compute docs_only
        id: detect
        uses: ./.github/actions/detect-docs-only

  # [05-UNS-5] issue authority is admitted through a checked-in membership
  # manifest, so edits to that admission path require a live exists/kind/state
  # check before merge. The offline generator and Rust constructors establish
  # shape and membership; this job prevents a same-PR manifest edit from
  # blessing a closed issue, pull request, or missing object (chelis#730 §C2.1).
  rejection-authority-liveness:
    name: Rejection Authority Liveness
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.rejection_authority_changed != 'false') }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before materializing the Devenv closure; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Validate rejection authority construction boundary
        run: devenv-retry --profile ci shell --no-tui -- python scripts/check_rejection_authority_boundary.py

      - name: Validate rejection issue authorities against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: devenv-retry --profile ci shell --no-tui -- python scripts/validate_rejection_issue_manifest.py

  # C2.2's producer seal depends on same-crate privacy, which an external
  # compile-fail doctest cannot distinguish from pub(crate). Run the actual
  # controlled mutations whenever any owner/oracle/control input changes.
  diagnostic-kind-oracle:
    name: Diagnostic Kind Mutation Oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.diagnostic_kind_changed != 'false') }}
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: target/diagnostic-kind-oracle
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and mutation-oracle build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/diagnostic-kind-oracle

      - name: Run C2.2 controlled mutations
        run: devenv-retry --profile ci shell --no-tui -- python scripts/diagnostic_kind_oracle.py

  lint-and-unit:
    name: Lint and Unit Tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Strip debuginfo from the dev/test build. Debuginfo is the dominant
    # disk consumer in target/; dropping it (alongside the free-disk step
    # below) is what keeps the Linux workspace build off "No space left on
    # device" / the mid-link ld bus-error (signal 7) — chelis#392. Symbols
    # only affect backtraces, never what is tested. The `ci` Devenv profile
    # owns this Linux disk policy.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Check workflow syntax
        uses: Chelis-Lang/ci/actions/actionlint@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          actionlint-version: '1.7.12'
          actionlint-sha256: sha256:8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          mode: enforce

      - name: Audit workflow security
        uses: Chelis-Lang/ci/actions/zizmor@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          zizmor-version: '1.28.0'
          mode: advisory

      # Devenv activates its Python virtual environment and sets
      # PYO3_PYTHON before each cargo invocation.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # Run the scripts/ Python unit tests with the project Devenv
      # interpreter. The profile set-math class runs in workspace-tests after
      # its build is warm, so this step disables only that duplicate class.
      - name: Script unit tests (scripts/test_*.py)
        env:
          CHELIS_SKIP_NEXTEST_PROFILE_SET_MATH: "1"
        run: devenv-retry --profile ci shell --no-tui -- python -m unittest discover -s scripts -p 'test_*.py'

      # Phase 1's registered-PyO3 ingress tests use the NumPy package
      # declared by devenv/toolchains.nix. The suite stubs safetensors.
      - name: Python binding ingress unit tests
        run: devenv-retry --profile ci shell --no-tui -- python -m unittest discover -s bindings/python/tests -p 'test_*.py'

      # The lint-and-unit gate subset (build, clippy, fmt, chelis lint
      # --check) is defined once in scripts/gate.py and run here via
      # `gate.py lint-and-unit`. Do not hand-inline cargo/chelis
      # commands into this job: scripts/test_gate.py greps this file
      # and fails if any gate step is not produced by gate.py. See
      # docs/investigations/test_toolchain_guards_design.md.
      - name: Gate (lint-and-unit subset)
        run: devenv-retry --profile ci shell --no-tui -- python scripts/gate.py lint-and-unit

  # Non-gate job (see NON_GATE_JOBS in scripts/test_gate.py, rule-id
  # GATE-SCOPE-SMT): the required fast SMT smoke. It builds the
  # cvc5-backed `smt` feature and proves the binary can discharge a real
  # obligation through cvc5, but leaves the full solver/proof corpus to
  # smt-full-prove.yml (nightly + manual dispatch only, not on PRs). Keep the job
  # display name stable: branch protection requires this exact context.
  # Runbook: docs/smt_build_setup.md.
  smt-build:
    name: SMT Feature Build (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # The lane links the flake's pinned cvc5 tree (nix/cvc5.nix) through
    # CVC5_DIR and builds inside the Devenv shell -- the same rustc and the
    # same cvc5 the shipped Linux binary uses (openspec
    # converge-smt-lanes-on-nix-cvc5). The closure cache below is shared with
    # nix-packages.yml, so warm runs link in minutes. A cold closure (a cvc5
    # or nixpkgs pin bump) pays one ~30m Nix cvc5 build; the ceiling covers
    # that cold case plus a cold workspace recompile.
    timeout-minutes: 75
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      # cvc5 closure cache: the shared composite pair derives one key
      # from the cvc5-dir drvPath, so every lane (SMT, full-prove,
      # release, drift canary, Nix packages) shares one cached closure.
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: x86_64-linux

      # cvc5-sys links the prebuilt archives from CVC5_DIR and never runs
      # CMake, so this lane needs no apt C dependencies.
      - name: Build the Devenv cvc5 output
        run: |
          set -euo pipefail
          devenv-retry build --no-tui outputs.cvc5-dir

      # Save immediately after the closure exists, so a later build or
      # test failure does not lose the ~30m cold cvc5 build.
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: x86_64-linux
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # Keep the former smt-build cache namespace shared with the
          # optional full-prove lane.
          shared-key: smt-smt-build
          # Persist a warm workspace cache even if a later step fails, so a
          # slow cold run is not re-paid on the next attempt (chelis#583).
          cache-on-failure: true

      # `devenv-retry` retries only cachix/devenv#3064's exact invalid-store-path
      # diagnostic. Other failures stop immediately with their original status.
      - name: Build smt feature
        run: devenv-retry --profile smt shell --no-tui -- cargo build -p chelis-cli --features smt

      - name: Verify cvc5 discharge path (smt feature live)
        run: devenv-retry --profile smt shell --no-tui -- python .github/scripts/verify_release_smt.py ./target/debug/chelis

      - name: Run cvc5 engine smoke tests
        run: devenv-retry --profile smt shell --no-tui -- cargo test -p chelis-prove --features smt --lib cvc5_engine_

  smt-build-darwin-arm64:
    name: SMT Feature Build (darwin-arm64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # Warm closure + warm cargo cache runs in minutes; a cold cvc5 closure
    # pays one ~30m Nix build. See the smt-build job for the lane design
    # (openspec converge-smt-lanes-on-nix-cvc5).
    timeout-minutes: 75
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6

      # Explicit bash: this step runs before setup-devenv installs the
      # devenv-ci launcher the job default names.
      - name: Assert Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: aarch64-darwin

      - name: Build the Devenv cvc5 output
        run: |
          set -euo pipefail
          devenv-retry build --no-tui outputs.cvc5-dir

      # Save immediately after the closure exists, so a later build or
      # test failure does not lose the ~30m cold cvc5 build.
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: aarch64-darwin
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: smt-darwin-arm64
          cache-on-failure: true

      - name: Build chelis-cli (release, smt)
        run: devenv-retry --profile smt shell --no-tui -- cargo build --release -p chelis-cli --features smt

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/release/chelis | grep -E 'arm64|aarch64'

      - name: Verify cvc5 discharge path (smt feature live)
        run: devenv-retry --profile smt shell --no-tui -- python .github/scripts/verify_release_smt.py ./target/release/chelis

  workspace-tests:
    name: Workspace Tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Skip on docs-only PRs (chelis#419). A skipped required job reports
    # success, so branch protection stays satisfied; on push docs_only is
    # always false. `needs: [changes]` is what makes the output readable.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # Strip debuginfo through the `ci` Devenv profile. See lint-and-unit
    # for the chelis#392 rationale.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace

      # The workspace has ~200 integration test binaries. `cargo test
      # --workspace --tests` runs them one binary at a time, serializing
      # the heavyweight binaries (each test compiles/checks/builds
      # chelis-std). `cargo nextest` schedules tests from all binaries in
      # a single global thread pool, overlapping the heavyweight work.
      # See docs/investigations/ci_integration_test_runtime_diagnosis.md.
      #
      # The integration gate subset (`cargo nextest run --workspace`)
      # is defined once in scripts/gate.py and run here via `gate.py
      # integration`. The `ci` nextest profile writes per-test JUnit
      # timing XML to target/nextest/ci/junit.xml; the test-timing
      # budget step below consumes it. Do not hand-inline cargo
      # commands into this job (see scripts/test_gate.py parity lock).
      - name: Gate (integration subset)
        run: devenv-retry --profile ci shell --no-tui -- python scripts/gate.py integration

      # Run the structural oracle here after the workspace build
      # is warm so its three `nextest list` calls are continuously enforced.
      - name: Verify nextest profile coverage
        run: devenv-retry --profile ci shell --no-tui -- python -m unittest scripts.test_nextest_profile_partition.ProfilePartitionTests

      # Informational, non-failing: flags integration tests that have
      # regressed past their committed timing baseline or that are new
      # and over the absolute ceiling. The baseline
      # (scripts/test_timing_baseline.json) is hand-curated and
      # explicitly regenerated, never auto-updated on merge. Promotable
      # to a blocking step later. See
      # docs/investigations/test_toolchain_guards_design.md.
      - name: Test-timing budget (informational)
        if: always()
        continue-on-error: true
        run: devenv-retry --profile ci shell --no-tui -- python scripts/test_timing_check.py --junit target/nextest/ci/junit.xml

  # Run the inherited Phase 0-3 acceptance contract beside the workspace
  # nextest suite. On the measured #1118 run these steps took 7m22s after a
  # 14m56s workspace gate; making them independent removes that serial tail.
  dtype-phase3-oracle:
    name: Dtype Phase 0-3 Oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    permissions:
      contents: read
      issues: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Both parallel jobs restore the same cache; only workspace-tests
          # saves it, avoiding a second multi-GB entry in the 10 GB cache pool.
          save-if: false

      - name: Dtype Phase 0-3 oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: devenv-retry --profile ci shell --no-tui -- python scripts/dtype_phase3_oracle.py

  # Keep the #732 Phase 2 acceptance contract executable as its own blocking
  # leg. This is deliberately not appended to the dtype job: each phase oracle
  # has an independently visible result and failure boundary.
  faithful-observation-phase2-oracle:
    name: Faithful Observation Phase 2 Oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Restore the workspace cache but leave the single writer in the
          # workspace-tests job, avoiding another multi-GB cache entry.
          save-if: false

      - name: Faithful observation Phase 2 oracle
        run: devenv-retry --profile ci shell --no-tui -- python scripts/faithful_observation_phase2_oracle.py

  # Keep the existing required status context while making the three expensive
  # legs parallel. `!cancelled()` lets this job inspect dependency failures
  # while still suppressing work after cancellation.
  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, workspace-tests, dtype-phase3-oracle, faithful-observation-phase2-oracle]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      - name: Require all integration legs
        run: python3 scripts/ci_require_success.py workspace-tests=${{ needs.workspace-tests.result }} dtype-phase3-oracle=${{ needs.dtype-phase3-oracle.result }} faithful-observation-phase2-oracle=${{ needs.faithful-observation-phase2-oracle.result }}

  # NOTE: the LOC report moved to its own weekly workflow
  # (.github/workflows/loc-report.yml) so it no longer commits a bot
  # commit to main on every merge. See WS-7 / spend-trim.

  macos-smoke:
    name: macOS Smoke
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Hosted macOS runners are a manual gate. Linux remains the blocking
    # workspace path for pull requests and pushes.
    if: github.event_name == 'workflow_dispatch'
    # The manual macOS workspace build drops debuginfo to reduce its cost.
    # macOS pays for debuginfo twice: rustc emits it, then the linker
    # walks the debug map for every test binary the workspace produces.
    # Nothing here reads debuginfo -- the job asserts binary architecture
    # and runs two codegen smoke scripts -- so the only visible cost is
    # unsymbolicated frames in a `RUST_BACKTRACE` dump on failure, which
    # is exactly the tradeoff the Linux jobs already accept. The release
    # SMT jobs use the separate `smt` profile, which extends this CI policy.
    steps:
      - uses: actions/checkout@v6

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      # Run the real workspace test suite on macOS so macOS-only failures
      # (e.g., test harnesses that miss `-framework Accelerate` on linking
      # generated C, or Metal codegen-structure regressions) actually turn
      # this job red. Before this step existed, macOS-only breakage was
      # silently invisible to CI because the job only built and ran a
      # narrow Accelerate smoke shell script. `cargo nextest run
      # --workspace` builds everything it needs as part of test
      # compilation, so a separate `cargo build --workspace` step
      # beforehand is redundant under Swatinem's rust-cache. nextest's
      # cross-binary parallelism keeps this job off the same ~200-binary
      # serialization bloat as the Linux integration job; see
      # docs/investigations/ci_integration_test_runtime_diagnosis.md.
      - name: Workspace tests
        run: devenv-retry --profile ci shell --no-tui -- cargo nextest run --workspace

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/debug/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test generated C with Accelerate
        run: devenv-retry --profile ci shell --no-tui -- python .github/scripts/smoke_macos_accelerate.py ./target/debug/chelis

      # Phase M smoke: emit `.mm` from the Metal backend and link it
      # against the Metal/Foundation frameworks. Compile-and-link only
      # — no kernel dispatch — because MTLCreateSystemDefaultDevice may
      # return null on macos-latest CI VMs. Real GPU correctness lives
      # in the M6 manual gate (`cargo test -p chelis-backend-metal
      # --test gpu_correctness -- --ignored`) on a real workstation.
      - name: Smoke test Metal backend codegen + link
        run: devenv-retry --profile ci shell --no-tui -- python .github/scripts/smoke_macos_metal.py ./target/debug/chelis

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # The `sanitizers` Devenv profile owns the sanitizer flags, runtime
    # policy, and stripped Rust debuginfo.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Backend tests under ASan/UBSan
        run: devenv-retry --profile sanitizers shell --no-tui -- cargo test -p chelis-backend-c

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      # Shallow the clone to the PR's commit range instead of the whole
      # repo history (chelis#421). GitHub Actions expressions have no
      # arithmetic, so the depth-1 checkout is deepened to the PR commit
      # count + 1 in bash below (the `+1` reaches the base tip's parent so
      # `base..head` resolves). A backstop fetch guarantees `base.sha` is
      # present even if the count is stale (a force-push between the event
      # and the run). On push, depth 2 covers `HEAD~1..HEAD`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      - name: Resolve the commit range
        id: authorship-range
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            # Deepen head to the PR commit range, then backstop-fetch the
            # base commit so `base..head` resolves at the shallow boundary.
            git fetch --depth=$((COMMITS + 1)) origin "$HEAD_SHA" 2>/dev/null || true
            git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          else
            git fetch --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
            BASE_SHA="$(git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          {
            echo "base-sha=$BASE_SHA"
            echo "head-sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check commits for AI authorship markers
        uses: Chelis-Lang/ci/actions/check-authorship@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          base-sha: ${{ steps.authorship-range.outputs.base-sha }}
          head-sha: ${{ steps.authorship-range.outputs.head-sha }}
          profile: all-markers
          max-commits: '1000'

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Strip debuginfo through the `ci` Devenv profile. This job compiles the
    # chelis-e2e skill-suite test binary.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Validate package SKILL and mdBook examples
        run: devenv-retry --profile ci shell --no-tui -- cargo test -p chelis-e2e --test skill_suite

      - name: Build mdBook
        run: devenv-retry --profile ci shell --no-tui -- mdbook build docs/book
