name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect docs-only pull requests so the heavy jobs (Integration, macOS
  # Smoke, SMT Feature Build, Backend Sanitizers, Hull Conformance Gate)
  # can skip them via a job-level `if` (chelis#419). This MUST be a job
  # output consumed by each heavy job's `if`, never a workflow-level
  # `paths-ignore`: a required check filtered out by `paths-ignore` never
  # reports its status context, so branch protection waits on it forever
  # and the PR can never merge; a required check whose JOB is skipped by
  # an `if` reports its context as success, satisfying branch protection.
  #
  # This job itself is intentionally NOT a required status check, is
  # cheap (no toolchain, no build), and runs on every event. On push (no
  # pull_request context) it emits docs_only=false so push-to-main always
  # runs the full suite, per the WS-7 spend-trim scope.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      rejection_authority_changed: ${{ steps.detect.outputs.rejection_authority_changed }}
      diagnostic_kind_changed: ${{ steps.detect.outputs.diagnostic_kind_changed }}
    steps:
      # Shallow checkout (depth 1); the detect step deepens to the PR
      # commit range. GitHub Actions expressions have no arithmetic, so
      # `commits + 1` is computed in bash, not in the YAML `fetch-depth`.
      # On push the detect step short-circuits without needing history.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Compute docs_only
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push-to-main (or any non-PR event) always runs the full
            # suite; do not skip heavy jobs off a PR diff.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "rejection_authority_changed=false" >> "$GITHUB_OUTPUT"
            echo "diagnostic_kind_changed=false" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME): docs_only=false (full suite)"
            exit 0
          fi
          # Deepen head to the PR commit count + 1 (the +1 reaches the
          # base tip's parent so base..head resolves), then backstop-fetch
          # the base commit so it is present as an object even on a stale
          # count (force-push between the event and the run).
          git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          git diff --name-only "$BASE..$HEAD" \
            | python3 scripts/ci_detect_docs_only.py

  # [05-UNS-5] issue authority is admitted through a checked-in membership
  # manifest, so edits to that admission path require a live exists/kind/state
  # check before merge. The offline generator and Rust constructors establish
  # shape and membership; this job prevents a same-PR manifest edit from
  # blessing a closed issue, pull request, or missing object (chelis#730 §C2.1).
  rejection-authority-liveness:
    name: Rejection Authority Liveness
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.rejection_authority_changed != 'false') }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv
        run: uv venv --python 3.11

      - name: Validate rejection authority construction boundary
        run: .venv/bin/python scripts/check_rejection_authority_boundary.py

      - name: Validate rejection issue authorities against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/validate_rejection_issue_manifest.py

  # C2.2's producer seal depends on same-crate privacy, which an external
  # compile-fail doctest cannot distinguish from pub(crate). Run the actual
  # controlled mutations whenever any owner/oracle/control input changes.
  diagnostic-kind-oracle:
    name: Diagnostic Kind Mutation Oracle
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.diagnostic_kind_changed != 'false') }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: target/diagnostic-kind-oracle
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and mutation-oracle build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/diagnostic-kind-oracle

      - name: Run C2.2 controlled mutations
        run: .venv/bin/python scripts/diagnostic_kind_oracle.py

  lint-and-unit:
    name: Lint and Unit Tests (Linux)
    runs-on: ubuntu-latest
    # Strip debuginfo from the dev/test build. Debuginfo is the dominant
    # disk consumer in target/; dropping it (alongside the free-disk step
    # below) is what keeps the Linux workspace build off "No space left on
    # device" / the mid-link ld bus-error (signal 7) — chelis#392. Symbols
    # only affect backtraces, never what is tested. Set per-job (not
    # workflow-wide) so macos-smoke, the authoritative oracle, is byte-for-
    # byte unchanged; the disk pressure is Linux-only.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      # apt-get under retry (scripts/ci_apt_get.py): the hosted runner's apt
      # mirror intermittently resets the connection mid-download, flaking the
      # job with no code change. The helper retries the update+install pair on
      # a transient failure; a genuine packaging error still fails after the
      # attempts are exhausted.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `.cargo/config.toml` sets `PYO3_PYTHON=.venv/bin/python` so the
      # `chelis-python` link step finds the project-pinned interpreter
      # on every developer's machine. CI runners don't ship a `.venv/`
      # by default, so `scripts/ci_setup_uv_python.py` creates one with
      # the same uv-managed Python the project policy requires, then
      # appends the interpreter's `sysconfig.LIBDIR` to `$GITHUB_ENV` as
      # `LD_LIBRARY_PATH` (Linux) or `DYLD_LIBRARY_PATH` (macOS) so the
      # `chelis-python` test binaries can dlopen `libpython3.X.so` at
      # runtime. pyo3-build-config is a transitive build-dep of pyo3
      # and runs even when only its dependents are compiled, so this
      # step must precede every cargo invocation — including the
      # cache restore below, which is future-proofed against a
      # Swatinem version that might invoke `cargo` directly.
      - name: Install uv
        # Pinned to v8.1.0 (specific patch) rather than @v8 because
        # astral-sh/setup-uv does not yet publish a rolling `v8` major
        # tag — only the explicit v8.0.0 and v8.1.0 patch tags exist.
        # Using `@v8` resolves to "unable to find version `v8`" on the
        # runner. Bump this pin when astral-sh publishes either a `v8`
        # rolling tag or a newer patch.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # Run the scripts/ Python unit tests (gate.py, ci_free_disk.py, the
      # CI/release-workflow guards, etc.). This is the only job that runs
      # them, and it is the right host: cargo is present (so the release
      # pyo3 dep-graph oracle works) but cargo-nextest is NOT installed
      # here, so test_nextest_profile_partition's heavy `cargo nextest
      # list --workspace` oracle self-skips. Uses the uv-managed .venv
      # interpreter per repo policy. Not a cargo/chelis command, so the
      # scripts/test_gate.py parity lock leaves it alone.
      - name: Script unit tests (scripts/test_*.py)
        run: .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'

      # Phase 1's registered-PyO3 ingress tests are pure Python and stub the
      # native module, but intentionally exercise real NumPy dtype identities.
      # Install only that declared runtime dependency; safetensors is stubbed by
      # the suite so this step never builds the extension module.
      - name: Install Python binding ingress test dependency
        run: uv pip install --python .venv/bin/python 'numpy>=2.0'

      - name: Python binding ingress unit tests
        run: .venv/bin/python -m unittest discover -s bindings/python/tests -p 'test_*.py'

      # The lint-and-unit gate subset (build, clippy, fmt, chelis lint
      # --check) is defined once in scripts/gate.py and run here via
      # `gate.py lint-and-unit`. Do not hand-inline cargo/chelis
      # commands into this job: scripts/test_gate.py greps this file
      # and fails if any gate step is not produced by gate.py. See
      # docs/investigations/test_toolchain_guards_design.md.
      - name: Gate (lint-and-unit subset)
        run: python3 scripts/gate.py lint-and-unit

  # Non-gate job (see NON_GATE_JOBS in scripts/test_gate.py, rule-id
  # GATE-SCOPE-SMT): the required fast SMT smoke. It builds the
  # cvc5-backed `smt` feature and proves the binary can discharge a real
  # obligation through cvc5, but leaves the full solver/proof corpus to
  # smt-full-prove.yml (nightly + manual dispatch only, not on PRs). Keep the job
  # display name stable: branch protection requires this exact context.
  # Runbook: docs/smt_build_setup.md.
  smt-build:
    name: SMT Feature Build (Linux)
    runs-on: ubuntu-latest
    # In steady state this job LINKS a durable prebuilt cvc5 (a GitHub Release
    # asset published by build-cvc5.yml, rustc-independent, no cache TTL/LRU),
    # so it runs ~3m warm. The from-source cvc5 compile (~22m) is off the
    # per-PR path: it only recurs on a cvc5-sys version bump before
    # build-cvc5.yml republishes the asset (see docs/smt_build_setup.md for the
    # bump runbook). 25m covers a warm link plus a fully cold Rust workspace
    # recompile (e.g. after a stable-toolchain bump) with margin, and fails
    # fast instead of silently absorbing a stray from-source cvc5 build.
    timeout-minutes: 25
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # cvc5 builds from source into target/ on top of the workspace build —
    # the heaviest disk consumer of any Linux job — so it gets both the
    # free-disk reclaim and the debuginfo strip (chelis#392). It was the
    # only Linux build job missing the free-disk step.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo + cvc5 build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        # apt-get under retry (scripts/ci_apt_get.py) so a transient
        # mirror reset does not flake the cvc5 smoke job. This fast lane
        # does not install Z3, Gappa, or Arb-only tools; those live in
        # the non-required full prove workflow.
        run: python3 scripts/ci_apt_get.py gcc g++ cmake libclang-dev libgmp-dev libmpfr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      # cvc5 (cvc5-sys) builds from source via CMake+make (~22m cold). To keep
      # that off the per-PR path we LINK a prebuilt cvc5, tried in two layers
      # (see docs/smt_build_setup.md and scripts/ci_cvc5_cache.py):
      #   1. DURABLE (primary): a GitHub Release asset published by
      #      build-cvc5.yml, keyed on the cvc5-sys version + namespace (NOT
      #      Cargo.lock, NOT rustc). A Release asset has no 10GB LRU budget, no
      #      7-day TTL, and no branch scope, so a stable-toolchain bump or a
      #      quiet stretch no longer forces a cold rebuild. `fetch`
      #      sha256-verifies and extracts it; on ANY miss it exits 0 with
      #      warm=false.
      #   2. FALLBACK (secondary): the stable-key Actions cache, restored only
      #      when the durable fetch missed (the cvc5-sys-bump window before
      #      build-cvc5.yml republishes). Best-effort; a hiccup degrades to
      #      from-source, never fails the job.
      # `activate` exports CVC5_DIR only when the store is complete (verified by
      # ci_cvc5_cache.py's sentinel); otherwise the normal from-source path
      # runs. (A PR branch DOES inherit main's caches/assets; only a PR's own
      # cache SAVE is branch-scoped.)
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-x86_64

      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-x86_64 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # cvc5 builds from source into target/; share the former
          # smt-build cache namespace with the optional full-prove lane
          # while keeping the gate jobs lean.
          shared-key: smt-smt-build
          # Persist a warm workspace cache even if a later step fails, so a
          # slow cold run is not re-paid on the next attempt (chelis#583).
          cache-on-failure: true

      - name: Build smt feature
        run: cargo build -p chelis-cli --features smt

      # Cold runs only (no CVC5_DIR active): copy the freshly built cvc5
      # artifacts into the stable-key cache dir so the next Cargo.lock churn
      # links them instead of rebuilding. `complete=true` is emitted only
      # after a fully-verified harvest; the save step below is gated on it,
      # so a partial/failed build never poisons the stable-key cache.
      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/debug/chelis

      - name: Run cvc5 engine smoke tests
        run: cargo test -p chelis-prove --features smt --lib cvc5_engine_

  # chelis#422 (WS-4) PROVE-IN-CI lanes. release.yml ships
  # `chelis-cli --features smt` on three targets; cvc5 builds from
  # source (cmake/g++/libgmp) and is only PROVEN on ubuntu-latest by the
  # smt-build job above. These two lanes prove cvc5 also builds on the
  # other two release targets BEFORE release.yml relies on the feature
  # there: the glibc-2.31 (debian:11) compat toolchain and macOS-arm64.
  # Each mirrors its release.yml job's build command exactly
  # (`cargo build --release -p chelis-cli --features smt`) and runs the
  # post-build verifier (.github/scripts/verify_release_smt.py) to
  # confirm the binary actually discharges through cvc5, not the
  # solver-free fuzz fallback. No uv setup: `cargo build -p chelis-cli`
  # is pyo3-free on both the default and smt feature graphs (asserted by
  # scripts/test_release_workflow_pyo3_isolation.py), unlike the
  # `cargo test -p chelis-prove` step in the Linux smt-build job.
  smt-build-glibc231:
    name: SMT Feature Build (Linux, glibc 2.31)
    runs-on: ubuntu-latest
    container: debian:11
    defaults:
      run:
        shell: bash
    steps:
      # python3-pip provides `tomli` (cvc5's build-time TOML codegen
      # needs it on Python < 3.11; debian:11 ships Python 3.9, and
      # python3-tomli is not in the main bullseye suite, only backports).
      # python3-venv provides the `venv` module cvc5's cmake create_venv
      # step uses for its codegen venv (debian:11's slim image omits it,
      # so create_venv fails configure.sh otherwise). m4 is required by
      # GMP's configure: cvc5's --auto-download builds its own static GMP
      # from source, and GMP's ./configure aborts with "No usable m4 in
      # $PATH" without it (debian:11's slim image omits m4; ubuntu-latest
      # and the macOS image both ship it). cmake/g++/libclang for the
      # cvc5 source build; libgmp/libmpfr-dev are not strictly needed for
      # the smt-only feature (cvc5 builds its own static GMP) but match
      # the Linux smt-build recipe. git is needed because cvc5-sys clones
      # the cvc5 source at build time.
      # Bootstrap the few packages needed BEFORE the in-repo retry helper can
      # run, on the slim debian:11 image: git + ca-certificates + curl for
      # `actions/checkout@v6`, and python3 to run scripts/ci_apt_get.py itself
      # (debian:11-slim ships no python3, and the helper installs python3 among
      # the heavy set -- so python3 must exist first; chicken-and-egg). This
      # split lets the heavy prereq install (the one that actually flakes on a
      # mirror reset) go through the retry helper, which lives in the repo and
      # cannot be invoked until checkout. Kept inline and minimal; a reset on
      # these four tiny packages is far rarer than on the full cvc5 set.
      - name: Bootstrap checkout prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3

      - name: Checkout
        uses: actions/checkout@v6

      # apt-get under retry: debian:11's mirrors intermittently reset the
      # connection mid-download (`deb.debian.org ... Connection reset by
      # peer`), flaking this job with no code change. ci_apt_get.py retries
      # the update+install pair on a transient failure; a genuine packaging
      # error still fails after the attempts are exhausted. --no-sudo: the
      # container already runs as root and has no sudo. See scripts/ci_apt_get.py.
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          python3 scripts/ci_apt_get.py --no-sudo --no-install-recommends \
            build-essential m4 \
            cmake libclang-dev libopenblas-dev libgmp-dev libmpfr-dev \
            python3 python3-pip python3-venv
          pip3 install --break-system-packages tomli || pip3 install tomli

      - name: Assert glibc 2.31 build environment
        run: |
          set -euo pipefail
          ldd --version | awk 'NR==1'
          ldd --version | awk 'NR==1' | grep -F '2.31'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # chelis#583: dedicated stable-key cvc5 cache, in its OWN
      # `linux-glibc231` namespace so the debian:11 (glibc 2.31) toolchain's
      # libcvc5.a is never crossed with the ubuntu-latest one. On a warm hit
      # cvc5-sys links the prebuilt lib (built in this same container, so the
      # glibc-2.31 assertion below stays valid) instead of rebuilding from
      # source after an unrelated Cargo.lock bump. See the smt-build job.
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace linux-glibc231

      # Durable Release asset first, Actions cache fallback second; see the
      # smt-build job for the full rationale. The asset is built in this same
      # debian:11 (glibc 2.31) container by build-cvc5.yml, so the glibc-2.31
      # assertion below stays valid on the linked artifact.
      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace linux-glibc231 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: smt-glibc231
          cache-on-failure: true

      - name: Build chelis-cli (release, smt)
        run: cargo build --release -p chelis-cli --features smt

      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Assert no glibc requirement above 2.31
        run: |
          set -euo pipefail
          max_req="$(objdump -T target/release/chelis | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "max glibc requirement: ${max_req}"
          test "$(printf 'GLIBC_2.31\n%s\n' "${max_req}" | sort -V | tail -1)" = "GLIBC_2.31"

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

  smt-build-darwin-arm64:
    name: SMT Feature Build (darwin-arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      # CMake, Python (3.11+, so cvc5's TOML codegen uses stdlib
      # tomllib), and libclang ship in the macos-latest image and Xcode
      # CLT; cvc5 auto-downloads and builds its own static GMP, so no
      # brew installs are required for the cvc5 source build. `cmake` is
      # installed defensively in case a future image drops it from PATH.
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ROBUSTNESS NOTE (darwin SMT warm-cache masks cold build): Swatinem's
      # cache restores a previously-built cvc5 from target/, AND the
      # chelis#583 cvc5 cache below restores a prebuilt libcvc5.a, so on a
      # warm cache this job can pass WITHOUT ever re-running the cold cvc5
      # source build (cmake configure + the C++ compile). A break that only
      # manifests on a cold compile -- a cvc5/cvc5-sys bump, a new flag, a
      # toolchain change on the macos-latest image -- would then stay green
      # here until a cache-key change or a cache eviction forces the cold
      # path. The release.yml darwin job uses a DIFFERENT cache key (no `key:`
      # override) and no cvc5 cache, so it does not share either cache and is
      # the authoritative cold-build proof for the SHIPPED artifact; treat a
      # release-job cvc5 failure as real even when this per-PR lane is green.
      # If a cvc5/toolchain bump is in the diff, force a cold build by bumping
      # this `key:` (e.g. `smt-darwin-arm64-v2`) AND the cvc5 CACHE_SCHEMA in
      # the same PR so both cold paths are proven before release relies on it.
      #
      # chelis#583: dedicated stable-key cvc5 cache in the `darwin-arm64`
      # namespace, decoupled from Cargo.lock churn (the Swatinem cache keys on
      # Cargo.lock, so an unrelated bump would otherwise re-pay the ~30m cvc5
      # build). On a warm hit cvc5-sys links the prebuilt lib. See smt-build.
      - name: Compute cvc5 cache key
        id: cvc5key
        run: python3 scripts/ci_cvc5_cache.py key --namespace darwin-arm64

      # Durable Release asset first, Actions cache fallback second; see the
      # smt-build job for the full rationale.
      - name: Fetch durable prebuilt cvc5 (Release asset)
        id: cvc5fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_cvc5_cache.py fetch --namespace darwin-arm64 --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Restore prebuilt cvc5 (Actions cache fallback)
        id: cvc5restore
        if: steps.cvc5fetch.outputs.warm != 'true'
        uses: actions/cache/restore@v4
        # Best-effort: a cache-service hiccup must degrade to a from-source
        # build, never fail this job (chelis#583).
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Activate prebuilt cvc5 (link instead of rebuild)
        run: python3 scripts/ci_cvc5_cache.py activate --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: smt-darwin-arm64
          cache-on-failure: true

      - name: Build chelis-cli (release, smt)
        run: cargo build --release -p chelis-cli --features smt

      - name: Harvest cvc5 build for cache
        id: cvc5harvest
        run: python3 scripts/ci_cvc5_cache.py harvest --dir "${{ steps.cvc5key.outputs.dir }}"

      - name: Save prebuilt cvc5
        if: always() && steps.cvc5harvest.outputs.complete == 'true'
        uses: actions/cache/save@v4
        # Best-effort: saving the cvc5 cache must never fail the build.
        continue-on-error: true
        with:
          path: ${{ steps.cvc5key.outputs.dir }}
          key: ${{ steps.cvc5key.outputs.key }}

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/release/chelis | grep -E 'arm64|aarch64'

      - name: Verify cvc5 discharge path (smt feature live)
        run: python3 .github/scripts/verify_release_smt.py ./target/release/chelis

  workspace-tests:
    name: Workspace Tests (Linux)
    runs-on: ubuntu-latest
    # Skip on docs-only PRs (chelis#419). A skipped required job reports
    # success, so branch protection stays satisfied; on push docs_only is
    # always false. `needs: [changes]` is what makes the output readable.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # Strip debuginfo; see lint-and-unit for the chelis#392 rationale.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      # apt-get under retry (scripts/ci_apt_get.py); see the lint-and-unit
      # job for the transient-mirror-reset rationale.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # See lint-and-unit job for why this runs before the cargo cache
      # and why the version is pinned to v8.1.0 rather than @v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The workspace has ~200 integration test binaries. `cargo test
      # --workspace --tests` runs them one binary at a time, serializing
      # the heavyweight binaries (each test compiles/checks/builds
      # chelis-std). `cargo nextest` schedules tests from all binaries in
      # a single global thread pool, overlapping the heavyweight work.
      # See docs/investigations/ci_integration_test_runtime_diagnosis.md.
      #
      # The integration gate subset (`cargo nextest run --workspace`)
      # is defined once in scripts/gate.py and run here via `gate.py
      # integration`. The `ci` nextest profile writes per-test JUnit
      # timing XML to target/nextest/ci/junit.xml; the test-timing
      # budget step below consumes it. Do not hand-inline cargo
      # commands into this job (see scripts/test_gate.py parity lock).
      - name: Gate (integration subset)
        run: python3 scripts/gate.py integration

      # This structural oracle needs cargo-nextest, which the script-unit job
      # intentionally does not install. Run it here after the workspace build
      # is warm so its three `nextest list` calls are continuously enforced.
      - name: Verify nextest profile coverage
        run: .venv/bin/python -m unittest scripts.test_nextest_profile_partition.ProfilePartitionTests

      # Informational, non-failing: flags integration tests that have
      # regressed past their committed timing baseline or that are new
      # and over the absolute ceiling. The baseline
      # (scripts/test_timing_baseline.json) is hand-curated and
      # explicitly regenerated, never auto-updated on merge. Promotable
      # to a blocking step later. See
      # docs/investigations/test_toolchain_guards_design.md.
      - name: Test-timing budget (informational)
        if: always()
        continue-on-error: true
        run: python3 scripts/test_timing_check.py --junit target/nextest/ci/junit.xml

  # Run the inherited Phase 0-3 acceptance contract beside the workspace
  # nextest suite. On the measured #1118 run these steps took 7m22s after a
  # 14m56s workspace gate; making them independent removes that serial tail.
  dtype-phase3-oracle:
    name: Dtype Phase 0-3 Oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Install dtype-oracle Python dependency
        run: uv pip install --python .venv/bin/python 'numpy>=2.0'

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Both parallel jobs restore the same cache; only workspace-tests
          # saves it, avoiding a second multi-GB entry in the 10 GB cache pool.
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Dtype Phase 0-3 oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/dtype_phase3_oracle.py

  # Keep the existing required status context while making both expensive
  # legs parallel. `!cancelled()` lets this job inspect dependency failures
  # while still suppressing work after cancellation.
  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, workspace-tests, dtype-phase3-oracle]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Require both integration legs
        run: python3 scripts/ci_require_success.py workspace-tests=${{ needs.workspace-tests.result }} dtype-phase3-oracle=${{ needs.dtype-phase3-oracle.result }}

  # NOTE: the LOC report moved to its own weekly workflow
  # (.github/workflows/loc-report.yml) so it no longer commits a bot
  # commit to main on every merge. See WS-7 / spend-trim.

  macos-smoke:
    name: macOS Smoke
    runs-on: macos-latest
    timeout-minutes: 20
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. macOS Smoke is the authoritative workspace oracle, so it
    # runs on every code PR and every push; only a pure-prose PR skips it.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # See lint-and-unit job for why this runs before the cargo cache
      # and why the version is pinned to v8.1.0 rather than @v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      # Run the real workspace test suite on macOS so macOS-only failures
      # (e.g., test harnesses that miss `-framework Accelerate` on linking
      # generated C, or Metal codegen-structure regressions) actually turn
      # this job red. Before this step existed, macOS-only breakage was
      # silently invisible to CI because the job only built and ran a
      # narrow Accelerate smoke shell script. `cargo nextest run
      # --workspace` builds everything it needs as part of test
      # compilation, so a separate `cargo build --workspace` step
      # beforehand is redundant under Swatinem's rust-cache. nextest's
      # cross-binary parallelism keeps this job off the same ~200-binary
      # serialization bloat as the Linux integration job; see
      # docs/investigations/ci_integration_test_runtime_diagnosis.md.
      - name: Workspace tests
        run: cargo nextest run --workspace

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/debug/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test generated C with Accelerate
        run: python3 .github/scripts/smoke_macos_accelerate.py ./target/debug/chelis

      # Phase M smoke: emit `.mm` from the Metal backend and link it
      # against the Metal/Foundation frameworks. Compile-and-link only
      # — no kernel dispatch — because MTLCreateSystemDefaultDevice may
      # return null on macos-latest CI VMs. Real GPU correctness lives
      # in the M6 manual gate (`cargo test -p chelis-backend-metal
      # --test gpu_correctness -- --ignored`) on a real workstation.
      - name: Smoke test Metal backend codegen + link
        run: python3 .github/scripts/smoke_macos_metal.py ./target/debug/chelis

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ubuntu-latest
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      CHELIS_C_TEST_EXTRA_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Strip debuginfo; see lint-and-unit for the chelis#392 rationale.
      # ASan/UBSan still report file:line from the C side; the Rust
      # debuginfo dropped here does not affect the sanitizer findings.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      # apt-get under retry (scripts/ci_apt_get.py); see the lint-and-unit
      # job for the transient-mirror-reset rationale.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # No uv setup here — `cargo test -p chelis-backend-c` does not
      # transitively pull pyo3 (verified by `cargo tree -p chelis-backend-c`),
      # so pyo3-build-config never runs in this job.
      - name: Backend tests under ASan/UBSan
        run: cargo test -p chelis-backend-c

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    steps:
      # Shallow the clone to the PR's commit range instead of the whole
      # repo history (chelis#421). GitHub Actions expressions have no
      # arithmetic, so the depth-1 checkout is deepened to the PR commit
      # count + 1 in bash below (the `+1` reaches the base tip's parent so
      # `base..head` resolves). A backstop fetch guarantees `base.sha` is
      # present even if the count is stale (a force-push between the event
      # and the run). On push, depth 2 covers `HEAD~1..HEAD`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check commits for AI authorship markers
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            # Deepen head to the PR commit range, then backstop-fetch the
            # base commit so `base..head` resolves at the shallow boundary
            # (both no-ops if already present).
            git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
            git fetch --depth=1 origin "$BASE" 2>/dev/null || true
            RANGE="$BASE..$HEAD"
          else
            git fetch --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
            RANGE="HEAD~1..HEAD"
          fi
          FOUND=0
          # Patterns covering Claude, Kiro, OpenAI, Codex, ChatGPT, Copilot, generic AI
          AI_MSG_PATTERNS=(
            '(Co-)?Authored-By:.*(claude|anthropic|kiro|openai|codex|chatgpt|copilot)'
            'Generated (with|by).*(claude|kiro|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)'
          )
          AI_IDENTITY_PATTERNS=(
            '(claude|anthropic|kiro|openai|codex|chatgpt|copilot)'
          )
          for SHA in $(git rev-list "$RANGE"); do
            MSG="$(git log -1 --format="%B" "$SHA")"
            AUTHOR="$(git log -1 --format="%an <%ae>" "$SHA")"
            COMMITTER="$(git log -1 --format="%cn <%ce>" "$SHA")"
            for pat in "${AI_MSG_PATTERNS[@]}"; do
              if printf '%s\n' "$MSG" | grep -qiE "$pat"; then
                echo "FAIL: $SHA commit message matches: $pat"
                FOUND=1
              fi
            done
            for pat in "${AI_IDENTITY_PATTERNS[@]}"; do
              if printf '%s\n' "$AUTHOR" | grep -qiE "$pat"; then
                echo "FAIL: $SHA author matches: $AUTHOR"
                FOUND=1
              fi
              if printf '%s\n' "$COMMITTER" | grep -qiE "$pat"; then
                echo "FAIL: $SHA committer matches: $COMMITTER"
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Remove AI authorship markers from the flagged commits."
            exit 1
          fi
          echo "All commits clean."

  docs:
    name: Docs
    runs-on: ubuntu-latest
    # Strip debuginfo; see lint-and-unit for the chelis#392 rationale.
    # This job compiles the chelis-e2e skill-suite test binary.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # .github/actions/free-disk-space (scripts/ci_free_disk.py).
      - name: Free disk space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # No uv setup here — `cargo test -p chelis-e2e` does not transitively
      # pull pyo3 (verified by `cargo tree -p chelis-e2e`), so
      # pyo3-build-config never runs in this job.
      - name: Validate package SKILL and mdBook examples
        run: cargo test -p chelis-e2e --test skill_suite

      - name: Build mdBook
        run: mdbook build docs/book
