name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-unit:
    name: Lint and Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --workspace --lib

  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Integration tests
        run: cargo test --workspace --tests

  loc-report:
    name: LOC Report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate LOC report
        run: cd py && uv run loc-report

      - name: Commit LOC report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/loc_report.md
          if git diff --cached --quiet; then
            echo "LOC report unchanged"
            exit 0
          fi
          git commit -m "Update LOC report"
          git push || echo "LOC report push skipped: token lacks write access"

  macos-smoke:
    name: macOS Smoke
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/debug/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test generated C with Accelerate
        run: bash .github/scripts/smoke_macos_accelerate.sh ./target/debug/chelis

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ubuntu-latest
    env:
      CHELIS_C_TEST_EXTRA_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Backend tests under ASan/UBSan
        run: cargo test -p chelis-backend-c

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits for AI authorship markers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="$BASE..$HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          FOUND=0
          # Patterns covering Claude, OpenAI, Codex, ChatGPT, Copilot, generic AI
          AI_MSG_PATTERNS=(
            '(Co-)?Authored-By:.*(claude|anthropic|openai|codex|chatgpt|copilot)'
            'Generated (with|by).*(claude|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)'
          )
          AI_IDENTITY_PATTERNS=(
            '(claude|anthropic|openai|codex|chatgpt|copilot)'
          )
          for SHA in $(git rev-list "$RANGE"); do
            MSG="$(git log -1 --format="%B" "$SHA")"
            AUTHOR="$(git log -1 --format="%an <%ae>" "$SHA")"
            COMMITTER="$(git log -1 --format="%cn <%ce>" "$SHA")"
            for pat in "${AI_MSG_PATTERNS[@]}"; do
              if printf '%s\n' "$MSG" | grep -qiE "$pat"; then
                echo "FAIL: $SHA commit message matches: $pat"
                FOUND=1
              fi
            done
            for pat in "${AI_IDENTITY_PATTERNS[@]}"; do
              if printf '%s\n' "$AUTHOR" | grep -qiE "$pat"; then
                echo "FAIL: $SHA author matches: $AUTHOR"
                FOUND=1
              fi
              if printf '%s\n' "$COMMITTER" | grep -qiE "$pat"; then
                echo "FAIL: $SHA committer matches: $COMMITTER"
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Remove AI authorship markers from the flagged commits."
            exit 1
          fi
          echo "All commits clean."

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Validate package SKILL and mdBook examples
        run: cargo test -p chelis-e2e --test skill_suite

      - name: Build mdBook
        run: mdbook build docs/book
