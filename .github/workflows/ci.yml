name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect docs-only pull requests so the heavy jobs (Integration,
  # SMT Feature Build, Backend Sanitizers, Hull Conformance Gate)
  # can skip them via a job-level `if` (chelis#419). This MUST be a job
  # output consumed by each heavy job's `if`, never a workflow-level
  # `paths-ignore`: a required check filtered out by `paths-ignore` never
  # reports its status context, so branch protection waits on it forever
  # and the PR can never merge; a required check whose JOB is skipped by
  # an `if` reports its context as success, satisfying branch protection.
  #
  # This job itself is intentionally NOT a required status check, is
  # cheap (no toolchain, no build), and runs on every event. On push (no
  # pull_request context) it emits docs_only=false so push-to-main always
  # runs the full suite, per the WS-7 spend-trim scope.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      rejection_authority_changed: ${{ steps.detect.outputs.rejection_authority_changed }}
      diagnostic_kind_changed: ${{ steps.detect.outputs.diagnostic_kind_changed }}
    steps:
      # Shallow checkout (depth 1) on every event: the local
      # detect-docs-only action needs the repo on disk. The action
      # deepens to the PR commit range itself; on push it
      # short-circuits to docs_only=false without touching history.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Compute docs_only
        id: detect
        uses: ./.github/actions/detect-docs-only

  # [05-UNS-5] issue authority is admitted through a checked-in membership
  # manifest, so edits to that admission path require a live exists/kind/state
  # check before merge. The offline generator and Rust constructors establish
  # shape and membership; this job prevents a same-PR manifest edit from
  # blessing a closed issue, pull request, or missing object (chelis#730 §C2.1).
  rejection-authority-liveness:
    name: Rejection Authority Liveness
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.rejection_authority_changed != 'false') }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before materializing the Devenv closure; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Validate rejection authority construction boundary
        run: devenv-retry --profile ci shell --no-tui -- python scripts/check_rejection_authority_boundary.py

      - name: Validate rejection issue authorities against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: devenv-retry --profile ci shell --no-tui -- python scripts/validate_rejection_issue_manifest.py

  # C2.2's producer seal depends on same-crate privacy, which an external
  # compile-fail doctest cannot distinguish from pub(crate). Run the actual
  # controlled mutations whenever any owner/oracle/control input changes.
  diagnostic-kind-oracle:
    name: Diagnostic Kind Mutation Oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.diagnostic_kind_changed != 'false') }}
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: target/diagnostic-kind-oracle
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and mutation-oracle build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/diagnostic-kind-oracle

      - name: Run C2.2 controlled mutations
        run: devenv-retry --profile ci shell --no-tui -- python scripts/diagnostic_kind_oracle.py

  lint-rust:
    name: Rust Policy (Linux)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Strip debuginfo from the dev/test build. Debuginfo is the dominant
    # disk consumer in target/; dropping it (alongside the free-disk step
    # below) is what keeps the Linux workspace build off "No space left on
    # device" / the mid-link ld bus-error (signal 7) — chelis#392. Symbols
    # only affect backtraces, never what is tested. The `ci` Devenv profile
    # owns this Linux disk policy.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Check workflow syntax
        uses: Chelis-Lang/ci/actions/actionlint@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          actionlint-version: '1.7.12'
          actionlint-sha256: sha256:8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          mode: enforce

      - name: Audit workflow security
        uses: Chelis-Lang/ci/actions/zizmor@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          zizmor-version: '1.28.0'
          mode: advisory

      # Devenv activates its Python virtual environment and sets
      # PYO3_PYTHON before each cargo invocation.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # The Rust-policy gate subset (clippy, fmt, chelis lint --check,
      # doctests, and compile guards) is defined once in scripts/gate.py and
      # run here via `gate.py lint-and-unit`. Clippy already compiles every
      # workspace target, so a preceding standalone
      # `cargo build --workspace --all-targets` is redundant. Do not
      # hand-inline cargo/chelis commands into this job:
      # scripts/test_gate.py greps this file and fails if any gate step is
      # not produced by gate.py. See
      # docs/investigations/test_toolchain_guards_design.md.
      - name: Gate (lint-and-unit subset)
        run: devenv-retry --profile ci shell --no-tui -- python scripts/gate.py lint-and-unit

  script-unit:
    name: Script and Python Unit Tests (Linux)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # A small number of workflow guards inspect Cargo metadata. They do not
      # compile the workspace, but they require the stable cargo executable.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      # cargo-nextest is intentionally absent, so the expensive structural
      # profile oracle self-skips here and runs once on workspace shard 1.
      - name: Script unit tests (scripts/test_*.py)
        run: .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Python binding ingress test dependency
        run: uv pip install --python .venv/bin/python 'numpy>=2.0'

      - name: Python binding ingress unit tests
        run: .venv/bin/python -m unittest discover -s bindings/python/tests -p 'test_*.py'

  # Preserve the required branch-protection context while the independent
  # Rust and Python policy workers execute in parallel.
  lint-and-unit:
    name: Lint and Unit Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, lint-rust, script-unit]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Require every lint and unit worker
        run: python3 scripts/ci_require_success.py lint-rust=${{ needs.lint-rust.result }} script-unit=${{ needs.script-unit.result }}

  # Non-gate job (see NON_GATE_JOBS in scripts/test_gate.py, rule-id
  # GATE-SCOPE-SMT): the required fast SMT smoke. It builds the
  # cvc5-backed `smt` feature and proves the binary can discharge a real
  # obligation through cvc5, but leaves the full solver/proof corpus to
  # smt-full-prove.yml (nightly + manual dispatch only, not on PRs). Keep the job
  # display name stable: branch protection requires this exact context.
  # Runbook: docs/smt_build_setup.md.
  smt-build:
    name: SMT Feature Build (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # The lane links the flake's pinned cvc5 tree (nix/cvc5.nix) through
    # CVC5_DIR and builds inside the Devenv shell -- the same rustc and the
    # same cvc5 the shipped Linux binary uses (openspec
    # converge-smt-lanes-on-nix-cvc5). The closure cache below is shared with
    # nix-packages.yml, so warm runs link in minutes. A cold closure (a cvc5
    # or nixpkgs pin bump) pays one ~30m Nix cvc5 build; the ceiling covers
    # that cold case plus a cold workspace recompile.
    timeout-minutes: 75
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      # cvc5 closure cache: the shared composite pair derives one key
      # from the cvc5-dir drvPath, so every lane (SMT, full-prove,
      # release, drift canary, Nix packages) shares one cached closure.
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: x86_64-linux

      # cvc5-sys links the prebuilt archives from CVC5_DIR and never runs
      # CMake, so this lane needs no apt C dependencies.
      - name: Build the Devenv cvc5 output
        run: |
          set -euo pipefail
          devenv-retry build --no-tui outputs.cvc5-dir

      # Save immediately after the closure exists, so a later build or
      # test failure does not lose the ~30m cold cvc5 build.
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: x86_64-linux
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # Keep the former smt-build cache namespace shared with the
          # optional full-prove lane.
          shared-key: smt-smt-build
          # Persist a warm workspace cache even if a later step fails, so a
          # slow cold run is not re-paid on the next attempt (chelis#583).
          cache-on-failure: true

      # `devenv-retry` retries only cachix/devenv#3064's exact invalid-store-path
      # diagnostic. Other failures stop immediately with their original status.
      - name: Build smt feature
        run: devenv-retry --profile smt shell --no-tui -- cargo build -p chelis-cli --features smt

      - name: Verify cvc5 discharge path (smt feature live)
        run: devenv-retry --profile smt shell --no-tui -- python .github/scripts/verify_release_smt.py ./target/debug/chelis

      - name: Run cvc5 engine smoke tests
        run: devenv-retry --profile smt shell --no-tui -- cargo test -p chelis-prove --features smt --lib cvc5_engine_

      # chelis#1125 PP7: `crates/chelis-cli/tests/prove_deep_obligations.rs` is
      # `#![cfg(feature = "smt")]` and had NO invocation anywhere. The gate
      # never passes `--features smt`, this job tested only `chelis-prove`, and
      # smt-full-prove.yml never names `chelis-cli`, so a merged test asserting
      # the correct proof tier for the `.dp` surface could not fail and the
      # regression it was written to catch landed green. This is the smallest
      # step that runs it, in the job that already provisions cvc5. Pinned by
      # scripts/test_gate.py's SmtCiSplitTests so it cannot silently disappear
      # again.
      - name: Run the Deep-surface obligation tier tests
        run: devenv-retry --profile smt shell --no-tui -- cargo test -p chelis-cli --features smt --test prove_deep_obligations

      # Clippy's `disallowed_types` ban on raw hash collections
      # (spec/design/hash_order_determinism.md C2.3) only sees the
      # configuration it compiles. This job already provisions cvc5, so it is
      # the cheapest place to lint the `smt` feature's code. Registered in
      # scripts/check_configuration_closure.py CLIPPY_MATRIX, which fails if
      # this command drifts from it.
      - name: Clippy over the cvc5 feature configuration
        run: devenv-retry --profile smt shell --no-tui -- cargo clippy --workspace --all-targets --features chelis-cli/smt,chelis-prove/smt,chelis-tide/smt -- -D warnings

  smt-build-darwin-arm64:
    name: SMT Feature Build (darwin-arm64)
    # Hosted macOS runners pay a cold Nix cvc5 closure, so this lane stays a
    # manual dispatch (openspec converge-smt-lanes-on-nix-cvc5). The Linux
    # smt-build job is the per-PR required SMT signal.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # Warm closure + warm cargo cache runs in minutes; a cold cvc5 closure
    # pays one ~30m Nix build. See the smt-build job for the lane design
    # (openspec converge-smt-lanes-on-nix-cvc5).
    timeout-minutes: 75
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6

      # Explicit bash: this step runs before setup-devenv installs the
      # devenv-ci launcher the job default names.
      - name: Assert Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: aarch64-darwin

      - name: Build the Devenv cvc5 output
        run: |
          set -euo pipefail
          devenv-retry build --no-tui outputs.cvc5-dir

      # Save immediately after the closure exists, so a later build or
      # test failure does not lose the ~30m cold cvc5 build.
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: aarch64-darwin
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: smt-darwin-arm64
          cache-on-failure: true

      - name: Build chelis-cli (release, smt)
        run: devenv-retry --profile smt shell --no-tui -- cargo build --release -p chelis-cli --features smt

      - name: Verify packaged binary architecture
        run: |
          set -euo pipefail
          file target/release/chelis | grep -E 'arm64|aarch64'

      - name: Verify cvc5 discharge path (smt feature live)
        run: devenv-retry --profile smt shell --no-tui -- python .github/scripts/verify_release_smt.py ./target/release/chelis

  workspace-tests-shard:
    name: Workspace Tests (Linux, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Skip on docs-only PRs (chelis#419). A skipped required job reports
    # success, so branch protection stays satisfied; on push docs_only is
    # always false. `needs: [changes]` is what makes the output readable.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # Strip debuginfo through the `ci` Devenv profile. See lint-rust
    # for the chelis#392 rationale.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Both shards restore the same warm workspace cache. Only shard 1
          # publishes a new entry, avoiding a same-key save race.
          save-if: ${{ matrix.shard == 1 }}

      # The workspace has ~200 integration test binaries. `cargo test
      # --workspace --tests` runs them one binary at a time, serializing
      # the heavyweight binaries (each test compiles/checks/builds
      # chelis-std). `cargo nextest` schedules tests from all binaries in
      # a single global thread pool, overlapping the heavyweight work.
      # See docs/investigations/ci_integration_test_runtime_diagnosis.md.
      #
      # The integration nextest command is defined once in scripts/gate.py.
      # Each worker selects one of two deterministic, disjoint hash
      # partitions. The `ci` nextest profile writes per-test JUnit
      # timing XML to target/nextest/ci/junit.xml; the aggregate job downloads
      # both artifacts and reports their combined timings. Do not hand-inline
      # cargo commands into this job (see scripts/test_gate.py parity lock).
      - name: Gate (workspace test shard)
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: devenv-retry --profile ci shell --no-tui -- python scripts/gate.py integration --tests-only --partition hash:${{ matrix.shard }}/2

      # Shard 2 already has the feature-complete workspace build warm. Run
      # each non-test integration oracle exactly once here instead of paying
      # for a third independently compiled worker.
      - name: Gate (integration support subset)
        if: matrix.shard == 2
        run: devenv-retry --profile ci shell --no-tui -- python scripts/gate.py integration --support-only

      # This structural oracle needs cargo-nextest. Execute it exactly once on
      # shard 1, balancing its hosted cost against shard 2's exact-once
      # integration support subset. It lists only the default feature
      # configuration this shard has already built; the generalization lane's
      # feature-enabled listing runs on generalization shard 1 for the same
      # reason.
      - name: Verify nextest profile coverage
        if: matrix.shard == 1
        run: devenv-retry --profile ci shell --no-tui -- python -m unittest scripts.test_nextest_profile_partition.ProfilePartitionTests

      - name: Upload workspace JUnit shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-workspace-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

  workspace-tests:
    name: Workspace Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, workspace-tests-shard]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Require every workspace test worker
        run: python3 scripts/ci_require_success.py workspace-tests-shard=${{ needs.workspace-tests-shard.result }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download workspace JUnit shard 1
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-workspace-1
          path: target/test-telemetry/input/workspace-1

      - name: Download workspace JUnit shard 2
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-workspace-2
          path: target/test-telemetry/input/workspace-2

      - name: Merge disjoint workspace timing reports
        run: >-
          uv run --managed-python --python 3.11 --no-project python
          scripts/ci_test_telemetry.py
          --shard workspace-1=target/test-telemetry/input/workspace-1/junit.xml
          --shard workspace-2=target/test-telemetry/input/workspace-2/junit.xml
          --require-disjoint
          --merged-junit target/test-telemetry/workspace-junit.xml
          --json target/test-telemetry/workspace-report.json
          --summary target/test-telemetry/workspace-summary.md
          --github-summary "${GITHUB_STEP_SUMMARY}"

      # The baseline comes from the exact two-shard hosted runner. A later
      # unchanged-code run produced scheduler-sensitive relative and absolute
      # outliers, so both stay visible without false-redding the required gate.
      # Missing, malformed, empty, or invalid telemetry remains blocking.
      - name: Validate and report test timing
        run: >-
          uv run --managed-python --python 3.11 --no-project python
          scripts/test_timing_check.py
          --junit target/test-telemetry/workspace-junit.xml
          --informational

      - name: Upload merged workspace telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-linux-workspace
          path: |
            target/test-telemetry/workspace-junit.xml
            target/test-telemetry/workspace-report.json
            target/test-telemetry/workspace-summary.md
          if-no-files-found: error
          retention-days: 14

  # Run the inherited Phase 0-3 acceptance contract beside the workspace
  # nextest suite. On the measured #1118 run these steps took 7m22s after a
  # 14m56s workspace gate; making them independent removes that serial tail.
  dtype-phase3-oracle:
    name: Dtype Phase 0-3 Oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    permissions:
      contents: read
      issues: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Both parallel jobs restore the same cache; only matrix shard 1 of
          # workspace-tests-shard saves it, avoiding a second multi-GB entry.
          save-if: false

      # The wire and bindings census binaries both invoke nested cargo rustdoc
      # in this shared ~500 MB target. Restore it independently of the normal
      # workspace cache so those exact nested builds survive across runs.
      - name: Restore capacity rustdoc build
        uses: actions/cache/restore@v4
        with:
          path: target/agents/729-capacity-rustdoc
          key: ${{ runner.os }}-${{ runner.arch }}-capacity-rustdoc-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/capacity_census_typed.py', 'crates/chelis-compiler-api/**', 'crates/chelis-python/**') }}

      - name: Dtype Phase 0-3 oracle
        env:
          GH_TOKEN: ${{ github.token }}
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: devenv-retry --profile ci shell --no-tui -- python scripts/dtype_phase3_oracle.py

      - name: Validate and report test timing
        run: >-
          devenv-retry --profile ci shell --no-tui --
          python scripts/test_timing_check.py
          --junit target/nextest/ci-full/junit.xml
          --informational

      - name: Upload dtype JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-dtype
          path: target/nextest/ci-full/junit.xml
          if-no-files-found: error
          retention-days: 14

      # Pull requests only consume the last main-produced cache. One
      # successful push-to-main writer avoids duplicate multi-hundred-MB
      # entries and same-key races across the parallel consumers.
      - name: Save capacity rustdoc build
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: target/agents/729-capacity-rustdoc
          key: ${{ runner.os }}-${{ runner.arch }}-capacity-rustdoc-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/capacity_census_typed.py', 'crates/chelis-compiler-api/**', 'crates/chelis-python/**') }}

  # Keep the #732 Phase 2 acceptance contract executable as its own blocking
  # leg. This is deliberately not appended to the dtype job: each phase oracle
  # has an independently visible result and failure boundary.
  faithful-observation-phase2-oracle:
    name: Faithful Observation Phase 2 Oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Restore the workspace cache but leave the single writer in matrix
          # shard 1 of workspace-tests-shard, avoiding another multi-GB entry.
          save-if: false

      - name: Faithful observation Phase 2 oracle
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: devenv-retry --profile ci shell --no-tui -- python scripts/faithful_observation_phase2_oracle.py

  # Freeze chelis#1286's complete initial ownership fixture universe and its
  # typed expected-failure receipts before production ownership changes begin.
  # This phase is hardware-independent; the HIP hardware row becomes mandatory
  # in Phase 3.
  compiled-value-ownership-phase0-oracle:
    name: Compiled Value Ownership Phase 2 Oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Restore the workspace cache while leaving shard 1 of the workspace
          # suite as the single writer for this namespace.
          save-if: false

      - name: Compiled value ownership Phase 2 oracle
        run: .venv/bin/python scripts/compiled_value_ownership_oracle.py --phase 2

      - name: Compiled value ownership launch subset
        run: .venv/bin/python scripts/compiled_value_ownership_oracle.py --phase launch

  # chelis#893 Phase 0's authoritative oracle is the `runtime-representation`
  # gate stage. It runs release-profile reproducers whose artifacts are never
  # in the shared cache plus 37 serial controlled mutations, about eleven
  # hosted minutes: measured on push run 33653771041 it took workspace shard
  # 2's support step from 2.1 to 13.0 minutes and the shard from 14.4 to 25.9.
  # Like the other phase oracles it therefore gets its own runner and its own
  # failure boundary, aggregated under the required Integration Tests (Linux)
  # context. `clang` is the oracle's C/Objective-C front end.
  runtime-representation-phase0-oracle:
    name: Runtime Representation Phase 0 Oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc clang libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          # Restore the workspace cache; matrix shard 1 of workspace-tests-shard
          # remains the single writer for this namespace.
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The stage is defined once in scripts/gate.py; scripts/test_gate.py
      # pins this job's run commands like the other gate-owned workers.
      - name: Gate (runtime representation stage)
        run: python3 scripts/gate.py runtime-representation

  # chelis#1207's authoritative parity corpus compares every production
  # level-based generalization with the retained reference sweep and bypasses
  # nextest's default filter so no discovered non-ignored test is omitted.
  # Split the one corpus over four deterministic hash partitions: each shard
  # still compiles the exact feature-enabled workspace, while the expensive
  # test execution runs on four hosted runners in parallel. The aggregate job
  # below retains a stable oracle status and fails closed unless all four
  # disjoint partitions succeed; the directly required Integration Tests (Linux)
  # context transitively gates that aggregate.
  generalize-sweep-oracle-shard:
    name: Typecheck Level Generalization Oracle (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    permissions:
      contents: read
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          save-if: false

      - name: Restore capacity rustdoc build
        uses: actions/cache/restore@v4
        with:
          path: target/agents/729-capacity-rustdoc
          key: ${{ runner.os }}-${{ runner.arch }}-capacity-rustdoc-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/capacity_census_typed.py', 'crates/chelis-compiler-api/**', 'crates/chelis-python/**') }}

      - name: Typecheck level generalization oracle
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: devenv-retry --profile ci shell --no-tui -- cargo nextest run --workspace --profile ci-full --ignore-default-filter --features chelis-types/generalize-sweep-oracle --no-fail-fast -E 'not (binary_id(/^chelis-cli::stdlib_typecheck_cache_concurrency$/) | (binary_id(/^chelis-cli::issue_1293_redteam_round4$/) & test(/^recursive_list_tuple_and_adt_cotangents_match_in_eval_and_c$/)))' --partition hash:${{ matrix.shard }}/4

      # The generalization-lane selection census lists this exact feature
      # configuration, which is warm only here. On workspace shard 1 the same
      # listing recompiled the workspace under a second feature set and cost
      # 4.4 minutes per run; here it is one `cargo nextest list` on the build
      # the oracle step just produced. Shard 1 runs it once.
      - name: Verify generalization lane selection
        if: matrix.shard == 1
        run: devenv-retry --profile ci shell --no-tui -- python -m unittest scripts.test_nextest_profile_partition.GeneralizationPartitionTests

      - name: Validate and report test timing
        run: >-
          devenv-retry --profile ci shell --no-tui --
          python scripts/test_timing_check.py
          --junit target/nextest/ci-full/junit.xml
          --informational

      - name: Upload generalization JUnit shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-generalization-${{ matrix.shard }}
          path: target/nextest/ci-full/junit.xml
          if-no-files-found: error
          retention-days: 14

  generalize-sweep-oracle:
    name: Typecheck Level Generalization Oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, generalize-sweep-oracle-shard]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Require every generalization-oracle shard
        run: python3 scripts/ci_require_success.py generalize-sweep-oracle-shard=${{ needs.generalize-sweep-oracle-shard.result }}

  # Keep the existing required status context while making the expensive
  # legs parallel. `always()` makes the stable required context inspect every
  # dependency result, including cancellation, instead of being skipped green.
  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, workspace-tests, dtype-phase3-oracle, faithful-observation-phase2-oracle, compiled-value-ownership-phase0-oracle, runtime-representation-phase0-oracle, generalize-sweep-oracle]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Require all integration legs
        run: python3 scripts/ci_require_success.py workspace-tests=${{ needs.workspace-tests.result }} dtype-phase3-oracle=${{ needs.dtype-phase3-oracle.result }} faithful-observation-phase2-oracle=${{ needs.faithful-observation-phase2-oracle.result }} compiled-value-ownership-phase0-oracle=${{ needs.compiled-value-ownership-phase0-oracle.result }} runtime-representation-phase0-oracle=${{ needs.runtime-representation-phase0-oracle.result }} generalize-sweep-oracle=${{ needs.generalize-sweep-oracle.result }}

  # NOTE: the LOC report moved to its own weekly workflow
  # (.github/workflows/loc-report.yml) so it no longer commits a bot
  # commit to main on every merge. See WS-7 / spend-trim.

  macos-workspace-shard:
    name: macOS Workspace (shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    # Successful runs normally finish in 14-16 minutes, but hosted-runner
    # variance can push the workspace suite past the old 20-minute job cap.
    # Keep a hard ceiling while leaving measured headroom for the post-test
    # architecture, manifested-C-ABI, and Metal smoke checks.
    timeout-minutes: 30
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. macOS Smoke is the authoritative workspace oracle, so it
    # runs on every code PR and every push; only a pure-prose PR skips it.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # Every other cargo *test* job in this workflow drops debuginfo; this
    # one was the only omission, and it is the workflow's critical path
    # (the `Workspace tests` step alone is longer than any whole job).
    # macOS pays for debuginfo twice: rustc emits it, then the linker
    # walks the debug map for every test binary the workspace produces.
    # Nothing here reads debuginfo -- the job asserts binary architecture
    # and runs two codegen smoke scripts -- so the only visible cost is
    # unsymbolicated frames in a `RUST_BACKTRACE` dump on failure, which
    # is exactly the tradeoff the Linux jobs already accept. The release
    # SMT jobs use the separate `smt` profile, which extends this CI policy.
    steps:
      - uses: actions/checkout@v6

      # The macOS workspace shards stay on the hosted toolchain rather than
      # Devenv: this workflow's Devenv conversion covers the portable Linux
      # jobs, and these shards are the authoritative workspace oracle.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # See lint-rust for why this runs before the cargo cache
      # and why the version is pinned to v8.1.0 rather than @v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-workspace
          save-if: ${{ matrix.shard == 1 }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Assert Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      # Run the real workspace test suite on macOS so macOS-only failures
      # (e.g., test harnesses that miss `-framework Accelerate` on linking
      # generated C, or Metal codegen-structure regressions) actually turn
      # this job red. Before this step existed, macOS-only breakage was
      # silently invisible to CI because the job only built and ran a
      # narrow Accelerate smoke shell script. `cargo nextest run
      # --workspace` builds everything it needs as part of test
      # compilation, so a separate `cargo build --workspace` step
      # beforehand is redundant under Swatinem's rust-cache. nextest's
      # cross-binary parallelism keeps this job off the same ~200-binary
      # serialization bloat as the Linux workspace workers; see
      # docs/investigations/ci_integration_test_runtime_diagnosis.md.
      - name: Workspace tests
        env:
          CHELIS_TEST_SHARED_REEF_HOME: ${{ runner.temp }}/chelis-test-shared-reef
        run: cargo nextest run --workspace --profile ci-full --partition hash:${{ matrix.shard }}/2

      - name: Upload macOS workspace JUnit shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-macos-workspace-${{ matrix.shard }}
          path: target/nextest/ci-full/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Verify packaged binary architecture
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          file target/debug/chelis | grep -E 'arm64|aarch64'

      - name: Smoke test manifested C callable ABI
        if: matrix.shard == 2
        run: python3 .github/scripts/smoke_macos_manifested_callable.py ./target/debug/chelis

      # Phase M smoke: emit `.mm` from the Metal backend and link it
      # against the Metal/Foundation frameworks. Compile-and-link only
      # — no kernel dispatch — because MTLCreateSystemDefaultDevice may
      # return null on macos-latest CI VMs. Real GPU correctness lives
      # in the M6 manual gate (`cargo test -p chelis-backend-metal
      # --test gpu_correctness -- --ignored`) on a real workstation.
      - name: Smoke test Metal backend codegen + link
        if: matrix.shard == 2
        run: python3 .github/scripts/smoke_macos_metal.py ./target/debug/chelis

      - name: Validate and report test timing
        run: >-
          .venv/bin/python scripts/test_timing_check.py
          --junit target/nextest/ci-full/junit.xml
          --informational

  # Keep the exact branch-protection context stable and fail closed if either
  # disjoint full-workspace partition fails.
  macos-smoke:
    name: macOS Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, macos-workspace-shard]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v6

      - name: Require every macOS workspace shard
        run: python3 scripts/ci_require_success.py macos-workspace-shard=${{ needs.macos-workspace-shard.result }}

  # Preserve every partition's nextest timing as a durable artifact and one
  # cross-platform report. Overlap between semantic lanes is intentional and
  # remains visible; the workspace aggregate separately proves its hash
  # partitions are disjoint before producing their validated timing report.
  # Dtype, generalization, and macOS producers validate and report the same
  # diagnostic thresholds before their own required aggregates.
  #
  # Every JUnit producer must have SUCCEEDED. This job downloads nine
  # named artifacts with no fallback, and a producer that did not finish
  # uploads none of its own: a hosted-runner allocation failure cancels
  # the job before its first step, and a producer that dies at its own
  # upload step leaves the artifact equally absent. Without that gate a
  # run gains a second red job whose only message is `Artifact not found
  # for name: junit-macos-workspace-1`, which reads as a repository
  # defect rather than as the producer failure the required aggregate
  # already reports. Skipping is safe here and only here: this is a
  # non-required reporting aggregate, the run is already red from the
  # producer itself, and each producer separately validates and reports
  # its own lane timing through scripts/test_timing_check.py. Required
  # aggregates keep `always()` and stay fail-closed.
  test-telemetry:
    name: CI Test Telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, workspace-tests-shard, dtype-phase3-oracle, generalize-sweep-oracle-shard, macos-workspace-shard]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') && needs.workspace-tests-shard.result == 'success' && needs.dtype-phase3-oracle.result == 'success' && needs.generalize-sweep-oracle-shard.result == 'success' && needs.macos-workspace-shard.result == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download Linux workspace JUnit shard 1
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-workspace-1
          path: target/test-telemetry/input/linux-workspace-1

      - name: Download Linux workspace JUnit shard 2
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-workspace-2
          path: target/test-telemetry/input/linux-workspace-2

      - name: Download dtype JUnit
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-dtype
          path: target/test-telemetry/input/linux-dtype

      - name: Download generalization JUnit shard 1
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-generalization-1
          path: target/test-telemetry/input/linux-generalization-1

      - name: Download generalization JUnit shard 2
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-generalization-2
          path: target/test-telemetry/input/linux-generalization-2

      - name: Download generalization JUnit shard 3
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-generalization-3
          path: target/test-telemetry/input/linux-generalization-3

      - name: Download generalization JUnit shard 4
        uses: actions/download-artifact@v7
        with:
          name: junit-linux-generalization-4
          path: target/test-telemetry/input/linux-generalization-4

      - name: Download macOS workspace JUnit shard 1
        uses: actions/download-artifact@v7
        with:
          name: junit-macos-workspace-1
          path: target/test-telemetry/input/macos-workspace-1

      - name: Download macOS workspace JUnit shard 2
        uses: actions/download-artifact@v7
        with:
          name: junit-macos-workspace-2
          path: target/test-telemetry/input/macos-workspace-2

      - name: Build cross-lane timing report
        run: >-
          uv run --managed-python --python 3.11 --no-project python
          scripts/ci_test_telemetry.py
          --shard linux-workspace-1=target/test-telemetry/input/linux-workspace-1/junit.xml
          --shard linux-workspace-2=target/test-telemetry/input/linux-workspace-2/junit.xml
          --shard linux-dtype=target/test-telemetry/input/linux-dtype/junit.xml
          --shard linux-generalization-1=target/test-telemetry/input/linux-generalization-1/junit.xml
          --shard linux-generalization-2=target/test-telemetry/input/linux-generalization-2/junit.xml
          --shard linux-generalization-3=target/test-telemetry/input/linux-generalization-3/junit.xml
          --shard linux-generalization-4=target/test-telemetry/input/linux-generalization-4/junit.xml
          --shard macos-workspace-1=target/test-telemetry/input/macos-workspace-1/junit.xml
          --shard macos-workspace-2=target/test-telemetry/input/macos-workspace-2/junit.xml
          --json target/test-telemetry/full/report.json
          --summary target/test-telemetry/full/summary.md
          --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload cross-lane timing report
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-all-lanes
          path: target/test-telemetry/full
          if-no-files-found: error
          retention-days: 14

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success. Runs on every code PR and push.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # The `sanitizers` Devenv profile owns the sanitizer flags, runtime
    # policy, and stripped Rust debuginfo.
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Backend tests under ASan/UBSan
        run: devenv-retry --profile sanitizers shell --no-tui -- cargo test -p chelis-backend-c

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      # Shallow the clone to the PR's commit range instead of the whole
      # repo history (chelis#421). GitHub Actions expressions have no
      # arithmetic, so the depth-1 checkout is deepened to the PR commit
      # count + 1 in bash below (the `+1` reaches the base tip's parent so
      # `base..head` resolves). A backstop fetch guarantees `base.sha` is
      # present even if the count is stale (a force-push between the event
      # and the run). On push, depth 2 covers `HEAD~1..HEAD`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      - name: Resolve the commit range
        id: authorship-range
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            # Deepen head to the PR commit range, then backstop-fetch the
            # base commit so `base..head` resolves at the shallow boundary.
            git fetch --depth=$((COMMITS + 1)) origin "$HEAD_SHA" 2>/dev/null || true
            git fetch --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          else
            git fetch --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
            BASE_SHA="$(git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          {
            echo "base-sha=$BASE_SHA"
            echo "head-sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check commits for AI authorship markers
        uses: Chelis-Lang/ci/actions/check-authorship@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          base-sha: ${{ steps.authorship-range.outputs.base-sha }}
          head-sha: ${{ steps.authorship-range.outputs.head-sha }}
          profile: all-markers
          max-commits: '1000'

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    # Strip debuginfo through the `ci` Devenv profile. This job compiles the
    # chelis-e2e skill-suite test binary.
    steps:
      # Full history: the Phase 4B acknowledgement gate diffs every frozen
      # contract file against `git merge-base origin/main HEAD`. The default
      # shallow checkout gives neither a usable `origin/main` nor enough
      # history behind it, and what it does give varies with the clone shape:
      # measured, `--depth 1 --no-single-branch` makes `git merge-base` exit 1
      # with no output, and `--depth 1 --branch <topic>` leaves `origin/main`
      # absent entirely. The gate fails loudly on both, so a shallow checkout
      # turns this job red rather than quiet, but the depth is what makes it
      # green for the right reason.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Validate CI topology documentation
        run: devenv-retry --profile ci shell --no-tui -- python -m unittest scripts.test_gate.CiParityTests.test_topology_docs_name_current_shard_owners

      # chelis#729 Phase 4B froze the numeric atoms and the capability schema
      # behind atom and region digests over spec/ and spec/design/, plus a
      # per-file acknowledgement gate over every frozen contract file. The
      # oracle validates documents and runs no cargo command, and a docs-only
      # pull request skips every heavy job, so this always-run job is the only
      # placement that actually defends the freeze against the edits most
      # likely to break it. This step is unconditional: on a push or a
      # workflow_dispatch it runs the atom and region digests and reports the
      # contract diff without requiring a pull request body.
      - name: Validate the chelis#729 Phase 4B freeze
        run: devenv-retry --profile ci shell --no-tui -- python scripts/dtype_phase4b_oracle.py

      # The enforcing half. On a pull request every changed frozen contract
      # file must be named by a `Frozen-contract-change:` line in the body.
      # The body is untrusted text written by the PR author, so it is passed
      # through the environment and never interpolated into a shell command.
      #
      # The base is the default `origin/main`, deliberately, not
      # `github.event.pull_request.base.sha`. The checkout is `refs/pull/N/merge`,
      # so HEAD is GitHub's test-merge commit and `git merge-base origin/main HEAD`
      # is that commit's first parent: exactly the base the merge was built on.
      # The payload SHA is only the base tip at event-creation time, so if `main`
      # advances and GitHub regenerates the merge ref before the checkout, the
      # payload SHA lags and main's changes get charged to this branch. The merge
      # base cannot lag that way, and both steps then read one baseline.
      - name: Require frozen contract acknowledgements
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: devenv-retry --profile ci shell --no-tui -- python scripts/dtype_phase4b_oracle.py --require-acknowledgement --acknowledgements-env PR_BODY

      # No project venv setup here — `cargo test -p chelis-e2e` does not
      # transitively pull pyo3 (verified by `cargo tree -p chelis-e2e`), so
      # pyo3-build-config never runs in this job. The focused documentation
      # contract above uses uv's managed no-project interpreter directly.
      - name: Validate package SKILL and mdBook examples
        run: devenv-retry --profile ci shell --no-tui -- cargo test -p chelis-e2e --test skill_suite

      - name: Build mdBook
        run: devenv-retry --profile ci shell --no-tui -- mdbook build docs/book
