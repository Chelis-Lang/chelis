name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install tokei
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo install tokei --locked

      - name: Generate LOC report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/loc_report.py

      - name: Commit LOC report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/loc_report.md
          git diff --cached --quiet || git commit -m "Update LOC report"
          git push

  backend-sanitizers:
    name: Backend Sanitizers
    runs-on: ubuntu-latest
    env:
      CHELIS_C_TEST_EXTRA_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Backend tests under ASan/UBSan
        run: cargo test -p chelis-backend-c

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits for AI authorship markers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="$BASE..$HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          FOUND=0
          # Patterns covering Claude, OpenAI, Codex, ChatGPT, Copilot, generic AI
          AI_MSG_PATTERNS=(
            '(Co-)?Authored-By:.*(claude|anthropic|openai|codex|chatgpt|copilot)'
            'Generated (with|by).*(claude|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)'
          )
          AI_IDENTITY_PATTERNS=(
            '(claude|anthropic|openai|codex|chatgpt|copilot)'
          )
          for SHA in $(git rev-list "$RANGE"); do
            MSG="$(git log -1 --format="%B" "$SHA")"
            AUTHOR="$(git log -1 --format="%an <%ae>" "$SHA")"
            COMMITTER="$(git log -1 --format="%cn <%ce>" "$SHA")"
            for pat in "${AI_MSG_PATTERNS[@]}"; do
              if printf '%s\n' "$MSG" | grep -qiE "$pat"; then
                echo "FAIL: $SHA commit message matches: $pat"
                FOUND=1
              fi
            done
            for pat in "${AI_IDENTITY_PATTERNS[@]}"; do
              if printf '%s\n' "$AUTHOR" | grep -qiE "$pat"; then
                echo "FAIL: $SHA author matches: $AUTHOR"
                FOUND=1
              fi
              if printf '%s\n' "$COMMITTER" | grep -qiE "$pat"; then
                echo "FAIL: $SHA committer matches: $COMMITTER"
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Remove AI authorship markers from the flagged commits."
            exit 1
          fi
          echo "All commits clean."
