name: Ecosystem Drift Canary

# The deliberate cross-repo drift signal. Every shell nightly pins the
# SAME fixed chelis version its own per-PR CI pins, so none of them can
# catch "a chelis change on main broke a downstream shell" — the recurring
# pain (e.g. nautilus #11, noticed ~40 days late after a release lag).
#
# This canary closes that gap: it builds the chelis toolchain from THIS
# repo's HEAD and, for each downstream shell, checks out its canary source
# (`main`, except hello-chelis's reviewed immutable commit) and runs the
# shell's own core gate (`chelis reef build` + `chelis test tests/`, or the
# cargo gate for the Rust shells) against the HEAD toolchain. A break surfaces
# within a day, at the offending chelis commit, instead of weeks later in a
# shell user's bug report.
#
# A failing shell leg files/updates a tracking issue IN THAT SHELL'S repo
# (open-on-fail / close-on-pass), mirroring the heavy-e2e.yml report
# pattern, so the signal lands where the shell maintainers see it.
#
# Modeled on conformance-nightly.yml (HEAD toolchain build + uv venv) and
# release.yml (the toolchain tarball recipe). Scheduled + manual dispatch
# ONLY; never per-PR, never on push — it is purely additive and cannot
# affect existing CI.

on:
  schedule:
    # 09:00 UTC daily. Staggered off the 07:00 heavy-e2e / conformance
    # nightlies and the 08:00 shell nightlies so the canary's HEAD build
    # does not contend with them for the org's runner pool.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Match release.yml: a stripped release binary with no debuginfo.
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  # Build the HEAD chelis toolchain and publish it as a workflow artifact
  # that is a HEAD equivalent of release.yml's linux-x86_64 tarball: the
  # `chelis` binary, the runtime staticlib + headers, AND a freshly
  # rebuilt-from-HEAD `packages/chelis-std/` so each shell can populate its
  # local Reef registry with HEAD chelis-std via `reef install
  # --from-monorepo` — exactly the path the shells' own `install_chelis_std.py`
  # uses against a release tag, but pointed at HEAD instead.
  build-chelis:
    name: Build chelis toolchain (HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout chelis (HEAD)
        uses: actions/checkout@v6

      # apt-get under retry (scripts/ci_apt_get.py): a transient apt mirror
      # reset would otherwise flake this scheduled canary with no code change.
      - name: Install C dependencies
        run: python3 scripts/ci_apt_get.py gcc libopenblas-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      # `.cargo/config.toml` sets `PYO3_PYTHON=.venv/bin/python`; any cargo
      # build that transitively pulls pyo3 needs a matching uv-managed venv
      # first (pyo3-build-config runs as a build-dep before compilation).
      # Same pattern as heavy-e2e.yml / conformance-nightly.yml.
      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build chelis-cli (release)
        run: cargo build --release -p chelis-cli --features sealed-runtime

      # Rebuild chelis-std from HEAD source with the HEAD binary so the
      # bundled package genuinely reflects HEAD (catches a chelis change
      # that breaks chelis-std's own lowering — a nautilus-#11-class bug).
      # Emits packages/chelis-std/dist/chelis-std-<ver>.{chb,tar.zst}.
      - name: Rebuild HEAD chelis-std bundle
        run: ./target/release/chelis reef build --no-auto-fetch packages/chelis-std

      - name: Record HEAD chelis version
        id: version
        run: |
          set -euo pipefail
          ver="$(./target/release/chelis --version | awk '{print $2}')"
          echo "chelis_version=${ver}" >> "$GITHUB_OUTPUT"
          echo "HEAD chelis version: ${ver}"

      # Stage a HEAD equivalent of release.yml's linux-x86_64 tarball plus
      # the freshly built packages/chelis-std/ tree (so `reef install
      # --from-monorepo <extracted>` resolves chelis-std). The monorepo
      # layout (a `packages/` dir) is what `--from-monorepo` expects.
      - name: Strip binary
        run: strip target/release/chelis

      - name: Stage toolchain tarball
        run: |
          set -euo pipefail
          staging="chelis-head-toolchain"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include" \
                   "$staging/packages/chelis-std" "$staging/scripts"
          cp target/release/chelis "$staging/bin/"
          # Ship the runtime this chelis carries (spec/08-backends.md §2.1).
          runtime_export="$(mktemp -d)"
          ./target/release/chelis runtime export "$runtime_export"
          cp "$runtime_export/libchelis_runtime.a" "$staging/lib/"
          cp "$runtime_export/chelis_runtime.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_views.h" "$staging/include/"
          cp "$runtime_export/chelis_runtime_dtype.h" "$staging/include/"
          cp "$runtime_export/chelis_blas.h" "$staging/include/"
          cp "$runtime_export/chelis_simd.h" "$staging/include/"
          cp "$runtime_export/chelis_math.h" "$staging/include/"
          python3 scripts/verify_runtime_package.py "$runtime_export" "$staging"
          # The chelis-std source + freshly built dist artifacts. reef
          # install --from-monorepo reads packages/<name>/dist/.
          cp -R packages/chelis-std/. "$staging/packages/chelis-std/"
          # The canary's own helper scripts, so the `drift` job (which
          # checks out the SHELL, not chelis) can repin + report without a
          # second chelis checkout.
          cp scripts/drift_repin_compiler.py "$staging/scripts/"
          cp scripts/drift_prepare_dependencies.py "$staging/scripts/"
          cp scripts/drift_report_issue.py "$staging/scripts/"
          cp scripts/verify_runtime_package.py "$staging/scripts/"
          tar czf chelis-head-toolchain.tar.gz "$staging"
          ls -la chelis-head-toolchain.tar.gz

      - name: Upload HEAD toolchain artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-head-toolchain
          path: chelis-head-toolchain.tar.gz
          retention-days: 7

    outputs:
      chelis_version: ${{ steps.version.outputs.chelis_version }}

  # One matrix leg per downstream shell. fail-fast:false so one shell's
  # break never cancels the others — the canary's whole job is to report
  # EACH shell independently.
  drift:
    name: ${{ matrix.repo }} (${{ matrix.type }}) vs chelis HEAD
    needs: build-chelis
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Pure-Chelis / reef shells (toolchain-binary consumers).
          # `reef_deps` entries retain a human release tag/version but end in
          # the reviewed peeled commit SHA that is the source authority. Each
          # exact commit is checked out, verified, repinned and migrated in its
          # throwaway checkout, built by HEAD with auto-fetch disabled,
          # verified as a strict current-format artifact, and installed
          # locally. chelis-std is NOT listed — it comes from the HEAD
          # toolchain. Mind the dep
          # graph: coral->nautilus, shoals->nautilus+coral, whale->shoals
          # (transitively nautilus+coral), hello-chelis->coral+nautilus+school
          # (the leaf). Each leg lists the TRANSITIVE closure so the source
          # builder can pin the entire graph exactly. The same closure is mirrored in
          # `chelis_conformance::registry::REGISTRY`'s `deps`, and
          # `registry_deps_match_drift_matrix` fails the build if the two
          # disagree — so this list and that table move together.
          #
          # `token_repos` is the newline-separated set of repos the minted
          # App token must read: the shell ITSELF (checkout) PLUS every
          # sibling source repo cloned at an exact reviewed commit. Scoping the
          # token to only `repo` would 403/404 on the dep checkout, and the
          # if:always() report step would then
          # misattribute that infra failure as language drift (a false
          # positive). Least-privilege: each token covers exactly its leg's
          # checkout + dep reads, nothing more.
          - repo: nautilus
            type: reef
            reef_deps: ""
            token_repos: nautilus
          - repo: coral
            type: reef
            reef_deps: "Chelis-Lang/nautilus@v0.7.45#563f2737c2988eaa05ca1e6ce4e941cf86c296b8"
            token_repos: |-
              coral
              nautilus
          - repo: shoals
            type: reef
            reef_deps: "Chelis-Lang/nautilus@v0.7.45#563f2737c2988eaa05ca1e6ce4e941cf86c296b8 Chelis-Lang/coral@v0.7.42#bdb92de243c2c911c0c2a2b83bff29673186476b"
            token_repos: |-
              shoals
              nautilus
              coral
          - repo: school
            type: reef
            reef_deps: ""
            token_repos: school
          - repo: hull
            type: reef
            reef_deps: ""
            token_repos: hull
          - repo: whale
            type: reef
            reef_deps: "Chelis-Lang/nautilus@v0.7.45#563f2737c2988eaa05ca1e6ce4e941cf86c296b8 Chelis-Lang/coral@v0.7.42#bdb92de243c2c911c0c2a2b83bff29673186476b Chelis-Lang/shoals@v0.24.12#502fbac05ef1c2c4fc5e8d97611b8b9c192a9707"
            token_repos: |-
              whale
              nautilus
              coral
              shoals

          # ---- Cargo shells (Rust workspaces with Cargo path deps on the
          # chelis crates). These differ from the reef shells in three ways:
          #   1. their `Cargo.toml` references chelis via `../chelis/crates/...`
          #      path deps, so the canary checks out chelis HEAD as the
          #      `../chelis` sibling (the `type: cargo` step below) and builds
          #      the shell's Rust workspace against HEAD chelis SOURCE — a
          #      tighter coupling than the binary-only reef shells, and exactly
          #      what these shells' own ci.yml `workspace-gate` does (sibling
          #      checkout at the pinned chelis ref);
          #   2. they still consume the HEAD `chelis` BINARY (on PATH) for
          #      `chelis reef build` / `chelis check` and any cargo test that
          #      subprocesses to `chelis`, plus HEAD chelis-std + source-built
          #      exact reef deps in the local registry — same as the reef legs;
          #   3. the cargo gate itself (build/test/clippy/fmt and any shell-
          #      specific fixture generation) is encoded per shell in
          #      `cargo_recipe`, mirroring each shell's ci.yml `workspace-gate`
          #      job verbatim so the canary asks the same question that shell's
          #      own per-PR CI asks, but against HEAD chelis.
          #
          # `reef_deps` and `token_repos` follow the reef-leg rules: the token
          # covers the shell checkout + every exact-commit source clone.
          #
          # c-earchin has NO chelis Cargo path dep (it is a pure toolchain-
          # binary consumer with a Rust workspace of its own), so its
          # `needs_chelis_sibling` is false: the canary skips the sibling
          # checkout + uv-venv setup for it. octant / calcify / hydronnx all
          # path-dep on `../chelis/crates/...` and need the sibling.
          - repo: octant
            type: cargo
            needs_chelis_sibling: true
            reef_deps: "Chelis-Lang/nautilus@v0.7.45#563f2737c2988eaa05ca1e6ce4e941cf86c296b8"
            token_repos: |-
              octant
              nautilus
            cargo_recipe: |
              chelis reef build --no-auto-fetch
              cargo build --workspace --all-targets
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
              cargo fmt --all -- --check
          - repo: calcify
            type: cargo
            needs_chelis_sibling: true
            reef_deps: "Chelis-Lang/nautilus@v0.7.45#563f2737c2988eaa05ca1e6ce4e941cf86c296b8 Chelis-Lang/coral@v0.7.42#bdb92de243c2c911c0c2a2b83bff29673186476b"
            token_repos: |-
              calcify
              nautilus
              coral
            cargo_recipe: |
              chelis reef build --no-auto-fetch
              cargo build --workspace --all-targets
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
              cargo fmt --all -- --check
              # calcify's example / bridge / verify jobs (Phase 9/13 oracles)
              # each subprocess to chelis; run them against HEAD too.
              cargo test --workspace --test e2e -- --include-ignored
              cargo test --workspace --test bridge -- --include-ignored
              cargo test --workspace --test verify -- --include-ignored
          - repo: c-earchin
            type: cargo
            needs_chelis_sibling: false
            reef_deps: ""
            token_repos: c-earchin
            cargo_recipe: |
              cargo build --workspace --all-targets
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
              cargo fmt --all -- --check
              # c-earchin's Chelis vocabulary + consumer smoke (its
              # workspace-gate's "Chelis vocabulary and consumer smoke" step).
              chelis check src/vocabulary.ch
              chelis check tests/integration/consumer/src/main.ch
              chelis validate --deep references/pricing_rules.dp
              chelis validate --deep references/vocabulary_miss.dp
              chelis prove references/pricing_rules.dp --spans references/pricing_rules.spans.json --json
              chelis reef build --no-auto-fetch tests/integration/consumer
              chelis reef build --no-auto-fetch .
          - repo: hydronnx
            type: cargo
            needs_chelis_sibling: true
            reef_deps: ""
            token_repos: hydronnx
            # hydronnx's cargo test depends on ONNX fixtures generated by its
            # uv-run Python scripts (gen_tabular_model.py / gen_fixtures.py /
            # parity_check.py) — mirror its workspace-gate fixture-gen +
            # cargo gate. uv is installed by the `type: cargo` setup below.
            cargo_recipe: |
              python3 scripts/run_negative_tests.py
              python3 scripts/run_blocked_probes.py
              uv run --with 'onnx>=1.16' --with 'numpy>=1.26' --with 'onnxruntime>=1.17' \
                python3 scripts/gen_tabular_model.py
              uv run --with 'onnx>=1.16' --with 'numpy>=1.26' \
                python3 scripts/gen_fixtures.py
              uv run --with 'onnx>=1.16' --with 'numpy>=1.26' --with 'onnxruntime>=1.17' \
                python3 scripts/parity_check.py
              cargo build --all-targets
              cargo test
              cargo clippy --all-targets -- -D warnings
              cargo fmt -p hydronnx -- --check
              chelis lint --check .

          # ---- Docker shell (hello-chelis). Its release CI image first runs
          # a release compiler and predecessor dependency graph, so it cannot
          # be a prerequisite for deciding HEAD drift. This canary pins the
          # hello-chelis source commit, builds every dependency from a reviewed
          # peeled commit with HEAD, then assembles a neutral Ubuntu image
          # directly from those bytes and the HEAD toolchain. token_repos must
          # cover every exact-commit source clone plus the Octant CLI release
          # download.
          #
          # `reef_deps` is hello-chelis's real manifest graph. `tool_deps`
          # records Octant and c-earchin, which the image installs as tools
          # rather than reef.toml dependencies. Both lists are rebuilt from
          # exact source commits under HEAD; keeping the categories separate
          # preserves the shell graph while pinning the complete image input.
          - repo: hello-chelis
            type: docker
            source_sha: "4d9796b15f00a075c3aabffd629fecfe3daac200"
            reef_deps: "Chelis-Lang/coral@v0.7.42#bdb92de243c2c911c0c2a2b83bff29673186476b Chelis-Lang/nautilus@v0.7.45#563f2737c2988eaa05ca1e6ce4e941cf86c296b8 Chelis-Lang/school@v0.1.13#7904a31ff6de4b9eec82507687097cc486f2baf7"
            tool_deps: "Chelis-Lang/octant@v0.13.0#ebd2a22150647f6252f2bb5be02b5016ff069249 Chelis-Lang/c-earchin@v0.3.3#70720831641ba325b217427d52cf47fcba4f0b27"
            octant_cli_sha256: "74c46fbe5cbddf489295b9df7db308bc838c7c9c8669740197cbb1dfcddd48b0"
            token_repos: |-
              hello-chelis
              chelis
              coral
              nautilus
              octant
              c-earchin
              school
    steps:
      - name: Mint per-shell App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          # contents:read for the shell checkout + every exact-commit dependency
          # source clone and release-tool download;
          # issues:write for the per-shell tracking issue. `token_repos`
          # carries the full set (shell + dep repos) so a scoped token
          # never 403s on a dep and triggers a false-positive drift issue.
          repositories: ${{ matrix.token_repos }}

      - name: Checkout ${{ matrix.repo }} at reviewed source
        uses: actions/checkout@v6
        with:
          repository: Chelis-Lang/${{ matrix.repo }}
          ref: ${{ matrix.source_sha || 'main' }}
          token: ${{ steps.token.outputs.token }}
          path: shell

      - name: Verify immutable shell source checkout
        if: matrix.source_sha != ''
        working-directory: shell
        run: test "$(git rev-parse HEAD)" = "${{ matrix.source_sha }}"

      # The HEAD toolchain tarball is needed by every leg type: reef + cargo
      # extract it onto PATH; docker injects it into the image build context.
      - name: Download HEAD toolchain artifact
        uses: actions/download-artifact@v7
        with:
          name: chelis-head-toolchain
          path: toolchain

      - name: Extract HEAD toolchain
        run: |
          set -euo pipefail
          tar -xzf toolchain/chelis-head-toolchain.tar.gz -C toolchain
          tdir="$GITHUB_WORKSPACE/toolchain/chelis-head-toolchain"
          # Always export CHELIS_TOOLCHAIN (the report step's helper scripts
          # live under it for every leg type, including docker).
          echo "CHELIS_TOOLCHAIN=${tdir}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # All legs prepare strict-v5 dependencies with HEAD on the runner host.
      # ----------------------------------------------------------------------
      - name: Put HEAD chelis on PATH
        if: matrix.type == 'reef' || matrix.type == 'cargo' || matrix.type == 'docker'
        run: echo "$CHELIS_TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # Kept as inline apt-get (no scripts/ci_apt_get.py retry): this drift
      # leg checks out the SHELL repo (path: shell) and pulls chelis as a
      # built ARTIFACT, not a chelis checkout, so the in-repo helper is not on
      # disk here. Only two small packages; a scheduled canary, not a gate.
      - name: Install C dependencies
        if: matrix.type == 'reef' || matrix.type == 'cargo' || matrix.type == 'docker'
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev

      - name: Verify HEAD chelis on PATH
        if: matrix.type == 'reef' || matrix.type == 'cargo' || matrix.type == 'docker'
        run: |
          set -euo pipefail
          got="$(chelis --version | awk '{print $2}')"
          test "$got" = "${{ needs.build-chelis.outputs.chelis_version }}"
          echo "chelis ${got} (HEAD) on PATH"

      # Populate the local Reef registry with HEAD chelis-std from the
      # extracted toolchain monorepo subset (mirrors the shells' own
      # install_chelis_std.py, but the source is HEAD, not a release tag).
      - name: Install HEAD chelis-std into local registry
        if: matrix.type == 'reef' || matrix.type == 'cargo' || matrix.type == 'docker'
        run: chelis reef install --from-monorepo "$CHELIS_TOOLCHAIN" chelis-std

      # Release artifacts from these tags predate strict CHB v5. Retain each
      # tag/version as human metadata, but use its reviewed peeled commit SHA
      # as source authority. Repin the complete throwaway graph, run the
      # supported source migration, build with HEAD and auto-fetch disabled,
      # verify the exact current-format output, then install those bytes
      # locally. The helper also rewrites the consumer's direct dependency
      # versions to this graph.
      - name: Build and install exact dependency sources
        if: (matrix.type == 'reef' || matrix.type == 'cargo') && matrix.reef_deps != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          deps_root="$RUNNER_TEMP/drift-dependencies-${{ matrix.repo }}"
          python3 "$CHELIS_TOOLCHAIN/scripts/drift_prepare_dependencies.py" \
            --workspace "$deps_root" \
            --shell shell \
            --compiler-version "${{ needs.build-chelis.outputs.chelis_version }}" \
            ${{ matrix.reef_deps }}
          echo "DRIFT_DEPENDENCIES=$deps_root" >> "$GITHUB_ENV"

      # Rewrite the shell's compiler pin to HEAD's version. Shells pin a
      # hard equality and `chelis reef build` rejects any mismatch before
      # exercising the language — so a shell still on an older pin would
      # fail at the manifest gate, not on real drift. Repinning asks the
      # real question: "if this shell were bumped to chelis HEAD, would it
      # still build and test?" The token's checkout is throwaway; the pin
      # rewrite is never committed.
      # Repin EVERY `reef.toml` under the shell, not just the root: shells
      # carry nested manifests (consumer smoke projects, examples, spikes)
      # that each hard-pin the compiler and would fail the manifest gate if a
      # build/check touches them while still on the old pin. The repin script
      # is a no-op on any manifest already matching HEAD's version, so this is
      # safe for reef legs (whose nested manifests, if any, are repinned too).
      # Directory mode also rewrites CHELIS_TAG/CHELIS_VERSION in every shell
      # workflow. Shell pin-consistency tests otherwise reject the deliberately
      # repinned manifest before the canary can exercise compiler compatibility.
      - name: Repin shell to HEAD chelis
        if: matrix.type == 'reef' || matrix.type == 'cargo'
        run: |
          set -euo pipefail
          ver="${{ needs.build-chelis.outputs.chelis_version }}"
          python3 "$CHELIS_TOOLCHAIN/scripts/drift_repin_compiler.py" \
            shell "$ver"

      # ----------------------------------------------------------------------
      # reef legs only: `chelis reef build` + `chelis test tests/`.
      # ----------------------------------------------------------------------
      - name: chelis reef build (${{ matrix.repo }} vs HEAD)
        if: matrix.type == 'reef'
        working-directory: shell
        run: chelis reef build --no-auto-fetch

      - name: chelis test tests/ (${{ matrix.repo }} vs HEAD)
        if: matrix.type == 'reef'
        working-directory: shell
        run: |
          set -uo pipefail
          if [ ! -d tests ] || [ -z "$(find tests -maxdepth 1 -name '*.ch' -type f -print -quit)" ]; then
            echo "No tests/*.ch files; skipping chelis test (reef build is the gate)."
            exit 0
          fi
          # Shoals now carries 367 tests. The 0.17.4 HEAD canary observed 291
          # clean passes before the old 600s whole-suite deadline killed the
          # process group, which is a harness timeout rather than language
          # drift. Raise the whole-suite bound explicitly while preserving the
          # existing 600s per-test budget; the two limits are independent.
          chelis test tests/ --timeout 600 --suite-timeout 900 --jobs auto

      # ----------------------------------------------------------------------
      # cargo legs only: build the shell's Rust workspace against HEAD chelis
      # SOURCE via the `../chelis` sibling path deps, then run its cargo
      # recipe (which still drives the HEAD chelis binary on PATH).
      # ----------------------------------------------------------------------
      # chelis HEAD source as the `../chelis` sibling so the shell's
      # `Cargo.toml` path deps (`../chelis/crates/...`) resolve. The shell is
      # checked out at `shell/` and chelis at `chelis/`, both under
      # `$GITHUB_WORKSPACE`; the cargo step runs with `working-directory:
      # shell`, so `../chelis` resolves to `$GITHUB_WORKSPACE/chelis` — exactly
      # the sibling layout each cargo shell's own ci.yml `workspace-gate`
      # produces, but at HEAD (`github.sha`) instead of the pinned release ref.
      # Skipped for c-earchin (no chelis Cargo path dep).
      - name: Checkout chelis HEAD as sibling (cargo path dep)
        if: matrix.type == 'cargo' && matrix.needs_chelis_sibling
        uses: actions/checkout@v6
        with:
          repository: Chelis-Lang/chelis
          ref: ${{ github.sha }}
          path: chelis

      - name: Install Rust toolchain
        if: matrix.type == 'cargo'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        if: matrix.type == 'cargo' && matrix.needs_chelis_sibling
        uses: astral-sh/setup-uv@v8.1.0

      # The chelis sibling's `.cargo/config.toml` sets PYO3_PYTHON to its
      # `.venv/bin/python`; any path-dep build that transitively pulls pyo3
      # needs a matching uv venv in the sibling first (same as build-chelis).
      - name: Create uv venv in chelis sibling
        if: matrix.type == 'cargo' && matrix.needs_chelis_sibling
        working-directory: chelis
        run: python3 scripts/ci_setup_uv_python.py

      # hydronnx's fixture generation runs `uv run` directly; ensure uv exists
      # even when there is no chelis sibling needing the venv setup above.
      - name: Install uv (fixture generation)
        if: matrix.type == 'cargo' && !matrix.needs_chelis_sibling && matrix.repo == 'hydronnx'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache cargo registry and build (${{ matrix.repo }})
        if: matrix.type == 'cargo'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
          shared-key: drift-${{ matrix.repo }}
          cache-on-failure: false

      # Run the shell's cargo gate verbatim (from its ci.yml workspace-gate),
      # against HEAD chelis. The HEAD chelis binary is on PATH, HEAD chelis-std
      # + exact source-built reef deps are in the local registry, and the `../chelis`
      # sibling provides the Cargo path-dep source.
      - name: Cargo gate (${{ matrix.repo }} vs HEAD)
        if: matrix.type == 'cargo'
        working-directory: shell
        run: |
          set -euo pipefail
          ${{ matrix.cargo_recipe }}

      # ----------------------------------------------------------------------
      # docker leg only (hello-chelis): assemble a neutral Ubuntu image from
      # the HEAD toolchain and exact source-built dependency graph, then run
      # the checked-out hello-chelis gates inside it. No release compiler or
      # predecessor dependency install/check is on this path.
      # ----------------------------------------------------------------------
      # Keep reef.toml dependencies distinct from image tool packages in the
      # matrix, but build and verify one exact source bundle for the image.
      # The helper returns status 2 when authenticated source acquisition or
      # exact-SHA verification fails; that is infrastructure, not language
      # drift. Failures after source verification remain genuine source/API
      # drift and keep the normal tracking-issue path.
      - name: Build and install exact Docker dependency sources
        id: docker_dependencies
        if: matrix.type == 'docker'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          deps_root="$RUNNER_TEMP/drift-dependencies-${{ matrix.repo }}"
          status=0
          set +e
          python3 "$CHELIS_TOOLCHAIN/scripts/drift_prepare_dependencies.py" \
            --workspace "$deps_root" \
            --shell shell \
            --compiler-version "${{ needs.build-chelis.outputs.chelis_version }}" \
            ${{ matrix.reef_deps }} ${{ matrix.tool_deps }}
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "failure_kind=setup" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            echo "failure_kind=drift" >> "$GITHUB_OUTPUT"
          else
            echo "failure_kind=none" >> "$GITHUB_OUTPUT"
            echo "DRIFT_DEPENDENCIES=$deps_root" >> "$GITHUB_ENV"
          fi
          exit "$status"

      # Image assembly is infrastructure-only. It contains no release Chelis
      # compiler and executes no hello-chelis source. A failure is withheld
      # from drift reporting and converted back to a job failure after the
      # reporting step.
      - name: Assemble neutral HEAD Docker image
        id: docker_image
        if: matrix.type == 'docker' && steps.docker_dependencies.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          tdir="$CHELIS_TOOLCHAIN"
          ctx="$(mktemp -d)"
          mkdir -p "$ctx/lib" "$ctx/include"
          cp "$tdir/bin/chelis" "$ctx/chelis"
          cp "$tdir/lib/libchelis_runtime.a" "$ctx/lib/"
          cp "$tdir"/include/*.h "$ctx/include/"
          runtime_export="$(mktemp -d)"
          "$ctx/chelis" runtime export "$runtime_export"
          python3 "$tdir/scripts/verify_runtime_package.py" "$runtime_export" "$ctx"
          cp -R "$tdir/packages" "$ctx/packages"
          cp -R "$DRIFT_DEPENDENCIES/packages" "$ctx/dependencies"
          cp -R shell "$ctx/workspace"
          rm -rf "$ctx/workspace/.git"
          asset="octant-v0.13.0-linux-x86_64.tar.gz"
          gh release download v0.13.0 \
            --repo Chelis-Lang/octant \
            --pattern "$asset" \
            --dir "$ctx"
          (
            cd "$ctx"
            echo "${{ matrix.octant_cli_sha256 }}  ${asset}" | sha256sum -c -
          )
          mkdir -p "$ctx/octant-toolchain"
          tar -xzf "$ctx/$asset" \
            -C "$ctx/octant-toolchain" \
            --strip-components=1
          cp "$ctx/octant-toolchain/bin/octant" "$ctx/octant"
          cat > "$ctx/Dockerfile" <<'DOCKER'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              PATH=/usr/local/bin:/usr/bin:/bin
          SHELL ["/bin/bash", "-o", "pipefail", "-c"]
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates \
                  gcc \
                  g++ \
                  make \
                  libopenblas-dev \
                  libgomp1 \
                  valgrind \
                  git \
                  python3 \
                  python3-pip \
                  python3-venv \
              && rm -rf /var/lib/apt/lists/*
          COPY chelis /usr/local/bin/chelis
          COPY octant /usr/local/bin/octant
          COPY lib/libchelis_runtime.a /usr/local/lib/libchelis_runtime.a
          COPY include/*.h /usr/local/include/
          COPY packages /opt/chelis-head/packages
          COPY dependencies /opt/chelis-head/dependencies/packages
          COPY workspace /workspace
          RUN chelis reef install --from-monorepo /opt/chelis-head chelis-std \
              && chelis reef install --from-monorepo /opt/chelis-head/dependencies
          RUN chelis --version && octant version
          WORKDIR /workspace
          DOCKER
          docker build -t hello-chelis:head "$ctx"
          echo "HEAD chelis version in image:"
          docker run --rm hello-chelis:head chelis --version

      # Exercise hello-chelis semantics inside the neutral HEAD image.
      # Release-pinned hello-chelis CI owns byte-for-byte Deep sidecar drift;
      # regenerating with a different compiler version is expected to change
      # serialization and is not an ecosystem-compatibility signal.
      # The exact reviewed, throwaway-repinned checkout is copied into the
      # image before this gate, so no mutable host source is mounted at runtime.
      - name: hello-chelis check + test + C-backend (vs HEAD)
        id: docker_gate
        if: matrix.type == 'docker' && steps.docker_image.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          img=hello-chelis:head
          run() { docker run --rm -w /workspace "$img" "$@"; }
          echo "::group::chelis reef build"
          run chelis reef build --no-auto-fetch
          echo "::endgroup::"
          echo "::group::chelis check"
          run chelis check src/basics/hellotensor.ch
          echo "::endgroup::"
          echo "::group::chelis test tests/"
          run timeout 900s chelis test tests/ --jobs auto
          echo "::endgroup::"
          echo "::group::C-backend pytest"
          run bash -c 'pip install pytest --break-system-packages 2>/dev/null || pip install pytest; python3 -m pytest -q tests/test_c_backend.py'
          echo "::endgroup::"

      # ADVISORY conformance signal: run the HEAD toolchain's
      # `chelis reef conform audit` against the shell checkout and print the
      # report. This is the CONVENTION-drift counterpart to the FUNCTIONAL-drift
      # gate above — it surfaces missing scaffolding (managed blocks, stamped
      # CHELIS_SURFACE, materialized skills, wired probes) that a build/test pass
      # cannot catch. It is deliberately `continue-on-error` + does NOT feed
      # `job.status`: most shells predate the retrofit and will report gaps, and
      # the HEAD binary auditing an older-pinned shell is inherently advisory
      # (see the contract's since_version note). Reef + cargo legs only (the
      # audit needs the shell tree on disk + the HEAD `chelis` on PATH; the
      # docker leg's chelis lives inside the image). Filing a dedicated
      # conformance issue is tracked follow-up; for now the signal is the log.
      - name: Conformance audit (advisory, ${{ matrix.repo }} vs HEAD)
        if: (matrix.type == 'reef' || matrix.type == 'cargo') && always()
        continue-on-error: true
        working-directory: shell
        run: |
          echo "::group::chelis reef conform audit (advisory)"
          chelis reef conform audit || echo "::warning::conformance gaps in ${{ matrix.repo }} (advisory; retrofit via chelis reef conform init/sync)"
          echo "::endgroup::"

      # Open-on-fail / close-on-pass tracking issue IN THE SHELL'S OWN
      # repo, via the minted App token (issues:write). Same logic as the
      # heavy-e2e.yml report job, retargeted cross-repo. if:always() so it
      # runs whether the gate above passed or failed; `job.status` is the
      # aggregate result of the preceding steps in this matrix leg.
      - name: File/update drift tracking issue
        if: >-
          always() && (
            matrix.type != 'docker' ||
            (steps.docker_dependencies.outcome == 'failure' &&
             steps.docker_dependencies.outputs.failure_kind == 'drift') ||
            steps.docker_gate.outcome == 'success' ||
            steps.docker_gate.outcome == 'failure'
          )
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHELL_REPO: ${{ matrix.repo }}
          JOB_STATUS: >-
            ${{ matrix.type == 'docker' &&
                ((steps.docker_dependencies.outcome == 'failure' &&
                  steps.docker_dependencies.outputs.failure_kind == 'drift') ||
                 steps.docker_gate.outcome == 'failure') &&
                'failure' || job.status }}
          HEAD_VERSION: ${{ needs.build-chelis.outputs.chelis_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHELIS_SHA: ${{ github.sha }}
        run: python3 "$CHELIS_TOOLCHAIN/scripts/drift_report_issue.py"

      - name: Fail Docker language drift
        if: >-
          always() && matrix.type == 'docker' &&
          ((steps.docker_dependencies.outcome == 'failure' &&
            steps.docker_dependencies.outputs.failure_kind == 'drift') ||
           steps.docker_gate.outcome == 'failure')
        run: |
          echo "::error::hello-chelis has source/API drift against Chelis HEAD"
          exit 1

      - name: Fail Docker infrastructure
        if: >-
          always() && matrix.type == 'docker' &&
          ((steps.docker_dependencies.outcome == 'failure' &&
            steps.docker_dependencies.outputs.failure_kind != 'drift') ||
           steps.docker_dependencies.outcome == 'skipped' ||
           steps.docker_dependencies.outcome == 'cancelled' ||
           (steps.docker_dependencies.outcome == 'success' &&
            (steps.docker_image.outcome != 'success' ||
             steps.docker_gate.outcome == 'skipped' ||
             steps.docker_gate.outcome == 'cancelled')))
        run: |
          echo "::error::neutral HEAD Docker setup failed before a drift verdict"
          exit 1
