name: Ecosystem Drift Canary

# The deliberate cross-repo drift signal. Every shell nightly pins the
# SAME fixed chelis version its own per-PR CI pins, so none of them can
# catch "a chelis change on main broke a downstream shell" — the recurring
# pain (e.g. nautilus #11, noticed ~40 days late after a release lag).
#
# This canary closes that gap: it builds the chelis toolchain from THIS
# repo's HEAD and, for each downstream shell, checks out the shell at
# `main` and runs the shell's own core gate (`chelis reef build` +
# `chelis test tests/`, or the cargo gate for the Rust shells) against the
# HEAD toolchain. A break surfaces within a day, at the offending chelis
# commit, instead of weeks later in a shell user's bug report.
#
# A failing shell leg files/updates a tracking issue IN THAT SHELL'S repo
# (open-on-fail / close-on-pass), mirroring the heavy-e2e.yml report
# pattern, so the signal lands where the shell maintainers see it.
#
# The HEAD toolchain comes from the portable Devenv release output
# (nix/release-chelis.nix): the committed Cargo.nix graph, the pinned
# cvc5 tree, and the patchelf portability rewrite off the Nix store —
# the same artifact shape release.yml publishes, built from HEAD, so the
# canary ships shells exactly what a release would. Scheduled + manual
# dispatch ONLY; never per-PR, never on push — it is purely additive and
# cannot affect existing CI.

on:
  schedule:
    # 09:00 UTC daily. Staggered off the 07:00 heavy-e2e / conformance
    # nightlies and the 08:00 shell nightlies so the canary's HEAD build
    # does not contend with them for the org's runner pool.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the HEAD chelis toolchain and publish it as a workflow artifact:
  # release.yml's linux-x86_64 tarball content built from HEAD (the
  # `chelis` binary, the runtime staticlib + headers), AND a freshly
  # rebuilt-from-HEAD `packages/chelis-std/` so each shell can populate its
  # local Reef registry with HEAD chelis-std via `reef install
  # --from-monorepo` — exactly the path the shells' own `install_chelis_std.py`
  # uses against a release tag, but pointed at HEAD instead.
  build-chelis:
    name: Build chelis toolchain (HEAD)
    runs-on: ubuntu-latest
    # A cold cvc5 closure (a cvc5 or nixpkgs pin bump) pays one ~30m Nix
    # build before the Cargo.nix workspace build; the ceiling matches
    # release.yml's for the same output.
    timeout-minutes: 90
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout chelis (HEAD)
        uses: actions/checkout@v6

      # Free ~25-30 GB before the Nix closure build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Resolve the Devenv Rust version
        id: rust-version
        run: |
          rust_version="$(devenv-retry --profile ci shell --no-tui -- rustc --version | awk '{print $2}')"
          test -n "$rust_version"
          echo "rust_version=$rust_version" >> "$GITHUB_OUTPUT"

      # cvc5 closure cache: the shared composite pair derives one key from
      # the cvc5-dir drvPath, so all lanes (SMT, full-prove, release, Nix
      # packages) share one cached closure.
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: x86_64-linux

      # The portable release output (nix/release-chelis.nix): built from the
      # committed Cargo.nix graph with the pinned Devenv rustc, verified
      # (version, help, release fixture, cvc5 discharge), and rewritten off
      # the Nix store so the raw drift runners and the docker leg can run it.
      - name: Build and verify the portable chelis toolchain output
        run: |
          devenv-retry build --no-tui --quiet outputs.release-chelis > release-chelis-build.json
          devenv-retry --profile ci shell --no-tui -- python scripts/verify_release_chelis.py \
            --build-json release-chelis-build.json \
            --stage-root release-chelis \
            --platform linux-x86_64

      # Save immediately after the closure exists, so a later staging
      # failure does not lose the ~30m cold cvc5 build.
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: x86_64-linux
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

      - name: Unpack the portable toolchain
        run: |
          set -euo pipefail
          tarball="$(find release-chelis -name 'chelis-v*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$tarball"
          mkdir -p unpacked
          tar -xzf "$tarball" -C unpacked
          tdir="$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$tdir"
          echo "HEAD_TOOLCHAIN=$(readlink -f "$tdir")" >> "$GITHUB_ENV"

      # The portable binary runs on the raw runner host by contract (the
      # derivation verified the loader rewrite); record the version off-Nix,
      # the same way every drift leg runs it.
      - name: Record HEAD chelis version
        id: version
        # Explicit bash: the point of this step is running the portable
        # binary on the raw runner host, outside the Devenv shell.
        shell: bash
        run: |
          set -euo pipefail
          ver="$("$HEAD_TOOLCHAIN/bin/chelis" --version | awk '{print $2}')"
          echo "chelis_version=${ver}" >> "$GITHUB_OUTPUT"
          echo "HEAD chelis version: ${ver}"

      # Rebuild chelis-std from HEAD source with the HEAD binary so the
      # bundled package genuinely reflects HEAD (catches a chelis change
      # that breaks chelis-std's own lowering — a nautilus-#11-class bug).
      # Emits packages/chelis-std/dist/chelis-std-<ver>.{chb,tar.zst}.
      - name: Rebuild HEAD chelis-std bundle
        run: devenv-retry --profile ci shell --no-tui -- "$HEAD_TOOLCHAIN/bin/chelis" reef build packages/chelis-std

      # Stage release.yml's tarball content plus the freshly built
      # packages/chelis-std/ tree (so `reef install --from-monorepo
      # <extracted>` resolves chelis-std). The monorepo layout (a
      # `packages/` dir) is what `--from-monorepo` expects.
      - name: Stage toolchain tarball
        run: |
          set -euo pipefail
          staging="chelis-head-toolchain"
          mkdir -p "$staging/bin" "$staging/lib" "$staging/include" \
                   "$staging/packages/chelis-std" "$staging/scripts"
          cp "$HEAD_TOOLCHAIN/bin/chelis" "$staging/bin/"
          cp "$HEAD_TOOLCHAIN/lib/libchelis_runtime.a" "$staging/lib/"
          cp "$HEAD_TOOLCHAIN"/include/*.h "$staging/include/"
          # The chelis-std source + freshly built dist artifacts. reef
          # install --from-monorepo reads packages/<name>/dist/.
          cp -R packages/chelis-std/. "$staging/packages/chelis-std/"
          # The canary's own helper scripts, so the `drift` job (which
          # checks out the SHELL, not chelis) can repin + report without a
          # second chelis checkout.
          cp scripts/drift_repin_compiler.py "$staging/scripts/"
          cp scripts/drift_report_issue.py "$staging/scripts/"
          cp scripts/ci_detect_chelis_path_deps.py "$staging/scripts/"
          tar czf chelis-head-toolchain.tar.gz "$staging"
          ls -la chelis-head-toolchain.tar.gz

      - name: Upload HEAD toolchain artifact
        uses: actions/upload-artifact@v7
        with:
          name: chelis-head-toolchain
          path: chelis-head-toolchain.tar.gz
          retention-days: 7

    outputs:
      chelis_version: ${{ steps.version.outputs.chelis_version }}
      rust_version: ${{ steps.rust-version.outputs.rust_version }}

  # One off-Nix matrix leg per binary consumer. fail-fast:false ensures that
  # one consumer failure never cancels another consumer. Source-dependent
  # Cargo shells use the separate project Devenv matrix below.
  drift:
    name: ${{ matrix.repo }} (${{ matrix.type }}) vs chelis HEAD
    needs: build-chelis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Test the ecosystem's CODE against chelis HEAD, not its release
      # cadence. A released dependency pins the compiler it was cut against,
      # so under HEAD `chelis reef build` / `check` / `test` would reject the
      # whole dep graph at the manifest gate before compiling anything — a
      # false drift positive. This waives EXACTLY the dependency
      # compiler-pin equality (every other manifest check stays enforced),
      # with a loud per-package warning in the log. Pin freshness is each
      # shell's own release-cadence concern, not a code-drift signal. See
      # chelis-reef `validate_manifest` + spec/design/reef_distribution.md
      # Item 8. NOTE: host env does not cross `docker run`, so the docker leg
      # re-passes this into its container explicitly (below).
      CHELIS_REEF_ALLOW_DEP_COMPILER_DRIFT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Pure-Chelis / reef shells (toolchain-binary consumers).
          # `reef_deps` is a space-separated list of released
          # `<org>/<repo>@<tag>` entries resolved as the shell's own CI
          # resolves them (its reef.toml dependency tags). chelis-std is
          # NOT listed — it comes from the HEAD toolchain. Mind the dep
          # graph: coral->nautilus, shoals->nautilus+coral, whale->shoals
          # (transitively nautilus+coral).
          #
          # `token_repos` is the newline-separated set of repos the minted
          # App token must read: the shell ITSELF (checkout) PLUS every
          # sibling dep repo `reef install --from-github` fetches release
          # assets from. Scoping the token to only `repo` would 403/404 on
          # the dep install, and the if:always() report step would then
          # misattribute that infra failure as language drift (a false
          # positive). Least-privilege: each token covers exactly its leg's
          # checkout + dep reads, nothing more.
          - repo: nautilus
            type: reef
            reef_deps: ""
            token_repos: nautilus
          - repo: coral
            type: reef
            reef_deps: "Chelis-Lang/nautilus@v0.7.26"
            token_repos: |-
              coral
              nautilus
          - repo: shoals
            type: reef
            reef_deps: "Chelis-Lang/nautilus@v0.7.26 Chelis-Lang/coral@v0.7.25"
            token_repos: |-
              shoals
              nautilus
              coral
          - repo: school
            type: reef
            reef_deps: ""
            token_repos: school
          - repo: hull
            type: reef
            reef_deps: ""
            token_repos: hull
          - repo: whale
            type: reef
            reef_deps: "Chelis-Lang/nautilus@v0.7.26 Chelis-Lang/coral@v0.7.25 Chelis-Lang/shoals@v0.20.1"
            token_repos: |-
              whale
              nautilus
              coral
              shoals

          # ---- Host Cargo consumer. c-earchin has no Chelis Cargo path
          # dependency. It consumes the HEAD compiler binary while its own Rust
          # workspace stays on the host toolchain, which preserves the off-Nix
          # consumer proof. Source-dependent Cargo shells run in drift-source.
          - repo: c-earchin
            type: cargo
            reef_deps: ""
            token_repos: c-earchin
            cargo_recipe: |
              cargo build --workspace --all-targets
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
              cargo fmt --all -- --check
              # c-earchin's Chelis vocabulary + consumer smoke (its
              # workspace-gate's "Chelis vocabulary and consumer smoke" step).
              chelis check src/vocabulary.ch
              chelis check tests/integration/consumer/src/main.ch
              chelis validate --deep references/pricing_rules.dp
              chelis validate --deep references/vocabulary_miss.dp
              chelis prove references/pricing_rules.dp --spans references/pricing_rules.spans.json --json
              chelis reef build tests/integration/consumer
              chelis reef build .

          # ---- Docker shell (hello-chelis). Its CI builds an Ubuntu image
          # that installs the chelis toolchain from a RELEASE tarball
          # (docker/Dockerfile `ARG CHELIS_VERSION`), then runs `chelis check`
          # / `chelis test` / the C-backend pytest inside the image. There is
          # no HEAD release tarball, so the canary cannot point the ARG at a
          # release tag. Instead it injects the HEAD toolchain artifact into
          # the build context and overrides the image's `/usr/local/bin/chelis`
          # (+ runtime staticlib + headers) with the HEAD-built ones via a thin
          # overlay Dockerfile that `FROM`s the freshly built hello-chelis
          # image — see the `type: docker` steps. token_repos must cover every
          # repo the Dockerfile's `reef install --from-github` reads
          # (chelis/coral/nautilus/octant/c-earchin/school) plus the octant release
          # tarball it downloads, plus hello-chelis itself.
          - repo: hello-chelis
            type: docker
            reef_deps: ""
            token_repos: |-
              hello-chelis
              chelis
              coral
              nautilus
              octant
              c-earchin
              school
    steps:
      - name: Mint per-shell App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          permission-contents: read
          permission-issues: write
          # contents:read for the shell checkout + every sibling dep repo
          # `reef install --from-github` reads release assets from;
          # issues:write for the per-shell tracking issue. `token_repos`
          # carries the full set (shell + dep repos) so a scoped token
          # never 403s on a dep and triggers a false-positive drift issue.
          repositories: ${{ matrix.token_repos }}

      - name: Checkout ${{ matrix.repo }} at main
        uses: actions/checkout@v6
        with:
          repository: Chelis-Lang/${{ matrix.repo }}
          ref: main
          token: ${{ steps.token.outputs.token }}
          path: shell

      # The HEAD toolchain tarball is needed by every leg type: reef + cargo
      # extract it onto PATH; docker injects it into the image build context.
      - name: Download HEAD toolchain artifact
        uses: actions/download-artifact@v7
        with:
          name: chelis-head-toolchain
          path: toolchain

      - name: Extract HEAD toolchain
        run: |
          set -euo pipefail
          tar -xzf toolchain/chelis-head-toolchain.tar.gz -C toolchain
          tdir="$GITHUB_WORKSPACE/toolchain/chelis-head-toolchain"
          # Always export CHELIS_TOOLCHAIN (the report step's helper scripts
          # live under it for every leg type, including docker).
          echo "CHELIS_TOOLCHAIN=${tdir}" >> "$GITHUB_ENV"

      # This off-Nix classifier uses ubuntu-latest Python 3.11 or newer.
      # It reads Cargo TOML before any host Cargo command can run.
      - name: Verify an off-Nix binary consumer has no Chelis source dependency
        id: classify
        run: |
          python3 "$CHELIS_TOOLCHAIN/scripts/ci_detect_chelis_path_deps.py" \
            shell "$GITHUB_WORKSPACE/chelis" --expect absent

      # ----------------------------------------------------------------------
      # reef + cargo legs: run the HEAD chelis binary on the runner host.
      # ----------------------------------------------------------------------
      - name: Put HEAD chelis on PATH
        if: matrix.type == 'reef' || matrix.type == 'cargo'
        run: echo "$CHELIS_TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # Kept as inline apt-get (no scripts/ci_apt_get.py retry): this drift
      # leg checks out the SHELL repo (path: shell) and pulls chelis as a
      # built ARTIFACT, not a chelis checkout, so the in-repo helper is not on
      # disk here. Only two small packages; a scheduled canary, not a gate.
      - name: Install C dependencies
        if: matrix.type == 'reef' || matrix.type == 'cargo'
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev

      - name: Verify HEAD chelis on PATH
        if: matrix.type == 'reef' || matrix.type == 'cargo'
        run: |
          set -euo pipefail
          got="$(chelis --version | awk '{print $2}')"
          test "$got" = "${{ needs.build-chelis.outputs.chelis_version }}"
          echo "chelis ${got} (HEAD) on PATH"

      # Populate the local Reef registry with HEAD chelis-std from the
      # extracted toolchain monorepo subset (mirrors the shells' own
      # install_chelis_std.py, but the source is HEAD, not a release tag).
      - name: Install HEAD chelis-std into local registry
        if: matrix.type == 'reef' || matrix.type == 'cargo'
        run: chelis reef install --from-monorepo "$CHELIS_TOOLCHAIN" chelis-std

      # Resolve the shell's released reef deps as @tags, exactly as the
      # shell's own ci.yml does. Each dep's prebuilt artifact was built
      # against the released chelis; HEAD chelis accepts it (validated).
      # Empty for shells whose only dependency is chelis-std.
      - name: Install released reef dependencies
        if: (matrix.type == 'reef' || matrix.type == 'cargo') && matrix.reef_deps != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          for dep in ${{ matrix.reef_deps }}; do
            echo "::group::reef install ${dep}"
            chelis reef install --from-github "$dep"
            echo "::endgroup::"
          done

      # Rewrite the shell's compiler pin to HEAD's version. Shells pin a
      # hard equality and `chelis reef build` rejects any mismatch before
      # exercising the language — so a shell still on an older pin would
      # fail at the manifest gate, not on real drift. Repinning asks the
      # real question: "if this shell were bumped to chelis HEAD, would it
      # still build and test?" The token's checkout is throwaway; the pin
      # rewrite is never committed.
      # Repin EVERY `reef.toml` under the shell, not just the root: shells
      # carry nested manifests (consumer smoke projects, examples, spikes)
      # that each hard-pin the compiler and would fail the manifest gate if a
      # build/check touches them while still on the old pin. The repin script
      # is a no-op on any manifest already matching HEAD's version, so this is
      # safe for reef legs (whose nested manifests, if any, are repinned too).
      # Directory mode also rewrites CHELIS_TAG/CHELIS_VERSION in every shell
      # workflow. Shell pin-consistency tests otherwise reject the deliberately
      # repinned manifest before the canary can exercise compiler compatibility.
      - name: Repin shell to HEAD chelis
        if: matrix.type == 'reef' || matrix.type == 'cargo'
        run: |
          set -euo pipefail
          ver="${{ needs.build-chelis.outputs.chelis_version }}"
          python3 "$CHELIS_TOOLCHAIN/scripts/drift_repin_compiler.py" \
            shell "$ver"

      # ----------------------------------------------------------------------
      # reef legs only: `chelis reef build` + `chelis test tests/`.
      # ----------------------------------------------------------------------
      - name: chelis reef build (${{ matrix.repo }} vs HEAD)
        if: matrix.type == 'reef'
        working-directory: shell
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: chelis reef build

      - name: chelis test tests/ (${{ matrix.repo }} vs HEAD)
        if: matrix.type == 'reef'
        working-directory: shell
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -uo pipefail
          if [ ! -d tests ] || [ -z "$(find tests -maxdepth 1 -name '*.ch' -type f -print -quit)" ]; then
            echo "No tests/*.ch files; skipping chelis test (reef build is the gate)."
            exit 0
          fi
          # Shoals now carries 367 tests. The 0.17.4 HEAD canary observed 291
          # clean passes before the old 600s whole-suite deadline killed the
          # process group, which is a harness timeout rather than language
          # drift. Raise the whole-suite bound explicitly while preserving the
          # existing 600s per-test budget; the two limits are independent.
          chelis test tests/ --timeout 600 --suite-timeout 900 --jobs auto

      # ----------------------------------------------------------------------
      # Host Cargo consumer only. c-earchin has no Chelis source dependency,
      # so this lane verifies the portable compiler against its host workspace.
      # Source-dependent Cargo shells run through project Devenv below.
      # ----------------------------------------------------------------------
      # Use the exact Rust version that the Chelis Devenv shell resolved in
      # build-chelis. An upstream Rust release cannot change this consumer
      # independently of the locked Chelis environment.
      - name: Install Rust toolchain
        if: matrix.type == 'cargo'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: ${{ needs.build-chelis.outputs.rust_version }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build (${{ matrix.repo }})
        if: matrix.type == 'cargo'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
          shared-key: drift-${{ matrix.repo }}
          cache-on-failure: false

      # Run c-earchin's host Cargo gate against the HEAD compiler binary.
      # Source-dependent Cargo gates run in the project Devenv job.
      - name: Cargo gate (${{ matrix.repo }} vs HEAD)
        if: matrix.type == 'cargo'
        working-directory: shell
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          ${{ matrix.cargo_recipe }}

      # ----------------------------------------------------------------------
      # docker leg only (hello-chelis): build its image but swap the
      # release-tarball chelis for the HEAD toolchain, then run its CI gates
      # inside the image.
      # ----------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: matrix.type == 'docker'
        uses: docker/setup-buildx-action@v3

      # Build the hello-chelis image normally (its Dockerfile installs the
      # pinned RELEASE chelis), then overlay a thin image that replaces the
      # toolchain with the HEAD build. The release-installed toolchain layer
      # is only used to bootstrap the shell-release reef installs + octant CLI
      # inside the image; the HEAD overlay overrides the `chelis` binary,
      # runtime staticlib, and headers so every gate below runs HEAD chelis.
      # This is the faithful "chelis ARG pointed at a HEAD-built toolchain"
      # the canary can express without a HEAD release tarball to download.
      - name: Build hello-chelis base image (release-pinned chelis)
        if: matrix.type == 'docker'
        uses: docker/build-push-action@v5
        with:
          context: shell
          file: shell/docker/Dockerfile
          tags: hello-chelis:base
          load: true
          secrets: |
            github_token=${{ steps.token.outputs.token }}

      - name: Overlay HEAD chelis toolchain onto the image
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          tdir="$CHELIS_TOOLCHAIN"
          ctx="$(mktemp -d)"
          cp "$tdir/bin/chelis" "$ctx/chelis"
          cp "$tdir/lib/libchelis_runtime.a" "$ctx/libchelis_runtime.a"
          cp "$tdir"/include/*.h "$ctx/"
          # Copy the HEAD chelis-std monorepo subset so we can reinstall it
          # over the release chelis-std the base image's reef registry holds.
          cp -R "$tdir/packages" "$ctx/packages"
          cat > "$ctx/Dockerfile" <<'DOCKER'
          FROM hello-chelis:base
          COPY chelis /usr/local/bin/chelis
          COPY libchelis_runtime.a /usr/local/lib/libchelis_runtime.a
          COPY *.h /usr/local/include/
          COPY packages /opt/chelis-head/packages
          # Reinstall HEAD chelis-std over the release one so the registry
          # matches the HEAD binary (mirrors the reef/cargo legs'
          # `reef install --from-monorepo`). Idempotent: writes the HEAD
          # chelis-std build into the local registry index.
          RUN chelis reef install --from-monorepo /opt/chelis-head chelis-std
          RUN chelis --version
          DOCKER
          docker build -t hello-chelis:head "$ctx"
          echo "HEAD chelis version in image:"
          docker run --rm hello-chelis:head chelis --version

      # Repin the checked-out shell to HEAD, same as the reef/cargo legs do
      # (above). The docker leg needs its OWN repin step for two reasons:
      #   1. It is a different position in the job. The reef/cargo repin runs
      #      before their `chelis reef build`; here it must run AFTER the base
      #      image is built, because that image installs the RELEASE chelis and
      #      its Dockerfile `chelis check`s the source — it would fail the
      #      manifest gate if the pin were already bumped to HEAD.
      #   2. The gate below runs against `-v "$PWD/shell:/workspace"`: the HOST
      #      checkout, not the image's baked copy. So it is the host `shell/`
      #      that must carry the HEAD pin, or `chelis check` fails at the
      #      manifest gate ("package.compiler must be `=X.Y.Z`") before any
      #      language surface is exercised — a false drift positive. Covers
      #      every reef.toml under the shell (root + nested), not just the root.
      - name: Repin shell to HEAD chelis (docker)
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          python3 "$CHELIS_TOOLCHAIN/scripts/drift_repin_compiler.py" \
            shell "${{ needs.build-chelis.outputs.chelis_version }}"

      # Exercise hello-chelis semantics inside the HEAD-overlaid image.
      # Release-pinned hello-chelis CI owns byte-for-byte Deep sidecar drift;
      # regenerating with a different compiler version is expected to change
      # serialization and is not an ecosystem-compatibility signal.
      # `-v "$PWD/shell:/workspace"` mounts the checked-out corpus so `chelis
      # check` / `chelis test` / pytest see the source tree.
      - name: hello-chelis check + test + C-backend (vs HEAD)
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          img=hello-chelis:head
          # Forward the dep-compiler-drift waiver (set at job level) INTO the
          # container: the shell's deps live in the image's registry at their
          # released pins, so `chelis check` / `test` would reject them under
          # HEAD without it. `-e VAR` (no value) passes the host value through.
          run() { docker run --rm -e CHELIS_REEF_ALLOW_DEP_COMPILER_DRIFT -v "$PWD/shell:/workspace" -w /workspace "$img" "$@"; }
          echo "::group::chelis check"
          run chelis check src/basics/hellotensor.ch
          echo "::endgroup::"
          echo "::group::chelis test tests/"
          run timeout 900s chelis test tests/ --jobs auto
          echo "::endgroup::"
          echo "::group::C-backend pytest"
          run bash -c 'pip install pytest --break-system-packages 2>/dev/null || pip install pytest; python3 -m pytest -q tests/test_c_backend.py'
          echo "::endgroup::"

      # ADVISORY conformance signal: run the HEAD toolchain's
      # `chelis reef conform audit` against the shell checkout and print the
      # report. This is the CONVENTION-drift counterpart to the FUNCTIONAL-drift
      # gate above — it surfaces missing scaffolding (managed blocks, stamped
      # CHELIS_SURFACE, materialized skills, wired probes) that a build/test pass
      # cannot catch. It is deliberately `continue-on-error` + does NOT feed
      # `job.status`: most shells predate the retrofit and will report gaps, and
      # the HEAD binary auditing an older-pinned shell is inherently advisory
      # (see the contract's since_version note). Reef + cargo legs only (the
      # audit needs the shell tree on disk + the HEAD `chelis` on PATH; the
      # docker leg's chelis lives inside the image). Filing a dedicated
      # conformance issue is tracked follow-up; for now the signal is the log.
      - name: Conformance audit (advisory, ${{ matrix.repo }} vs HEAD)
        if: (matrix.type == 'reef' || matrix.type == 'cargo') && always()
        continue-on-error: true
        working-directory: shell
        run: |
          echo "::group::chelis reef conform audit (advisory)"
          chelis reef conform audit || echo "::warning::conformance gaps in ${{ matrix.repo }} (advisory; retrofit via chelis reef conform init/sync)"
          echo "::endgroup::"

      # Open-on-fail / close-on-pass tracking issue IN THE SHELL'S OWN
      # repo, via the minted App token (issues:write). Same logic as the
      # heavy-e2e.yml report job, retargeted cross-repo. It runs after a
      # successful partition check, whether the consumer gate passes or fails.
      # Classifier failures stay in this repository and do not blame a shell.
      - name: File/update drift tracking issue
        if: always() && steps.classify.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHELL_REPO: ${{ matrix.repo }}
          JOB_STATUS: ${{ job.status }}
          HEAD_VERSION: ${{ needs.build-chelis.outputs.chelis_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHELIS_SHA: ${{ github.sha }}
        run: python3 "$CHELIS_TOOLCHAIN/scripts/drift_report_issue.py"

  # These shells compile Chelis through `../chelis` Cargo path dependencies.
  # Run those source builds with the pinned Chelis project environment. The
  # separate drift job retains the off-Nix binary-consumer proofs.
  drift-source:
    name: ${{ matrix.repo }} (cargo source) vs chelis HEAD
    needs: build-chelis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The canary verifies source compatibility, not release-pin cadence.
      # This waiver affects dependency compiler-pin equality only.
      CHELIS_REEF_ALLOW_DEP_COMPILER_DRIFT: "1"
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: octant
            reef_deps: "Chelis-Lang/nautilus@v0.7.41"
            token_repos: |-
              octant
              nautilus
            cargo_recipe: |
              chelis reef build
              cargo build --workspace --all-targets
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
              cargo fmt --all -- --check
          - repo: calcify
            reef_deps: "Chelis-Lang/nautilus@v0.7.33 Chelis-Lang/coral@v0.7.30"
            token_repos: |-
              calcify
              nautilus
              coral
            cargo_recipe: |
              chelis reef build
              cargo build --workspace --all-targets
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
              cargo fmt --all -- --check
              cargo test --workspace --test e2e -- --include-ignored
              cargo test --workspace --test bridge -- --include-ignored
              cargo test --workspace --test verify -- --include-ignored
          - repo: hydronnx
            reef_deps: ""
            token_repos: hydronnx
            cargo_recipe: |
              python3 scripts/run_negative_tests.py
              python3 scripts/run_blocked_probes.py
              LD_LIBRARY_PATH="$CHELIS_PYTHON_WHEEL_LIBRARY_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
                uv run --with 'onnx>=1.16' --with 'numpy>=1.26' --with 'onnxruntime>=1.17' \
                python3 scripts/gen_tabular_model.py
              LD_LIBRARY_PATH="$CHELIS_PYTHON_WHEEL_LIBRARY_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
                uv run --with 'onnx>=1.16' --with 'numpy>=1.26' \
                python3 scripts/gen_fixtures.py
              LD_LIBRARY_PATH="$CHELIS_PYTHON_WHEEL_LIBRARY_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
                uv run --with 'onnx>=1.16' --with 'numpy>=1.26' --with 'onnxruntime>=1.17' \
                python3 scripts/parity_check.py
              cargo build --all-targets
              cargo test
              cargo clippy --all-targets -- -D warnings
              cargo fmt -p hydronnx -- --check
              chelis lint --check .
    steps:
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition

      - name: Mint per-shell App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Chelis-Lang
          permission-contents: read
          permission-issues: write
          repositories: ${{ matrix.token_repos }}

      - name: Checkout ${{ matrix.repo }} at main
        uses: actions/checkout@v6
        with:
          repository: Chelis-Lang/${{ matrix.repo }}
          ref: main
          token: ${{ steps.token.outputs.token }}
          path: shell

      - name: Checkout chelis HEAD as sibling (cargo path dep)
        uses: actions/checkout@v6
        with:
          repository: Chelis-Lang/chelis
          ref: ${{ github.sha }}
          path: chelis

      - name: Download HEAD toolchain artifact
        uses: actions/download-artifact@v7
        with:
          name: chelis-head-toolchain
          path: toolchain

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Extract HEAD toolchain
        run: |
          set -euo pipefail
          tar -xzf toolchain/chelis-head-toolchain.tar.gz -C toolchain
          tdir="$GITHUB_WORKSPACE/toolchain/chelis-head-toolchain"
          echo "CHELIS_TOOLCHAIN=${tdir}" >> "$GITHUB_ENV"

      - name: Verify the consumer uses Chelis source dependencies
        id: classify
        working-directory: chelis
        run: |
          devenv-retry --profile ci shell --no-tui -- python \
            "$CHELIS_TOOLCHAIN/scripts/ci_detect_chelis_path_deps.py" \
            "$GITHUB_WORKSPACE/shell" "$GITHUB_WORKSPACE/chelis" \
            --expect present

      - name: Put HEAD chelis on PATH
        run: |
          set -u
          test -n "$CHELIS_TOOLCHAIN"
          echo "$CHELIS_TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Verify HEAD chelis on PATH
        working-directory: chelis
        run: |
          devenv-retry --profile ci shell --no-tui -- bash -euo pipefail -c '
            got="$(chelis --version | cut -d " " -f 2)"
            test "$got" = "${{ needs.build-chelis.outputs.chelis_version }}"
            echo "chelis ${got} (HEAD) on PATH"
          '

      - name: Install HEAD chelis-std into local registry
        working-directory: chelis
        run: devenv-retry --profile ci shell --no-tui -- chelis reef install --from-monorepo "$CHELIS_TOOLCHAIN" chelis-std

      - name: Install released reef dependencies
        if: matrix.reef_deps != ''
        working-directory: chelis
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          devenv-retry --profile ci shell --no-tui -- bash -euo pipefail -c '
            for dep in ${{ matrix.reef_deps }}; do
              echo "::group::reef install ${dep}"
              chelis reef install --from-github "$dep"
              echo "::endgroup::"
            done
          '

      - name: Repin shell to HEAD chelis
        working-directory: chelis
        run: |
          devenv-retry --profile ci shell --no-tui -- python \
            "$CHELIS_TOOLCHAIN/scripts/drift_repin_compiler.py" \
            "$GITHUB_WORKSPACE/shell" \
            "${{ needs.build-chelis.outputs.chelis_version }}"

      - name: Cache cargo registry and build (${{ matrix.repo }})
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
          shared-key: drift-${{ matrix.repo }}
          cache-on-failure: false

      # The Devenv Linux shell supplies GCC and OpenBLAS for each downstream
      # C link. The recipe runs in a child shell inside that environment.
      - name: Cargo gate (${{ matrix.repo }} vs HEAD)
        working-directory: chelis
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          CARGO_RECIPE: ${{ matrix.cargo_recipe }}
        run: |
          devenv-retry --profile ci shell --no-tui -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE/shell"
            exec bash -euo pipefail -c "$CARGO_RECIPE"
          '

      - name: Conformance audit (advisory, ${{ matrix.repo }} vs HEAD)
        if: always()
        continue-on-error: true
        working-directory: chelis
        run: |
          devenv-retry --profile ci shell --no-tui -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE/shell"
            echo "::group::chelis reef conform audit (advisory)"
            chelis reef conform audit || echo "::warning::conformance gaps in ${{ matrix.repo }}"
            echo "::endgroup::"
          '

      # Report source drift only after the classifier confirms this partition.
      # A classifier failure is a Chelis CI failure, not a shell regression.
      - name: File/update drift tracking issue
        if: always() && steps.classify.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHELL_REPO: ${{ matrix.repo }}
          JOB_STATUS: ${{ job.status }}
          HEAD_VERSION: ${{ needs.build-chelis.outputs.chelis_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHELIS_SHA: ${{ github.sha }}
        run: python3 "$CHELIS_TOOLCHAIN/scripts/drift_report_issue.py"
