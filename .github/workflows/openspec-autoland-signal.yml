name: OpenSpec autoland signal

# Fire a `workflow_run` event for a branch push. That is all this does.
#
# This workflow runs the PUSHED BRANCH's copy of itself, so whoever pushed
# wrote it. It therefore holds NO permissions and does NO work: it starts
# nothing, reads nothing, writes nothing, and produces no output, artifact,
# or conclusion that anything downstream consults.
#
# `openspec-autoland-controller.yml` reacts to this run. It runs the
# DEFAULT BRANCH's copy of itself and re-derives every fact it acts on from
# the API: the event type, the head repository, the branch, the commit, and
# whether that commit is still the branch head. It reads nothing this run
# produced -- not even whether it succeeded.
#
# So the only influence a rewritten copy of this file has is to decline to
# run at all, which stops autoland for that push. Failing closed is the
# correct direction, and it is the whole attack surface.
#
# `branches-ignore` keeps the default branch out, so a merge landing on
# `main` cannot start another cycle.

on:
  push:
    branches-ignore:
      - main
    # An ordinary code push should start nothing at all. Filtering here is
    # safe even though this file is head-controlled: widening it only
    # produces a run the controller then refuses, and narrowing it only
    # stops the pusher's own change from landing automatically.
    paths:
      - "openspec/**"

permissions: {}

concurrency:
  group: openspec-autoland-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    name: openspec-autoland-signal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the push
        run: |
          echo "A push happened. The controller decides what it means."
