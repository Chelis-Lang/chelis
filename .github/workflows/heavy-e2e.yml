name: Heavy E2E

# The heavyweight end-to-end suite: tests that run a real `chelis build`
# + gcc + run, a real `reef build` / `reef install`, or a full-stdlib
# `chelis check`. Each re-typechecks or rebuilds the whole chelis-std
# transitive graph and costs 9-28s wall, and nextest cannot parallelize
# within a single test, so they set a hard multi-minute wall-clock floor.
# They are high-level end-to-end signal, not inner-loop coverage, so they
# are OFF the per-PR `Integration Tests` gate and run here instead.
#
# This workflow runs on a nightly schedule and on manual dispatch ONLY.
# It does NOT run per-PR and does NOT run on push-to-main. The exact set
# of tests is the `nightly` nextest profile's default-filter in
# `.config/nextest.toml`; the per-PR `ci` profile excludes exactly that
# set, so a test is on the per-PR gate XOR this nightly gate.

on:
  schedule:
    # 07:00 UTC daily. Off-peak; no per-PR latency impact.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  heavy-e2e:
    name: Heavy E2E (Linux)
    runs-on: ubuntu-latest
    # The suite is ~27s of test wall on a fast box; allow generous head
    # room for a slow runner plus compilation cache miss.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libopenblas-dev libasan8 libubsan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `.cargo/config.toml` sets `PYO3_PYTHON=.venv/bin/python`; CI
      # runners need a matching uv-managed venv before any cargo run
      # (pyo3-build-config is a transitive build-dep that runs before
      # main compilation). See ci.yml lint-and-unit job for the same
      # pattern and for why the version is pinned to v8.1.0 rather
      # than @v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create uv-managed venv + wire libpython rpath
        run: python3 scripts/ci_setup_uv_python.py

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The `nightly` nextest profile (.config/nextest.toml) selects
      # exactly the heavy e2e suite via its default-filter and sets
      # `retries = 2` so a transient gcc/CPU-contention hiccup does not
      # fail the run. This is the only place the `nightly` profile is
      # used.
      - name: Heavy e2e suite
        run: cargo nextest run --workspace --profile nightly

      # The chelis-std in-language self-test corpus (packages/chelis-std/tests/,
      # run via `chelis test tests/`). Its integration test is #[ignore] (a
      # ~170s manual gate), so NOTHING in CI exercised it — neither the per-PR
      # gate nor `--profile nightly` runs ignored tests, and the corpus rotted
      # silently (chelis#332/#333). Run it explicitly here so a regression in a
      # chelis-std module surfaces nightly. `if: always()` so it runs even when
      # the heavy e2e suite above fails (independent signal).
      - name: chelis-std self-test corpus
        if: always()
        run: cargo test -p chelis-cli --test chelis_std_self_test_corpus -- --ignored --nocapture

  # Surface a nightly failure as a tracking issue (opens on failure, closes on
  # green) so a red nightly is impossible to miss — scheduled-run failures do
  # not show a red status on main, which is how both nightlies stayed red for
  # days unnoticed.
  report:
    name: Surface nightly status
    needs: heavy-e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close nightly-failure tracking issue
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.heavy-e2e.result }}
        with:
          script: |
            const title = 'Nightly failing: Heavy E2E';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (process.env.RESULT === 'failure') {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **Heavy E2E** nightly failed.\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the nightly next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (process.env.RESULT === 'success' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Nightly green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
