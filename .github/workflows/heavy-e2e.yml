name: Heavy E2E

# The heavyweight end-to-end suite: tests that run a real `chelis build`
# + gcc + run, a real `reef build` / `reef install`, or a full-stdlib
# `chelis check`. Each re-typechecks or rebuilds the whole chelis-std
# transitive graph and costs 9-28s wall, and nextest cannot parallelize
# within a single test, so they set a hard multi-minute wall-clock floor.
# They are high-level end-to-end signal, not inner-loop coverage, so they
# are OFF the per-PR `Integration Tests` gate and run here instead.
#
# This workflow runs on a nightly schedule and on manual dispatch ONLY.
# It does NOT run per-PR and does NOT run on push-to-main. The exact set
# of tests is the `nightly` nextest profile's default-filter in
# `.config/nextest.toml`; the per-PR `ci` profile excludes exactly that
# set, so a test is on the per-PR gate XOR this nightly gate.

on:
  schedule:
    # 08:00 UTC daily. Off-peak; no per-PR latency impact. Staggered off
    # 07:00 so it does not collide with conformance-nightly.yml (which also
    # runs at 07:00) for runner-minutes and disk on the shared scheduler.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  heavy-e2e:
    name: Heavy E2E (Linux)
    runs-on: ubuntu-latest
    # The suite is ~27s of test wall on a fast box; allow generous head
    # room for a slow runner plus compilation cache miss.
    timeout-minutes: 30
    # Strip debuginfo from the dev/test build. Debuginfo is the dominant
    # disk consumer in target/ and this end-to-end suite needs no symbols;
    # dropping it (alongside the free-disk step below) is what keeps the
    # workspace build off "No space left on device" / ld bus-error (signal 7).
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6

      # Free ~25-30 GB before the cargo build; see
      # Chelis-Lang/ci reclaim-ubuntu-runner-disk. This is
      # the in-repo free-disk step every ci.yml build job already runs; the
      # heavy-e2e job was the only build job missing it, which is why its
      # workspace build exhausted the runner disk.
      - name: Free disk space (Ubuntu)
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition

      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      # The Devenv shell composes the private Chelis-Lang/ci consumer module,
      # so Nix needs a token to fetch it (same pattern as nix-packages.yml).
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      # Devenv activates its Python virtual environment and sets
      # PYO3_PYTHON before each cargo invocation.
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # The `nightly` nextest profile (.config/nextest.toml) selects
      # exactly the heavy e2e suite via its default-filter and sets
      # `retries = 2` so a transient gcc/CPU-contention hiccup does not
      # fail the run. This is the only place the `nightly` profile is
      # used.
      - name: Heavy e2e suite
        run: devenv-retry --profile ci shell --no-tui -- cargo nextest run --workspace --profile nightly

      # The chelis-std in-language self-test corpus (packages/chelis-std/tests/,
      # run via `chelis test tests/`). Its integration test is #[ignore] (a
      # ~170s manual gate), so NOTHING in CI exercised it — neither the per-PR
      # gate nor `--profile nightly` runs ignored tests, and the corpus rotted
      # silently (chelis#332/#333). Run it explicitly here so a regression in a
      # chelis-std module surfaces nightly. `if: always()` so it runs even when
      # the heavy e2e suite above fails (independent signal).
      - name: chelis-std self-test corpus
        if: always()
        run: devenv-retry --profile ci shell --no-tui -- cargo test -p chelis-cli --test chelis_std_self_test_corpus -- --ignored --nocapture

  # Surface a nightly failure as a tracking issue (opens on failure, closes on
  # green) so a red nightly is impossible to miss — scheduled-run failures do
  # not show a red status on main, which is how both nightlies stayed red for
  # days unnoticed.
  report:
    name: Surface nightly status
    needs: heavy-e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#53 selective retry

      - name: Open or close the nightly tracking issue
        uses: Chelis-Lang/ci/actions/nightly-status@111b5865ccf04146344ad99dcdea9d724d65fc69 # ci#50 shared composition
        with:
          github-token: ${{ github.token }}
          result: ${{ needs.heavy-e2e.result }}
          issue-title: "Nightly failing: Heavy E2E"
          issue-body: |
            The **Heavy E2E** nightly failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: `${{ github.sha }}`

            Auto-opened on failure; auto-closes when the nightly next passes.
          issue-label: nightly-failure
          recovery-comment: >-
            Nightly green again — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Closing.
