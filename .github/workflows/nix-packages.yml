      - name: Check the Devenv package outputs
        run: .venv/bin/python scripts/check_devenv_package_outputs.py .devenv-package-outputs.json .devenv-workspace-graph.json
      - name: Run the Nix flake contract suite
        run: .venv/bin/python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Export the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit != 'true'
        run: python3 -c 'import subprocess; out = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.aarch64-darwin.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--to", "file:///tmp/chelis-cvc5-cache", out], check=True)'
