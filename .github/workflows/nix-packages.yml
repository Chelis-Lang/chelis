        id: cvc5-key
        run: python3 -c 'import os, pathlib, subprocess; drv = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.aarch64-darwin.cvc5-dir.drvPath"], text=True).strip(); pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("key=" + pathlib.Path(drv).name + "\n")'
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chelis-cvc5-cache
          key: nix-cvc5-${{ steps.cvc5-key.outputs.key }}
      - name: Import the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit == 'true'
        run: python3 -c 'import subprocess; out = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.aarch64-darwin.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--from", "file:///tmp/chelis-cvc5-cache", "--no-check-sigs", out], check=True)'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Create the project Python environment
        run: uv venv --python 3.11 .venv
      - name: Run the Devenv input and composition tests
        run: .venv/bin/python -m unittest scripts.test_devenv_version scripts.test_devenv_composition scripts.test_check_nix_lock_parity
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Build all Devenv package outputs
        run: devenv build --no-tui outputs.chelis outputs.chelis-runtime outputs.chelisup outputs.default > .devenv-package-outputs.json
