name: Nix Packages

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: nix-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The complete native package checks take tens of minutes on hosted
    # runners, so they run only on an explicit dispatch or a published release.
    env:
      # max-jobs bounds concurrent derivation builds to the hosted runner
      # memory; cores = 0 gives each build every runner core.
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      # The hosted runner root disk cannot hold the cold Nix closure next to
      # the preinstalled toolchains this job never uses.
      - name: Reclaim runner disk space
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
      - uses: actions/checkout@v6
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry
      # The Devenv shell composes the private Chelis-Lang/ci consumer module, so
      # Nix needs a token to fetch it. Mint a short-lived, contents:read token
      # scoped to ci from the CI GitHub App and append it to NIX_CONFIG.
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "x86_64-linux", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: x86_64-linux
      - name: Run the Devenv shell smoke checks
        run: devenv-retry test --no-tui
      - name: Build the Devenv package outputs
        run: devenv-retry build --no-tui outputs.chelis outputs.chelis-runtime outputs.chelisup
      - name: Run the Nix flake contract suite
        run: devenv-retry --profile ci shell --no-tui -- python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: x86_64-linux
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    # Keep release and manual coverage native on both supported systems.
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 1
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#54 colored selective retry
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@a3b3e8ee939270649370826d62085c04342fd9e9 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "aarch64-darwin", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: aarch64-darwin
      - name: Run the Devenv shell smoke checks
        run: devenv-retry test --no-tui
      - name: Build the Devenv package outputs
        run: devenv-retry build --no-tui outputs.chelis outputs.chelis-runtime outputs.chelisup
      - name: Run the Nix flake contract suite
        run: devenv-retry --profile ci shell --no-tui -- python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: aarch64-darwin
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}
