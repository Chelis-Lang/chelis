name: Nix Packages

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: nix-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Retain native check budgets plus 25 minutes for cold Devenv realization.
  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('{"group":"chelis-ci-trusted","labels":"chelis-ci-warm-x64"}') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 135
    # Only reviewed manual-main builds use the protected pool. Release tags
    # and branch validation remain hosted; the host independently checks the pin.
    env:
      # Bound concurrent derivations and retain signature verification on
      # both the protected runner and the hosted release fallback.
      NIX_CONFIG: |
        sandbox = true
        require-sigs = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    steps:
      - name: Reclaim hosted runner disk space
        if: runner.environment == 'github-hosted'
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@e7b00e437d6dc1aef7eb2093661219b298073c2c
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@0b5faba5025fade929194b46a9e52e43fec63462
      - name: Activate the project CI environment
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: python scripts/ci_devenv.py
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "x86_64-linux", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Restore protected real-workload caches
        id: build-cache
        if: runner.environment != 'github-hosted'
        uses: Chelis-Lang/ci/actions/restore-build-cache@2c21438c4308ec6e475eda7d54c5f37331965e6f
        with:
          mode: read-write
          kache-binary: ${{ env.RUSTC_WRAPPER }}
      - name: Declare the activated profile cache root
        if: steps.build-cache.outcome == 'success'
        run: python scripts/ci_nix_cache_roots.py
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Run the Nix flake contract suite
        run: python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Declare completed native check cache roots
        if: steps.build-cache.outcome == 'success'
        run: python scripts/ci_nix_cache_roots.py --checks
      - name: Publish verified outputs and clean cache state
        if: always() && steps.build-cache.outcome == 'success'
        uses: Chelis-Lang/ci/actions/publish-build-cache@2c21438c4308ec6e475eda7d54c5f37331965e6f
        with:
          state-path: ${{ steps.build-cache.outputs.state-path }}

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    # Keep release and manual coverage native on both supported systems.
    runs-on: macos-latest
    timeout-minutes: 145
    env:
      NIX_CONFIG: |
        sandbox = true
        require-sigs = true
        max-jobs = 1
        cores = 0
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@0b5faba5025fade929194b46a9e52e43fec63462
      - name: Activate the project CI environment
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: python scripts/ci_devenv.py
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "aarch64-darwin", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Run the Nix flake contract suite
        run: python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
