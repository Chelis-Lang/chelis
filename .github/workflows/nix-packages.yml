name: Nix Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same docs-only detector as ci.yml's `changes` job (chelis#419). The
  # Nix package build lives in its own workflow file, so `needs:` cannot
  # reach ci.yml's changes job; this replicates it here so the
  # `Nix Packages (x86_64-linux)` context skips on a docs-only PR (a
  # skipped required job reports success) while running on every code PR
  # and push. The darwin job keeps its own manual-dispatch gate.
  changes:
    name: Detect docs-only changes (nix)
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # Shallow checkout (depth 1) on every event: the local
      # detect-docs-only action needs the repo on disk. See ci.yml's
      # changes job.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Compute docs_only
        id: detect
        uses: ./.github/actions/detect-docs-only

  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success, and the `if` fails safe (runs when the changes job did
    # not succeed) so a broken detector never skips the build on a code
    # PR. Only package derivations are content-addressed away from
    # prose; the runner still cold-builds them, so a pure-prose PR
    # skips the whole job instead.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      # max-jobs bounds concurrent derivation builds to the hosted runner
      # memory; cores = 0 gives each build every runner core.
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      # The hosted runner root disk cannot hold the cold Nix closure next to
      # the preinstalled toolchains this job never uses.
      - name: Reclaim runner disk space
        uses: Chelis-Lang/ci/actions/reclaim-ubuntu-runner-disk@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
      - uses: actions/checkout@v6
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry
      # The Devenv shell composes the private Chelis-Lang/ci consumer module, so
      # Nix needs a token to fetch it. Mint a short-lived, contents:read token
      # scoped to ci from the CI GitHub App and append it to NIX_CONFIG.
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "x86_64-linux", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: x86_64-linux
      - name: Run the Devenv shell smoke checks
        run: devenv-retry test --no-tui
      - name: Build the Devenv package outputs
        run: devenv-retry build --no-tui outputs.chelis outputs.chelis-runtime outputs.chelisup
      - name: Run the Nix flake contract suite
        run: devenv-retry --profile ci shell --no-tui -- python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: x86_64-linux
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    # Manual gate: hosted macOS runners are the scarcest CI resource, so
    # pull requests run only the Linux job. Dispatch this workflow to run
    # the identical darwin check set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 1
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#54 colored selective retry
      - name: Authenticate the private ci input
        uses: Chelis-Lang/ci/actions/authenticate-private-ci-input@9d4d4c59e46a0672b5e17a5644e99700821c87e6 # ci#50 shared composition
        with:
          app-client-id: ${{ vars.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "aarch64-darwin", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: ./.github/actions/cvc5-cache-restore
        with:
          system: aarch64-darwin
      - name: Run the Devenv shell smoke checks
        run: devenv-retry test --no-tui
      - name: Build the Devenv package outputs
        run: devenv-retry build --no-tui outputs.chelis outputs.chelis-runtime outputs.chelisup
      - name: Run the Nix flake contract suite
        run: devenv-retry --profile ci shell --no-tui -- python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Save the cvc5 toolchain closure
        uses: ./.github/actions/cvc5-cache-save
        with:
          system: aarch64-darwin
          cache-hit: ${{ steps.cvc5-cache.outputs.cache-hit }}
          key: ${{ steps.cvc5-cache.outputs.key }}
