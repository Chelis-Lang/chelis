name: Nix Packages

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
