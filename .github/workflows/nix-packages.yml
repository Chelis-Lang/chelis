name: Nix Packages

on:
  workflow_dispatch:
  release:
    types: [published]
  # The nightly run builds and publishes the default branch when the
  # chelis-lang cache does not hold its packages.
  schedule:
    - cron: '37 2 * * *'

# A scheduled run must not cancel a manual dispatch on the same branch.
concurrency:
  group: nix-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reserve headroom for cold Devenv realization before native checks.
  # A scheduled run skips this job when the cache-status job below finds
  # every package path in the cache. A failed cache report leaves
  # `complete` empty, so the job runs.
  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    needs: [cache-status]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.cache-status.outputs.complete != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 135
    # Native package acceptance runs on the hosted builder on every ref.
    # A protected-runner startup failure must not leave main without checks.
    env:
      # Bound concurrent derivations and retain signature verification.
      # Read the cvc5 tree and the crate builds that main and release runs
      # push to the chelis-lang cache.
      NIX_CONFIG: |
        sandbox = true
        require-sigs = true
        max-jobs = 2
        cores = 0
        extra-substituters = https://chelis-lang.cachix.org
        extra-trusted-public-keys = chelis-lang.cachix.org-1:F4W65FQ7sunLoF2q6rzkWNTIBd3P/tJ/NFcv12OS9v8=
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim hosted runner disk space
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/vendor/ci/actions/reclaim-ubuntu-runner-disk
      - name: Set up portable Devenv
        uses: ./.github/actions/vendor/ci/actions/setup-devenv
      # The base configuration is the one that `devenv test` uses. The ci
      # profile adds OpenBLAS and the numeric cache, which no step here uses.
      - name: Activate the project CI environment
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: python scripts/ci_devenv.py --profile base
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "x86_64-linux", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Run the Nix flake contract suite
        run: python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      # Every run lists the paths that a main or tag run pushes, so a branch
      # dispatch proves that the Devenv shell roots resolve.
      - name: List the paths to publish to Cachix
        run: python scripts/publish_nix_cache.py --dry-run
      # release.yml dispatches this workflow on each release tag. The
      # schedule runs it on main, and a maintainer can dispatch it on main.
      # A run on any other ref pushes nothing.
      - name: Publish the packages and their build inputs to Cachix
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_DEPLOY }}
        run: python scripts/publish_nix_cache.py

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    needs: [cache-status]
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.cache-status.outputs.complete != 'true') }}
    # Keep release, scheduled, and manual coverage native on both systems.
    runs-on: macos-latest
    timeout-minutes: 145
    env:
      NIX_CONFIG: |
        sandbox = true
        require-sigs = true
        max-jobs = 1
        cores = 0
        extra-substituters = https://chelis-lang.cachix.org
        extra-trusted-public-keys = chelis-lang.cachix.org-1:F4W65FQ7sunLoF2q6rzkWNTIBd3P/tJ/NFcv12OS9v8=
    defaults:
      run:
        shell: chelis-ci-shell run {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up portable Devenv
        uses: ./.github/actions/vendor/ci/actions/setup-devenv
      - name: Activate the project CI environment
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
        run: python scripts/ci_devenv.py --profile base
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "aarch64-darwin", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Run the Nix flake contract suite
        run: python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: List the paths to publish to Cachix
        run: python scripts/publish_nix_cache.py --dry-run
      - name: Publish the packages and their build inputs to Cachix
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_DEPLOY }}
        run: python scripts/publish_nix_cache.py

  # Evaluate the package output paths of each supported system and ask the
  # chelis-lang cache for each one. A scheduled run skips the native jobs
  # when the cache holds every path. Manual and release runs use the
  # report only as information.
  cache-status:
    name: Nix cache status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up portable Devenv
        uses: ./.github/actions/vendor/ci/actions/setup-devenv
      - name: Check the chelis-lang cache for the package outputs
        id: status
        run: python3 scripts/nix_cache_status.py --github-output "$GITHUB_OUTPUT"
