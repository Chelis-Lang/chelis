name: Nix Packages

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: Configure the Devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
          skipPush: true
      - name: Install Devenv v2.2
        run: nix profile add github:cachix/devenv/ffce215a42d09c6375c3d60dd9c4110438fc4d87
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "x86_64-linux", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Create the project Python environment
        run: uv venv --python 3.11 .venv
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Run the Nix flake contract suite
        run: .venv/bin/python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: Configure the Devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
          skipPush: true
      - name: Install Devenv v2.2
        run: nix profile add github:cachix/devenv/ffce215a42d09c6375c3d60dd9c4110438fc4d87
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "aarch64-darwin", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Create the project Python environment
        run: uv venv --python 3.11 .venv
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Run the Nix flake contract suite
        run: .venv/bin/python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
