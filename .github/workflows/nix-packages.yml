name: Nix Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same docs-only detector as ci.yml's `changes` job (chelis#419). The
  # Nix package build lives in its own workflow file, so `needs:` cannot
  # reach ci.yml's changes job; this replicates it here so the
  # `Nix Packages (x86_64-linux)` context skips on a docs-only PR (a
  # skipped required job reports success) while running on every code PR
  # and push. The darwin job keeps its own manual-dispatch gate.
  changes:
    name: Detect docs-only changes (nix)
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # Shallow checkout (depth 1); deepen in bash since GitHub Actions
      # expressions have no arithmetic. See ci.yml's changes job.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Compute docs_only
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME): docs_only=false (full suite)"
            exit 0
          fi
          git fetch --depth=$((COMMITS + 1)) origin "$HEAD" 2>/dev/null || true
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          git diff --name-only "$BASE..$HEAD" \
            | python3 scripts/ci_detect_docs_only.py

  nix-linux-x86-64:
    name: Nix Packages (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Skip on docs-only PRs (chelis#419); a skipped required job reports
    # success, and the `if` fails safe (runs when the changes job did
    # not succeed) so a broken detector never skips the build on a code
    # PR. Only package derivations are content-addressed away from
    # prose; the runner still cold-builds them, so a pure-prose PR
    # skips the whole job instead.
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    env:
      # max-jobs bounds concurrent derivation builds to the hosted runner
      # memory; cores = 0 gives each build every runner core.
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 2
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      # The hosted runner root disk cannot hold the cold Nix closure next to
      # the preinstalled toolchains this job never uses.
      - name: Reclaim runner disk space
        shell: bash
        run: sudo python3 -c 'import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ("/usr/share/dotnet", "/usr/local/lib/android", "/usr/local/.ghcup", "/opt/hostedtoolcache/CodeQL")]'
      - uses: actions/checkout@v6
      - name: Set up portable Devenv
        uses: Chelis-Lang/ci/actions/setup-devenv@73f017c4d3179dc313844e9d5f08d17a7879c824 # ci#37 prerequisite
      - name: Verify the runner system
        run: python3 -c 'import subprocess; system = subprocess.check_output(["nix", "eval", "--impure", "--raw", "--expr", "builtins.currentSystem"], text=True).strip(); assert system == "x86_64-linux", system'
      - name: Verify the Nix sandbox
        run: python3 -c 'import subprocess; value = subprocess.check_output(["nix", "config", "show", "sandbox"], text=True).strip(); assert value == "true", value'
      - name: Compute the cvc5 toolchain cache key
        id: cvc5-key
        run: python3 -c 'import os, pathlib, subprocess; drv = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.x86_64-linux.cvc5-dir.drvPath"], text=True).strip(); pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("key=" + pathlib.Path(drv).name + "\n")'
      - name: Restore the cvc5 toolchain closure
        id: cvc5-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chelis-cvc5-cache
          key: nix-cvc5-${{ steps.cvc5-key.outputs.key }}
      - name: Import the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit == 'true'
        run: python3 -c 'import subprocess; out = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.x86_64-linux.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--from", "file:///tmp/chelis-cvc5-cache", "--no-check-sigs", out], check=True)'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Create the project Python environment
        run: uv venv --python 3.11 .venv
      - name: Run the Devenv input and composition tests
        run: .venv/bin/python -m unittest scripts.test_devenv_version scripts.test_devenv_composition scripts.test_check_nix_lock_parity
      - name: Run the Devenv shell smoke checks
        run: devenv test --no-tui
      - name: Build all Devenv package outputs
        run: devenv build --no-tui outputs.chelis outputs.chelis-runtime outputs.chelisup outputs.default > .devenv-package-outputs.json
      - name: Build the Devenv workspace graph artifact
        run: devenv build --no-tui chelis.rust.workspaceGraph.generatedCargoNix > .devenv-workspace-graph.json
      - name: Check the Devenv package outputs
        run: .venv/bin/python scripts/check_devenv_package_outputs.py .devenv-package-outputs.json .devenv-workspace-graph.json
      - name: Run the Nix flake contract suite
        run: .venv/bin/python scripts/test_nix_flake_contract.py
      - name: Run the complete native flake check set
        run: nix flake check --print-build-logs
      - name: Export the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit != 'true'
        run: python3 -c 'import subprocess; out = subprocess.check_output(["nix", "eval", "--raw", ".#legacyPackages.x86_64-linux.cvc5-dir.outPath"], text=True).strip(); subprocess.run(["nix", "copy", "--to", "file:///tmp/chelis-cvc5-cache", out], check=True)'
      - name: Save the cvc5 toolchain closure
        if: steps.cvc5-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/chelis-cvc5-cache
          key: nix-cvc5-${{ steps.cvc5-key.outputs.key }}

  nix-darwin-arm64:
    name: Nix Packages (aarch64-darwin)
    # Manual gate: hosted macOS runners are the scarcest CI resource, so
    # pull requests run only the Linux job. Dispatch this workflow to run
    # the identical darwin check set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        sandbox = true
        max-jobs = 1
        cores = 0
    defaults:
      run:
        shell: devenv-ci bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Set up portable Devenv
