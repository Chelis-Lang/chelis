name: OpenSpec autoland validation

# Strict OpenSpec validation of the pull-request head, published as a
# check run the merge worker requires.
#
# This workflow runs on `pull_request`, so the file that runs IS supplied
# by the pull request. That is safe here for two reasons, and only for
# those two reasons:
#
#   1. It holds no write permission and no secret. The worst a rewritten
#      copy can do is lie about its own result.
#   2. The merge worker does not take that result on trust. Before merging,
#      it verifies from the BASE revision that the head's `.github`,
#      `scripts`, Devenv, Nix, and toolchain trees are byte-identical to
#      the base's. If they are, this file is the base's file, and its
#      conclusion is the base's conclusion. If they are not, the worker
#      refuses and this result is never consulted.
#
# The job runs in `enforce` mode: a schema finding fails the check. The
# advisory `openspec-validate` workflow keeps its own disposition, because
# a finding there is a warning for a human who is already reading the
# change, while a finding here is the difference between merging and not.
#
# The JOB NAME below is the check-run context that
# `openspec-autoland.yml` requires by name. Renaming the job renames the
# context and the merge worker will refuse every pull request until the
# two agree again. `scripts/test_openspec_autoland_workflow.py` asserts
# they match.
#
# The name is not the guarantee, though: any workflow can publish a job
# with any name, and anyone with write access can post a commit status with
# any context. So the merge worker also requires a successful run of THIS
# FILE, by file name, on the exact head sha, under the `pull_request`
# event. Two consequences: this file must not be renamed without updating
# `--require-workflow` in `openspec-autoland.yml`, and `pull_request` must
# remain its only trigger, because a run under any other event validates a
# different tree and the worker ignores it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "openspec/**"

permissions:
  contents: read

concurrency:
  group: openspec-autoland-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenSpec Strict Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the OpenSpec tree
        uses: Chelis-Lang/ci/actions/openspec-governance@74f11c693992cfa9278b93b0117778f6b38bfe16 # ci#32 with ci#30 advisory mode
        with:
          mode: enforce
