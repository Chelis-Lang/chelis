[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "chelis"
version = "0.1.0"
description = "Python bindings for the Chelis compiler and tensor interop surface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "ml_dtypes==0.6.0",
  "packaging>=24",
  "safetensors>=0.5",
]

[tool.maturin]
manifest-path = "../../crates/chelis-python/Cargo.toml"
module-name = "chelis._native"
python-source = "."
features = ["extension-module"]
