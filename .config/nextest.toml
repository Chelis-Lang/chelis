# cargo-nextest configuration.
#
# Profiles:
#   default  - local `cargo nextest run`. Fast suite only; heavy e2e is excluded.
#   ci       - per-PR `Workspace Tests` job, via `scripts/gate.py integration`.
#              Fast suite plus JUnit timing XML. Complete test binaries named
#              by the parallel required dtype oracle's `--test` arguments run
#              only in that job.
#   ci-full  - the default per-PR scope plus JUnit output. Explicit-filter
#              lanes use `--ignore-default-filter` with this profile, while
#              macOS inherits the ordinary default scope unchanged.
#   nightly  - the `Heavy E2E` workflow (.github/workflows/heavy-e2e.yml), which
#              runs on a nightly `schedule:` and on `workflow_dispatch:` ONLY.
#              Runs exactly the heavy e2e suite the other two profiles exclude.
#
# Heavy e2e == tests that run a real `chelis build` + gcc + run, or a real
# `reef build` / `reef install`. Each one rebuilds the whole chelis-std
# transitive graph and costs 10-28s wall, and nextest cannot parallelize
# within a single test, so leaving them on the per-PR gate sets a hard
# multi-minute wall-clock floor. They are high-level end-to-end signal, not
# inner-loop coverage, so they move to a nightly job. The
# contention-independent unit/integration coverage they sit on top of stays
# on the per-PR gate.
#
# Every profile disables fail-fast so one failure cannot hide later failures.
# Gate commands also pass `--no-fail-fast` explicitly; the profile setting
# extends the same diagnostic behavior to direct and non-gate CI invocations.
#
# `production_stdlib_typechecks` (one `chelis check` per stdlib file) was in
# the heavy set before the cross-process typecheck cache landed. With the
# cache, those checks are warm-cache fast and back on the per-PR gate.
#
# The heavy set is named explicitly (not by a heuristic) so adding or removing
# a heavy test is a reviewable diff. The selection is shared between the
# fast-suite exclusion and the nightly inclusion via the `heavy-e2e` filterset
# below being negated in `default`/`ci` and used positively in `nightly`.
#
# Grep targets if this needs revisiting:
#   - real chelis build + gcc + run / reef build / reef install

# The wire and PyO3 binding authority tests both run nested Cargo sequences in
# target/agents/729-capacity-rustdoc. The target's nonblocking lease must keep
# rejecting unscheduled interleaving, so nextest gives the two actual owners one
# shared execution slot. Every custom profile inherits this override from
# `default`, including explicit-filter runs with `--ignore-default-filter`.
[test-groups]
capacity-rustdoc-verifiers = { max-threads = 1 }

[profile.default]
fail-fast = false
default-filter = '''
    not (
        binary_id(/^chelis-cli::stdlib_typecheck_cache_oracle$/)
        + binary_id(/^chelis-cli::stdlib_typecheck_cache_concurrency$/)
        + binary_id(/^chelis-cli::monomorphization_build$/)
        + (binary_id(/^chelis-cli::cli$/) & test(/^phase3a_reef_std_acceptance_oracle$/))
        + (binary_id(/^chelis-cli::cli$/) & test(/^reef_check_accepts_sig_only_shell_imports$/))
        + (binary_id(/^chelis-cli::cli$/) & test(/^reef_build_emits_shell_and_archive$/))
        + (binary_id(/^chelis-cli::bundled_chelis_std_loader$/) & test(/^phaseA_bundled_chelis_std_loader_property_oracle$/))
        + (binary_id(/^chelis-cli::reef_install_from_monorepo$/) & test(/^reef_install_from_monorepo_populates_registry_and_unblocks_check$/))
        + (binary_id(/^chelis-cli::issue_1293_redteam_round4$/) & test(/^recursive_list_tuple_and_adt_cotangents_match_in_eval_and_c$/))
    )
'''

[[profile.default.overrides]]
filter = '''(binary_id(/^chelis-compiler-api::capacity_census_wire$/) & test(/^wire_schema_numeric_fields_match_the_reviewed_baseline$/)) + (binary_id(/^chelis-python::capacity_census_bindings$/) & test(/^registered_pyfunctions_match_the_reviewed_rustdoc_signatures$/))'''
test-group = "capacity-rustdoc-verifiers"

# chelis#1831 per-test backstop for the profiles unattended jobs run.
#
# Without a `terminate-after`, nextest prints `SLOW [> Ns]` every 60 seconds
# forever and never kills the test. One pathological row then consumes the
# whole hosted budget and the job dies by `timeout-minutes` with no JUnit, no
# summary and no attribution: in dispatch 34615787779, three of four
# `Full Workspace (Linux, shard N/4)` jobs were cancelled at 60 minutes, two of
# them on their LAST test, and reported nothing.
#
# The period comes from measured rows, not a round number. The 10,362 test
# durations in nightly 34558777344's JUnit split cleanly in two:
#
#   p50 0.0 s, p90 0.6 s, p99 13.1 s, p99.9 105.6 s
#   slowest healthy row  223.8 s  runtime_extent_claim_preparation::
#                                 omitted_extent_claim_contract
#   ------------------------------ 2.7x gap ------------------------------
#   the tracked chelis#1829/#1830 JSON+CSV interpreter family, 7 rows,
#   607.5 s .. 2340.7 s, all PASSING; slowest is
#   csv_io::csv_io_end_to_end_is_exact_and_byte_stable at 2340.7 s.
#
# 3000 s (50 x 60 s) sits above the slowest measured PASSING row with 28%
# headroom and below the 60-minute job budget. That is deliberate: choosing a
# period inside the second group would convert chelis#1830 from a slow row
# into a failing row, which is a disposition decision that issue owns (either
# `#[ignore]` plus a manual gate, or fix the interpreter), not one a CI
# backstop should make on its behalf. What this setting buys today is the
# unbounded case: a row that never returns is killed and the rest of the run
# still reports. It does not, on its own, rescue a 60-minute shard that spends
# 2900 s inside that family.
#
# The 60-second period is nextest's own warning cadence, kept so the `SLOW`
# lines in existing logs do not change shape.
#
# REVISIT THIS PERIOD when chelis#1829 resolves. The second cluster is a
# tracked regression, not inherent cost. chelis#1830 measured the same rows on
# the `ci` profile in run 34485518418 (2026-09-10 13:54 UTC, head f5c2a1ea8):
# csv_io_end_to_end 13.889 s, json_io_end_to_end 8.093 s, json_io_missing_path
# 6.210 s, which is where they regressed 168x to 207x from. So 3000 s is sized
# around a defect that is expected to disappear, and it must not calcify as if
# it described this suite's real shape. When those rows return to seconds, drop
# this to roughly 600 s (10 periods, 2.7x the slowest healthy row) and delete
# this paragraph. chelis#1830 is closed as not-planned and is kept here as the
# measurement record; chelis#1829 owns the disposition.
#
# The `default` profile deliberately carries NO backstop: a developer
# workstation running several agents is exactly the contention case
# chelis#1607 recorded, where a load-sensitive cap fires as a phantom failure.
# `scripts/test_ci_cadence.py::terminate_after` locks that every profile a
# hosted job names carries this setting.

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 50 }
# Keep the local fast-suite scope, then delegate every complete test binary
# named by a required Phase 0-3 oracle `--test` argument. Selector-based `-E`
# legs remain in both jobs, including expressions with whole-binary arms. The
# executable manifest guard derives this list through the inheritance chain.
default-filter = '''
    not (
        binary_id(/^chelis-cli::stdlib_typecheck_cache_oracle$/)
        + binary_id(/^chelis-cli::stdlib_typecheck_cache_concurrency$/)
        + binary_id(/^chelis-cli::monomorphization_build$/)
        + (binary_id(/^chelis-cli::cli$/) & test(/^phase3a_reef_std_acceptance_oracle$/))
        + (binary_id(/^chelis-cli::cli$/) & test(/^reef_check_accepts_sig_only_shell_imports$/))
        + (binary_id(/^chelis-cli::cli$/) & test(/^reef_build_emits_shell_and_archive$/))
        + (binary_id(/^chelis-cli::bundled_chelis_std_loader$/) & test(/^phaseA_bundled_chelis_std_loader_property_oracle$/))
        + (binary_id(/^chelis-cli::reef_install_from_monorepo$/) & test(/^reef_install_from_monorepo_populates_registry_and_unblocks_check$/))
        + (binary_id(/^chelis-cli::issue_1293_redteam_round4$/) & test(/^recursive_list_tuple_and_adt_cotangents_match_in_eval_and_c$/))
        + binary_id(/^chelis-backend-c::exec_compile$/)
        + binary_id(/^chelis-backend-c::host_emit_dtype_dispatch$/)
        + binary_id(/^chelis-cli::capacity_census_tripwire$/)
        + binary_id(/^chelis-cli::domain_checker$/)
        + binary_id(/^chelis-cli::dtype_phase2_reduction_matrix$/)
        + binary_id(/^chelis-cli::eval_tensor_narrowing_matrix$/)
        + binary_id(/^chelis-cli::fold_static_cond_matrix$/)
        + binary_id(/^chelis-cli::int_width_lane_matrix$/)
        + binary_id(/^chelis-cli::issue_680_int_exactness$/)
        + binary_id(/^chelis-cli::issue_687_rejected_cells_corpus$/)
        + binary_id(/^chelis-cli::issue_729_payload_census$/)
        + binary_id(/^chelis-cli::issue_734_tostring_placeholder$/)
        + binary_id(/^chelis-cli::issue_759_checked_cast_default$/)
        + binary_id(/^chelis-cli::issue_761_subnormal_ingress$/)
        + binary_id(/^chelis-cli::issue_860_checker_chokepoint$/)
        + binary_id(/^chelis-cli::narrow_dtype_matrix$/)
        + binary_id(/^chelis-cli::observation_roundtrip_harness$/)
        + binary_id(/^chelis-cli::parity$/)
        + binary_id(/^chelis-cli::parity_corpus_contract$/)
        + binary_id(/^chelis-cli::phase3_body_contract$/)
        + binary_id(/^chelis-cli::precision_matrix$/)
        + binary_id(/^chelis-cli::prove_int64_exactness$/)
        + binary_id(/^chelis-cli::reduction_and_bitwise_matrix$/)
        + binary_id(/^chelis-cli::scalar_stub_matrix$/)
        + binary_id(/^chelis-compiler-api::capacity_census_wire$/)
        + binary_id(/^chelis-compiler-api::dtype_kernel_boundary$/)
        + binary_id(/^chelis-e2e::eval_agreement$/)
        + binary_id(/^chelis-ir::dtype_kernel_boundary$/)
        + binary_id(/^chelis-prove::dtype_concrete_boundary$/)
        + binary_id(/^chelis-python::capacity_census_bindings$/)
        + binary_id(/^chelis-types::agreement_tolerance$/)
    )
'''

[profile.ci.junit]
# Written to `target/nextest/ci/junit.xml`. nextest places JUnit
# reports under `target/nextest/<profile>/<path>`.
path = "junit.xml"

# Cargo target selectors define this lane. The driver ignores default filters
# and verifies the exact compiled binary/test listing before execution.
[profile.ci-fast]
inherits = "default"
fail-fast = false
# chelis#1831: see the backstop note above `[profile.ci]`.
slow-timeout = { period = "60s", terminate-after = 50 }

[profile.ci-fast.junit]
path = "junit.xml"

[profile.ci-full]
inherits = "default"
fail-fast = false
# chelis#1831: see the backstop note above `[profile.ci]`.
slow-timeout = { period = "60s", terminate-after = 50 }

[profile.ci-full.junit]
# Explicit-filter and macOS lanes write one report per hosted runner without
# changing their selection contract.
path = "junit.xml"

# The #1294 oracle runs inside integration support. Its nested nextest must
# not overwrite the workspace shard's ci/ci-full execution receipts.
[profile.builtin-atom-closure]
inherits = "default"
fail-fast = false

[profile.builtin-atom-closure.junit]
path = "junit.xml"

[profile.nightly]
fail-fast = false
# Manual heavy-only selection; hosted extended validation is unfiltered. This
# default-filter is exactly the heavy set the `default` profile excludes.
# The `ci` profile additionally delegates binaries named by oracle `--test`
# arguments; scripts/test_nextest_profile_partition.py locks that handoff.
default-filter = '''
    binary_id(/^chelis-cli::stdlib_typecheck_cache_oracle$/)
    + binary_id(/^chelis-cli::stdlib_typecheck_cache_concurrency$/)
    + binary_id(/^chelis-cli::monomorphization_build$/)
    + (binary_id(/^chelis-cli::cli$/) & test(/^phase3a_reef_std_acceptance_oracle$/))
    + (binary_id(/^chelis-cli::cli$/) & test(/^reef_check_accepts_sig_only_shell_imports$/))
    + (binary_id(/^chelis-cli::cli$/) & test(/^reef_build_emits_shell_and_archive$/))
    + (binary_id(/^chelis-cli::bundled_chelis_std_loader$/) & test(/^phaseA_bundled_chelis_std_loader_property_oracle$/))
    + (binary_id(/^chelis-cli::reef_install_from_monorepo$/) & test(/^reef_install_from_monorepo_populates_registry_and_unblocks_check$/))
    + (binary_id(/^chelis-cli::issue_1293_redteam_round4$/) & test(/^recursive_list_tuple_and_adt_cotangents_match_in_eval_and_c$/))
'''
# chelis#1831: see the backstop note above `[profile.ci]`.
slow-timeout = { period = "60s", terminate-after = 50 }
# A transient gcc/CPU-contention hiccup should not fail a nightly job; retry
# the heavy tests rather than capping their concurrency (which would slow the
# per-PR gate, the exact regression this change reverses).
retries = 2

# The runtime representation oracle compares its frozen selection to this
# dedicated framework receipt. Nested CLI oracle tests cannot overwrite it.
[profile.runtime-representation]
fail-fast = false

[profile.runtime-representation.junit]
path = "junit.xml"

# chelis#2394: entirely ignored native producer scenarios have a dedicated
# explicit owner, not ordinary empty coverage. Use --run-ignored only,
# --ignore-default-filter and --no-tests fail with the exact producer target.
# Do not put this suite in the ordinary/nightly partition or an oracle that
# its nested Cargo producer builds could launch again.
[profile.runtime-identity-producers]
inherits = "default"
fail-fast = false
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 150 }

[profile.runtime-identity-producers.junit]
path = "junit.xml"
