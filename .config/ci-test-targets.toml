# The rows below own the opaque-invariants corpus, whose only CI consumer
# runs nightly: `chelis-cli::opaque_corpus_gate` runs each committed program
# against the live binary, and it is not a standing_target, so it reaches CI
# only through the nightly full workspace. `scripts/test_regen_all.py` does
# run per pull request, but its corpus tests exercise
# `regen_all.compare_corpus_trees` against synthetic trees rather than the
# committed one, so they defend the comparison and not the artifact. That
# distinction is the rule for these rows: name the job that goes red when the
# artifact is wrong, not the job that tests the generator or the checker.
# chelis#2261 tracks promoting them to per-pull-request coverage.
[[path_rule]]
prefix = "tests/corpus/opaque_invariants/manifest.json"
disposition = "owner"
workflow = "heavy-e2e.yml"
job = "full-workspace"
cadence = "daily 03:17 UTC and workflow_dispatch"
reason = "opaque_corpus_gate runs each check-lane corpus program named here against the live binary and holds it to its pinned exit code"
tracking_issue = "chelis#2250"

[[path_rule]]
prefix = "tests/corpus/opaque_invariants/programs/"
disposition = "owner"
workflow = "heavy-e2e.yml"
job = "full-workspace"
cadence = "daily 03:17 UTC and workflow_dispatch"
reason = "opaque_corpus_gate executes every generated corpus program here on the checked lane"
tracking_issue = "chelis#2250"

