# Versioned pull-request integration ownership. All default-feature lib/bin units are automatic.
# standing_target preserves the reviewed ci-fast set; exclusions and shared-path rules
# are consumed by scripts/ci_change_owned.py and fail closed when stale.
version = 3

[[path_rule]]
prefix = "pyrightconfig.json"
disposition = "owner"
workflow = "ci.yml"
job = "script-unit"
cadence = "pull_request and push"
reason = "script-unit validates the complete tracked Python source graph and exclusions"
tracking_issue = "chelis#1430"

[[path_rule]]
prefix = "scripts/test_pyright_scope.py"
disposition = "owner"
workflow = "ci.yml"
job = "script-unit"
cadence = "pull_request and push"
reason = "script-unit executes the positive and negative Pyright source-scope tests"
tracking_issue = "chelis#1430"

[[path_rule]]
prefix = "scripts/z3_test.py"
disposition = "packages"
packages = ["chelis-prove"]

[[path_rule]]
prefix = "scripts/test_z3_test.py"
