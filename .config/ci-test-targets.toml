# Cargo metadata classifies paths under workspace package roots directly.
# Shared roots remain fail-closed unless this file records a current,
# evidence-backed disposition. Directory prefixes end in `/`; other rules are
# exact files. Overlap is forbidden by the parser.

[[path_rule]]
prefix = "spec/02-surf-syntax.md"
disposition = "packages"
packages = ["chelis-surf", "chelis-types", "chelis-compiler-api"]

[[path_rule]]
prefix = "spec/03-deep-syntax.md"
disposition = "packages"
packages = ["chelis-deep", "chelis-surf", "chelis-types", "chelis-compiler-api"]

[[path_rule]]
