# Versioned pull-request integration ownership. All default-feature lib/bin units are automatic.
# standing_target preserves the reviewed ci-fast set; exclusions and shared-path rules
# are consumed by scripts/ci_change_owned.py and fail closed when stale.
version = 2

# The completion runner consumes these exact runtime-extent corpus inputs.
[[path_rule]]
prefix = "scripts/runtime_extent_oracle.py"
disposition = "owner"
workflow = "heavy-e2e.yml"
job = "runtime-extent-oracle"
cadence = "daily 03:17 UTC and workflow_dispatch"
reason = "the completion oracle executes both registered phase corpora and their receipts"
