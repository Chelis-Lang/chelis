# selection is FOR. The defect that issue names is not that targets get added;
# it is that nobody has decided what the set covers, so it grows one escape at a
# time with no rule. The row carries a measured cost and this status so the
# evidence is concrete rather than another silent accretion. Re-decide it with
# the rest of the file when #1824 settles.
