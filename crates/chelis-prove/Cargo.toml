[package]
name = "chelis-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Three-tier property verification: type check → SMT (cvc5) → fuzz"

[features]
smt = ["cvc5-rs"]
z3 = ["dep:z3", "dep:num-rational"]

[dependencies]
cvc5-rs = { version = "0.3", optional = true }
# The `num` feature exposes `Real::from_big_rational`, which converts a finite
# f64 to its EXACT dyadic rational (mantissa * 2^exp) with no decimal rounding,
# so the value Z3 reasons over is the literal itself, not a re-parsed decimal.
z3 = { version = "0.20", optional = true, features = ["num"] }
num-rational = { version = "0.4", optional = true, default-features = false, features = ["num-bigint"] }
chelis-surf = { path = "../chelis-surf" }
chelis-deep = { path = "../chelis-deep" }
chelis-pred = { path = "../chelis-pred" }
chelis-types = { path = "../chelis-types" }
chelis-compiler-api = { path = "../chelis-compiler-api" }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
bincode = "1"
thiserror = { workspace = true }

[dev-dependencies]
