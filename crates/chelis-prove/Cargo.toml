[package]
name = "chelis-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Three-tier property verification: type check → SMT (cvc5) → fuzz"

[features]
smt = ["cvc5-rs", "num-rational"]
# WI-12 Z3 NRA engine (WS-5): a second SMT DischargeEngine over the SAME
# GoalShape::Smt the cvc5 engine fits, backed by Z3's nonlinear-real-arithmetic
# decision procedure. It is the cvc5->Z3 capability-split consumer of the
# try-until-discharge dispatcher: a goal cvc5 returns Unknown on can fall
# through to Z3. The two engines lower the SAME SmtExpr to the SAME exact-f64
# rationals (num-rational's BigRational::from_float, matching the #444 cvc5
# RealLit fix), so they reason about identical numbers and a cross-engine
# oracle can require they agree. Independent of `smt`: the `z3` feature can be
# built WITHOUT cvc5, and the default build links neither.
#
# z3 = 0.20 / z3-sys = 0.11 with `default-features = false` so z3-sys does NOT
# build a bundled Z3 from source (no cmake): its build.rs takes the
# pkg-config/`Z3_LIBRARY_PATH_OVERRIDE` branch and `#[link(name = "z3")]`
# links a PREBUILT libz3 (the system `libz3-dev` in CI; the python-shipped
# libz3 on this workstation). See `docs/local_z3_environment.md` for the link
# recipe and `scripts/z3_test.py` for the wrapper that sets it.
z3 = ["dep:z3", "num-rational"]
# WI-15 SoS certificate engine: a univariate-polynomial-nonneg-on-interval
# DischargeEngine that proves p(x) >= 0 on [a,b] via a Markov-Lukacs
# sum-of-squares SDP (Clarabel as the float SDP core) followed by a
# Peyrl-Parrilo EXACT RATIONAL repair + exact certificate verification. The
# certificate trust anchor is pure rational arithmetic (num-rational over
# num-bigint), independent of Clarabel's float precision: a float SDP solution
# is only a proposal; the exact-verified rational cert is the proof. The
# discharge is CertificateBearing@Exact ONLY when the exact cert verifies. The
# default / smt / solver-free builds link none of this.
clarabel = ["dep:clarabel", "num-rational", "dep:num-bigint", "dep:num-traits"]
# WI-16 Carcara auditability: re-check cvc5's Alethe proofs in-process for
# independent auditability of the linear-arithmetic / EUF fragment (the
# SmtExpr/SmtSort surface has no bit-vector representation, so the bit-vector
# slice of Alethe is not reachable here). It audits cvc5's output, so it
# implies `smt`. `gmp-mpfr-sys/use-system-libs` forces the
# transitive `rug -> gmp-mpfr-sys` build to LINK system GMP (needs the
# `gmp-devel` headers) instead of compiling GMP from C source, keeping the
# build off the slow from-source path. Carcara's `rug` enables only
# `integer`+`rational`, so neither MPFR nor MPC belongs in this feature.
carcara = ["smt", "dep:carcara", "gmp-mpfr-sys/use-system-libs"]
# WI-14 Arb/FLINT rigorous-enclosure oracle. `arb-sys` vendors FLINT + Arb C
# source and compiles them (and pulls `gmp-mpfr-sys`, which compiles GMP/MPFR),
# so a clean build compiles the C stack from source (~1 min cold). The oracle is
# validation/build-time tooling that never ships in a deployed slim build, so it
# is off by default; the default + smt builds keep zero FLINT/Arb symbols. The
# vendored FLINT/Arb C and `gmp-mpfr-sys` are LGPL, so the LGPL obligation
# attaches to a binary built with this feature (recorded + deferred, master
# WI-19). The Fedora PIE-default toolchain requires the vendored C be compiled
# `-fPIC`; `.cargo/config.toml` sets `CFLAGS`/`CXXFLAGS` and isolated build
# caches so a clean build is position-independent without a per-developer step.
arb = ["dep:arb-sys"]

[dependencies]
chelis-unord.workspace = true
cvc5-rs = { version = "0.3", optional = true }
# WI-14 oracle: FFI to FLINT/Arb. 0.3.6 vendors FLINT 2.8.5 + Arb c2b7e36 (it
# does NOT link a system FLINT) and exposes `arb_hypgeom_erf` plus the interval
# extraction (`arb_get_lbound_arf`/`ubound_arf`) and directed-rounding f64
# projection (`arf_get_d` with `ARF_RND_FLOOR`/`ARF_RND_CEIL`) the oracle needs.
arb-sys = { version = "0.3.6", optional = true }
# On the smt AND z3 paths: a RealLit lowers to its EXACT f64 value as a
# rational `n/d` (BigRational::from_float), so the solver reasons about the
# same number the runtime f64 evaluator does, not the literal's exact decimal.
# cvc5 and Z3 share this lowering so they reason about identical numbers.
num-rational = { version = "0.4", default-features = false, features = [
    "num-bigint",
], optional = true }
# WI-12 Z3 NRA engine (the `z3` feature). `default-features = false` so
# z3-sys does NOT vendor/build Z3 from source: it links a PREBUILT libz3 via
# `#[link(name = "z3")]` (the build.rs pkg-config/Z3_LIBRARY_PATH_OVERRIDE
# branch). Keep this OFF for the default and smt builds so neither links z3.
z3 = { version = "0.20", default-features = false, optional = true }
# Carcara is a Rust project, not a crates.io crate (see the WI-16 master-plan
# note), so it is a pinned git dependency. Pin a specific rev for build
# reproducibility and CI-cache stability.
carcara = { git = "https://github.com/ufmg-smite/carcara", rev = "45bfaedce92b31970cc2f8b07966813652aed8b0", optional = true }
# Pulled in only so the `carcara` feature can force `use-system-libs` on the
# transitive `rug -> gmp-mpfr-sys` build (cargo unifies the feature across the
# graph). `default-features = false` retains the GMP base required by Rug
# without activating the default MPFR and MPC features.
gmp-mpfr-sys = { version = "1", default-features = false, optional = true }
# WI-15 SoS certificate engine (behind `clarabel`). clarabel is the float SDP
# core that PROPOSES a Gram matrix; num-bigint/num-traits back the exact-rational
# repair + verification that turns the proposal into a checked certificate
# (num-rational's BigRational over num-bigint's BigInt, with num-traits for
# Zero/One/Signed). The repair is the proof; clarabel is only the heuristic.
# clarabel's default feature is `serde` (its solver references serde_json
# unconditionally), so the default set is kept. The PSD cone needs clarabel's
# `sdp` feature, which needs a BLAS/LAPACK backend; the per-OS backend
# (sdp-openblas on Linux, sdp-accelerate on macOS) is selected in the
# target-specific dependency tables below so cargo unifies it onto this base
# dep. `clarabel` is an opt-in dev/CI feature, NOT in the shipped release binary
# (release ships --features smt only), so the product and downstream shells link
# zero BLAS; only chelis's own clarabel CI lane + dev builds pull OpenBLAS.
clarabel = { version = "0.11", optional = true }
num-bigint = { version = "0.4", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
chelis-surf = { path = "../chelis-surf" }
chelis-deep = { path = "../chelis-deep" }
chelis-pred = { path = "../chelis-pred" }
chelis-types = { path = "../chelis-types" }
chelis-compiler-api = { path = "../chelis-compiler-api" }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
bincode = "1"
thiserror = { workspace = true }
# Beacon subprocess shim (chelis#439): transport-only deps for the in-tree
# DischargeEngine that shells to the out-of-tree chelis-beacon binary. base64
# encodes the EXACT WireDag v6 bytes inline in the request JSON; wait-timeout
# gives the hard subprocess kill the discharge timeout maps to; tempfile backs
# the optional temp-file request transport. None link a solver, so the default
# build stays solver-free. (tempfile is already used elsewhere in the workspace.)
base64 = "0.22"
wait-timeout = "0.2"
tempfile = "3"

# WI-15: the per-OS BLAS/LAPACK backend for clarabel's `sdp` (PSD cone) feature.
# These reference the SAME optional `clarabel` crate as the base [dependencies]
# entry, so cargo UNIFIES the features: when `--features clarabel` is on, the
# `sdp` + the matching backend turn on for the active target; when it is off,
# clarabel is not built at all (optional dep), so neither does any BLAS. Linux
# links system OpenBLAS (libopenblas-dev; already in the CI smt-glibc231 lane);
# macOS uses the OS-bundled Accelerate framework. The shipped release binary
# does not enable `clarabel`, so it links no BLAS.
[target.'cfg(target_os = "linux")'.dependencies]
clarabel = { version = "0.11", optional = true, features = ["sdp-openblas"] }

[target.'cfg(target_os = "macos")'.dependencies]
clarabel = { version = "0.11", optional = true, features = ["sdp-accelerate"] }

[dev-dependencies]

# A compiled mock `chelis-beacon` binary for the shim integration tests: it reads
# a request and emits a canned CheckReport JSON selected by an env var, so every
# §5 mapping row (docs/design/beacon_subprocess_shim.md) can be exercised without
# a real Beacon. The tests reach it via CARGO_BIN_EXE_mock-chelis-beacon (defined
# for integration tests under tests/).
[[bin]]
name = "mock-chelis-beacon"
path = "src/bin/mock_chelis_beacon.rs"

# WI-13 envelope certifier: the offline Arb trust-anchor that stamps each
# envelope box's certified sup-norm `eps`. Requires the `arb` feature (links
# FLINT/Arb); never part of a deployed build.
[[bin]]
name = "certify_erf_envelope"
path = "src/bin/certify_erf_envelope.rs"
required-features = ["arb"]

[[bin]]
name = "certify_special_fn_envelope"
path = "src/bin/certify_special_fn_envelope.rs"
required-features = ["arb"]

[lints]
workspace = true
