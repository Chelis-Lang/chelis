[package]
name = "chelis-compiler-api"
description = "Shared machine-facing compiler API for Tide and Python bindings"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Native immutable views at the actual code-generation boundary; default off.
emission-observer = []
# Same-compilation helper captures and a final-success-bound projection; default off.
compilation-trace = ["emission-observer", "chelis-ir/lowering-trace", "chelis-pipeline-core/lowering-trace"]

[dependencies]
chelis-unord.workspace = true
chelis-backend-c.workspace = true
chelis-backend-hip.workspace = true
chelis-deep.workspace = true
chelis-image-id.workspace = true
chelis-effects.workspace = true
chelis-ir.workspace = true
chelis-macros.workspace = true
chelis-pipeline-core.workspace = true
chelis-reef.workspace = true
chelis-std-bundle.workspace = true
chelis-surf.workspace = true
chelis-types.workspace = true
chelis-validate.workspace = true
chelis-vocab.workspace = true
bincode = "1"
half.workspace = true
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Fixed binary64 source/report adapters must read back their emitted decimals exactly.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
chelis-reef.workspace = true
bincode = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
