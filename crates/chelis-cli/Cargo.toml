[package]
name = "chelis-cli"
description = "CLI for the Chelis language compiler"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chelis"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chelis-conformance.workspace = true
chelis-deep.workspace = true
chelis-reef.workspace = true
# WS-C orchestration: reuse chelisup's toolchain-store path math (paths::Store)
# and pin resolution (resolve) so `reef setup`/`doctor`/the unknown-subcommand
# hint share one source of truth with the installer. chelisup has no `chelis-*`
# deps, so this edge is cycle-free. Only `paths` + `resolve` are used; never
# `install` (see the shim-corruption guard in cmd_reef_setup).
chelisup = { path = "../chelisup" }
chelis-macros.workspace = true
chelis-surf.workspace = true
chelis-types = { path = "../chelis-types" }
chelis-effects.workspace = true
chelis-ir = { path = "../chelis-ir" }
chelis-runtime.workspace = true
chelis-backend-c = { path = "../chelis-backend-c" }
chelis-backend-hip = { path = "../chelis-backend-hip" }
chelis-backend-metal = { path = "../chelis-backend-metal" }
chelis-compiler-api = { path = "../chelis-compiler-api" }
chelis-cove.workspace = true
chelis-lsp.workspace = true
chelis-tide.workspace = true
chelis-validate.workspace = true
chelis-prove = { path = "../chelis-prove", optional = true }
chelis-lint.workspace = true
libc.workspace = true
serde.workspace = true
serde_json = "1"
tempfile = "3"
walkdir = "2"

[features]
# The shared property/obligation runner is part of every normal CLI build.
# `smt` only adds cvc5; a default build still runs the identical Tier-C engine
# that Tide uses, so solver availability cannot fork fuzz semantics.
default = ["chelis-prove"]
smt = ["chelis-prove/smt", "chelis-tide/smt"]

[dev-dependencies]
assert_cmd = "2"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
chelis-shell.workspace = true
# `reef_setup.rs` synthesizes a chelis toolchain release tarball
# (`chelis-vX.Y.Z-<slug>.tar.gz`, gzip) so the auto-install-via-chelisup path
# runs fully offline through the real chelisup binary.
flate2 = "1"
# `observation_roundtrip_harness.rs` (chelis#732 Phase 0) verifies f16/bf16
# exit text at the dtype's own width, and the chelis#729 Phase 0 domain
# checker (tests/common/mod.rs) needs the same f16/bf16 nearest-value
# rounding - one dev-dep serves both; same crate the backends already use.
half.workspace = true
chelis-std-bundle.workspace = true
predicates = "3"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The faithful-observation tripwire parses Rust format captures. Use Rust's
# Unicode identifier tables so valid non-ASCII captures cannot evade it.
unicode-ident = "1"
# `toml` is needed by `crates/chelis-cli/tests/reef_lockfile_remote_origin.rs`
# (Item 9 lockfile-origin oracle) for byte-level round-trip assertions
# against `ReefLock`. Pinned to the same version chelis-reef itself
# uses (workspace-resolved 0.8) so the round-trip is bit-stable.
toml = "0.8"
walkdir = "2"
wiremock = "0.6"
zstd = "0.13"
