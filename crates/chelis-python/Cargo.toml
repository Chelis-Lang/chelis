[package]
name = "chelis-python"
description = "PyO3 bindings for the shared Chelis compiler API"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "chelis_python"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
# A sealed build (spec/08 §2.1) carries no checkout path and skips the
# development source-freshness check, so installed Python wheels run without
# their build checkout. Staging receipts record the mode.
sealed-runtime = ["chelis-runtime-bundle/sealed"]

[dependencies]
chelis-abi.workspace = true
chelis-backend-c.workspace = true
chelis-compiler-api.workspace = true
chelis-reef.workspace = true
chelis-runtime-bundle.workspace = true
chelis-vocab.workspace = true
libc = "0.2"
libloading = "0.8"
pyo3 = { version = "0.24", features = ["abi3-py39", "auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3-build-config = { version = "0.24", features = ["resolve-config"] }
quote.workspace = true
syn.workspace = true

[lints]
workspace = true
