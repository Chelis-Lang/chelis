[package]
name = "chelis-runtime-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The runtime static archive and headers a Chelis compiler carries and stages."

[features]
# Release and Nix builds of the CLI are sealed builds (spec/08-backends.md
# §2.1): they carry no checkout path and skip the development source-freshness
# check. Staging receipts record the mode.
sealed = []
clarabel-provider = ["chelis-runtime/clarabel-provider"]

[dependencies]
chelis-runtime.workspace = true
chelis-runtime-bundle-macro.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
# Test-only: reads the undefined symbols of every object in the carried
# archive (`tests/runtime_no_host_transcendentals.rs`).
object = { version = "0.37", default-features = false, features = [
    "read_core",
    "archive",
    "coff",
    "elf",
    "macho",
    "std",
    "unaligned",
] }
tempfile = "3"

[lints]
workspace = true
