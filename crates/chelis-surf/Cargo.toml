[package]
name = "chelis-surf"
description = "Surface syntax parser and desugaring for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Explicit, version-bounded migration; absent from ordinary Surf consumers.
pre-020-pipe-migration = ["chelis-deep/pre-020-pipe-migration"]

[[test]]
name = "pipe_sugar_contract"
required-features = ["pre-020-pipe-migration"]

[dependencies]
chelis-numeric-core = { workspace = true, default-features = false }
chelis-stack-services.workspace = true
chelis-unord.workspace = true
chelis-deep.workspace = true
chelis-pred.workspace = true
chelis-vocab.workspace = true
serde = { version = "1", default-features = false, features = ["derive", "alloc", "rc"] }
thiserror = { version = "2", default-features = false }
ryu = { version = "1", default-features = false }

[dev-dependencies]
chelis-syntax-host.workspace = true
chelis-macros.workspace = true
proptest = "1"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
