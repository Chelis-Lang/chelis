[package]
name = "chelisup"
description = "First-party rustup-style toolchain installer and version-routing shim for Chelis"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# A single binary. It runs the installer CLI when invoked as `chelisup`
# and the fast pin-resolving shim when invoked as `chelis` (argv[0]
# dispatch, the rustup proxy model). See `src/lib.rs::dispatch`.
[[bin]]
name = "chelisup"
path = "src/main.rs"

[dependencies]
chelis-version = { path = "../chelis-version" }
clap = { version = "4", features = ["derive"] }
# Match chelis-reef's HTTP stack exactly so the resolved dependency tree
# stays single-version: blocking client, rustls (no system OpenSSL).
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
# The chelis toolchain release asset is a gzip tarball
# (`chelis-vX.Y.Z-<slug>.tar.gz`), not the zstd archive reef uses for
# shells, so gzip decode is required here.
flate2 = "1"
tar = "0.4"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# Integration tests synthesize a release tarball fixture in-process so
# the `install` path is exercised fully offline.
flate2 = "1"
tar = "0.4"
