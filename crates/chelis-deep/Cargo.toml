[package]
name = "chelis-deep"
description = "Deep (s-expression) parser for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Raw historical receipts are never a normal Deep ingress path.
pre-020-pipe-migration = []

[dependencies]
chelis-numeric-core = { workspace = true, default-features = false, features = ["serde"] }
chelis-vocab = { workspace = true, default-features = false }
chelis-stack-services.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
chelis-syntax-host.workspace = true
bincode = "1"
proc-macro2 = "1"
proptest = "1"
serde_json = "1"
syn.workspace = true

[lints]
workspace = true
