[package]
name = "chelis-runtime"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# chelis#1286 Phase 0: private, test-only allocation telemetry. Normal
# runtime artifacts do not enable this feature and retain the published ABI.
ownership-ledger = ["dep:chelis-unord"]

[dependencies]
chelis-abi.workspace = true
chelis-unord = { workspace = true, optional = true }
chelis-vocab.workspace = true
# chelis#732 Phase 2: exact f16/bf16 widening and correctly rounded
# narrowing for the shortest-round-trip formatter and the per-dtype
# to_list / tensor-render reads. Same crate the checker-side reference
# formatter uses, so the two lanes share one narrowing definition.
half = { workspace = true }
libc.workspace = true
memmap2 = "0.9"
num-bigint = "0.4"

[build-dependencies]
# build.rs records a SHA-256 of each declared source input, which development
# compilers check before staging this runtime (spec/08-backends.md §2.1).
sha2 = "0.10"

[dev-dependencies]
# Test-only: the byte-equality lock against the reference renderer
# (`chelis_types::observation::format_element`). The production staticlib
# keeps zero checker dependencies; this edge exists only for
# `tests/format_shortest_matches_reference.rs`.
chelis-types = { workspace = true }
# Test-only: the floating-point profile's obligation rows for the f16 and bf16
# storage conversions, whose production lane is this crate's finalization.
chelis-crmath = { workspace = true }

# chelis#3032: the sort-tuple ownership tests read the allocation ledger, so
# every runner, the change-owned lane included, builds them with it.
[[test]]
name = "sort_tuple_ownership"
path = "tests/sort_tuple_ownership.rs"
required-features = ["ownership-ledger"]

[lints]
workspace = true
