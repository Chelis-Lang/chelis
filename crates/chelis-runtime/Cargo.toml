[package]
name = "chelis-runtime"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
chelis-vocab.workspace = true
# chelis#732 Phase 2: exact f16/bf16 widening and correctly rounded
# narrowing for the shortest-round-trip formatter and the per-dtype
# to_list / tensor-render reads. Same crate the checker-side reference
# formatter uses, so the two lanes share one narrowing definition.
half = { workspace = true }
libc.workspace = true
memmap2 = "0.9"

[dev-dependencies]
# Test-only: the byte-equality lock against the reference renderer
# (`chelis_types::observation::format_element`). The production staticlib
# keeps zero checker dependencies; this edge exists only for
# `tests/format_shortest_matches_reference.rs`.
chelis-types = { workspace = true }
