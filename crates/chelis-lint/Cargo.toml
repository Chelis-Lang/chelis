[package]
name = "chelis-lint"
description = "Naming-convention lint for the Chelis ecosystem (spec/01-nomenclature.md)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "chelis_lint"
path = "src/lib.rs"

[dependencies]
chelis-deep.workspace = true
chelis-surf.workspace = true
ignore = "0.4"
regex = "1"
serde.workspace = true
toml = "0.8"

[dev-dependencies]
chelis-deep.workspace = true
tempfile = "3"
assert_cmd = "2"
predicates = "3"
