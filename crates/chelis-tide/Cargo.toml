[package]
name = "chelis-tide"
description = "Tide agent API and MCP service for Chelis"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forward the SMT toolchain so the tide obligation path proves at the
# same Tier B as the CLI (RFC D-PARITY); without it tide runs Tier C.
smt = ["chelis-prove/smt"]

[dependencies]
axum = "0.7"
chelis-compiler-api.workspace = true
chelis-prove = { path = "../chelis-prove" }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
