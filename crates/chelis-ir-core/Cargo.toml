[package]
name = "chelis-ir-core"
description = "Portable IR algorithms and ordinary data for Chelis"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
serde = ["dep:serde", "chelis-checker-core/serde", "chelis-type-core/serde", "chelis-numeric-core/serde", "chelis-effects-core/serde", "chelis-unord/serde"]
lowering-trace = []
test-instrumentation = []

[dependencies]
chelis-deep = { path = "../chelis-deep", default-features = false }
chelis-checker-core = { path = "../chelis-checker-core", default-features = false }
chelis-type-core = { path = "../chelis-type-core", default-features = false }
chelis-numeric-core = { path = "../chelis-numeric-core", default-features = false, features = ["alloc"] }
chelis-dag-core = { path = "../chelis-dag-core", default-features = false }
chelis-effects-core = { path = "../chelis-effects-core", default-features = false }
chelis-pred = { path = "../chelis-pred", default-features = false }
chelis-vocab = { path = "../chelis-vocab", default-features = false }
chelis-abi = { path = "../chelis-abi", default-features = false }
chelis-unord = { path = "../chelis-unord", default-features = false }
chelis-stack-services = { path = "../chelis-stack-services", default-features = false }
num-bigint = { version = "0.4", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "critical-section"] }
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"], optional = true }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
chelis-ir.workspace = true
chelis-types = { path = "../chelis-types", features = ["test-instrumentation"] }
chelis-effects.workspace = true
chelis-syntax-host.workspace = true
chelis-surf.workspace = true
chelis-macros.workspace = true
critical-section = { version = "1", features = ["std"] }
bincode = "1.3.3"
serde_json = "1"
syn.workspace = true

[lints]
workspace = true
