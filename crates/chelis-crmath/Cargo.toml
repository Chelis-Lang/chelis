[package]
name = "chelis-crmath"
description = "Correctly rounded transcendentals (vendored CORE-MATH) for every Chelis lane"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
links = "chelis_crmath"

[features]
default = ["std"]
std = ["half/std"]

[dependencies]
half = { version = "2", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
libm = { version = "0.2.16", default-features = false }

[build-dependencies]
cc = "1"

[dev-dependencies]
libm = { version = "0.2.16", default-features = false }

[[test]]
name = "crmath_profile"
required-features = ["std"]

[[test]]
name = "crmath_half_composition"
required-features = ["std"]

[lints]
workspace = true
