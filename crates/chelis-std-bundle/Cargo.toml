[package]
name = "chelis-std-bundle"
description = "The chelis-std runtime archive and shell, packed at build time and embedded"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chelis-reef.workspace = true

# The build script packs packages/chelis-std through chelis-reef's packing
# step. Only binaries and test harnesses depend on this crate, so library
# checks never pack.
[build-dependencies]
chelis-reef.workspace = true
sha2 = "0.10"

[dev-dependencies]
chelis-shell.workspace = true
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
