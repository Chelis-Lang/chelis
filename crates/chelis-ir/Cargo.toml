[package]
name = "chelis-ir"
description = "RISC DAG intermediate representation for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Explicit in-memory observations of production lowering; no default capture.
lowering-trace = []

[dependencies]
chelis-axis-core.workspace = true
chelis-abi.workspace = true
chelis-unord.workspace = true
chelis-deep.workspace = true
chelis-effects.workspace = true
chelis-types = { path = "../chelis-types" }
chelis-vocab.workspace = true
num-bigint = "0.4"
serde.workspace = true
stacker.workspace = true
thiserror.workspace = true

[dev-dependencies]
syn.workspace = true
chelis-surf.workspace = true
chelis-macros.workspace = true
bincode = "1"
serde_json = "1"

[[test]]
name = "helper_lowering_trace"
required-features = ["lowering-trace"]

[lints]
workspace = true
