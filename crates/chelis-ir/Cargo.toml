[package]
name = "chelis-ir"
description = "RISC DAG intermediate representation for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Explicit in-memory observations of production lowering; no default capture.
lowering-trace = ["chelis-ir-core/lowering-trace"]

[dependencies]
chelis-ir-core = { workspace = true, features = ["serde"] }
critical-section = { version = "1", features = ["std"] }
chelis-type-core = { workspace = true, default-features = false, features = ["serde"] }
chelis-dag-core.workspace = true
chelis-numeric-core = { workspace = true, default-features = false, features = ["alloc", "serde"] }
chelis-abi.workspace = true
chelis-unord.workspace = true
chelis-deep.workspace = true
chelis-effects.workspace = true
chelis-checker-core.workspace = true
chelis-types = { path = "../chelis-types" }
chelis-syntax-host.workspace = true
chelis-stack-services.workspace = true
chelis-vocab.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
chelis-ir-core = { workspace = true, features = ["serde", "test-instrumentation"] }
chelis-types = { path = "../chelis-types", features = ["test-instrumentation"] }
syn.workspace = true
chelis-surf.workspace = true
chelis-macros.workspace = true
bincode = "1"
serde_json = "1"

[[test]]
name = "lowering_trace"
required-features = ["lowering-trace"]

[[test]]
name = "helper_lowering_trace"
required-features = ["lowering-trace"]

[lints]
workspace = true
