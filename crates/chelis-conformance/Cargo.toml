[package]
name = "chelis-conformance"
description = "Downstream shell-repo contract: conformance manifest, shell registry, and embedded canonical assets"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chelis-version = { path = "../chelis-version" }
# Section exclusions resolve headings through CommonMark structure so examples,
# HTML blocks, and other non-heading text cannot become selector boundaries.
pulldown-cmark = { version = "0.13.4", default-features = false }
sha2 = "0.10"
# The `[conform]` control surface in a shell's reef.toml is read STRUCTURALLY,
# not line-wise (chelis#1262). Two review rounds produced six bypass spellings of
# a hand-rolled line scan; a parsed document makes spelling-independence hold by
# construction. Same version chelis-reef/chelis-cli/chelisup already use.
toml = "0.8"
# Workflow caller authority is parsed from YAML job mappings, not whitespace:
# the same parsed jobs determine known callers and unrecognized central refs.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1"

[build-dependencies]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
