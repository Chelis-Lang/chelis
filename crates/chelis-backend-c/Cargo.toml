[package]
name = "chelis-backend-c"
description = "C code generation backend for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
sleef = []
# Translation-unit-private observation of actual Random locals. This feature
# is for the bounded LaCaDiLE native harness and is never enabled by default.
native-random-observer = ["chelis-ir/lowering-trace"]

[dependencies]
chelis-unord.workspace = true
chelis-ir = { path = "../chelis-ir" }
chelis-types = { path = "../chelis-types" }
chelis-vocab.workspace = true
# WS-1/chelis#729 reduced-float reference values in the C-backend regression
# corpus. Production Const emission uses chelis-types' canonical one-rounding
# conversion and stamps the resulting exact two-byte pattern.
half = { workspace = true }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
chelis-deep.workspace = true
chelis-effects.workspace = true
chelis-runtime.workspace = true
chelis-surf.workspace = true
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
