[package]
name = "chelis-backend-c"
description = "C code generation backend for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
sleef = []

[dependencies]
chelis-ir = { path = "../chelis-ir" }
chelis-types = { path = "../chelis-types" }
chelis-vocab.workspace = true
# WS-1 (dtype + Metal cleanup cycle): bit-pattern computation for the
# bf16/f16 Const emit path. Codegen evaluates `half::bf16::from_f64(value)`
# and `half::f16::from_f64(value)` at compile time so the emitted C
# code calls `chelis_fill_bf16(t, 0xXXXXu)` with the exact two-byte
# pattern (no per-element runtime conversion at Const fill time).
half = { workspace = true }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
chelis-runtime.workspace = true
serde_json = "1"
tempfile = "3"
