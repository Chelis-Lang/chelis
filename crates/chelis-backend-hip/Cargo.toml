[package]
name = "chelis-backend-hip"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chelis-unord.workspace = true
chelis-backend-c = { path = "../chelis-backend-c" }
chelis-ir = { path = "../chelis-ir" }
chelis-types = { path = "../chelis-types" }
chelis-vocab.workspace = true

[dev-dependencies]
# Tests that link HIP or CPU hosts stage the runtime the bundle carries
# (spec/08-backends.md §2.1) and link that exact archive.
chelis-runtime-bundle.workspace = true
# The host-program Count tests lower real Surf source through the front
# end so the wrapper's helper manifest and verified ownership come from
# the same pipeline the CLI and compiler API use.
chelis-effects.workspace = true
chelis-surf.workspace = true
# WS-A3: bf16 / f16 acceptance tests use the `half` crate to emit the
# correct 2-byte bit patterns for input tensors and read them back from
# bf16 outputs. The runtime crate does not yet depend on `half`; this
# is a test-only dependency to keep the runtime surface unchanged.
half = "2"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
