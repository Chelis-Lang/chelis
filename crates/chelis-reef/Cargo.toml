[package]
name = "chelis-reef"
description = "Local-first Reef package system for Chelis"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-hooks = []

[dependencies]
chelis-deep.workspace = true
chelis-macros.workspace = true
chelis-pipeline-core.workspace = true
chelis-surf.workspace = true
chelis-types.workspace = true
chelis-effects.workspace = true
chelis-shell.workspace = true
chelis-std-bundle.workspace = true
serde.workspace = true
semver.workspace = true
spdx.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
url.workspace = true
bincode = "1"
schemars = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
# Item 8: process-level advisory lock (`flock(2)`) on
# `$CHELIS_REEF_HOME/.reef-lock` around the auto-fetch + install + index
# update critical section. `rustix` is already in the dep graph as a
# transitive of several workspace deps; promoting it to a direct dep
# adds no new external dependency. Pinned to the same major version
# already in `Cargo.lock` to keep the resolved tree single-version.
rustix = { version = "1.1", features = ["fs"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
walkdir = "2"
zstd = "0.13"
# Item 11 (chelis#468): gunzip support for binary-artifact assets
# published as `.tar.gz`/`.tgz` (the `.tar.zst` path already uses
# `zstd`). flate2 1.x is already resolved in the workspace lock as a
# transitive dependency, so promoting it to a direct dep of chelis-reef
# adds no new external crate to the build graph.
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
