[package]
name = "chelis-types"
description = "Type checker for the Chelis language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
checkpoint-compile-probe = []
generalize-sweep-oracle = []

[dependencies]
chelis-numeric-core = { workspace = true, default-features = false, features = ["alloc", "serde"] }
chelis-unord.workspace = true
chelis-deep.workspace = true
chelis-pred.workspace = true

chelis-abi.workspace = true
chelis-vocab.workspace = true

serde.workspace = true
sha2 = "0.10"
stacker.workspace = true
thiserror.workspace = true

[dev-dependencies]
half.workspace = true
chelis-syntax-host.workspace = true
serde_json = "1"
bincode = "1"
chelis-surf.workspace = true
chelis-macros.workspace = true
proc-macro2 = "1"
syn.workspace = true
quote.workspace = true

[lints]
workspace = true
