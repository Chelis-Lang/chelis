[package]
name = "chelis-e2e"
description = "End-to-end integration tests for the Chelis compiler"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chelis-deep.workspace = true
chelis-surf.workspace = true
chelis-types = { path = "../chelis-types" }
chelis-effects.workspace = true
chelis-ir = { path = "../chelis-ir" }
chelis-backend-c = { path = "../chelis-backend-c" }
chelis-backend-hip = { path = "../chelis-backend-hip" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
