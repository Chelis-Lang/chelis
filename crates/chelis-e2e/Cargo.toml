[package]
name = "chelis-e2e"
description = "End-to-end integration tests for the Chelis compiler"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# WS-1 (dtype + Metal cleanup cycle): opt-in HIP cross-validation. The
# default-feature Linux CI runner does not have hipcc / libhipblas, so
# any test that requires GPU execution is gated behind this flag.
# Manual gate: `cargo test -p chelis-e2e --features hip-local-gpu`.
hip-local-gpu = []

[dependencies]
chelis-unord.workspace = true
chelis-compiler-api.workspace = true
chelis-deep.workspace = true
chelis-macros.workspace = true
chelis-surf.workspace = true
chelis-types = { path = "../chelis-types" }
chelis-effects.workspace = true
chelis-ir = { path = "../chelis-ir" }
chelis-runtime.workspace = true
# The agreement harnesses stage the runtime the bundle carries
# (spec/08-backends.md §2.1) and link that exact archive.
chelis-runtime-bundle.workspace = true
chelis-backend-c = { path = "../chelis-backend-c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
chelis-reef.workspace = true
chelis-std-bundle.workspace = true
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
