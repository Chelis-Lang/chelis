require_version: true
inputs:
  # Shared ecosystem tool pins (crate2nix, openspec) consumed via the devenv
  # polyrepo compose pattern (imports: ci/devenv/consumer). ci is private; nix
  # uses the authenticated github: fetcher. CI mints a scoped token from the CI
  # GitHub App through the reviewed authentication action.
  # locally add `access-tokens = github.com=$(gh auth token)` to
  # ~/.config/nix/nix.conf. Bump with `devenv update ci`.
  ci:
    url: github:Chelis-Lang/ci/a3b3e8ee939270649370826d62085c04342fd9e9
    flake: false
  devenv:
    url: github:cachix/devenv/v2.2?dir=src/modules
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/6004ea8c229fe9d41b21c6f4c76bf6c2e10771dd
  rust-overlay:
    url: github:oxalica/rust-overlay/19a19f3921ae195f2fbd85f5dc57e6d1df63aa0b
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
  - ci/devenv/consumer
