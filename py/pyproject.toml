[project]
name = "chelis-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf", "pygount"]

[project.scripts]
summarize-pdf = "chelis_tools.summarize_pdf:main"
batch-summarize = "chelis_tools.batch_summarize:main"
loc-report = "chelis_tools.loc_report:main"
skill-eval = "chelis_tools.skill_eval:main"
stamp-shell = "chelis_tools.stamp_shell:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chelis_tools"]
