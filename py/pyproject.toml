[project]
name = "chelis-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf"]

[project.scripts]
summarize-pdf = "chelis_tools.summarize_pdf:main"
batch-summarize = "chelis_tools.batch_summarize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chelis_tools"]
